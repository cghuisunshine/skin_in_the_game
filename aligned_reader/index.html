 useful (as in the case of statins), but that we now know has been backed up by suspicious or incomplete studies. Deep down, he may know that statins are harmful, as they will lead to long-term side effects. But the pharmaceutical companies have managed to convince everyone that these unseen consequences are harmless, when the right precautionary approach is to consider the unseen as potentially harmful. In fact for most people except those that are very ill, the risks outweigh the benefits. Except that the long-term medical risks are hidden; they will play out in the long run, whereas the legal risk is immediate. This is no different from the Bob Rubin risk-transfer trade, of delaying risks and making them look invisible.", "begin": 8494.658, "end": 8580.578, "localBegin": 3192.48, "localEnd": 3278.4}, {"id": "c003_f000116", "text": "Now can one make medicine less asymmetric? Not directly; the solution, as I have argued in Antifragile and more technically elsewhere, is for the patient to avoid treatment when he or she is mildly ill, but use medicine for the \"tail events,\" that is, for rarely encountered severe conditions. The problem is that the mildly ill represent a much larger pool of people than the severely ill - and are people who are expected to live longer and consume drugs for longer - hence pharmaceutical companies have an incentive to focus on them. (Dead people, I am told, stop taking drugs.)", "begin": 8580.578, "end": 8617.018, "localBegin": 3278.4, "localEnd": 3314.84}, {"id": "c003_f000117", "text": "In sum, both the doctor and the patient have skin in the game, though not perfectly, but administrators don't - and they seem to be the cause of the troubling malfunctioning of the system. Administrators everywhere on the planet, in all businesses and pursuits, and at all times in history, have been the plague.", "begin": 8617.018, "end": 8637.458, "localBegin": 3314.84, "localEnd": 3335.28}, {"id": "c003_f000118", "text": "NEXT", "begin": 8637.458, "end": 8641.018, "localBegin": 3335.28, "localEnd": 3338.84}, {"id": "c003_f000119", "text": "This chapter introduced us to the agency problem and risk sharing, seen from both a commercial and an ethical viewpoint, assuming the two can be disentangled. We also introduced the problem of scale. Next, we will try to get deeper into the hidden asymmetries that make aggregates strange animals.", "begin": 8641.018, "end": 8665.058, "localBegin": 3338.84, "localEnd": 3362.88}]}, {"kind": "chapter", "number": 4, "title": "Book 3: That Greatest Asymmetry", "audio": "audio/chapter_004.mp3", "start": 8665.077, "end": 11782.922, "duration": 3117.845, "paragraphs": [{"id": "c004_f000001", "text": "Book 3 That Greatest Asymmetry", "begin": 8665.077, "end": 8672.317, "localBegin": 0.0, "localEnd": 7.24}, {"id": "c004_f000002", "text": "Chapter 2 The Most Intolerant Wins: T he Dominance of the Stubborn Minority", "begin": 8672.317, "end": 8679.597, "localBegin": 7.24, "localEnd": 14.52}, {"id": "c004_f000003", "text": "Why you don't have to smoke in the smoking section - Your food choices on the fall of the Saudi king - How to prevent a friend from working too hard - Omar Sharif's conversion - How to make a market collapse", "begin": 8679.597, "end": 8694.197, "localBegin": 14.52, "localEnd": 29.12}, {"id": "c004_f000004", "text": "The main idea behind complex systems is that the ensemble behaves in ways not predicted by its components. The interactions matter more than the nature of the units. Studying individual ants will almost never give us a clear indication of how the ant colony operates. For that, one needs to understand an ant colony as an ant colony, no less, no more, not a collection of ants. This is called an \"emergent\" property of the whole, by which parts and whole differ because what matters are the interactions between such parts. And interactions can obey very simple rules.", "begin": 8694.197, "end": 8731.077, "localBegin": 29.12, "localEnd": 66.0}, {"id": "c004_f000005", "text": "The rule we discuss in this chapter is the minority rule, the mother of all asymmetries. It suffices for an intransigent minority - a certain type of intransigent minority - with significant skin in the game (or, better, soul in the game) to reach a minutely small level, say 3 or 4 percent of the total population, for the entire population to have to submit to their preferences. Further, an optical illusion comes with the dominance of the minority: a naive observer (who looks at the standard average) would be under the impression that the choices and preferences are those of the majority. If it seems absurd, it is because our scientific intuitions aren't calibrated for this. (Fughedabout scientific and academic intuitions and snap judgments; they don't work, and your standard intellectualization fails with complex systems, though your grandmothers' wisdom doesn't.)", "begin": 8731.077, "end": 8783.597, "localBegin": 66.0, "localEnd": 118.52}, {"id": "c004_f000006", "text": "Among other things, many other things, the minority rule will show us how all it takes is a small number of intolerant, virtuous people with skin in the game, in the form of courage, for society to function properly.", "begin": 8783.597, "end": 8797.677, "localBegin": 118.52, "localEnd": 132.6}, {"id": "c004_f000007", "text": "FIGURE 1. The lemonade container with the circled U indicating it is (literally) kosher.", "begin": 8797.677, "end": 8799.237, "localBegin": 132.6, "localEnd": 134.16}, {"id": "c004_f000008", "text": "This example of complexity hit me, ironically, as I was helping with the New England Complex Systems Institute summer barbecue. As the hosts were setting up the table and unpacking the drinks, a friend who was observant and ate only kosher dropped by to say hello. I offered him a glass of that type of yellow sugared water with citric acid people sometimes call lemonade, almost certain that he would reject it owing to his dietary laws. He didn't. He drank the liquid, and another kosher person commented, \"Around here, drinks are kosher.\" We looked at the carton container. There was a fine print: a tiny symbol, a U inside a circle, indicating that it was kosher. The symbol will be detected by those who need to know and look for the minuscule print. As for myself, like the character in Molière's play Le Bourgeois Gentilhomme who suddenly discovers that he has been speaking in prose all these years without knowing it, I realized that I had been drinking kosher liquids without knowing it.", "begin": 8799.237, "end": 8854.077, "localBegin": 134.16, "localEnd": 189.0}, {"id": "c004_f000009", "text": "CRIMINALS WITH PEANUT ALLERGIES", "begin": 8854.077, "end": 8860.957, "localBegin": 189.0, "localEnd": 195.88}, {"id": "c004_f000010", "text": "A strange idea hit me. The kosher population represents less than three tenths of a percent of the residents of the United States. Yet, it appears that almost all drinks are kosher. Why? Simply because going full kosher allows the producers, grocers, and restaurants to not have to distinguish between kosher and nonkosher for liquids, with special markers, separate aisles, separate inventories, different stocking sub-facilities. And the simple rule that changes the total is as follows:", "begin": 8860.957, "end": 8889.717, "localBegin": 195.88, "localEnd": 224.64}, {"id": "c004_f000011", "text": "A kosher (or halal) eater will never eat nonkosher (or nonhalal) food, but a nonkosher eater isn't banned from eating kosher.", "begin": 8889.717, "end": 8898.317, "localBegin": 224.64, "localEnd": 233.24}, {"id": "c004_f000012", "text": "Or, rephrased in another domain:", "begin": 8898.317, "end": 8900.837, "localBegin": 233.24, "localEnd": 235.76}, {"id": "c004_f000013", "text": "A disabled person will not use the regular bathroom, but a nondisabled person will use the bathroom for disabled people.", "begin": 8900.837, "end": 8907.877, "localBegin": 235.76, "localEnd": 242.8}, {"id": "c004_f000014", "text": "Granted, sometimes in practice we hesitate to use a bathroom with a disabled sign on it owing to some confusion - mistaking the rule for the one for parking cars, believing that the bathroom is reserved for exclusive use by the handicapped.", "begin": 8907.877, "end": 8920.957, "localBegin": 242.8, "localEnd": 255.88}, {"id": "c004_f000015", "text": "Someone with a peanut allergy will not eat products that touch peanuts, but a person without such an allergy can eat items with peanut traces in them.", "begin": 8920.957, "end": 8930.477, "localBegin": 255.88, "localEnd": 265.4}, {"id": "c004_f000016", "text": "Which explains why it is so hard to find peanuts on U.S. airplanes and why schools are often peanut-free (which, in a way, increases the number of persons with peanut allergies, as reduced exposure is one of the causes behind such allergies).", "begin": 8930.477, "end": 8945.317, "localBegin": 265.4, "localEnd": 280.24}, {"id": "c004_f000017", "text": "Let us apply the rule to domains where it can get entertaining:", "begin": 8945.317, "end": 8949.277, "localBegin": 280.24, "localEnd": 284.2}, {"id": "c004_f000018", "text": "An honest person will never commit criminal acts, but a criminal will readily engage in legal acts.", "begin": 8949.277, "end": 8956.637, "localBegin": 284.2, "localEnd": 291.56}, {"id": "c004_f000019", "text": "Let us call such minority an intransigent group, and the majority a flexible one. And their relationship rests on an asymmetry in choices.", "begin": 8956.637, "end": 8966.917, "localBegin": 291.56, "localEnd": 301.84}, {"id": "c004_f000020", "text": "I once pulled a prank on a friend. Years ago, when Big Tobacco was hiding and repressing the evidence of harm from secondary smoke, New York had smoking and nonsmoking sections in restaurants (even airplanes had, absurdly, a smoking section). I once went to lunch with a fellow visiting from Europe: the restaurant only had availability in the smoking section. I convinced my visitor that we needed to buy cigarettes, as we had to smoke in the smoking section. He complied.", "begin": 8966.917, "end": 8993.637, "localBegin": 301.84, "localEnd": 328.56}, {"id": "c004_f000021", "text": "Two more things. First, the geography of the terrain, that is, the spatial structure, matters a bit; it makes a big difference whether the intransigents are in their own district or are mixed with the rest of the population. If people following the minority rule lived in ghettos with a separate small economy, then the minority rule would not apply. But when a population has an even spatial distribution, say, when the ratio of such a minority in a neighborhood is the same as that in the entire village, that in the village is the same as in the county, that in the county is the same as in the state, and that in the state is the same as nationwide, then the (flexible) majority will have to submit to the minority rule. Second, the cost structure matters quite a bit. It happens in our first example that making lemonade compliant with kosher laws doesn't change the price by much - it is a matter of avoiding some standard additives. But if the manufacturing of kosher lemonade costs substantially more, then the rule will be weakened in some nonlinear proportion to the difference in costs. If it costs ten times as much to make kosher food, then the minority rule will not apply, except perhaps in some very rich neighborhoods.", "begin": 8993.637, "end": 9068.317, "localBegin": 328.56, "localEnd": 403.24}, {"id": "c004_f000022", "text": "Muslims have kosher laws, so to speak, but these are much narrower and apply only to meat. Muslims and Jews have near-identical slaughter rules (all kosher is halal for most Sunni Muslims, or was so in past centuries, but the reverse is not true). Note that these slaughter rules are skin-in-the-game driven, inherited from the ancient Eastern Mediterranean Greek and Levantine practice of economically burdensome animal sacrifice, to only worship the Gods if one has skin in the game. The Gods do not like cheap signaling.", "begin": 9068.317, "end": 9100.637, "localBegin": 403.24, "localEnd": 435.56}, {"id": "c004_f000023", "text": "Now consider this manifestation of the dictatorship of the minority. In the United Kingdom, where the (practicing) Muslim population is only 3 to 4 percent, a very high proportion of the meat we find is halal. Close to 70 percent of lamb imports from New Zealand are halal. Close to 10 percent of Subway stores carry halal-only meat (meaning no pork), in spite of the high costs of losing the business of ham eaters (like myself). The same holds in South Africa, which has about the same proportion of Muslims. There, a disproportionately high share of chicken is halal certified. But in the U.K. and other nominally Christian countries, halal is not neutral enough to reach a high level, as people may rebel against being forced to abide by others' sacred values - accepting and respecting the sacred values of other religions might signal some type of violation of yours, if you are a true monotheist. For instance, the seventh century Christian Arab poet Al-Akhtal made a point to never eat halal meat in his famous defiant poem boasting his Christianity: \"I do not eat sacrificial flesh\": Wa lastu bi'akuli lahmal adahi.", "begin": 9100.637, "end": 9173.477, "localBegin": 435.56, "localEnd": 508.4}, {"id": "c004_f000024", "text": "Al-Akhtal was reflecting a standard Christian reaction from three or four centuries earlier - Christians were tortured in pagan times by being forced to eat sacrificial meat, which they found sacrilegious. Many Christian martyrs took the heroic stance of starving to death rather than ingest impure food.", "begin": 9173.477, "end": 9192.077, "localBegin": 508.4, "localEnd": 527.0}, {"id": "c004_f000025", "text": "One can expect the same rejection of others' religious norms to take place in the West as the Muslim populations in Europe grow.", "begin": 9192.077, "end": 9200.237, "localBegin": 527.0, "localEnd": 535.16}, {"id": "c004_f000026", "text": "So the minority rule may produce a larger share of halal food in the stores than warranted by the proportion of halal eaters in the population, but with a headwind somewhere because some people may have a taboo against the custom. But with some non-religious kashrut rules, so to speak, the share can be expected to converge closer to a 100 percent (or some high number). In the U.S. and Europe, \"organic\" food companies are selling more and more products precisely because of the minority rule, and because ordinary and unlabeled food may be seen by some to contain pesticides, herbicides, and transgenic genetically modified organisms, or GMOs, with, according to them, unknown risks. (What we call GMOs in this context means transgenic food, entailing the transfer of genes from a foreign organism or species that would not have occurred in nature). Or it could be for some existential reasons, cautious behavior, or Burkean conservatism (that is, following the precautionary ideas of Edmund Burke) - some may not want to venture too far too fast from what their grandparents ate. Labeling something \"organic\" is a way to say that it contains no transgenic GMOs.", "begin": 9200.237, "end": 9271.797, "localBegin": 535.16, "localEnd": 606.72}, {"id": "c004_f000027", "text": "In promoting genetically modified food via all manner of lobbying, purchasing of congressmen, and overt scientific propaganda (with smear campaigns against such persons as yours truly, much about which later), big agricultural companies foolishly believed that all they needed was to win the majority. No, you idiots. Your snap \"scientific\" judgment is too naive for these types of decisions. Consider that transgenic-GMO eaters will eat non-GMOs, but not the reverse. So it may suffice to have a tiny percentage - say, no more than 5 percent - of an evenly spatially distributed population of non-genetically modified eaters for the entire population to have to eat non-GMO food. How? Say you have a corporate event, a wedding, or a lavish party to celebrate the fall of the Saudi Arabian regime, the bankruptcy of the rent-seeking investment bank Goldman Sachs, or the public reviling of Ray Kotcher, chairman of Ketchum the contemptible public relations firm, the enemy of scientists and scientific whistleblowers. Do you need to send a questionnaire asking people if they eat or don't eat transgenic GMOs and reserve special meals accordingly? No. You just select everything non-GMO, provided the price difference is not consequential. And the price difference appears to be small enough to be negligible, as (perishable) food costs in America are largely, up to about 80 or 90 percent, determined by distribution and storage, not the cost at the agricultural level. And as organic food is in higher demand, thanks to the minority rule, distribution costs decrease and the minority rule ends up accelerating in its effect.", "begin": 9271.797, "end": 9371.437, "localBegin": 606.72, "localEnd": 706.36}, {"id": "c004_f000028", "text": "\"Big Ag\" (the large agricultural firms) does not realize that this is the equivalent of entering a game in which one needed to not just win more points than the adversary, but win 97 percent of the total points just to be safe. It is strange to see an industry that spends hundreds of millions of dollars on research-cum-smear-campaigns, with hundreds of these scientists who think of themselves as more intelligent than the rest of us, miss such an elementary point about asymmetric choices.", "begin": 9371.437, "end": 9402.397, "localBegin": 706.36, "localEnd": 737.32}, {"id": "c004_f000029", "text": "Another example: do not think that the spread of automatic shifting cars is necessarily due to a majority preference; it could just be because those who can drive manual shifts can always drive automatic, but the reverse is not true.", "begin": 9402.397, "end": 9416.997, "localBegin": 737.32, "localEnd": 751.92}, {"id": "c004_f000030", "text": "The method of analysis employed here is called a \"renormalization group,\" a powerful apparatus in mathematical physics that allows us to see how things scale up (or down). Let us examine it next - without mathematics.", "begin": 9416.997, "end": 9426.797, "localBegin": 751.92, "localEnd": 761.72}, {"id": "c004_f000031", "text": "FIGURE 2. Renormalization group, steps one through three (start from the top): Four boxes containing four boxes, with one of the boxes dark at step one, with successive applications of the minority rule.", "begin": 9426.797, "end": 9436.797, "localBegin": 761.72, "localEnd": 771.72}, {"id": "c004_f000032", "text": "RENORMALIZATION GROUP", "begin": 9436.797, "end": 9437.677, "localBegin": 771.72, "localEnd": 772.6}, {"id": "c004_f000033", "text": "Figure 2 shows four boxes exhibiting what is called fractal self-similarity. Each box contains four smaller boxes. Each one of the four boxes will contain four boxes, and so all the way down, and all the way up until we reach a certain level. There are two shades: light for the majority choice, and dark for the minority one.", "begin": 9437.677, "end": 9458.557, "localBegin": 772.6, "localEnd": 793.48}, {"id": "c004_f000034", "text": "Assume the smaller unit contains four people, a family of four. One of them is in the intransigent minority and eats only non-GMO food (which includes organic). The color of this box is dark, and the others light. We \"renormalize once\" as we move up: the stubborn daughter manages to impose her rule on the four and the unit is now all dark, i.e., will opt for non-GMO. Now, step three, you have the family going to a barbecue party attended by three other families. As they are known to only eat non-GMO, the guests will cook only organic. The local grocery store, realizing the neighborhood is only non-GMO, switches to non-GMO to simplify life, which impacts the local wholesaler, and the system continues to \"renormalize.\"", "begin": 9458.557, "end": 9506.757, "localBegin": 793.48, "localEnd": 841.68}, {"id": "c004_f000035", "text": "By some coincidence, the day before the Boston barbecue, I was flaneuring in New York, and I dropped by the office of Raphael Douady, a friend I wanted to prevent from working, that is, engaging in an activity that, when abused, causes the loss of mental clarity, in addition to bad posture and loss of definition in facial features. The French physicist Serge Galam happened to be visiting, and chose the friend's office to kill time and taste Raphael's bad espresso. Galam was first to apply these renormalization techniques to social matters and political science; his name was familiar, as he is the author of the main book on the subject, which had then been sitting for months in an unopened Amazon box in my basement. He elaborated on his research and showed me a computer model of elections by which it suffices for some minority to exceed a certain level for its choices to prevail.", "begin": 9506.757, "end": 9558.717, "localBegin": 841.68, "localEnd": 893.64}, {"id": "c004_f000036", "text": "So the same illusion exists in political discussions, spread by political \"scientists\": you think that because some extreme right- or left-wing party has, say, the support of ten percent of the population, their candidate will get ten percent of the votes. No: these baseline voters should be classified as \"inflexible\" and will always vote for their faction. But some of the flexible voters can also vote for that extreme faction, just as non-kosher people can eat kosher. These people are the ones to watch out for, as they may swell the number of votes for the extreme party. Galam's models produced a bevy of counterintuitive effects in political science - and his predictions have turned out to be way closer to real outcomes than the naive consensus.", "begin": 9558.717, "end": 9605.477, "localBegin": 893.64, "localEnd": 940.4}, {"id": "c004_f000037", "text": "THE VETO", "begin": 9605.477, "end": 9607.637, "localBegin": 940.4, "localEnd": 942.56}, {"id": "c004_f000038", "text": "What we saw in the renormalization group was the \"veto\" effect, as a person in a group can steer choices. The advertising executive (and extremely bon vivant) Rory Sutherland suggested to me that this explains why some fast-food chains, such as McDonald's, thrive. It's not because they offer a great product, but because they are not vetoed in a certain socio-economic group - and by a small proportion of people in that group at that.", "begin": 9607.637, "end": 9636.397, "localBegin": 942.56, "localEnd": 971.32}, {"id": "c004_f000039", "text": "When there are few choices, McDonald's appears to be a safe bet. It is also a safe bet in shady places with few regulars where the food variance from expectation can be consequential - I am writing these lines in the Milan train station and, as offensive as it can be to someone who spent all this money to go to Italy, McDonald's is one of the few restaurants there. And it is packed. Shockingly, Italians are seeking refuge there from a risky meal. They may hate McDonald's, but they certainly hate uncertainty even more.", "begin": 9636.397, "end": 9671.717, "localBegin": 971.32, "localEnd": 1006.64}, {"id": "c004_f000040", "text": "Pizza is the same story: it is a commonly accepted food, and, outside a gathering of pseudo-leftist caviar eaters, nobody will be blamed for ordering it.", "begin": 9671.717, "end": 9683.877, "localBegin": 1006.64, "localEnd": 1018.8}, {"id": "c004_f000041", "text": "Rory wrote to me about the beer-wine asymmetry and the choices made for parties: \"Once you have 10 percent or more women at a party, you cannot serve only beer. But most men will drink wine. So you only need one set of glasses if you serve only wine - the universal donor, to use the language of blood groups.\"", "begin": 9683.877, "end": 9703.757, "localBegin": 1018.8, "localEnd": 1038.68}, {"id": "c004_f000042", "text": "This strategy of seeking the optimal among not necessarily great options might have been played by the Khazars when they were looking to choose between Islam, Judaism, and Christianity. Legend has it that three high-ranking delegations (bishops, rabbis, and sheikhs) came to make the sales pitch. The Khazar lords asked the Christians: if you were forced to chose between Judaism and Islam, which one would you pick? Judaism, they replied. Then the lords asked the Muslims: which of the two, Christianity or Judaism? Judaism, the Muslims said. Judaism it was; and the tribe converted.", "begin": 9703.757, "end": 9740.997, "localBegin": 1038.68, "localEnd": 1075.92}, {"id": "c004_f000043", "text": "LINGUA FRANCA", "begin": 9740.997, "end": 9743.557, "localBegin": 1075.92, "localEnd": 1078.48}, {"id": "c004_f000044", "text": "If a meeting is taking place in Germany in the Teutonic-looking conference room of a corporation that is sufficiently international or European, and one of the persons in the room doesn't speak German, the entire meeting will be run in…English, the brand of inelegant English used in corporations across the world. That way they can equally offend their Teutonic ancestors and the English language. It all started with the asymmetric rule that those who are nonnative in English know (bad) English, but the reverse - English speakers knowing other languages - is less likely. French was supposed to be the language of diplomacy, as civil servants coming from aristocratic backgrounds used it, while their more vulgar compatriots involved in commerce relied on English. In the rivalry between the two languages, English won as commerce grew to dominate modern life; the victory has nothing to do with the prestige of France or the efforts of their civil servants in promoting their more or less beautiful Latinized and logically spelled language over the orthographically confusing one of trans-Channel meat-pie eaters.", "begin": 9743.557, "end": 9812.757, "localBegin": 1078.48, "localEnd": 1147.68}, {"id": "c004_f000045", "text": "We can thus get some inkling of how the emergence of lingua francas can come from minority rules - and that is a point that is not visible to linguists. Aramaic is a Semitic language that succeeded the Canaanite language (that is, Phoenician-Hebrew) in the Levant and resembles Arabic; it was the language Jesus Christ spoke. The reason it came to dominate the Levant and Egypt isn't because of any particular imperial Semitic power or the fact that they have interesting noses. It was the Persians - who speak an Indo-European language - who spread Aramaic, the language of Assyria, Syria, and Babylon. Persians taught Egyptians a language that was not their own. Simply, when the Persians invaded Babylon they found an administration with scribes who could only use Aramaic and didn't know Persian, so Aramaic became the state language. If your secretary can only take dictation in Aramaic, Aramaic is what you will use. This led to the oddity of Aramaic being used in Mongolia, as records were maintained in the Syriac alphabet (Syriac is the Eastern dialect of Aramaic). And centuries later, the story would repeat itself in reverse, with the Arabs using Greek in their early administration in the seventh and eighth centuries. For during the Hellenistic era, Greek replaced Aramaic as the lingua franca in the Levant, and the scribes of Damascus maintained their records in Greek. But it was not the Greeks who spread Greek around the Mediterranean, but the Romans who accelerated the spreading of Greek, as they used it in their administration across the Eastern empire, as well as the coastal Levantines - the New Testament was written in the Greek of Syria.", "begin": 9812.757, "end": 9926.917, "localBegin": 1147.68, "localEnd": 1261.84}, {"id": "c004_f000046", "text": "A French Canadian friend from Montreal, Jean-Louis Rheault, bemoaning the loss of the French language among French Canadians outside narrowly provincial areas, commented as follows: \"In Canada, when we say bilingual, it is English-speaking, and when we say French-speaking it becomes bilingual.\"", "begin": 9926.917, "end": 9945.877, "localBegin": 1261.84, "localEnd": 1280.8}, {"id": "c004_f000047", "text": "GENES VS. LANGUAGES", "begin": 9945.877, "end": 9949.077, "localBegin": 1280.8, "localEnd": 1284.0}, {"id": "c004_f000048", "text": "Looking at genetic data in the Eastern Mediterranean with my collaborator the geneticist Pierre Zalloua, we noticed that both invaders, Turks and Arabs, left few genes, and in the case of Turkey, the tribes from East and Central Asia brought an entirely new language. Turkey, shockingly, is still inhabited by the populations of Asia Minor you read about in history books, but with new names. Further, Zalloua and his colleagues claim that Canaanites from 3,700 years ago represent more than nine-tenths of the genes of current residents of the state of Lebanon, with only a tiny amount of new genes added, in spite of about every possible army having dropped by for sightseeing and some pillaging. While Turks are Mediterraneans who speak an East Asian language, the French (North of Avignon) are largely of Northern European stock, yet they speak a Mediterranean language.", "begin": 9949.077, "end": 10003.637, "localBegin": 1284.0, "localEnd": 1338.56}, {"id": "c004_f000049", "text": "So:", "begin": 10003.637, "end": 10005.677, "localBegin": 1338.56, "localEnd": 1340.6}, {"id": "c004_f000050", "text": "Genes follow majority rule; languages minority rule.", "begin": 10005.677, "end": 10008.637, "localBegin": 1340.6, "localEnd": 1343.56}, {"id": "c004_f000051", "text": "Languages travel; genes less so.", "begin": 10008.637, "end": 10011.597, "localBegin": 1343.56, "localEnd": 1346.52}, {"id": "c004_f000052", "text": "This shows us the recent mistake of building racial theories on language, dividing people into \"Aryans\" and \"Semites,\" based on linguistic considerations. While the subject was central to the German Nazis, the practice continues today in one form or another, often benign. For the great irony is that Northern European supremacists (\"Aryan\"), while anti-Semitic, used the classical Greeks to give themselves a pedigree and a link to a glorious civilization, but didn't realize that the Greeks and their Mediterranean \"Semitic\" neighbors were actually genetically close to one another. It has been recently shown that both ancient Greeks and Bronze Age Levantines share an Anatolian origin. It just happened that the languages diverged.", "begin": 10011.597, "end": 10068.237, "localBegin": 1346.52, "localEnd": 1403.16}, {"id": "c004_f000053", "text": "THE ONE-WAY STREET OF RELIGIONS", "begin": 10068.237, "end": 10069.757, "localBegin": 1403.16, "localEnd": 1404.68}, {"id": "c004_f000054", "text": "In the same manner, the spread of Islam in the Near East, where Christianity was heavily entrenched (remember that it was born there), can be attributed to two simple asymmetries. The original Islamic rulers weren't particularly interested in converting Christians, as these provided them with tax revenues - the proselytism of Islam did not initially address those called \"people of the book,\" i.e. individuals of Abrahamic faith. In fact, my ancestors who survived thirteen centuries under Muslim rule saw clear advantages in not being Muslim: mostly in the avoidance of military conscription.", "begin": 10069.757, "end": 10107.637, "localBegin": 1404.68, "localEnd": 1442.56}, {"id": "c004_f000055", "text": "The two asymmetric rules are as follows. First, under Islamic law, if a non-Muslim man marries a Muslim woman, he needs to convert to Islam - and if either parent of a child happens to be Muslim, the child will be Muslim. Second, becoming Muslim is irreversible, as apostasy is the heaviest crime under the religion, sanctioned by the death penalty. The famous Egyptian actor Omar Sharif, born Mikhael Demetri Shalhoub, came from a Lebanese Christian family. He converted to Islam to marry a famous Egyptian actress and had to change his name to an Arabic one. He later divorced, but did not revert to the faith of his ancestors.", "begin": 10107.637, "end": 10144.517, "localBegin": 1442.56, "localEnd": 1479.44}, {"id": "c004_f000056", "text": "Under these two asymmetric rules, one can do simple simulations and see how a small Islamic group occupying Christian (Coptic) Egypt can lead, over the centuries, to the Copts becoming a tiny minority. All one needs is a small rate of interfaith marriages. Likewise, one can see how Judaism doesn't spread and tends to stay in the minority, as the religion has weaker rules: the mother is required to be Jewish. An even stronger asymmetry than that of Judaism explains the depletion in the Near East of three Gnostic faiths: the Druze, the Ezidi, and the Mandeans (Gnostic religions are those with mysteries and knowledge that are typically accessible to only a minority of elders, with the rest of the members kept in the dark about the details of the faith). Unlike Islam, which requires either parent to be Muslim, and Judaism, which asks for at least the mother to have the faith, these three religions require both parents to be of the faith, otherwise the child and the parents say toodaloo to the community.", "begin": 10144.517, "end": 10204.597, "localBegin": 1479.44, "localEnd": 1539.52}, {"id": "c004_f000057", "text": "In places such as Lebanon, Galilee, and Northern Syria, with mountainous terrain, Christians and other non-Sunni Muslims remained concentrated. Christians, not being exposed to Muslims, experienced no intermarriage. By contrast, Egypt has a flat terrain. The distribution of the population presents homogeneous mixtures there, which permits renormalization (i.e. allows the asymmetric rule to prevail).", "begin": 10204.597, "end": 10230.797, "localBegin": 1539.52, "localEnd": 1565.72}, {"id": "c004_f000058", "text": "Egypt's Copts suffered from an additional problem: the irreversibility of Islamic conversions. Many Copts during Islamic rule converted to the dominant religion when it was merely an administrative procedure, something that helps one land a job or handle a problem that requires Islamic jurisprudence. One did not have to really believe in it, since Islam doesn't conflict markedly with Orthodox Christianity. Little by little a Christian or Jewish family engaging in a Marrano-style conversion becomes truly converted, as, a couple of generations later, the descendants forget the arrangement of their ancestors.", "begin": 10230.797, "end": 10275.117, "localBegin": 1565.72, "localEnd": 1610.04}, {"id": "c004_f000059", "text": "So all Islam did was out-stubborn Christianity, which itself won thanks to its own stubbornness. For before Islam, the original spread of Christianity in the Roman empire was largely due to…the blinding intolerance of Christians; their unconditional, aggressive, and recalcitrant proselytizing. Roman pagans were initially tolerant of Christians, as the tradition was to share gods with other members of the empire. But they wondered why these Nazarenes didn't want to give and take gods and offer that Jesus fellow to the Roman pantheon in exchange for some other gods. What, our gods aren't good enough for them? But Christians were intolerant of Roman paganism. The \"persecution\" of the Christians had vastly more to do with the intolerance of the Christians for the pantheon of local gods than the reverse. What we read is history written by the Christian side, not the Greco-Roman one.", "begin": 10275.117, "end": 10334.237, "localBegin": 1610.04, "localEnd": 1669.16}, {"id": "c004_f000060", "text": "We know too little about the Roman perspective during the rise of Christianity, as hagiographies have dominated the discourse: we have for instance the narrative of the martyr Saint Catherine, who kept converting her jailors until she was beheaded, except that…she may have never existed. But the beheading of Saint Cyprian, bishop of Carthage, under Valerian, was real. So there are endless histories of Christian martyrs and saints - but very little is known of pagan heroes. Even the early Christians of the Gnostic tradition have been expurgated from the record. When Julian the Apostate tried to go back to ancient paganism, it was like trying to sell French food in South Jersey: it simply had no market. It was like trying to keep a balloon under water. And it was not because pagans had an intellectual deficit: in fact, my heuristic is that the more pagan, the more brilliant one's mind, and the higher one's ability to handle nuances and ambiguity. Purely monotheistic religions such as Protestant Christianity, Salafi Islam, or fundamentalist atheism accommodate literalist and mediocre minds that cannot handle ambiguity.", "begin": 10334.237, "end": 10414.477, "localBegin": 1669.16, "localEnd": 1749.4}, {"id": "c004_f000061", "text": "In fact, we can observe in the history of Mediterranean \"religions\" or, rather, rituals and systems of behavior and belief, a drift dictated by the intolerant, actually bringing the system closer to what we can call a religion. Judaism might have almost lost because of the mother rule and its confinement to a tribal base, but Christianity ruled, and for the very same reasons, Islam did. Islam? There have been many Islams, the final accretion quite different from the earlier ones. For Islam itself is ending up being taken over (in the Sunni branch) by purists simply because they are more intolerant than the rest: the Wahhabis (aka Salafis), founders of Saudi Arabia, destroyed the shrines in most parts of what is now their country during the nineteenth century. They went on to impose the maximally intolerant rule in a manner that was later imitated by ISIS. Every single accretion of Salafism seems to exist to accommodate the most intolerant of its branches.", "begin": 10414.477, "end": 10477.477, "localBegin": 1749.4, "localEnd": 1812.4}, {"id": "c004_f000062", "text": "DECENTRALIZE, AGAIN", "begin": 10477.477, "end": 10481.037, "localBegin": 1812.4, "localEnd": 1815.96}, {"id": "c004_f000063", "text": "Another attribute of decentralization, and one that the \"intellectuals\" opposing an exit of Britain from the European Union (Brexit) don't get: if one needs, say, a 3 percent threshold in a political unit for the minority rule to take its effect, and on average the stubborn minority represents 3 percent of the population, with variations around the average, then some states will be subject to the rule, but not others. If, on the other hand, we merge all states in one, then the minority rule will prevail all across. This is the reason the U.S.A. works so well. As I have been repeating to everyone who listens, we are a federation, not a republic. To use the language of Antifragile, decentralization is convex to variations.", "begin": 10481.037, "end": 10531.357, "localBegin": 1815.96, "localEnd": 1866.28}, {"id": "c004_f000064", "text": "IMPOSING VIRTUE ON OTHERS", "begin": 10531.357, "end": 10533.197, "localBegin": 1866.28, "localEnd": 1868.12}, {"id": "c004_f000065", "text": "This idea of one-sidedness can help us debunk a few more misconceptions. How do books get banned? Certainly not because they offend the average person - most persons are passive and don't really care, or don't care enough to request the banning. From past episodes, it looks like all it takes is a few (motivated) activists for the banning of some books, or the blacklisting of some people. The great philosopher and logician Bertrand Russell lost his job at the City University of New York owing to a letter by an angry - and stubborn - mother who did not wish to have her daughter in the same room as the fellow with a dissolute lifestyle and unruly ideas.", "begin": 10533.197, "end": 10573.917, "localBegin": 1868.12, "localEnd": 1908.84}, {"id": "c004_f000066", "text": "The same seems to apply to prohibitions - at least to the prohibition of alcohol in the United States, which led to interesting mafia stories.", "begin": 10573.917, "end": 10582.997, "localBegin": 1908.84, "localEnd": 1917.92}, {"id": "c004_f000067", "text": "Let us conjecture that the formation of moral values in society doesn't come from the evolution of the consensus. No, it is the most intolerant person who imposes virtue on others precisely because of that intolerance. The same can apply to civil rights.", "begin": 10582.997, "end": 10602.157, "localBegin": 1917.92, "localEnd": 1937.08}, {"id": "c004_f000068", "text": "An insight into how the mechanisms of religion and the transmission of morals obey the same renormalization dynamics as dietary laws - and how we can show that morality is more likely to be something enforced by a minority. We saw earlier in the chapter the asymmetry between obeying and breaking rules: a law-abiding (or rule-abiding) fellow always follows the rules, but a felon or someone with looser sets of principles will not always break the rules. Likewise we discussed the strong asymmetric effects of halal dietary laws. Let us merge the two. It turns out that, in classical Arabic, the term halal has one opposite: haram. Violating legal and moral rules - any rule - is called haram. It is the exact same interdict that governs food intake and all other human behaviors, like sleeping with the wife of your neighbor, lending with interest (without partaking of downside of the borrower), or killing one's landlord for pleasure. Haram is haram and is asymmetric.", "begin": 10602.157, "end": 10664.797, "localBegin": 1937.08, "localEnd": 1999.72}, {"id": "c004_f000069", "text": "Once a moral rule is established, it will suffice to have a small, intransigent minority of geographically distributed followers to dictate a norm in society. The sad news is that one person looking at mankind as an aggregate may mistakenly believe that humans are spontaneously becoming more moral, better, and more gentle, with better breath, when this applies to only a small proportion of mankind.", "begin": 10664.797, "end": 10688.677, "localBegin": 1999.72, "localEnd": 2023.6}, {"id": "c004_f000070", "text": "But things work both ways, the good and the bad. While some believe that the average Pole was complicit in the liquidation of Jews, the historian Peter Fritzsche, when asked, \"Why didn't the Poles in Warsaw help their Jewish neighbors more?,\" responded that they generally did. But it took seven or eight Poles to help one Jew. It took only one Pole, acting as an informer, to turn in a dozen Jews. Even if such select anti-Semitism is contestable, we can easily imagine bad outcomes stemming from a minority of bad agents.", "begin": 10688.677, "end": 10725.117, "localBegin": 2023.6, "localEnd": 2060.04}, {"id": "c004_f000071", "text": "STABILITY OF THE MINORITY RULE, A PROBABILISTIC ARGUMENT", "begin": 10725.117, "end": 10728.677, "localBegin": 2060.04, "localEnd": 2063.6}, {"id": "c004_f000072", "text": "Wherever you look across societies and histories, you tend to find the same general moral laws prevailing, with some, but not significant, variations: do not steal (at least not from within the tribe); do not hunt orphans for entertainment; do not gratuitously beat up Spanish grammar specialists for training, instead use boxing bags (unless you are Spartan and even then you can only kill a limited number of helots for training purposes), and similar interdicts. And we can see these rules evolved over time to become more universal, expanding to a broader set, to progressively include slaves, other tribes, other species (animals, economists), etc. And one property of these laws: they are black-and-white, binary, discrete, and allow no shadow. You cannot steal \"a little bit\" or murder \"moderately\" - just as you cannot keep kosher and eat \"just a little bit\" of pork at Sunday barbecues.", "begin": 10728.677, "end": 10787.757, "localBegin": 2063.6, "localEnd": 2122.68}, {"id": "c004_f000073", "text": "I don't think that if you fondled the breast of the wife or girlfriend of some random weight lifter in front of him, you would do well in the intervening noisy episode, nor would you be able to convince him that it was \"just a little bit.\"", "begin": 10787.757, "end": 10801.517, "localBegin": 2122.68, "localEnd": 2136.44}, {"id": "c004_f000074", "text": "Now, it would be vastly more likely that these values emerged from a minority than a majority. Why? Take the following two theses:", "begin": 10801.517, "end": 10811.157, "localBegin": 2136.44, "localEnd": 2146.08}, {"id": "c004_f000075", "text": "Outcomes are paradoxically more stable under the minority rule - the variance of the results is lower and the rule is more likely to emerge independently across separate populations.", "begin": 10811.157, "end": 10821.997, "localBegin": 2146.08, "localEnd": 2156.92}, {"id": "c004_f000076", "text": "What emerges from the minority rule is more likely to be black-and-white, binary rules.", "begin": 10821.997, "end": 10829.997, "localBegin": 2156.92, "localEnd": 2164.92}, {"id": "c004_f000077", "text": "An example. Consider that an evil person, say an economics professor, decides to poison the collective by putting some product into soda cans. He has two options. The first is cyanide, which obeys a minority rule: a drop of poison (higher than a small threshold) makes the entire liquid poisonous. The second is a \"majority-style\" poison; it requires more than half the ingested liquid to be poisonous in order to kill. Now look at the inverse problem, a collection of dead people after a dinner party. The local Sherlock Holmes would assert that, conditional on the outcome that all people drinking the soda having been killed, the evil man opted for the first, not the second option. Simply, the majority rule leads to fluctuations around the average, with a high rate of survival. Not the minority rule. The minority rule produces low-variance in outcomes.", "begin": 10829.997, "end": 10882.237, "localBegin": 2164.92, "localEnd": 2217.16}, {"id": "c004_f000078", "text": "POPPER-GOEDEL'S PARADOX", "begin": 10882.237, "end": 10888.157, "localBegin": 2217.16, "localEnd": 2223.08}, {"id": "c004_f000079", "text": "I was at a large, multi-table dinner party, the kind where you have to choose between the vegetarian risotto and the non-vegetarian option, when I noticed that my neighbor had his food catered (including silverware) on a tray reminiscent of airplane fare. The dishes were sealed with aluminum foil. He was evidently ultra-kosher. It did not bother him to be seated with prosciutto eaters, who, in addition, mix butter and meat in the same dishes. He just wanted to be left alone to follow his own preferences.", "begin": 10888.157, "end": 10918.597, "localBegin": 2223.08, "localEnd": 2253.52}, {"id": "c004_f000080", "text": "For Jews and Muslim minorities such as Shiites, Sufis, and (vaguely) associated religions such as Druze and Alawis, the aim is to be left alone - with historical exceptions here and there. But had my neighbor been a Sunni Salafi, he would have required the entire room to be eating halal. Perhaps the entire building. Perhaps the entire town. Hopefully the entire country. Ideally, the entire planet. Indeed, given the total lack of separation between church and state in his creed, and between the holy and the profane, to him haram (the opposite of halal) means literally illegal. The entire room was committing a legal violation.", "begin": 10918.597, "end": 10959.477, "localBegin": 2253.52, "localEnd": 2294.4}, {"id": "c004_f000081", "text": "As I am writing these lines, people are disputing whether the freedom of the enlightened West can be undermined by the intrusive policies that would be needed to fight fundamentalists.", "begin": 10959.477, "end": 10968.437, "localBegin": 2294.4, "localEnd": 2303.36}, {"id": "c004_f000082", "text": "Can democracy - by definition the majority - tolerate enemies? The question is as follows: \"Would you agree to deny the freedom of speech to every political party that has in its charter the banning of freedom of speech?\" Let's go one step further: \"Should a society that has elected to be tolerant be intolerant about intolerance?\"", "begin": 10968.437, "end": 10991.437, "localBegin": 2303.36, "localEnd": 2326.36}, {"id": "c004_f000083", "text": "This is in fact the incoherence that Kurt Gödel (the grandmaster of logical rigor) detected in the United States Constitution while taking the naturalization exam. Legend has it that Gödel started arguing with the judge, and Einstein, who was his witness during the process, saved him. The philosopher of science Karl Popper independently discovered the same inconsistency in democratic systems.", "begin": 10991.437, "end": 11017.917, "localBegin": 2326.36, "localEnd": 2352.84}, {"id": "c004_f000084", "text": "I wrote about people with logical flaws asking me if one should be \"skeptical about skepticism\"; I used a similar answer as Popper when I was asked if \"one could falsify falsification.\" I just walked away.", "begin": 11017.917, "end": 11031.837, "localBegin": 2352.84, "localEnd": 2366.76}, {"id": "c004_f000085", "text": "We can answer these points using the minority rule. Yes, an intolerant minority can control and destroy democracy. Actually, it will eventually destroy our world.", "begin": 11031.837, "end": 11042.717, "localBegin": 2366.76, "localEnd": 2377.64}, {"id": "c004_f000086", "text": "So, we need to be more than intolerant with some intolerant minorities. Simply, they violate the Silver Rule. It is not permissible to use \"American values\" or \"Western principles\" in treating intolerant Salafism (which denies other peoples' right to have their own religion). The West is currently in the process of committing suicide.", "begin": 11042.717, "end": 11067.077, "localBegin": 2377.64, "localEnd": 2402.0}, {"id": "c004_f000087", "text": "IRREVERENCE OF MARKETS AND SCIENCE", "begin": 11067.077, "end": 11069.117, "localBegin": 2402.0, "localEnd": 2404.04}, {"id": "c004_f000088", "text": "Now consider markets. We can say that markets aren't the sum of market participants, but price changes reflect the activities of the most motivated buyer and seller. Yes, the most motivated rules. Indeed this is something that only traders seem to understand: why a price can drop by ten percent because of a single seller. All you need is a stubborn seller. Markets react in a way that is disproportional to the impetus. The overall stock markets currently represent more than thirty trillion dollars, but a single order in 2008, only fifty billion, that is, less than two-tenths of a percent of the total, triggered a drop of close to 10 percent, causing losses of around three trillion dollars. As retold in Antifragile, it was an order activated by the Parisian bank Société Générale, which discovered a hidden acquisition by a rogue trader and wanted to reverse the purchase. Why did the market react so disproportionately? Because the order was one-way - stubborn: they had to sell and there was no way to convince the management otherwise. My personal adage is:", "begin": 11069.117, "end": 11138.317, "localBegin": 2404.04, "localEnd": 2473.24}, {"id": "c004_f000089", "text": "The market is like a large movie theater with a small door.", "begin": 11138.317, "end": 11141.837, "localBegin": 2473.24, "localEnd": 2476.76}, {"id": "c004_f000090", "text": "And the best way to detect a sucker is to see if his focus is on the size of the theater rather than that of the door. Stampedes happen in cinemas - say, when someone shouts \"fire\" - because those who want to be out do not want to stay in, exactly the same unconditionality we saw with kosher observance or panic selling.", "begin": 11141.837, "end": 11161.877, "localBegin": 2476.76, "localEnd": 2496.8}, {"id": "c004_f000091", "text": "Science acts similarly. As we saw earlier, the minority rule is behind Karl Popper's thinking. But Popper is too stern, so let us leave him for later and, for now, discuss the more entertaining and jovial Richard Feynman, the most irreverent and playful scientist of his day. His book of anecdotes, What Do You Care What Other People Think?, conveys the idea of the fundamental irreverence of science, which proceeds through a similar mechanism as the kosher asymmetry. How? Science isn't the sum of what scientists think, but exactly as with markets, it is a procedure that is highly skewed. Once you debunk something, it is now wrong. Had science operated by majority consensus, we would be still stuck in the Middle Ages, and Einstein would have ended as he started, a patent clerk with fruitless side hobbies.", "begin": 11161.877, "end": 11213.357, "localBegin": 2496.8, "localEnd": 2548.28}, {"id": "c004_f000092", "text": "UNUS SED LEO: ONLY ONE BUT A LION", "begin": 11213.357, "end": 11218.197, "localBegin": 2548.28, "localEnd": 2553.12}, {"id": "c004_f000093", "text": "Alexander said that it was preferable to have an army of sheep led by a lion than an army of lions led by a sheep. Alexander (or whoever produced this probably apocryphal saying) understood the value of the active, intolerant, and courageous minority. Hannibal terrorized Rome for a decade and a half with a tiny army of mercenaries, winning twenty-two battles against the Romans, battles in which he was outnumbered each time. He was inspired by a version of this maxim. For, at the battle of Cannae, he remarked to Gisco, who was concerned that the Carthaginians were outnumbered by the Romans: \"There is one thing that's more wonderful than their numbers…in all that vast number there is not one man called Gisgo.\"", "begin": 11218.197, "end": 11269.197, "localBegin": 2553.12, "localEnd": 2604.12}, {"id": "c004_f000094", "text": "This large payoff from stubborn courage is not limited to the military. \"Never doubt that a small group of thoughtful citizens can change the world. Indeed, it is the only thing that ever has,\" wrote Margaret Mead. Revolutions are unarguably driven by an obsessive minority. And the entire growth of society, whether economic or moral, comes from a small number of people.", "begin": 11269.197, "end": 11298.477, "localBegin": 2604.12, "localEnd": 2633.4}, {"id": "c004_f000095", "text": "SUMMARY AND NEXT", "begin": 11298.477, "end": 11303.757, "localBegin": 2633.4, "localEnd": 2638.68}, {"id": "c004_f000096", "text": "So we summarize this chapter and link it to hidden asymmetries, the subtitle of the book. Society doesn't evolve by consensus, voting, majority, committees, verbose meetings, academic conferences, tea and cucumber sandwiches, or polling; only a few people suffice to disproportionately move the needle. All one needs is an asymmetric rule somewhere - and someone with soul in the game. And asymmetry is present in about everything.", "begin": 11303.757, "end": 11336.757, "localBegin": 2638.68, "localEnd": 2671.68}, {"id": "c004_f000097", "text": "We promised in the Prologue to explain that slavery is more widespread than anticipated - actually, quite a bit more. Let us see next, after the Appendix.", "begin": 11336.757, "end": 11375.957, "localBegin": 2671.68, "localEnd": 2710.88}, {"id": "c004_f000098", "text": "Appendix to book 3 A Few More Counterintuitive Things About the Collective", "begin": 11375.957, "end": 11381.517, "localBegin": 2710.88, "localEnd": 2716.44}, {"id": "c004_f000099", "text": "Antifragile has been about the failure of the average to represent anything in the presence of nonlinearities and asymmetries similar to the minority rule. So let us go beyond:", "begin": 11381.517, "end": 11393.837, "localBegin": 2716.44, "localEnd": 2728.76}, {"id": "c004_f000100", "text": "The average behavior of the market participant will not allow us to understand the general behavior of the market.", "begin": 11393.837, "end": 11400.837, "localBegin": 2728.76, "localEnd": 2735.76}, {"id": "c004_f000101", "text": "You can examine markets as markets and individuals as individuals, but markets are not sums of average individuals (a sum is an average multiplied by a constant so they are both equally affected). These points now appear clear thanks to our discussion about renormalization. But to show how claims by the entire field of social science may fall apart, take one step further:", "begin": 11400.837, "end": 11425.117, "localBegin": 2735.76, "localEnd": 2760.04}, {"id": "c004_f000102", "text": "The psychological experiments on individuals showing \"biases\" do not allow us to automatically understand aggregates or collective behavior, nor do they enlighten us about the behavior of groups.", "begin": 11425.117, "end": 11437.317, "localBegin": 2760.04, "localEnd": 2772.24}, {"id": "c004_f000103", "text": "Human nature is not defined outside of transactions involving other humans. Remember that we do not live alone, but in packs, and almost nothing of relevance concerns a person in isolation - which is what is typically done in laboratory-style works.", "begin": 11437.317, "end": 11460.237, "localBegin": 2772.24, "localEnd": 2795.16}, {"id": "c004_f000104", "text": "Groups are units on their own. There are qualitative differences between a group of ten and a group of, say, 395,435. Each is a different animal, in the literal sense, as different as a book is from an office building. When we focus on commonalities, we get confused, but, at a certain scale, things become different. Mathematically different. The higher the dimension, in other words, the higher the number of possible interactions, and the more disproportionally difficult it is to understand the macro from the micro, the general from the simple units. This disproportionate increase of computational demands is called the curse of dimensionality. (I have actually found situations where, in the presence of small random errors, a single additional dimension may more than double some aspect of the complexity. Going from 1,000 to 1,001 may cause complexity to be multiplied by a billion times.)", "begin": 11460.237, "end": 11526.357, "localBegin": 2795.16, "localEnd": 2861.28}, {"id": "c004_f000105", "text": "Or, in spite of the huge excitement about our ability to see into the brain using the so-called field of neuroscience:", "begin": 11526.357, "end": 11534.557, "localBegin": 2861.28, "localEnd": 2869.48}, {"id": "c004_f000106", "text": "Understanding how the subparts of the brain (say, neurons) work will never allow us to understand how the brain works.", "begin": 11534.557, "end": 11541.997, "localBegin": 2869.48, "localEnd": 2876.92}, {"id": "c004_f000107", "text": "A group of neurons or genes, like a group of people, differs from the individual components - because the interactions are not necessarily linear. So far we have no f***ing idea how the brain of the worm C. elegans works, which has around three hundred neurons. C. elegans was the first living unit to have its genes sequenced. Now consider that the human brain has about one hundred billion neurons, and that going from 300 to 301 neurons, because of the curse of dimensionality, may double the complexity. So the use of never here is appropriate. And if you also want to understand why, in spite of the trumpeted \"advances\" in sequencing the DNA, we are largely unable to get information except in small isolated pockets for some diseases, same story. Monogenic diseases, those for which a single gene plays a role, are quite tractable, but anything entailing higher dimensionality falls apart.", "begin": 11541.997, "end": 11601.517, "localBegin": 2876.92, "localEnd": 2936.44}, {"id": "c004_f000108", "text": "Understanding the genetic makeup of a unit will never allow us to understand the behavior of the unit itself.", "begin": 11601.517, "end": 11608.957, "localBegin": 2936.44, "localEnd": 2943.88}, {"id": "c004_f000109", "text": "A reminder that what I am writing here isn't an opinion. It is a straightforward mathematical property.", "begin": 11608.957, "end": 11614.397, "localBegin": 2943.88, "localEnd": 2949.32}, {"id": "c004_f000110", "text": "The mean-field approach is when one uses the average interaction between, say, two people, and generalizes to the group - it is only possible if there are no asymmetries. For instance, Yaneer Bar-Yam has applied the failure of mean-field to evolutionary theory of the selfish-gene narrative trumpeted by such aggressive journalistic minds as Richard Dawkins and Steven Pinker, with more mastery of English than probability theory. He shows that local properties fail and the so-called mathematics used to prove the selfish gene are woefully naive and misplaced. There has been a storm around work by Martin Nowack and his colleagues (which include the biologist E. O. Wilson) about the terminal flaws in the selfish gene theory.", "begin": 11614.397, "end": 11658.557, "localBegin": 2949.32, "localEnd": 2993.48}, {"id": "c004_f000111", "text": "The question is: could it be that much of what we have read about the advances in behavioral sciences is nonsense? Odds are it is. Many people have been accused of racism, segregationism, and somethingism without merit. Using cellular automata, a technique similar to renormalization, the late Thomas Schelling showed a few decades ago how a neighborhood can be segregated without a single segregationist among its inhabitants.", "begin": 11658.557, "end": 11697.597, "localBegin": 2993.48, "localEnd": 3032.52}, {"id": "c004_f000112", "text": "ZERO-INTELLIGENCE MARKETS", "begin": 11697.597, "end": 11701.877, "localBegin": 3032.52, "localEnd": 3036.8}, {"id": "c004_f000113", "text": "The underlying structure of reality matters much more than the participants, something policymakers fail to understand.", "begin": 11701.877, "end": 11710.597, "localBegin": 3036.8, "localEnd": 3045.52}, {"id": "c004_f000114", "text": "Under the right market structure, a collection of idiots produces a well-functioning market.", "begin": 11710.597, "end": 11715.437, "localBegin": 3045.52, "localEnd": 3050.36}, {"id": "c004_f000115", "text": "The researchers Dhananjay Gode and Shyam Sunder came to a surprising result in 1993. You populate markets with zero intelligence agents, that is buying and selling randomly, under some structure such that a proper auction process matches bids and offers in a regular way. And guess what? We get the same allocative efficiency as if market participants were intelligent. Friedrich Hayek has been, once again, vindicated. Yet one of the most cited ideas in history, that of the invisible hand, appears to be the least integrated into modern psyche.", "begin": 11715.437, "end": 11752.517, "localBegin": 3050.36, "localEnd": 3087.44}, {"id": "c004_f000116", "text": "Furthermore:", "begin": 11752.517, "end": 11754.717, "localBegin": 3087.44, "localEnd": 3089.64}, {"id": "c004_f000117", "text": "It may be that some idiosyncratic behavior on the part of the individual (deemed at first glance \"irrational\") may be necessary for efficient functioning at the collective level.", "begin": 11754.717, "end": 11767.277, "localBegin": 3089.64, "localEnd": 3102.2}, {"id": "c004_f000118", "text": "More critically for the \"rationalist\" crowd,", "begin": 11767.277, "end": 11769.397, "localBegin": 3102.2, "localEnd": 3104.32}, {"id": "c004_f000119", "text": "Individuals don't need to know where they are going; markets do.", "begin": 11769.397, "end": 11773.637, "localBegin": 3104.32, "localEnd": 3108.56}, {"id": "c004_f000120", "text": "Leave people alone under a good structure and they will take care of things.", "begin": 11773.637, "end": 11782.917, "localBegin": 3108.56, "localEnd": 3117.84}]}, {"kind": "chapter", "number": 5, "title": "Books 4 and 5: Wolves Among Dogs / Being Alive Means Taking Certain Risks", "audio": "audio/chapter_005.mp3", "start": 11782.922, "end": 15922.39, "duration": 4139.468, "paragraphs": [{"id": "c005_f000001", "text": "Book 4 Wolves Among Dogs", "begin": 11782.922, "end": 11790.002, "localBegin": 0.0, "localEnd": 7.08}, {"id": "c005_f000002", "text": "Chapter 3 How to Legally Own Another Person", "begin": 11790.002, "end": 11795.362, "localBegin": 7.08, "localEnd": 12.44}, {"id": "c005_f000003", "text": "Even the church had its hippies - Coase does not need math - Avoid lawyers during Oktoberfest - The expat life ends one day - People who have been employees are signaling domestication", "begin": 11795.362, "end": 11811.082, "localBegin": 12.44, "localEnd": 28.16}, {"id": "c005_f000004", "text": "In its early phase, as the church was starting to get established in Europe, there was a group of itinerant people called the gyrovagues. They were gyrating and roaming monks without any affiliation to any institution. Theirs was a freelance (and ambulatory) variety of monasticism, and their order was sustainable, as the members lived off begging and from the good graces of townsmen who took interest in them. It was a weak form of sustainability, as one can hardly call sustainable a group of a people with vows of celibacy: they cannot grow organically, and would need continuous enrollment. But they managed to survive thanks to help from the population, who provided them with food and temporary shelter.", "begin": 11811.082, "end": 11851.482, "localBegin": 28.16, "localEnd": 68.56}, {"id": "c005_f000005", "text": "Until sometime around the fifth century, when they started disappearing - they are now extinct. The gyrovagues were unpopular with the church, banned by the Council of Chalcedon in the fifth century, then banned again by the second Council of Nicaea about three hundred years later. In the West, Saint Benedict of Nursia, their greatest detractor, favored a more institutional brand of monasticism, and ended up prevailing with his rules that codified the activity, with a hierarchy and strong supervision by an abbot. For instance, Benedict's rules, put together in a sort of instruction manual, stipulate that a monk's possessions should be in the hands of the abbot (Rule 33), and Rule 70 bans angry monks from hitting other monks.", "begin": 11851.482, "end": 11896.722, "localBegin": 68.56, "localEnd": 113.8}, {"id": "c005_f000006", "text": "Why were they banned? They were, simply, totally free. They were financially free, and secure, not because of their means but because of their lack of wants. Ironically, by being beggars, they had the equivalent of f*** you money, which we can more easily get by being at the lowest rung than by joining the income-dependent classes.", "begin": 11896.722, "end": 11917.402, "localBegin": 113.8, "localEnd": 134.48}, {"id": "c005_f000007", "text": "Complete freedom is the last thing you want if you have an organized religion to run. Total freedom for your employees is also a very, very bad thing if you have a firm to run, so this chapter is about the question of employees and the nature of the firm and other institutions.", "begin": 11917.402, "end": 11934.562, "localBegin": 134.48, "localEnd": 151.64}, {"id": "c005_f000008", "text": "Benedict's instruction manual aims explicitly at removing any hint of freedom from the monks under the principles of stabilitate sua et conversatione morum suorum et oboedientia - \"stability, conversion of manners, and obedience.\" And of course monks are put through a probation period of one year to see if they are sufficiently obedient.", "begin": 11934.562, "end": 11958.922, "localBegin": 151.64, "localEnd": 176.0}, {"id": "c005_f000009", "text": "In short, every organization wants a certain number of people associated with it to be deprived of a certain share of their freedom. How do you own these people? First, by conditioning and psychological manipulation; second, by tweaking them to have some skin in the game, forcing them to have something significant to lose if they disobey authority - something hard to do with gyrovague beggars who flout their scorn for material possessions. In the orders of the mafia, things are simple: made men (that is, ordained) can be whacked if the capo suspects a lack of allegiance, with a transitory stay in the trunk of a car - and a guaranteed presence of the boss at their funerals. For other professions, skin in the game comes in more subtle forms.", "begin": 11958.922, "end": 12005.522, "localBegin": 176.0, "localEnd": 222.6}, {"id": "c005_f000010", "text": "TO OWN A PILOT", "begin": 12005.522, "end": 12008.562, "localBegin": 222.6, "localEnd": 225.64}, {"id": "c005_f000011", "text": "Let us say that you own a small airline company. You are a very modern person; having attended many conferences and spoken to consultants, you believe that the traditional company is a thing of the past: everything can be organized through a web of contractors. It is more efficient to do so, you are certain.", "begin": 12008.562, "end": 12026.922, "localBegin": 225.64, "localEnd": 244.0}, {"id": "c005_f000012", "text": "Bob is a pilot with whom you have entered into a specific contract, in a well-defined drawn-out legal agreement, for precise flights, commitments made a long time in advance, which includes a penalty for nonperformance. Bob supplies the co-pilot and an alternative pilot in case someone is sick. Tomorrow evening you will be operating a scheduled flight to Munich as part of an Oktoberfest special. The flight is full with motivated budget passengers, some of whom went on a preparatory diet; they have been waiting a whole year for this Gargantuan episode of beer, pretzels, and sausage in laughter-filled hangars.", "begin": 12026.922, "end": 12062.082, "localBegin": 244.0, "localEnd": 279.16}, {"id": "c005_f000013", "text": "Bob calls you at five P.M. to let you know that he and the copilot, well, they love you…but, you know, they will not fly the plane tomorrow. You know, they had an offer from a Saudi Arabian Sheikh, a devout man who wants to take a special party to Las Vegas, and needs Bob and his team to run the flight. The Sheikh and his retinue were impressed with Bob's manners, the fact that Bob had never had a drop of alcohol in his life, his expertise in fermented yoghurt drinks, and told him that money was no object. The offer is so generous that it covers whatever penalty there is for a breach of a competing contract by Bob.", "begin": 12062.082, "end": 12097.682, "localBegin": 279.16, "localEnd": 314.76}, {"id": "c005_f000014", "text": "You kick yourself. There are plenty of lawyers on these Oktoberfest flights, and, worse, retired lawyers without hobbies who love to sue as a way to kill time, regardless of outcome. Consider the chain reaction: if your plane doesn't take off, you will not have the equipment to bring the beer-fattened passengers back from Munich - and you will most certainly miss many round trips. Rerouting passengers is costly and not guaranteed.", "begin": 12097.682, "end": 12123.522, "localBegin": 314.76, "localEnd": 340.6}, {"id": "c005_f000015", "text": "You make a few phone calls and it turns out that it is easier to find an academic economist with common sense than find another pilot - that is, an event of probability zero. You have all this equity in a firm that is now under severe financial threat. You are certain that you will go bust.", "begin": 12123.522, "end": 12141.282, "localBegin": 340.6, "localEnd": 358.36}, {"id": "c005_f000016", "text": "You start thinking: well, you know, if Bob were a slave, someone you own, you know, these kind of things would not be possible. Slave? But wait…what Bob just did isn't something that employees who are in the business of being employees do! People who are employees for a living don't behave so opportunistically. Contractors are exceedingly free; as risk-takers, they fear mostly the law. But employees have a reputation to protect. And they can be fired.", "begin": 12141.282, "end": 12169.922, "localBegin": 358.36, "localEnd": 387.0}, {"id": "c005_f000017", "text": "People you find in employment love the regularity of the payroll, with that special envelop on their desk the last day of the month, and without which they would act as a baby deprived of mother's milk. You realize that had Bob been an employee rather than something that appeared to be cheaper, that contractor thing, then you wouldn't be having so much trouble.", "begin": 12169.922, "end": 12192.242, "localBegin": 387.0, "localEnd": 409.32}, {"id": "c005_f000018", "text": "But employees are expensive. You have to pay them even when you've got nothing for them to do. You lose your flexibility. Talent for talent, they cost a lot more. Lovers of paychecks are lazy…but they would never let you down at times like these.", "begin": 12192.242, "end": 12207.682, "localBegin": 409.32, "localEnd": 424.76}, {"id": "c005_f000019", "text": "So employees exist because they have significant skin in the game - and the risk is shared with them, enough risk for it to be a deterrent and a penalty for acts of undependability, such as failing to show up on time. You are buying dependability.", "begin": 12207.682, "end": 12223.522, "localBegin": 424.76, "localEnd": 440.6}, {"id": "c005_f000020", "text": "And dependability is a driver behind many transactions. People of some means have a country house - which is inefficient compared to hotels or rentals - because they want to make sure it is available if they decide they want to use it on a whim. There is a trader's expression: \"Never buy when you can rent the three Fs: what you Float, what you Fly, and what you…(that something else).\" Yet many people own boats and planes, and end up stuck with that something else.", "begin": 12223.522, "end": 12250.042, "localBegin": 440.6, "localEnd": 467.12}, {"id": "c005_f000021", "text": "True, a contractor has downside, a financial penalty that can be built into the contract, in addition to reputational costs. But consider that an employee will always have more risk. And conditional on someone being an employee, such a person will be risk averse. By being employees they signal a certain type of domestication.", "begin": 12250.042, "end": 12272.122, "localBegin": 467.12, "localEnd": 489.2}, {"id": "c005_f000022", "text": "Someone who has been employed for a while is giving you strong evidence of submission.", "begin": 12272.122, "end": 12278.442, "localBegin": 489.2, "localEnd": 495.52}, {"id": "c005_f000023", "text": "Evidence of submission is displayed by the employee's going through years depriving himself of his personal freedom for nine hours every day, his ritualistic and punctual arrival at an office, his denying himself his own schedule, and his not having beaten up anyone on the way back home after a bad day. He is an obedient, housebroken dog.", "begin": 12278.442, "end": 12301.682, "localBegin": 495.52, "localEnd": 518.76}, {"id": "c005_f000024", "text": "FROM THE COMPANY MAN TO THE COMPANIES PERSON", "begin": 12301.682, "end": 12305.802, "localBegin": 518.76, "localEnd": 522.88}, {"id": "c005_f000025", "text": "Even when an employee ceases to be an employee, he will remain diligent. The longer the person stays with a company, the more emotional investment they will have in staying, and, when leaving, are guaranteed in making an \"honorable exit.\"", "begin": 12305.802, "end": 12321.602, "localBegin": 522.88, "localEnd": 538.68}, {"id": "c005_f000026", "text": "If employees lower your tail risk, you lower theirs as well. Or at least, that's what they think you do.", "begin": 12321.602, "end": 12335.242, "localBegin": 538.68, "localEnd": 552.32}, {"id": "c005_f000027", "text": "At the time of writing, firms stay in the top league by size (the so-called S&P 500) for only about between ten and fifteen years. Companies exit the S&P 500 through mergers or by shrinking their business, both conditions leading to layoffs. Throughout the twentieth century, however, expected duration was more than sixty years. Longevity for large firms was greater; people stayed with large firms for their entire lives. There was such a thing as a company man (restricting the gender here is appropriate, as company men were almost all men).", "begin": 12335.242, "end": 12381.202, "localBegin": 552.32, "localEnd": 598.28}, {"id": "c005_f000028", "text": "The company man is best defined as someone whose identity is impregnated with the stamp his firm wants to give him. He dresses the part, even uses the language the company expects. His social life is so invested in the company that leaving it inflicts a huge penalty, like banishment from Athens under the Ostrakon. Saturday nights, he goes out with other company men and spouses, sharing company jokes. IBM required its employees to wear white shirts - not light blue, not with discreet stripes, but plain white. And a dark blue suit. Nothing was allowed to be fancy, or invested with the tiniest amount of idiosyncratic attribute. You were a part of IBM.", "begin": 12381.202, "end": 12423.122, "localBegin": 598.28, "localEnd": 640.2}, {"id": "c005_f000029", "text": "Our definition:", "begin": 12423.122, "end": 12424.842, "localBegin": 640.2, "localEnd": 641.92}, {"id": "c005_f000030", "text": "A company man is someone who feels that he has something huge to lose if he doesn't behave as a company man - that is, he has skin in the game.", "begin": 12424.842, "end": 12434.762, "localBegin": 641.92, "localEnd": 651.84}, {"id": "c005_f000031", "text": "In return, the firm is bound by a pact to keep the company man on the books as long as feasible, that is, until mandatory retirement, after which he would go play golf with a comfortable pension, with former coworkers as partners. The system worked when large corporations survived a long time and were perceived to be longer lasting than nation-states.", "begin": 12434.762, "end": 12457.042, "localBegin": 651.84, "localEnd": 674.12}, {"id": "c005_f000032", "text": "By the 1990s, however, people started to realize that working as a company man was safe…provided the company stayed around. But the technological revolution that took place in Silicon valley put traditional companies under financial threat. For instance, after the rise of Microsoft and the personal computer, IBM, which was the main farm for company men, had to lay off a proportion of its \"lifers,\" who then realized that the low-risk profile of their position wasn't so low risk. These people couldn't find a job elsewhere; they were of no use to anyone outside IBM. Even their sense of humor failed outside of the corporate culture.", "begin": 12457.042, "end": 12495.842, "localBegin": 674.12, "localEnd": 712.92}, {"id": "c005_f000033", "text": "If the company man is, sort of, gone, he has been replaced by the companies person. For people are no longer owned by a company but by something worse: the idea that they need to be employable. The employable person is embedded in an industry, with fear of upsetting not just their employer, but other potential employers.", "begin": 12495.842, "end": 12515.882, "localBegin": 712.92, "localEnd": 732.96}, {"id": "c005_f000034", "text": "COASE'S THEORY OF THE FIRM", "begin": 12515.882, "end": 12521.322, "localBegin": 732.96, "localEnd": 738.4}, {"id": "c005_f000035", "text": "Perhaps, by definition, an employable person is the one you will never find in a history book, because these people are designed to never leave their mark on the course of events. They are, by design, uninteresting to historians. But let us now see how this fits the theory of the firm and the ideas of Ronald Coase.", "begin": 12521.322, "end": 12557.522, "localBegin": 738.4, "localEnd": 774.6}, {"id": "c005_f000036", "text": "An employee is - by design - more valuable inside a firm than outside of it; that is, more valuable to the employer than the marketplace.", "begin": 12557.522, "end": 12566.162, "localBegin": 774.6, "localEnd": 783.24}, {"id": "c005_f000037", "text": "Coase was a remarkable modern economist in that he was independent thinking, rigorous, and creative, with ideas that are applicable and explai
