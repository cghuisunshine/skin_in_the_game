 mean these were not there. The record is insufficient, and such asymmetry needs to be permanently present in one's analysis. Silent evidence should be the driver. Reading a history book, without putting its events in perspective, offers a similar bias to reading an account of life in New York seen from an emergency room at Bellevue Hospital.", "begin": 24804.894, "end": 24865.374, "localBegin": 1583.84, "localEnd": 1644.32}, {"id": "c008_f000079", "text": "So always keep in mind that historians and policy scholaristas are selected from a cohort of people who derive their knowledge from books, not real life and business. The same is true for State Department employees, since these are not hired among adventurers and doers, but students of these scholars. Let's say it bluntly: spending part of your life reading archives in the stacks of the Yale Library doesn't fit the nonacademic temperament of someone who has to be aware and watch his back, say, a debt-collector for the Mafia or a pit speculator in fast commodities. (If you don't get this, you are an academic.)", "begin": 24865.374, "end": 24903.494, "localBegin": 1644.32, "localEnd": 1682.44}, {"id": "c008_f000080", "text": "Let us take for example the standard account of Arabs in Spain, Turks in parts of the Byzantine Empire, or Arabs and Byzantines. From a geopolitics standpoint, you would see all of these situations as a tug-of-war. Yes, there was a tug-of-war, but not in the sense that you suspect. Merchants were doing business very actively during these periods. My own existence as Greek-Orthodox of Byzantine rite living under Islam (though at a safe, very safe physical distance from Sunni Muslims) is witness to such collaboration. And never discount the theological rationalizations to justify collaboration with the economic powers - before the discovery of America, the business center of gravity was in the East. The expression \"Better the turban of the Turk than the tiara of the Pope!\" originated with the Grand Duke Lucas Notaras, who negotiated a friendship treaty with the Ottomans, and was repeated at various stages in history. It is also attributed to Saint Mark of Ephesus, and was often shouted by Balkan peasants to justify siding with the Turks against their Catholic lords.", "begin": 24903.494, "end": 24969.574, "localBegin": 1682.44, "localEnd": 1748.52}, {"id": "c008_f000081", "text": "As the reader will know by now, I have myself lived through the worst part of the civil war in Lebanon. Except for areas near the Green Line, it didn't feel like war. But those reading about it in history books will not understand my experience.", "begin": 24969.574, "end": 25008.734, "localBegin": 1748.52, "localEnd": 1787.68}, {"id": "c008_f000082", "text": "NEXT", "begin": 25008.734, "end": 25010.014, "localBegin": 1787.68, "localEnd": 1788.96}, {"id": "c008_f000083", "text": "We just saw in Book 6 various asymmetries in life coming from largely undetected agency problems, where absence of skin in the game contaminates fields and produces distortions.", "begin": 25010.014, "end": 25045.734, "localBegin": 1788.96, "localEnd": 1824.68}, {"id": "c008_f000084", "text": "But recall that religion is about skin in the game - not quite about \"belief.\" We will spend the next few chapters with what people call \"religion,\" which will take us deeper and deeper into the core of the book: rationality and risk bearing.", "begin": 25045.734, "end": 25094.294, "localBegin": 1824.68, "localEnd": 1873.24}, {"id": "c008_f000085", "text": "Book 7 Religion, Belief, and Skin in the Game", "begin": 25094.294, "end": 25104.774, "localBegin": 1873.24, "localEnd": 1883.72}, {"id": "c008_f000086", "text": "Chapter 15 They Don't Know What They Are Talking About When They Talk about Religion", "begin": 25104.774, "end": 25133.214, "localBegin": 1883.72, "localEnd": 1912.16}, {"id": "c008_f000087", "text": "The more they talk. the less you understand - Law or nomous? - In religion, as in other things, you pay for the label", "begin": 25133.214, "end": 25146.414, "localBegin": 1912.16, "localEnd": 1925.36}, {"id": "c008_f000088", "text": "My lifetime motto is that mathematicians think in (well, precisely defined and mapped) objects and relations, jurists and legal thinkers in constructs, logicians in maximally abstract operators, and…fools in words.", "begin": 25146.414, "end": 25163.054, "localBegin": 1925.36, "localEnd": 1942.0}, {"id": "c008_f000089", "text": "Two people can be using the same word, meaning different things, yet continue the conversation, which is fine for coffee, but not when making decisions, particularly policy decisions affecting others. But it is easy to trip them, as Socrates did, simply by asking them what they think they mean by what they said - hence philosophy was born as rigor in discourse and disentanglement of mixed-up notions, in precise opposition to the sophist's promotion of rhetoric. Since Socrates we have had a long tradition of mathematical science and contract law driven by precision in mapping terms. But we have also had many pronouncements by fools using labels - outside of poetry, beware the verbalistic, that archenemy of knowledge.", "begin": 25163.054, "end": 25210.214, "localBegin": 1942.0, "localEnd": 1989.16}, {"id": "c008_f000090", "text": "-", "begin": 25210.214, "end": 25213.294, "localBegin": 1989.16, "localEnd": 1992.24}, {"id": "c008_f000091", "text": "Different people rarely mean the same thing when they say \"religion,\" nor do they realize it. For early Jews and Muslims, religion was law. Din means law in Hebrew and religion in Arabic. For early Jews, religion was also tribal; for early Muslims, it was universal. For the Romans, religion was social events, rituals, and festivals - the word religio was a counter to superstitio, and while present in the Roman zeitgeist it had no equivalent concept in the Greek-Byzantine East. Throughout the ancient world, law was procedurally and mechanically its own thing. Early Christianity, thanks to Saint Augustine, stayed relatively away from the law, and, later, remembering its origins, had an uneasy relation with it. For instance, even during the Inquisition, a lay court formally handled final sentencing. Further, Theodosius's code (compiled in the fifth century to unify Roman law) was \"Christianized\" with a short introduction, a blessing of sorts - the rest remained identical to pagan Roman legal reasoning as expounded in Constantinople and (mostly) Berytus. The code remained dominated by the Phoenician legal scholars Ulpian and Papinian, who were pagan: contrary to theories by geopoliticalists, the Roman school of law of Berytus (Beirut) was not shut down by Christianity, but by an earthquake.", "begin": 25213.294, "end": 25298.814, "localBegin": 1992.24, "localEnd": 2077.76}, {"id": "c008_f000092", "text": "The difference is marked in that Christian Aramaic uses different words: din for religion and nomous (from the Greek) for law. Jesus, with his imperative \"give to Caesar what belongs to Caesar,\" separated the holy and the profane: Christianity was for another domain, \"the kingdom to come,\" only merging with this one in the eschaton. Neither Islam nor Judaism have a marked separation between holy and profane. And of course Christianity moved away from the solely spiritual domain to embrace the ceremonial and ritualistic, integrating much of the pagan rites of the Levant and Asia Minor. As an illustration of the symbolic separation between church and state, the title Pontifex Maximus (head priest), taken by the Roman emperors after Augustus, reverted after Theodosius, in the late fourth century, to the bishop of Rome, and later, more or less informally, to the Catholic Pope.", "begin": 25298.814, "end": 25370.534, "localBegin": 2077.76, "localEnd": 2149.48}, {"id": "c008_f000093", "text": "For most Jews today, religion has become ethnocultural, without the law - and for many, a nation. Same for Armenians, Syriacs, Chaldeans, Copts, and Maronites. For Orthodox and Catholic Christians, religion is largely aesthetics, pomp, and rituals. For Protestants, religion is belief without aesthetics, pomp, or law. Further East, for Buddhists, Shintoists, and Hindus, religion is practical and spiritual philosophy, with a code of ethics (and for some, a cosmogony). So when Hindus talk about the Hindu \"religion,\" it doesn't mean the same thing to a Pakistani, and would certainly mean something different to a Persian.", "begin": 25370.534, "end": 25411.934, "localBegin": 2149.48, "localEnd": 2190.88}, {"id": "c008_f000094", "text": "When the nation-state dream came about, things got more, much more complicated. When an Arab used to say \"Jew\" he largely referred to a creed; to Arabs, a converted Jew was no longer a Jew. But for a Jew, a Jew was simply defined as someone whose mother was a Jew. But Judaism somewhat merged into nation-state and now, for many, indicates belonging to a nation.", "begin": 25411.934, "end": 25437.854, "localBegin": 2190.88, "localEnd": 2216.8}, {"id": "c008_f000095", "text": "In Serbia, Croatia, and Lebanon, religion means one thing at times of peace, and something quite different at times of war.", "begin": 25437.854, "end": 25446.414, "localBegin": 2216.8, "localEnd": 2225.36}, {"id": "c008_f000096", "text": "When someone discusses the \"Christian minority\" in the Levant, it doesn't amount to (as Arabs tend to think) promoting a Christian theocracy (full theocracies were rare in Christian history, just Byzantium and a short attempt by Calvin). He just means \"secular,\" or wants a marked separation of church and state. Same for the gnostics (Druids, Druze, Mandeans, Alawis, Alevis) who have a religion largely unknown by its members, lest they leak and get persecuted by the dominant majority.", "begin": 25446.414, "end": 25476.614, "localBegin": 2225.36, "localEnd": 2255.56}, {"id": "c008_f000097", "text": "The problem with the European Union is that naive bureaucrats (those fellows who can't find a coconut on Coconut island) are fooled by the label. They treat Salafism, say, as just a religion - with its houses of \"worship\" - when in fact it is just an intolerant political system, which promotes (or allows) violence and rejects the institutions of the West - those very institutions that allow them to operate. We saw with the minority rule that the intolerant will run over the tolerant; cancer must be stopped before it becomes metastatic.", "begin": 25476.614, "end": 25511.094, "localBegin": 2255.56, "localEnd": 2290.04}, {"id": "c008_f000098", "text": "Salafism is very similar to atheistic Soviet Communism in its heyday: both have all-embracing control over all of human activity and thought, which makes discussions about whether religion or atheistic regimes are more murderous lacking in pertinence, precision, and realism.", "begin": 25511.094, "end": 25529.814, "localBegin": 2290.04, "localEnd": 2308.76}, {"id": "c008_f000099", "text": "BELIEF VS. BELIEF", "begin": 25529.814, "end": 25535.654, "localBegin": 2308.76, "localEnd": 2314.6}, {"id": "c008_f000100", "text": "We will see in the next chapter that \"belief\" can be epistemic, or simply procedural (or metaphorical) - leading to confusions about which sorts of beliefs are religious beliefs and which ones are not. For, on top of the \"religion\" problem, there is a problem with belief. Some beliefs are largely decorative, some are functional (they help in survival), others are literal. And to revert to our metastatic Salafi problem: when one of these fundamentalists talks to a Christian, he is convinced that the Christian takes his own beliefs literally, while the Christian is convinced that the Salafi has the same oft-metaphorical concepts that he has, to be taken seriously but not literally - and, often, not very seriously. Religions such as Christianity, Judaism, and, to some extent Shiite Islam, evolved (or, rather, let their members evolve in developing a sophisticated society) precisely by moving away from the literal. The literal doesn't leave any room for adaptation.", "begin": 25535.654, "end": 25594.494, "localBegin": 2314.6, "localEnd": 2373.44}, {"id": "c008_f000101", "text": "As Gibbon wrote:", "begin": 25594.494, "end": 25596.894, "localBegin": 2373.44, "localEnd": 2375.84}, {"id": "c008_f000102", "text": "The various modes of worship, which prevailed in the Roman world, were all considered by the people, as equally true; by the philosopher, as equally false; and by the magistrate, as equally useful. And thus toleration produced not only mutual indulgence, but even religious concord.", "begin": 25596.894, "end": 25615.894, "localBegin": 2375.84, "localEnd": 2394.84}, {"id": "c008_f000103", "text": "LIBERTARIANISM AND CHURCH-FREE RELIGIONS", "begin": 25615.894, "end": 25621.014, "localBegin": 2394.84, "localEnd": 2399.96}, {"id": "c008_f000104", "text": "As we mentioned, the Roman emperor Julian the Apostate tried to revert to ancient paganism after his father's cousin Constantine the Great started the process toward making Christianity a state religion almost half a century earlier. But he made a fatal reasoning error.", "begin": 25621.014, "end": 25635.974, "localBegin": 2399.96, "localEnd": 2414.92}, {"id": "c008_f000105", "text": "His problem was that, having been brought up as a Christian, he imagined that paganism required a structure similar to that of the church, ce genre de trucs. So he tried to create pagan bishops, synods, and these kinds of things. He did not realize that each pagan group had its own definition of religion, that each temple had its own practices, that by definition paganism was distributed in its execution, rituals, cosmogonies, practices, and \"beliefs.\" Pagans did not have a category for paganism.", "begin": 25635.974, "end": 25670.294, "localBegin": 2414.92, "localEnd": 2449.24}, {"id": "c008_f000106", "text": "After Julian, a brilliant general and valiant warrior, died in battle (heroically), the dream of returning to ancient values ended with him.", "begin": 25670.294, "end": 25678.494, "localBegin": 2449.24, "localEnd": 2457.44}, {"id": "c008_f000107", "text": "Just as paganism cannot be pigeon-holed, the same applies to libertarianism. It does not fit the structure of a political \"party\" - only that of a decentralized political movement. The very concept doesn't allow for the straitjacket of a strong party line and unified policy with respect to, say, court locations or relations with Mongolia. Political parties are hierarchical, they are designed in a way to substitute someone's own decision making with a well-defined protocol. This doesn't work with libertarians. The nomenklatura that is necessary in the functioning of a party cannot exist in a libertarian environment fraught with fractious and vehemently independent people.", "begin": 25678.494, "end": 25721.974, "localBegin": 2457.44, "localEnd": 2500.92}, {"id": "c008_f000108", "text": "Nevertheless, we libertarians share a minimal set of beliefs, the central one being to substitute the rule of law for the rule of authority. Without necessarily realizing it, libertarians believe in complex systems. And, since libertarianism is a movement, it can still exist as splintered factions within other political parties.", "begin": 25721.974, "end": 25743.814, "localBegin": 2500.92, "localEnd": 2522.76}, {"id": "c008_f000109", "text": "NEXT", "begin": 25743.814, "end": 25744.294, "localBegin": 2522.76, "localEnd": 2523.24}, {"id": "c008_f000110", "text": "To conclude, beware labels when it comes to matters associated with beliefs. And avoid treating religions as if they are all the same animal. But there is a commonality. The next chapter will show us how religion does not like fair-weather friends; it wants commitment; it is based on skin in the game.", "begin": 25744.294, "end": 25764.334, "localBegin": 2523.24, "localEnd": 2543.28}, {"id": "c008_f000111", "text": "Chapter 16 No Worship Without Skin in the Game", "begin": 25764.334, "end": 25772.934, "localBegin": 2543.28, "localEnd": 2551.88}, {"id": "c008_f000112", "text": "Symmetry, symmetry everywhere - Belief requires an entry fee", "begin": 25772.934, "end": 25781.174, "localBegin": 2551.88, "localEnd": 2560.12}, {"id": "c008_f000113", "text": "It is when you break a fast that you understand religion. I am writing this as I am ending the grueling Greek-Orthodox period of Lent, which, for the most part, allows no animal products. This diet is particularly hard to keep in the West where people use butter and dairy products. But once you fast, you feel entitled to celebrate Easter; it is like the exhilaration of fresh water when one is thirsty. You've paid a price.", "begin": 25781.174, "end": 25808.734, "localBegin": 2560.12, "localEnd": 2587.68}, {"id": "c008_f000114", "text": "Recall our brief discussion of the theological necessity of making Christ man - he had to sacrifice himself. Time to develop the argument here.", "begin": 25808.734, "end": 25817.694, "localBegin": 2587.68, "localEnd": 2596.64}, {"id": "c008_f000115", "text": "The main theological flaw in Pascal's wager is that belief cannot be a free option. It entails a symmetry between what you pay and what you receive. Things otherwise would be too easy. So the skin-in-the-game rules that hold between humans also hold in our rapport with the gods.", "begin": 25817.694, "end": 25836.294, "localBegin": 2596.64, "localEnd": 2615.24}, {"id": "c008_f000116", "text": "THE GODS DO NOT LIKE CHEAP SIGNALING", "begin": 25836.294, "end": 25842.614, "localBegin": 2615.24, "localEnd": 2621.56}, {"id": "c008_f000117", "text": "I will always remember the church altar in Saint Sergius (or, in the vernacular, Mar Sarkis) in the Aramaic-speaking town of Maaloula, even if I live 125 years. I visited the church a few decades ago, sparking an obsession with that ancient and neglected language. The town still spoke at the time the version of Western Aramaic that was used by Christ. At the time of Christ, the Levant spoke Greek in the coastal towns and Aramaic in the countryside. For those into Talmud, Western Aramaic corresponds to \"Yerushalmi\" or \"Palestinian Aramaic,\" as opposed to the Babylonian Aramaic closer to what is now Syriac. It was mesmerizing to see children speak, tease each other, and do what children usually do, but in an ancient language.", "begin": 25842.614, "end": 25889.174, "localBegin": 2621.56, "localEnd": 2668.12}, {"id": "c008_f000118", "text": "When a town holds the remnants of an ancient language, one needs to look for vestiges of an ancient practice. And indeed there was one. The detail that I will always remember is that the altar in Saint Sergius has a drain for blood. It had been recycled from an earlier pre-Christian practice. The appurtenances of the church came from a reconverted pagan temple used by early Christians. Actually, at the risk of upsetting a few people, it was not that reconverted: early Christians were sort of pagans. The standard theory is that before the council of Nicea (fourth century), it was common for Christians to recycle pagan altars. But there turns out to be evidence for what I always suspected: Christians and Jews in practice were not too differentiated from other Semitic cult followers, and shared places of worship with one another. The presence of saints in Christianity comes from that mechanism of recycling. There were no telephones, fax machines, or websites financed by Saudi princes to homogenize religions.", "begin": 25889.174, "end": 25949.694, "localBegin": 2668.12, "localEnd": 2728.64}, {"id": "c008_f000119", "text": "\"Altar\" in spoken Levantine and Aramaic is still maḋbaḣ from DBH, \"ritual slaying by cutting the guttural vein.\" It is an old tradition that left its mark on Islam: halal food requires such a method for slaughter. And qorban, the Semitic word QRB for \"getting closer (to God),\" originally done via sacrifice, is still used as a word for sacrament.", "begin": 25949.694, "end": 25978.494, "localBegin": 2728.64, "localEnd": 2757.44}, {"id": "c008_f000120", "text": "In fact, one of the main figures of Shiite Islam, the Imam Hussein son of Ali, addressed God before his death by offering himself as sacrifice: \"let me be the qorban for you\" - the supreme offering.", "begin": 25978.494, "end": 25993.294, "localBegin": 2757.44, "localEnd": 2772.24}, {"id": "c008_f000121", "text": "And his followers, to this day, show literal skin in the game during the commemoration of his death, the day of Ashoura, engaging in self-flagellation that leads to open wounds. Self-flagellation is also present in Christianity, as commemoration of the suffering of the Christ - while prevalent in the Middle Ages, it is now gone except in some places in Asia and Latin America.", "begin": 25993.294, "end": 26016.974, "localBegin": 2772.24, "localEnd": 2795.92}, {"id": "c008_f000122", "text": "In the Eastern Mediterranean pagan world (Greco-Semitic), no worship was done without sacrifice. The gods did not accept cheap talk. It was all about revealed preferences. Also, burnt offerings were precisely burnt so no human would consume them. Actually, not quite: the high priest got his share; priesthood was quite a lucrative position since in the pre-Christian, Greek-speaking Eastern Mediterranean, the offices of high priests were often auctioned off.", "begin": 26016.974, "end": 26047.294, "localBegin": 2795.92, "localEnd": 2826.24}, {"id": "c008_f000123", "text": "Physical sacrifice even applied to the Temple of Jerusalem. And even to later Jews, or early Christians, the followers of Pauline Christianity. Hebrews 9:22: Et omnia paene in sanguine mundantur secundum legem et sine sanguinis fusione non fit remissio. \"And almost all things are by the law purged with blood; and without shedding of blood is no remission.\"", "begin": 26047.294, "end": 26076.974, "localBegin": 2826.24, "localEnd": 2855.92}, {"id": "c008_f000124", "text": "But Christianity ended up removing the idea of such sacrifice under the notion that Christ sacrificed himself for others. But if you visit a Catholic or Orthodox church on Sunday service, you will see a simulacrum. It has wine representing blood, which, at the close of the ceremony is flushed in the piscina (the drain). Exactly as in the Maaloula altar.", "begin": 26076.974, "end": 26100.694, "localBegin": 2855.92, "localEnd": 2879.64}, {"id": "c008_f000125", "text": "Christianity used the personality of the Christ for the simulacrum; he sacrificed himself for us.", "begin": 26100.694, "end": 26110.014, "localBegin": 2879.64, "localEnd": 2888.96}, {"id": "c008_f000126", "text": "At the Last Supper, on the night when He was betrayed, our Savior instituted the Eucharistic sacrifice of His Body and Blood. He did this in order to perpetuate the sacrifice of the Cross throughout the centuries until He should come again. - Sacrosanctum Concilium, 47", "begin": 26110.014, "end": 26127.334, "localBegin": 2888.96, "localEnd": 2906.28}, {"id": "c008_f000127", "text": "Sacrifice was ended by making it metaphorical:", "begin": 26127.334, "end": 26132.374, "localBegin": 2906.28, "localEnd": 2911.32}, {"id": "c008_f000128", "text": "I appeal to you therefore brothers, by the mercies of God, to present your bodies as a living sacrifice, holy and acceptable to God, which is your spiritual worship. - Romans 12:1", "begin": 26132.374, "end": 26145.574, "localBegin": 2911.32, "localEnd": 2924.52}, {"id": "c008_f000129", "text": "As for Judaism, the same progression took place: after the destruction of the Second Temple in the first century A.D., animal sacrifices ended. Before that, the parable of Isaac and Abraham marks the notion of progressive departure from human sacrifice by the Abrahamic sects - as well as an insistence of skin in the game. But actual animal sacrifice continued for a while - though under different terms. God tested Abraham's faith with an asymmetric gift: sacrifice your son for me - it was not as with other situations of just giving the gods part of your yield in return for future benefits and improved harvests, as with common gift-giving, with tacit reciprocal expectations. It was the mother of all unconditional gifts to God. It was not a transaction, the transaction to end all transactions. About a millennia later, Christians had their last transaction.", "begin": 26145.574, "end": 26200.854, "localBegin": 2924.52, "localEnd": 2979.8}, {"id": "c008_f000130", "text": "The philosopher Moshe Halbertal holds that, post the simulacrum of Isaac, dealings with the Lord became a reciprocal gift-giving affair. But why did animal sacrifice continue for a while?", "begin": 26200.854, "end": 26213.614, "localBegin": 2979.8, "localEnd": 2992.56}, {"id": "c008_f000131", "text": "Canaanite habits die hard. Maimonides explains why God did not proscribe immediately the then-common practice of animal sacrifice: the reason is that \"to obey such a commandment would have been contrary to the nature of man, who generally cleaves to that to which he is used\"; instead he \"transferred to His service that which had served as a worship of created beings and of things imaginary and unreal.\" So animal sacrifice continued - largely voluntary - but, and this is the mark of Abrahamic religion, not the worship of animals, or the propitiation of deities through bribery. The latter practice even extended to the bribery of other tribes and others' gods, as continued to be practiced in Arabia until the sixth century. Then a United Nations of sorts, a communal marketplace for both goods, foreign relations, and various bilateral worship, took place in Mecca.", "begin": 26213.614, "end": 26269.854, "localBegin": 2992.56, "localEnd": 3048.8}, {"id": "c008_f000132", "text": "Love without sacrifice is theft (Procrustes). This applies to any form of love, particularly the love of God.", "begin": 26269.854, "end": 26279.854, "localBegin": 3048.8, "localEnd": 3058.8}, {"id": "c008_f000133", "text": "THE EVIDENCE", "begin": 26279.854, "end": 26283.254, "localBegin": 3058.8, "localEnd": 3062.2}, {"id": "c008_f000134", "text": "To summarize, in a Judeo-Christian place of worship, the focal point, where the priest stands, symbolizes skin in the game. The notion of belief without sacrifice, which is tangible proof, is new in history.", "begin": 26283.254, "end": 26297.854, "localBegin": 3062.2, "localEnd": 3076.8}, {"id": "c008_f000135", "text": "The strength of a creed did not rest on \"evidence\" of the powers of its gods, but evidence of the skin in the game on the part of its worshippers.", "begin": 26297.854, "end": 26307.654, "localBegin": 3076.8, "localEnd": 3086.6}, {"id": "c008_f000136", "text": "Chapter 17 Is the Pope Atheist?", "begin": 26307.654, "end": 26315.294, "localBegin": 3086.6, "localEnd": 3094.24}, {"id": "c008_f000137", "text": "It is dangerous to be a Pope, but you get good medical attention - Talk is just talk - Religion manages rituals", "begin": 26315.294, "end": 26324.694, "localBegin": 3094.24, "localEnd": 3103.64}, {"id": "c008_f000138", "text": "After Pope John Paul II was shot in 1981, he was rushed to the emergency room of the Agostino Gemelli University Polyclinic, where he met a collection of some of the most skilled doctors - modern doctors - Italy could produce, in contrast with the neighboring public hospital with lower-quality care. The Gemelli clinic later became the preferred destination for the pontiff at the first sign of a health problem.", "begin": 26324.694, "end": 26350.414, "localBegin": 3103.64, "localEnd": 3129.36}, {"id": "c008_f000139", "text": "At no point during the emergency period did the drivers of the ambulance consider taking John Paul the Second to a chapel for a prayer, or some equivalent form of intercession with the Lord, to give the sacred first right of refusal for the treatment. And not one of his successors seemed to have considered giving precedence to dealing with the Lord with the hope of some miraculous intervention in place of the trappings of modern medicine.", "begin": 26350.414, "end": 26374.614, "localBegin": 3129.36, "localEnd": 3153.56}, {"id": "c008_f000140", "text": "This is not to say that the bishops, cardinals, priests, and mere laypeople didn't pray and ask the Lord for help, nor that they believed that prayers weren't subsequently answered, given the remarkable recovery of the saintly man. But it remains that nobody in the Vatican seems to ever take chances by going first to the Lord, subsequently to the doctor, and, what is even more surprising, nobody seems to see a conflict with such inversion of the logical sequence. In fact the opposite course of action would have been considered madness. It would be in opposition to the tenets of the Catholic church, as it would be considered voluntary death, which is banned.", "begin": 26374.614, "end": 26413.414, "localBegin": 3153.56, "localEnd": 3192.36}, {"id": "c008_f000141", "text": "Note that the putative predecessors of the pope, the various Roman emperors, had a similar policy of seeking treatment first, and having recourse to theology after, although some of their treatments were packaged as delivered by the deities, such as the Greek god Asclepius or the weaker Roman equivalent Vediovis.", "begin": 26413.414, "end": 26432.374, "localBegin": 3192.36, "localEnd": 3211.32}, {"id": "c008_f000142", "text": "Now try to imagine a powerful head of an \"atheist\" sect, equivalent to the pope in rank, suffering a similar health exigency. He would have arrived at Gemelli (not some second-rate hospital in Latium) at the same time as John Paul. He would have had a similar-looking crowd of \"atheist\" well-wishers come to give him something called \"hope\" (or \"wishes\" for a good recovery) in their very atheistic language, with some self-consistent narrative about what they would like or \"wish\" to happen to their prominent man. The atheists would have been less colorfully dressed; their vocabulary would have been a bit less ornamental as well, but their actions would have been nearly identical.", "begin": 26432.374, "end": 26472.494, "localBegin": 3211.32, "localEnd": 3251.44}, {"id": "c008_f000143", "text": "Clearly, there are a lot of differences between the Most Holy Father and an atheist of equivalent rank, but these concern matters that are not life-threatening. These include sacrifices. His Holiness has given up on certain activities in the bedroom, other than reading and praying, though at least a dozen of his predecessors, the most famous one being Alexander VI, fathered a great deal of children, at least one when he was in his sixties, and by the conventional (not the immaculate) route. (There have been so many playboy popes that people are bored with their stories.) His Holiness spends considerable time praying, organizing every minute of his life according to certain Christian practices. And yet, while they devote less of their time to what they believe is not \"religion,\" many atheists engage in yoga and similar collective activities, or sit in concert halls in awe and silence (you can't even smoke a cigar or shout buy orders on your cell phone), spending considerable time doing what to a Martian would look like similar ritualistic gestures.", "begin": 26472.494, "end": 26533.254, "localBegin": 3251.44, "localEnd": 3312.2}, {"id": "c008_f000144", "text": "There was a period, the Albigensian crusade, in the thirteenth century, during which Catholics engaged in the mass killing of heretics. Some slaughtered indiscriminately, heretics and nonheretics, as a time saver and complexity-reduction approach. To them, it did not matter who was who, since \"The Lord would be able to tell them apart.\" Those times are long gone. Most Christians, when it comes to central medical, ethical, and decision-making situations (like myself, an Orthodox Christian) do not act any differently than atheists. Those who do (such as Christian scientists) are few. Most Christians have accepted the modern trappings of democracy, oligarchy, or military dictatorship, all these heathen political regimes, rather than seeking theocracies. Their decisions on central matters are indistinguishable from those of an atheist.", "begin": 26533.254, "end": 26585.454, "localBegin": 3312.2, "localEnd": 3364.4}, {"id": "c008_f000145", "text": "RELIGIOUS IN WORDS", "begin": 26585.454, "end": 26589.654, "localBegin": 3364.4, "localEnd": 3368.6}, {"id": "c008_f000146", "text": "So we define atheism or secularism in deeds, by the distance between one's actions and those of a nonatheistic person for an equivalent situation, not his beliefs and other decorative and symbolic matters - which, we will show in the next chapter, do not count.", "begin": 26589.654, "end": 26607.134, "localBegin": 3368.6, "localEnd": 3386.08}, {"id": "c008_f000147", "text": "Let us take stock here. There are people who are", "begin": 26607.134, "end": 26611.454, "localBegin": 3386.08, "localEnd": 3390.4}, {"id": "c008_f000148", "text": "atheists in actions, religious in words (most Orthodox and Catholic Christians)", "begin": 26611.454, "end": 26617.014, "localBegin": 3390.4, "localEnd": 3395.96}, {"id": "c008_f000149", "text": "and others who are", "begin": 26617.014, "end": 26618.294, "localBegin": 3395.96, "localEnd": 3397.24}, {"id": "c008_f000150", "text": "religious in actions, religious in words (Salafi Islamists and suicide bombers)", "begin": 26618.294, "end": 26624.334, "localBegin": 3397.24, "localEnd": 3403.28}, {"id": "c008_f000151", "text": "but I know of nobody who is atheist in both actions and words, completely devoid of rituals, respect for the dead, and superstitions (say a belief in economics, or in the miraculous powers of the mighty state and its institutions).", "begin": 26624.334, "end": 26638.894, "localBegin": 3403.28, "localEnd": 3417.84}, {"id": "c008_f000152", "text": "NEXT", "begin": 26638.894, "end": 26641.934, "localBegin": 3417.84, "localEnd": 3420.88}, {"id": "c008_f000153", "text": "This chapter will ease us to the next section: a) rationality resides in what you do, not in what you think or in what you \"believe\" (skin in the game), and b) rationality is about survival.", "begin": 26641.934, "end": 26660.934, "localBegin": 3420.88, "localEnd": 3439.88}]}, {"kind": "chapter", "number": 9, "title": "Book 8: Risk and Rationality", "audio": "audio/chapter_009.mp3", "start": 26660.963, "end": 30059.049, "duration": 3398.086, "paragraphs": [{"id": "c009_f000001", "text": "Book 8 Risk and Rationality", "begin": 26660.963, "end": 26668.123, "localBegin": 0.0, "localEnd": 7.16}, {"id": "c009_f000002", "text": "Chapter 18 How to Be Rational About Rationality", "begin": 26668.123, "end": 26674.443, "localBegin": 7.16, "localEnd": 13.48}, {"id": "c009_f000003", "text": "Restaurants without kitchens - Science from the grave - Do not shoot to the left of piano players - Merchants of rationality", "begin": 26674.443, "end": 26685.603, "localBegin": 13.48, "localEnd": 24.64}, {"id": "c009_f000004", "text": "My friend Rory Sutherland claims that the real function of swimming pools is to allow the middle class to sit around in bathing suits without looking ridiculous. Same with New York restaurants: you think their mission is to feed people, but that's not what they are about. They are in the business of overcharging you for liquor or Great Tuscan wines by the glass, yet get you in the door by serving you your low-carb (or low-something) dishes at break-even cost. (This business model, of course, fails to work in Saudi Arabia.)", "begin": 26685.603, "end": 26716.243, "localBegin": 24.64, "localEnd": 55.28}, {"id": "c009_f000005", "text": "So when we look at religion, and, to some extent, ancestral superstitions, we should consider what purpose they serve, rather than focusing on the notion of \"belief,\" epistemic belief in its strict scientific definition. In science, belief is literal belief; it is right or wrong, never metaphorical. In real life, belief is an instrument to do things, not the end product. This is similar to vision: the purpose of your eyes is to orient you in the best possible way, and get you out of trouble when needed, or help you find prey at a distance. Your eyes are not sensors designed to capture the electromagnetic spectrum. Their job description is not to produce the most accurate scientific representation of reality; rather the most useful one for survival.", "begin": 26716.243, "end": 26764.243, "localBegin": 55.28, "localEnd": 103.28}, {"id": "c009_f000006", "text": "OCULAR DECEPTION", "begin": 26764.243, "end": 26767.043, "localBegin": 103.28, "localEnd": 106.08}, {"id": "c009_f000007", "text": "Our perceptional apparatus makes mistakes - distortions - in order to lead us to more precise actions: ocular deception, it turns out, is a necessary thing. Greek and Roman architects misrepresented the columns of their temples, by tilting them inward, in order to give us the impression that the columns are straight. As Vitruvius explains, the aim is to \"counteract the visual reception by a change of proportions.\" A distortion is meant to bring about an enhancement for your aesthetic experience. The floor of the Parthenon is curved in reality so we can see it as straight. The columns are in truth unevenly spaced, so we can see them lined up like a marching Russian division in a parade.", "begin": 26767.043, "end": 26809.363, "localBegin": 106.08, "localEnd": 148.4}, {"id": "c009_f000008", "text": "Should one go lodge a complaint with the Greek Ministry of Tourism claiming that the columns are not vertical and that someone is taking advantage of our visual mechanisms?", "begin": 26809.363, "end": 26820.403, "localBegin": 148.4, "localEnd": 159.44}, {"id": "c009_f000009", "text": "ERGODICITY FIRST", "begin": 26820.403, "end": 26823.203, "localBegin": 159.44, "localEnd": 162.24}, {"id": "c009_f000010", "text": "The same applies to distortions of beliefs. Are visual deceits any different from leading someone to believe in Santa Claus, if it enhances his or her holiday aesthetic experience? No, unless it causes harm.", "begin": 26823.203, "end": 26837.563, "localBegin": 162.24, "localEnd": 176.6}, {"id": "c009_f000011", "text": "In that sense harboring superstitions is not irrational by any metric: nobody has managed to build a criterion for rationality based on actions that bear no cost. But actions that harm you are detectable, if not observable.", "begin": 26837.563, "end": 26852.523, "localBegin": 176.6, "localEnd": 191.56}, {"id": "c009_f000012", "text": "We will see in the next chapter that, unless one has an overblown and very unrealistic (Greek column-style) representation of some tail risks, one cannot survive - all it takes is a single event to cause an irreversible exit from the Social Security system. Is selective paranoia \"irrational\" if those individuals and populations who don't have it end up dying or extinct?", "begin": 26852.523, "end": 26876.683, "localBegin": 191.56, "localEnd": 215.72}, {"id": "c009_f000013", "text": "A statement that will orient us for the rest of the book:", "begin": 26876.683, "end": 26879.523, "localBegin": 215.72, "localEnd": 218.56}, {"id": "c009_f000014", "text": "Survival comes first, truth, understanding, and science later.", "begin": 26879.523, "end": 26884.923, "localBegin": 218.56, "localEnd": 223.96}, {"id": "c009_f000015", "text": "In other words, you do not need science to survive (we've survived for several hundred million years or more, depending on how you define the \"we\"), but you must survive to do science. As your grandmother would have said, better safe than sorry. Or as per the expression attributed to Hobbes: Primum vivere, deinde philosophari (First, live; then philosophize). This logical precedence is well understood by traders and people in the real world, as per the Warren Buffett truism \"to make money you must first survive\" - skin in the game again; those of us who take risks have their priorities firmer than vague textbook pseudo-rationalism. More technically, this brings us again to the ergodic property (which I keep promising to explain, but we are not ready yet): for the world to be \"ergodic,\" there needs to be no absorbing barrier, no substantial irreversibilities.", "begin": 26884.923, "end": 26938.403, "localBegin": 223.96, "localEnd": 277.44}, {"id": "c009_f000016", "text": "And what do we mean by \"survival\"? Survival of whom? Of you? Your family? Your tribe? Humanity? Note for now that I have a finite shelf life; my survival is not as important as the survival of things that do not have a limited life expectancy, such as mankind or planet earth. Hence the more \"systemic\" things are, the more important survival becomes.", "begin": 26938.403, "end": 26960.763, "localBegin": 277.44, "localEnd": 299.8}, {"id": "c009_f000017", "text": "FIGURE 3. An illustration of the bias-variance tradeoff. Assume two people (sober) shooting at a target in, say, Texas. The left shooter has a bias, a systematic \"error,\" but on balance gets closer to the target than the right shooter, who has no systematic bias but a high variance. Typically, you cannot reduce one without increasing the other. When fragile, the strategy at the left is the best: maintain a distance from ruin, that is, from hitting a point in the periphery should it be dangerous. This schema explains why if you want to minimize the probability of the plane crashing, you may make mistakes with impunity provided you lower your dispersion.", "begin": 26960.763, "end": 27007.483, "localBegin": 299.8, "localEnd": 346.52}, {"id": "c009_f000018", "text": "Rationality does not superficially look like rationality - just as science doesn't look like science as we've seen. Three rigorous thinkers (and their schools) orient my thinking on the matter: the cognitive scientist and polymath Herb Simon, who pioneered artificial intelligence; the psychologist Gerd Gigerenzer; and the mathematician, logician, and decision theorist Ken Binmore, who spent his life formulating the logical foundations of rationality.", "begin": 27007.483, "end": 27037.643, "localBegin": 346.52, "localEnd": 376.68}, {"id": "c009_f000019", "text": "FROM SIMON TO GIGERENZER", "begin": 27037.643, "end": 27040.643, "localBegin": 376.68, "localEnd": 379.68}, {"id": "c009_f000020", "text": "Simon formulated the notion now known as bounded rationality: we cannot possibly measure and assess everything as if we were a computer; we therefore produce, under evolutionary pressures, some shortcuts and distortions. Our knowledge of the world is fundamentally incomplete, so we need to avoid getting into unanticipated trouble. And even if our knowledge of the world were complete, it would still be computationally near-impossible to produce a precise, unbiased understanding of reality. A fertile research program on ecological rationality came out of the effort to cure Simon's problem; it is mostly organized and led by Gerd Gigerenzer (the one who critiqued Dawkins in Chapter 9), mapping how many things we do that appear, on the surface, illogical, but have deeper reasons.", "begin": 27040.643, "end": 27089.803, "localBegin": 379.68, "localEnd": 428.84}, {"id": "c009_f000021", "text": "REVELATION OF PREFERENCES", "begin": 27089.803, "end": 27092.843, "localBegin": 428.84, "localEnd": 431.88}, {"id": "c009_f000022", "text": "As for Ken Binmore, he showed that the concept casually dubbed \"rational\" is ill-defined, in fact so ill-defined that many uses of the term are just gibberish. There is nothing particularly irrational in beliefs per se (given that they can be shortcuts and instrumental to something else): to him everything lies in the notion of \"revealed preferences.\"", "begin": 27092.843, "end": 27115.403, "localBegin": 431.88, "localEnd": 454.44}, {"id": "c009_f000023", "text": "Before explaining the concept, consider the following three maxims:", "begin": 27115.403, "end": 27119.523, "localBegin": 454.44, "localEnd": 458.56}, {"id": "c009_f000024", "text": "Judging people by their beliefs is not scientific.", "begin": 27119.523, "end": 27123.683, "localBegin": 458.56, "localEnd": 462.72}, {"id": "c009_f000025", "text": "There is no such thing as the \"rationality\" of a belief, there is rationality of action.", "begin": 27123.683, "end": 27129.443, "localBegin": 462.72, "localEnd": 468.48}, {"id": "c009_f000026", "text": "The rationality of an action can be judged only in terms of evolutionary considerations.", "begin": 27129.443, "end": 27136.443, "localBegin": 468.48, "localEnd": 475.48}, {"id": "c009_f000027", "text": "The axiom of revelation of preferences (originating with Paul Samuelson, or possibly the Semitic gods), as you recall, states the following: you will not have an idea about what people really think, what predicts people's actions, merely by asking them - they themselves don't necessarily know. What matters, in the end, is what they pay for goods, not what they say they \"think\" about them, or the various possible reasons they give you or themselves for that. If you think about it, you will see that this is a reformulation of skin in the game. Even psychologists get it; in their experiments, their procedures require that actual dollars be spent for a test to be \"scientific.\" The subjects are given a monetary amount, and they watch how the subject formulates choices by examining how they spend the money. However, a large share of psychologists fughedabout revealed preferences when they start bloviating about rationality. They revert to judging beliefs rather than action.", "begin": 27136.443, "end": 27195.483, "localBegin": 475.48, "localEnd": 534.52}, {"id": "c009_f000028", "text": "Beliefs are…cheap talk. There may be some type of a translation mechanism too hard for us to understand, with distortions at the level of the thought process that are actually necessary for things to work.", "begin": 27195.483, "end": 27209.163, "localBegin": 534.52, "localEnd": 548.2}, {"id": "c009_f000029", "text": "Actually, by a mechanism (more technically called the bias-variance tradeoff), you often get better results making \"errors,\" as when you aim slightly away from the target when shooting. (See Figure 3.) I have shown in Antifragile that making some types of errors is the most rational thing to do, when the errors are of little cost, as they lead to discoveries. For instance, most medical \"discoveries\" are accidental to something else. An error-free world would have no penicillin, no chemotherapy…almost no drugs, and most probably no humans.", "begin": 27209.163, "end": 27245.563, "localBegin": 548.2, "localEnd": 584.6}, {"id": "c009_f000030", "text": "This is why I have been against the state dictating to us what we \"should\" be doing: only evolution knows if the \"wrong\" thing is really wrong, provided there is skin in the game to allow for selection.", "begin": 27245.563, "end": 27259.003, "localBegin": 584.6, "localEnd": 598.04}, {"id": "c009_f000031", "text": "WHAT IS RELIGION ABOUT?", "begin": 27259.003, "end": 27262.123, "localBegin": 598.04, "localEnd": 601.16}, {"id": "c009_f000032", "text": "It is therefore my opinion that religion exists to enforce tail risk management across generations, as its binary and unconditional rules are easy to teach and enforce. We have survived in spite of tail risks; our survival cannot be that random.", "begin": 27262.123, "end": 27278.883, "localBegin": 601.16, "localEnd": 617.92}, {"id": "c009_f000033", "text": "Recall that skin in the game means that you do not pay attention to what people say, only to what they do, and to how much of their necks they are putting on the line. Let survival work its wonders.", "begin": 27278.883, "end": 27291.523, "localBegin": 617.92, "localEnd": 630.56}, {"id": "c009_f000034", "text": "Superstitions can be vectors for risk management rules. We have as potent information that people who have them have survived; to repeat, never discount anything that allows you to survive. For instance, Jared Diamond discusses the \"constructive paranoia\" of residents of Papua New Guinea, whose superstitions prevent them from sleeping under dead trees. Whether it is superstition or something else, some deep scientific understanding of probability that is stopping you, it doesn't matter, so long as you don't sleep under dead trees. And if you dream of making people use probability in order to make decisions, I have some news: more than ninety percent of psychologists dealing with decision making (which includes such regulators and researchers as Cass Sunstein and Richard Thaler) have no clue about probability, and try to disrupt our efficient organic paranoias.", "begin": 27291.523, "end": 27331.443, "localBegin": 630.56, "localEnd": 670.48}, {"id": "c009_f000035", "text": "FIGURE 4. The classical \"large world vs small world\" problem. Science is currently too incomplete to provide all answers - and says it itself. We have been so much under assault by vendors using \"science\" to sell products that many people, in their mind, confuse science and scientism. Science is mainly rigor in the process.", "begin": 27331.443, "end": 27344.003, "localBegin": 670.48, "localEnd": 683.04}, {"id": "c009_f000036", "text": "Further, I find it incoherent to criticize someone's superstitions if these are meant to bring some benefits, while at the same time having no problemo with the optical illusions in Greek temples.", "begin": 27344.003, "end": 27356.323, "localBegin": 683.04, "localEnd": 695.36}, {"id": "c009_f000037", "text": "The notion of \"rational\" bandied about by all manner of promoters of scientism isn't defined well enough to be used for beliefs. To repeat, we do not have enough grounds to discuss \"irrational beliefs.\" We do with irrational actions.", "begin": 27356.323, "end": 27373.403, "localBegin": 695.36, "localEnd": 712.44}, {"id": "c009_f000038", "text": "Extending such logic, we can show that much of what we call \"belief\" is some kind of background furniture for the human mind, more metaphorical than real. It may work as therapy.", "begin": 27373.403, "end": 27385.403, "localBegin": 712.44, "localEnd": 724.44}, {"id": "c009_f000039", "text": "Also recall from Chapter 3 that collective rationality might require some individual biases.", "begin": 27385.403, "end": 27390.763, "localBegin": 724.44, "localEnd": 729.8}, {"id": "c009_f000040", "text": "\"TAWK\" AND CHEAP \"TAWK\"", "begin": 27390.763, "end": 27396.963, "localBegin": 729.8, "localEnd": 736.0}, {"id": "c009_f000041", "text": "The first principle we draw:", "begin": 27396.963, "end": 27398.923, "localBegin": 736.0, "localEnd": 737.96}, {"id": "c009_f000042", "text": "There is a difference between beliefs that are decorative and different sorts of beliefs, those that map to action.", "begin": 27398.923, "end": 27405.963, "localBegin": 737.96, "localEnd": 745.0}, {"id": "c009_f000043", "text": "There is no difference between them in words, except that the true difference reveals itself in risk taking, having something at stake, something one could lose in case one is wrong.", "begin": 27405.963, "end": 27416.763, "localBegin": 745.0, "localEnd": 755.8}, {"id": "c009_f000044", "text": "And the lesson, by rephrasing the principle:", "begin": 27416.763, "end": 27419.483, "localBegin": 755.8, "localEnd": 758.52}, {"id": "c009_f000045", "text": "How much you truly \"believe\" in something can be manifested only through what you are willing to risk for it.", "begin": 27419.483, "end": 27426.243, "localBegin": 758.52, "localEnd": 765.28}, {"id": "c009_f000046", "text": "But this merits continuation. The fact that there is this decorative component to belief, life, these strange rules followed outside the Gemelli clinics of the world, merits a discussion. What are these for? Can we truly understand their function? Are we confused about their function? Do we mistake their rationality? Can we use them instead to define rationality?", "begin": 27426.243, "end": 27451.603, "localBegin": 765.28, "localEnd": 790.64}, {"id": "c009_f000047", "text": "WHAT DOES LINDY SAY?", "begin": 27451.603, "end": 27454.323, "localBegin": 790.64, "localEnd": 793.36}, {"id": "c009_f000048", "text": "Let us see what Lindy has to say about \"rationality.\" While the notions of \"reason\" and \"reasonable\" were present in ancient thought, mostly embedded in the notion of precaution, or sophrosyne, this modern idea of \"rationality\" and \"rational decision making\" was born in the aftermath of Max Weber, with the works of psychologists, philosophasters, and psychosophasters. The classical sophrosyne means precaution, self-control, and temperance all in one. It was replaced with something a bit different. \"Rationality\" was forged during the post-enlightenment period, at a time when we thought that understanding the world was around the corner. It assumes absence of randomness, or a simplified random structure of our world. Also, of course, no interactions with the world.", "begin": 27454.323, "end": 27507.003, "localBegin": 793.36, "localEnd": 846.04}, {"id": "c009_f000049", "text": "The only definition of rationality that I've found that is practically, empirically, and mathematically rigorous is the following: what is rational is that which allows for survival. Unlike modern theories by psychosophasters, it maps to the classical way of thinking. Anything that hinders one's survival at an individual, collective, tribal, or general level is, to me, irrational.", "begin": 27507.003, "end": 27539.323, "localBegin": 846.04, "localEnd": 878.36}, {"id": "c009_f000050", "text": "Hence the precautionary principle and sound risk understanding.", "begin": 27539.323, "end": 27543.723, "localBegin": 878.36, "localEnd": 882.76}, {"id": "c009_f000051", "text": "THE NONDECORATIVE IN THE DECORATIVE", "begin": 27543.723, "end": 27545.923, "localBegin": 882.76, "localEnd": 884.96}, {"id": "c009_f000052", "text": "Now what I've called decorative is not necessarily superfluous, often to the contrary. The decorative may just have a function we do not know much about. We could consult for that the grandmaster statistician, time, through a very technical tool called the survival function, known by both old people and very complex statistics. We will resort here to the old-people version.", "begin": 27545.923, "end": 27572.403, "localBegin": 884.96, "localEnd": 911.44}, {"id": "c009_f000053", "text": "The fact to consider is not that beliefs have survived a long time - the Catholic church as an administration is close to twenty-four centuries old (it is largely the continuation of the Roman Republic). The point is that people who have religion - a certain religion - have survived.", "begin": 27572.403, "end": 27596.843, "localBegin": 911.44, "localEnd": 935.88}, {"id": "c009_f000054", "text": "Another principle:", "begin": 27596.843, "end": 27598.483, "localBegin": 935.88, "localEnd": 937.52}, {"id": "c009_f000055", "text": "When you consider beliefs in evolutionary terms, do not look at how they compete with each other, but consider the survival of the populations that have them.", "begin": 27598.483, "end": 27608.763, "localBegin": 937.52, "localEnd": 947.8}, {"id": "c009_f000056", "text": "Consider a competitor to the Pope's religion, Judaism. Jews have close to five hundred different dietary interdicts. These may seem irrational to an outsider who defines rationality in terms of what he can explain. Actually they will most certainly seem so. The Jewish kashrut prescribes keeping four sets of dishes, two sinks, the avoidance of mixing meat with dairy products or merely letting the two be in contact with each other, in addition to interdicts on some animals: shrimp, pork, etc. The good stuff.", "begin": 27608.763, "end": 27647.523, "localBegin": 947.8, "localEnd": 986.56}, {"id": "c009_f000057", "text": "These laws might have had an ex ante purpose. One can blame insalubrious behavior of pigs, exacerbated by the heat in the Levant (though heat in the Levant was not markedly different from that in pig-eating areas farther West). Or perhaps an ecological reason: pigs compete with humans in eating the same vegetables, while cows eat what we don't eat.", "begin": 27647.523, "end": 27668.723, "localBegin": 986.56, "localEnd": 1007.76}, {"id": "c009_f000058", "text": "But it remains the case that whatever their purpose, kashrut laws survived several millennia not because of their \"rationality\" but because the populations that followed them survived. It most certainly brought cohesion: people who eat together hang together. (To be technical, it is a convex heuristic.) Such group cohesion might be also responsible for trust in commercial transactions with remote members of the community, thus creating a vibrant network. Or some other benefit - but it remains that Jews have survived in spite of a very hard history.", "begin": 27668.723, "end": 27715.723, "localBegin": 1007.76, "localEnd": 1054.76}, {"id": "c009_f000059", "text": "This allows us to summarize:", "begin": 27715.723, "end": 27720.083, "localBegin": 1054.76, "localEnd": 1059.12}, {"id": "c009_f000060", "text": "Rationality does not depend on explicit verbalistic explanatory factors; it is only what aids survival, what avoids ruin.", "begin": 27720.083, "end": 27732.083, "localBegin": 1059.12, "localEnd": 1071.12}, {"id": "c009_f000061", "text": "Why? Clearly as we saw in the Lindy discussion:", "begin": 27732.083, "end": 27734.963, "localBegin": 1071.12, "localEnd": 1074.0}, {"id": "c009_f000062", "text": "Not everything that happens happens for a reason, but everything that survives survives for a reason.", "begin": 27734.963, "end": 27739.923, "localBegin": 1074.0, "localEnd": 1078.96}, {"id": "c009_f000063", "text": "Rationality is risk management, period. The next chapter will make the final argument in support of this principle.", "begin": 27739.923, "end": 27748.843, "localBegin": 1078.96, "localEnd": 1087.88}, {"id": "c009_f000064", "text": "Chapter 19 The Logic of Risk Taking", "begin": 27748.843, "end": 27750.923, "localBegin": 1087.88, "localEnd": 1089.96}, {"id": "c009_f000065", "text": "The central chapter always comes last - Always bet twice - Do you know your uncle point? - Who is \"you\"? - The Greeks were almost always right", "begin": 27750.923, "end": 27759.923, "localBegin": 1089.96, "localEnd": 1098.96}, {"id": "c009_f000066", "text": "FIGURE 5. The difference between one hundred people going to a casino and one person going to a casino one hundred times, i.e. between path-dependent and conventionally understood probability. The mistake has persisted in economics and psychology since age immemorial.", "begin": 27759.923, "end": 27772.843, "localBegin": 1098.96, "localEnd": 1111.88}, {"id": "c009_f000067", "text": "Time to explain ergodicity, ruin, and (again) rationality. Recall that to do science (and other nice things) requires survival but not the other way around.", "begin": 27772.843, "end": 27785.683, "localBegin": 1111.88, "localEnd": 1124.72}, {"id": "c009_f000068", "text": "Consider the following thought experiment. First case, one hundred people go to a casino to gamble a certain set amount each over a set period of time, and have complimentary gin and tonic - as shown in the cartoon in Figure 5. Some may lose, some may win, and we can infer at the end of the day what the \"edge\" is, that is, calculate the returns simply by counting the money left in the wallets of the people who return. We can thus figure out if the casino is properly pricing the odds. Now assume that gambler number 28 goes bust. Will gambler number 29 be affected? No.", "begin": 27785.683, "end": 27826.523, "localBegin": 1124.72, "localEnd": 1165.56}, {"id": "c009_f000069", "text": "You can safely calculate, from your sample, that about 1 percent of the gamblers will go bust. And if you keep playing and playing, you will be expected to have about the same ratio, 1 percent of gamblers going bust, on average, over that same time window.", "begin": 27826.523, "end": 27842.483, "localBegin": 1165.56, "localEnd": 1181.52}, {"id": "c009_f000070", "text": "Now let's compare this to the second case in the thought experiment. One person, your cousin Theodorus Ibn Warqa, goes to the casino a hundred days in a row, starting with a set amount. On day 28 cousin Theodorus Ibn Warqa is bust. Will there be day 29? No. He has hit an uncle point; there is no game no more.", "begin": 27842.483, "end": 27862.403, "localBegin": 1181.52, "localEnd": 1201.44}, {"id": "c009_f000071", "text": "No matter how good or alert your cousin Theodorus Ibn Warqa is, you can safely calculate that he has a 100 percent probability of eventually going bust.", "begin": 27862.403, "end": 27872.843, "localBegin": 1201.44, "localEnd": 1211.88}, {"id": "c009_f000072", "text": "The probabilities of success from a collection of people do not apply to cousin Theodorus Ibn Warqa. Let us call the first set ensemble probability, and the second one time probability (since the first is concerned with a collection of people and the second with a single person through time). Now, when you read material by finance professors, finance gurus, or your local bank making investment recommendations based on the long-term returns of the market, beware. Even if their forecasts were true (they aren't), no individual can get the same returns as the market unless he has infinite pockets and no uncle points. This is conflating ensemble probability and time probability. If the investor has to eventually reduce his exposure because of losses, or because of retirement, or because he got divorced to marry his neighbor's wife, or because he suddenly developed a heroin addiction after his hospitalization for appendicitis, or because he changed his mind about life, his returns will be divorced from those of the market, period.", "begin": 27872.843, "end": 27950.123, "localBegin": 1211.88, "localEnd": 1289.16}, {"id": "c009_f000073", "text": "Anyone who has survived in the risk-taking business more than a few years has some version of our by now familiar principle that \"in order to succeed, you must first survive.\" My own has been: \"never cross a river if it is on average four feet deep.\" I effectively organized all my life around the point that sequence matters and the presence of ruin disqualifies cost-benefit analyses; but it never hit me that the flaw in decision theory was so deep. Until out of nowhere came a paper by the physicist Ole Peters, working with the great Murray Gell-Mann. They presented a version of the difference between ensemble and time probabilities with a thought experiment similar to mine above, and showed that just about everything in social science having to do with probability is flawed. Deeply flawed. Very deeply flawed. Largely, terminally flawed. For, in the quarter millennia since an initial formulation of decision making under uncertainty by the mathematician Jacob Bernoulli, one that has since become standard, almost all people involved in the field have made the severe mistake of missing the effect of the difference between ensemble and time. Everyone? Not quite: every economist maybe, but not everyone: the applied mathematicians Claude Shannon and Ed Thorp, and the physicist J. L. Kelly of the Kelly Criterion got it right. They also got it in a very simple way. The father of insurance mathematics, the Swedish applied mathematician Harald Cramér, also got the point. And, more than two decades ago, practitioners such as Mark Spitznagel and myself built our entire business careers around it. (I mysteriously got it right in my writings and when I traded and made decisions, and detect deep inside when ergodicity is violated, but I never explicitly got Peters and Gell-Mann's mathematical structure - ergodicity is even discussed in Fooled by Randomness, two decades ago). Spitznagel and I even started an entire business to help investors eliminate uncle points so they could get the returns of the market. While I retired to do some flaneuring, Mark continued relentlessly (and successfully) at his Universa. Mark and I have been frustrated by economists who, not getting ergodicity, keep saying that worrying about the tails is \"irrational.\"", "begin": 27950.123, "end": 28106.323, "localBegin": 1289.16, "localEnd": 1445.36}, {"id": "c009_f000074", "text": "The idea I just presented is very very simple. But how come nobody for 250 years quite got it? Lack of skin in the game, obviously.", "begin": 28106.323, "end": 28119.843, "localBegin": 1445.36, "localEnd": 1458.88}, {"id": "c009_f000075", "text": "For it looks like you need a lot of intelligence to figure probabilistic things out when you don't have skin in the game. But for an overeducated nonpractitioner, these things are hard to figure out. Unless one is a genius, that is, has the clarity of mind to see through the mud, or has a sufficiently profound command of probability theory to cut through the nonsense. Now, certifiably, Murray Gell-Mann is a genius (and, likely, Peters). Gell-Mann discovered the subatomic particles he himself called quarks (which got him the Nobel). Peters said that when he presented the idea to Gell-Mann, \"he got it instantly.\" Claude Shannon, Ed Thorp, J. L. Kelly, and Harald Cramér are, no doubt, geniuses - I can personally vouch for Thorp, who has an unmistakable clarity of mind combined with a depth of thinking that juts out in conversation. These people could get it without skin in the game. But economists, psychologists, and decision theorists have no geniuses among them (unless one counts the polymath Herb Simon, who did some psychology on the side), and odds are they never will. Adding people without fundamental insights does not sum up to insight; looking for clarity in these fields is like looking for aesthetic harmony in the cubicle of a self-employed computer hacker or the attic of a highly disorganized electrician.", "begin": 28119.843, "end": 28222.563, "localBegin": 1458.88, "localEnd": 1561.6}, {"id": "c009_f000076", "text": "ERGODICITY", "begin": 28222.563, "end": 28222.963, "localBegin": 1561.6, "localEnd": 1562.0}, {"id": "c009_f000077", "text": "To take stock: a situation is deemed non-ergodic when observed past probabilities do not apply to future processes. There is a \"stop\" somewhere, an absorbing barrier that prevents people with skin in the game from emerging from it - and to which the system will invariably tend. Let us call these situations \"ruin,\" as there is no reversibility away from the condition. The central problem is that if there is a possibility of ruin, cost-benefit analyses are no longer possible.", "begin": 28222.963, "end": 28250.323, "localBegin": 1562.0, "localEnd": 1589.36}, {"id": "c009_f000078", "text": "Consider a more extreme example than the casino experiment. Assume a collection of people play Russian roulette a single time for a million dollars - this is the central story in Fooled by Randomness. About five out of six will make money. If someone used a standard cost-benefit analysis, he would have claimed that one has an 83.33 percent chance of gains, for an \"expected\" average return per shot of $833,333. But if you keep playing Russian roulette, you will end up in the cemetery. Your expected return is…not computable.", "begin": 28250.323, "end": 28303.403, "localBegin": 1589.36, "localEnd": 1642.44}, {"id": "c009_f000079", "text": "REPETITION OF EXPOSURES", "begin": 28303.403, "end": 28305.083, "localBegin": 1642.44, "localEnd": 1644.12}, {"id": "c009_f000080", "text": "Let us see why \"statistical testing\" and \"scientific\" statements are highly insufficient in the presence of both ruin problems and repetition of exposures. If one claimed that there is \"statistical evidence that a plane is safe,\" with a 98 percent confidence level (statistics are meaningless without such confidence bands), and acted on it, practically no experienced pilot would be alive today. In my war with the Monsanto machine, the advocates of genetically modified organisms (transgenics) kept countering me with benefit analyses (which were often bogus and doctored up), not tail risk analyses for repeated exposures.", "begin": 28305.083, "end": 28359.683, "localBegin": 1644.12, "localEnd": 1698.72}, {"id": "c009_f000081", "text": "Psychologists determine our \"paranoia\" or \"risk aversion\" by subjecting a person to a single experiment - then declare that humans are rationally challenged, as there is an innate tendency to \"overestimate\" small probabilities. They manage to believe that their subjects will never ever again take any personal tail risk! Recall from the chapter on inequality that academics in social science are…dynamically challenged. Nobody could see the grandmother-obvious inconsistency of such behavior with our ingrained daily life logic, which is remarkably more rigorous. Smoking a single cigarette is extremely benign, so a cost-benefit analysis would deem it irrational to give up so much pleasure for so little risk! But it is the act of smoking that kills, at a certain number of packs per year, or tens of thousand of cigarettes - in other words, repeated serial exposure.", "begin": 28359.683, "end": 28415.083, "localBegin": 1698.72, "localEnd": 1754.12}, {"id": "c009_f000082", "text": "But things are even worse: in real life, every single bit of risk you take adds up to reduce your life expectancy. If you climb mountains and ride a motorcycle and hang around the mob and fly your own small plane and drink absinthe, and smoke cigarettes, and play parkour on Thursday night, your life expectancy is considerably reduced, although no single action will have a meaningful effect. This idea of repetition makes paranoia about some low-probability events, even that deemed \"pathological,\" perfectly rational.", "begin": 28415.083, "end": 28456.083, "localBegin": 1754.12, "localEnd": 1795.12}, {"id": "c009_f000083", "text": "Further, there is a twist. If medicine is progressively improving your life expectancy, you need to be even more paranoid. Think dynamically.", "begin": 28456.083, "end": 28466.403, "localBegin": 1795.12, "localEnd": 1805.44}, {"id": "c009_f000084", "text": "If you incur a tiny probability of ruin as a \"one-off\" risk, survive it, then do it again (another \"one-off\" deal), you will eventually go bust with a probability of one hundred percent. Confusion arises because it may seem that if the \"one-off\" risk is reasonable, then an additional one is also reasonable. This can be quantified by recognizing that the probability of ruin approaches 1 as the number of exposures to individually small risks, say one in ten thousand, increases.", "begin": 28466.403, "end": 28499.243, "localBegin": 1805.44, "localEnd": 1838.28}, {"id": "c009_f000085", "text": "The flaw in psychology papers is to believe that the subject doesn't take any other tail risks anywhere outside the experiment and, crucially, will never again take any risk at all. The idea in social science of \"loss aversion\" has not been thought through properly - it is not measurable the way it has been measured (if it is at all measurable). Say you ask a subject how much he would pay to insure a 1 percent probability of losing $100. You are trying to figure out how much he is \"overpaying\" for \"risk aversion\" or something even more foolish, \"loss aversion.\" But you cannot possibly ignore all the other financial risks he is taking: if he has a car parked outside that can be scratched, if he has a financial portfolio that can lose money, if he has a bakery that may risk a fine, if he has a child in college who may cost unexpectedly more, if he can be laid off, if he may be unexpectedly ill in the future. All these risks add up, and the attitude of the subject reflects them all. Ruin is indivisible and invariant to the source of randomness that may cause it.", "begin": 28499.243, "end": 28575.963, "localBegin": 1838.28, "localEnd": 1915.0}, {"id": "c009_f000086", "text": "Another common error in the psychology literature concerns what is called \"mental accounting.\" The Thorp, Kelly, and Shannon school of information theory requires that, for an investment strategy to be ergodic and eventually capture the return of the market, agents increase their risks as they are winning, but contract after losses, a technique called \"playing with the house money.\" In practice, it is done by threshold, for ease of execution, not complicated rules: you start betting aggressively whenever you have a profit, never when you have a deficit, as if a switch was turned on or off. This method is practiced by probably every single trader who has survived. Now it happens that this dynamic strategy is deemed out of line by behavioral finance econophasters such as the creepy interventionist Richard Thaler, who, very ignorant of probability, calls this \"mental accounting\" a mistake (and, of course, invites government to \"nudge\" us away from it, and prevent strategies from being ergodic).", "begin": 28575.963, "end": 28651.043, "localBegin": 1915.0, "localEnd": 1990.08}, {"id": "c009_f000087", "text": "I believe that risk aversion does not exist: what we observe is, simply, a residual of ergodicity. People are, simply, trying to avoid financial suicide and take a certain attitude to tail risks.", "begin": 28651.043, "end": 28667.843, "localBegin": 1990.08, "localEnd": 2006.88}, {"id": "c009_f000088", "text": "But we do not need to be overly paranoid about ourselves; we need to shift some of our worries to bigger things.", "begin": 28667.843, "end": 28671.883, "localBegin": 2006.88, "localEnd": 2010.92}, {"id": "c009_f000089", "text": "WHO IS \"YOU\"?", "begin": 28671.883, "end": 28672.923, "localBegin": 2010.92, "localEnd": 2011.96}, {"id": "c009_f000090", "text": "Let us return to the notion of \"tribe.\" One of the defects modern education and thinking introduces is the illusion that each one of us is a single unit. In fact, I've sampled ninety people in seminars and asked them: \"what's the worst thing that can happen to you?\" Eighty-eight people answered \"my death.\"", "begin": 28672.923, "end": 28688.843, "localBegin": 2011.96, "localEnd": 2027.88}, {"id": "c009_f000091", "text": "This can only be the worst-case situation for a psychopath. For after that, I asked those who deemed that their worst-case outcome was their own death: \"Is your death plus that of your children, nephews, cousins, cat, dogs, parakeet, and hamster (if you have any of the above) worse than just your death?\" Invariably, yes. \"Is your death plus your children, nephews, cousins (…) plus all of humanity worse than just your death?\" Yes, of course. Then how can your death be the worst possible outcome?", "begin": 28688.843, "end": 28722.603, "localBegin": 2027.88, "localEnd": 2061.64}, {"id": "c009_f000092", "text": "Unless you are perfectly narcissistic and psychopathic - even then - your worst-case scenario is never limited to the loss of only your life.", "begin": 28722.603, "end": 28730.203, "localBegin": 2061.64, "localEnd": 2069.24}, {"id": "c009_f000093", "text": "Thus, we see the point that individual ruin is not as big a deal as collective ruin. And of course ecocide, the irreversible destruction of our environment, is the big one to worry about.", "begin": 28730.203, "end": 28741.723, "localBegin": 2069.24, "localEnd": 2080.76}, {"id": "c009_f000094", "text": "To use the ergodic framework: my death at Russian roulette is not ergodic for me but it is ergodic for the system. The precautionary principle, as I formulated with a few colleagues, is precisely about the highest layer.", "begin": 28741.723, "end": 28761.003, "localBegin": 2080.76, "localEnd": 2100.04}, {"id": "c009_f000095", "text": "FIGURE 6. Taking personal risks to save the collective are \"courage\" and \"prudence\" since you are lowering risks for the collective.", "begin": 28761.003, "end": 28767.083, "localBegin": 2100.04, "localEnd": 2106.12}, {"id": "c009_f000096", "text": "About every time I discuss the precautionary principle, some overeducated pundit suggests that \"we take risks by crossing the street,\" so why worry so much about the system? This sophistry usually causes a bit of anger on my part. Aside from the fact that the risk of being killed as a pedestrian is less than one in 47,000 years, the point is that my death is never the worst-case scenario unless it correlates to that of others.", "begin": 28767.083, "end": 28797.123, "localBegin": 2106.12, "localEnd": 2136.16}, {"id": "c009_f000097", "text": "I have a finite shelf life, humanity should have an infinite duration.", "begin": 28797.123, "end": 28801.683, "localBegin": 2136.16, "localEnd": 2140.72}, {"id": "c009_f000098", "text": "Or,", "begin": 28801.683, "end": 28802.083, "localBegin": 2140.72, "localEnd": 2141.12}, {"id": "c009_f000099", "text": "I am renewable, not humanity or the ecosystem.", "begin": 28802.083, "end": 28804.963, "localBegin": 2141.12, "localEnd": 2144.0}, {"id": "c009_f000100", "text": "Even worse, as I have shown in Antifragile, the fragility of the system's components (provided they are renewable and replaceable) is required to ensure the solidity of the system as a whole. If humans were immortals, they would go extinct from an accident, or from a gradual buildup of misfitness. But shorter shelf life for humans allows genetic changes across generations to be in sync with the variability of the environment.", "begin": 28804.963, "end": 28834.843, "localBegin": 2144.0, "localEnd": 2173.88}, {"id": "c009_f000101", "text": "COURAGE AND PRECAUTION AREN'T OPPOSITES", "begin": 28834.843, "end": 28838.043, "localBegin": 2173.88, "localEnd": 2177.08}, {"id": "c009_f000102", "text": "How can both courage and prudence be classical virtues? Virtue, as presented in Aristotle's Nicomachean Ethics, includes: sophrosyne (σωφροσύνη), prudence, and a form of sound judgment he called more broadly phronesis. Aren't these inconsistent with courage?", "begin": 28838.043, "end": 28862.203, "localBegin": 2177.08, "localEnd": 2201.24}, {"id": "c009_f000103", "text": "In our framework, they are not at all. They are actually, as Fat Tony would say, the same ting. How?", "begin": 28862.203, "end": 28867.723, "localBegin": 2201.24, "localEnd": 2206.76}, {"id": "c009_f000104", "text": "I can exercise courage to save a collection of kids from drowning, at the risk of my own life, and it would also correspond to a form of prudence. Were I to die, I would be sacrificing a lower layer in Figure 6 for the sake of a higher one.", "begin": 28867.723, "end": 28882.123, "localBegin": 2206.76, "localEnd": 2221.16}, {"id": "c009_f000105", "text": "Courage, according to the Greek ideal that Aristotle inherited from Homer (and conveyed by Solon, Pericles, and Thucydides) is never a selfish action:", "begin": 28882.123, "end": 28892.643, "localBegin": 2221.16, "localEnd": 2231.68}, {"id": "c009_f000106", "text": "Courage is when you sacrifice your own well-being for the sake of the survival of a layer higher than yours.", "begin": 28892.643, "end": 28900.123, "localBegin": 2231.68, "localEnd": 2239.16}, {"id": "c009_f000107", "text": "Selfish courage is not courage. A foolish gambler is not committing an act of courage, especially if he is risking other people's funds or has a family to feed.", "begin": 28900.123, "end": 28909.723, "localBegin": 2239.16, "localEnd": 2248.76}, {"id": "c009_f000108", "text": "RATIONALITY, AGAIN", "begin": 28909.723, "end": 28911.883, "localBegin": 2248.76, "localEnd": 2250.92}, {"id": "c009_f000109", "text": "The last chapter reframed rationality in terms of actual decisions, not what are called \"beliefs,\" as these may be adapted to stimulate us in the most convincing way to avoid things that threaten systemic surviva
