e credentialization of his competitors and overcome more serious hurdles. In addition, people who didn't go to Harvard are easier to deal with in real life.", "begin": 20870.779, "end": 20894.579, "localBegin": 1399.08, "localEnd": 1422.88}, {"id": "c007_f000072", "text": "You can tell if a discipline is BS if the degree depends severely on the prestige of the school granting it. I remember when I applied to MBA programs being told that anything outside the top ten or twenty would be a waste of time. On the other hand a degree in mathematics is much less dependent on the school (conditional on being above a certain level, so the heuristic would apply to the difference between top ten and top two thousand schools).", "begin": 20894.579, "end": 20920.459, "localBegin": 1422.88, "localEnd": 1448.76}, {"id": "c007_f000073", "text": "The same applies to research papers. In math and physics, a result posted on the repository site arXiv (with a minimum hurdle) is fine. In low-quality fields like academic finance (where papers are usually some form of complicated storytelling), the \"prestige\" of the journal is the sole criterion.", "begin": 20920.459, "end": 20941.939, "localBegin": 1448.76, "localEnd": 1470.24}, {"id": "c007_f000074", "text": "REAL GYMS DON'T LOOK LIKE GYMS", "begin": 20941.939, "end": 20945.819, "localBegin": 1470.24, "localEnd": 1474.12}, {"id": "c007_f000075", "text": "This education labeling provides a lot of cosmetic things but misses something essential about antifragility and true learning, reminiscent of gyms. People are impressed with expensive equipment - fancy, complicated, multicolored - meant to look as if it belonged on a spaceship. Things appear maximally sophisticated and scientific - but remember that what looks scientific is usually scientism, not science. As with label universities, you pay quite a bit of money to join, largely for the benefit of the real estate developer. Yet people into strength training (those who are actually strong across many facets of real life) know that users of these machines gain no strength beyond an initial phase. By having recourse to complicated equipment that typically targets very few muscles, regular users will eventually be pear-shaping and growing weaker over time, with skills that do not transfer outside of the very machine that they trained on. The equipment may have some use in a hospital or a rehabilitation program, but that's about it. On the other hand, the simpler barbell (a metal bar with two weights on both ends) is the only standard piece of equipment that gets you to recruit your entire body for exercises - and it is the simplest and cheapest to get. All you need to learn are the safety skills to move off the floor at your maximum while avoiding injury. Lindy again: weight lifters have known the phenomenology for at least two and a half millennia.", "begin": 20945.819, "end": 21032.859, "localBegin": 1474.12, "localEnd": 1561.16}, {"id": "c007_f000076", "text": "All you need are shoes to run outside when you can (and perhaps some pants that don't make you look ridiculous), and a barbell with weights. As I am writing these lines I am checking the brochure of a fancy hotel where I will be spending the next two days. The brochure was put together by some MBA: it is glossy, shows all the machines and the jars of the color-rich juices to \"improve\" your health. They even have a swimming pool; but no barbell.", "begin": 21032.859, "end": 21059.619, "localBegin": 1561.16, "localEnd": 1587.92}, {"id": "c007_f000077", "text": "And if gyms should not look like gyms, exercise should not look like exercise. Most gains in physical strength come from working the tails of the distribution, close to your limit.", "begin": 21059.619, "end": 21072.819, "localBegin": 1587.92, "localEnd": 1601.12}, {"id": "c007_f000078", "text": "NEXT", "begin": 21072.819, "end": 21074.899, "localBegin": 1601.12, "localEnd": 1603.2}, {"id": "c007_f000079", "text": "This chapter managed to mix weight lifting and fundamental research under the single argument that, while the presence of skin in the game does away with the cosmetic, its absence causes multiplicative nonsense. Next, let us consider the divergence of interest between you and yourself when you become rich.", "begin": 21074.899, "end": 21092.139, "localBegin": 1603.2, "localEnd": 1620.44}, {"id": "c007_f000080", "text": "Chapter 10 Only the Rich Are Poisoned: The Preferences of Others", "begin": 21092.139, "end": 21101.539, "localBegin": 1620.44, "localEnd": 1629.84}, {"id": "c007_f000081", "text": "The salesman is the boss - How to drink poison - Advertising and manipulation - The unbearable silence of large mansions on Sunday evening", "begin": 21101.539, "end": 21113.059, "localBegin": 1629.84, "localEnd": 1641.36}, {"id": "c007_f000082", "text": "When people get rich, they shed their skin-in-the-game-driven experiential mechanism. They lose control of their preferences, substituting constructed preferences for their own, complicating their lives unnecessarily, triggering their own misery. And these constructed preferences are of course the preferences of those who want to sell them something. This is a skin-in-the-game problem, as the choices of the rich are dictated by others who have something to gain, and no side effects, from the sale. And given that they are rich, and their exploiters not often so, nobody would shout victim.", "begin": 21113.059, "end": 21149.939, "localBegin": 1641.36, "localEnd": 1678.24}, {"id": "c007_f000083", "text": "I once had dinner in a Michelin-starred restaurant with a fellow who insisted on eating there instead of my selection of a casual Greek taverna with a friendly owner-operator whose second cousin was the manager and third cousin once removed was the friendly receptionist. The other customers seemed, as we say in Mediterranean languages, to have a cork plugged in their behind obstructing proper ventilation, causing the vapors to build on the inside of the gastrointestinal walls, leading to the irritable type of decorum you only notice in the educated semi-upper classes. I noted that, in addition to the plugged corks, all the men wore ties.", "begin": 21149.939, "end": 21185.859, "localBegin": 1678.24, "localEnd": 1714.16}, {"id": "c007_f000084", "text": "Dinner consisted of a succession of complicated small things, with microscopic ingredients and contrasting tastes that forced you to concentrate as if you were taking some entrance exam. You were not eating, rather visiting some type of museum with an affected English major lecturing you on some artistic dimension you would have never considered on your own. There was so little that was familiar and so little that fit my taste buds: once something on the occasion tasted like something real, there was no chance to have more as we moved on to the next dish. Trudging through the dishes and listening to some bull***t by the sommelier about the paired wine, I was afraid of losing concentration. It costs a lot of energy to fake that you're not bored. In fact, I discovered an optimization in the wrong place: the only thing I cared about, the bread, was not warm. It appears that this is not a Michelin requirement for three stars.", "begin": 21185.859, "end": 21240.379, "localBegin": 1714.16, "localEnd": 1768.68}, {"id": "c007_f000085", "text": "VENENUM IN AURO BIBITUR", "begin": 21240.379, "end": 21246.659, "localBegin": 1768.68, "localEnd": 1774.96}, {"id": "c007_f000086", "text": "I left the place starving. Now, if I had a choice, I would have had some time-tested recipe (say a pizza with very fresh ingredients, or a juicy hamburger) in a lively place - for a twentieth of the price. But because the dinner partner could afford the expensive restaurant, we ended up the victims of some complicated experiments by a chef judged by some Michelin bureaucrat. It would fail the Lindy effect: food does better through minute variations from Sicilian grandmother to Sicilian grandmother. It hit me that the rich were natural targets; as the eponymous Thyestes shouts in Seneca's tragedy, thieves do not enter impecunious homes, and one is more likely to be drinking poison in a golden cup than an ordinary one. Poison is drunk in golden cups (Venenum in auro bibitur).", "begin": 21246.659, "end": 21297.219, "localBegin": 1774.96, "localEnd": 1825.52}, {"id": "c007_f000087", "text": "It is easy to scam people by getting them into complications - the poor are spared that type of scamming. This is the same complication we saw in Chapter 9 that makes academics sell the most possibly complicated solution when a simple one can do. Further, the rich start using \"experts\" and \"consultants.\" An entire industry meant to swindle you will swindle you: financial consultants, diet advisors, exercise experts, lifestyle engineers, sleeping councilors, breathing specialists, etc.", "begin": 21297.219, "end": 21328.659, "localBegin": 1825.52, "localEnd": 1856.96}, {"id": "c007_f000088", "text": "Hamburgers, to many of us, are vastly tastier than filet mignon because of the higher fat content, but people have been convinced that the latter is better because it is more expensive to produce.", "begin": 21328.659, "end": 21342.299, "localBegin": 1856.96, "localEnd": 1870.6}, {"id": "c007_f000089", "text": "My idea of the good life is to not attend a gala dinner, one of those situations where you find yourself stuck seated for two hours between the wife of a Kansas City real estate developer (who just visited Nepal) and a Washington lobbyist (who just returned from a vacation in Bali).", "begin": 21342.299, "end": 21358.539, "localBegin": 1870.6, "localEnd": 1886.84}, {"id": "c007_f000090", "text": "LARGE FUNERAL HOMES", "begin": 21358.539, "end": 21362.619, "localBegin": 1886.84, "localEnd": 1890.92}, {"id": "c007_f000091", "text": "Same with real estate: most people, I am convinced, are happier in close quarters, in a real barrio-style neighborhood, where they can feel human warmth and company. But when they have big bucks they end up pressured to move into outsized, impersonal, and silent mansions, far away from neighbors. On late afternoons, the silence of these large galleries has a funereal feel to it, but without the soothing music. This is something historically rare: in the past, large mansions were teeming with servants, head-servants, butlers, cooks, assistants, maids, private tutors, impoverished cousins, horse grooms, even personal musicians. And nobody today will come to console you for having a mansion - few will realize that it is quite sad to be there on Sunday evening.", "begin": 21362.619, "end": 21409.779, "localBegin": 1890.92, "localEnd": 1938.08}, {"id": "c007_f000092", "text": "As Vauvenargues, the French moralist, figured out, small is preferable owing to what we would call in today's terms scale properties. Some things can be, simply, too large for your heart. Rome, he wrote, was easy to love by its denizens when it was a small village, harder when it became a large empire.", "begin": 21409.779, "end": 21429.619, "localBegin": 1938.08, "localEnd": 1957.92}, {"id": "c007_f000093", "text": "Prosperous people of the type who don't look rich are certainly aware of the point - they live in comfortable quarters and instinctively know that a move will be a mental burden. Many still live in their original houses.", "begin": 21429.619, "end": 21442.299, "localBegin": 1957.92, "localEnd": 1970.6}, {"id": "c007_f000094", "text": "Very few people understand their own choices, and end up being manipulated by those who want to sell them something. In that sense, impoverishment might even be desirable. Looking at Saudi Arabia, which should progressively revert to the pre-oil level of poverty, I wonder if taking away some things from them - including the swarm of fawning foreigners coming to skin them - will make them better off.", "begin": 21442.299, "end": 21465.899, "localBegin": 1970.6, "localEnd": 1994.2}, {"id": "c007_f000095", "text": "To put it another way: if wealth is giving you fewer options instead of more (and more varied) options, you're doing it wrong.", "begin": 21465.899, "end": 21474.859, "localBegin": 1994.2, "localEnd": 2003.16}, {"id": "c007_f000096", "text": "CONVERSATION", "begin": 21474.859, "end": 21479.859, "localBegin": 2003.16, "localEnd": 2008.16}, {"id": "c007_f000097", "text": "If anything, being rich you need to hide your money if you want to have what I call friends. This may be known; what is less obvious is that you may also need to hide your erudition and learning. People can only be social friends if they don't try to upstage or outsmart one another. Indeed, the classical art of conversation is to avoid any imbalance, as in Baldassare Castiglione's Book of the Courtier: people need to be equal, at least for the purpose of the conversation, otherwise it fails. It has to be hierarchy-free and equal in contribution. You'd rather have dinner with your friends than with your professor, unless of course your professor understands \"the art\" of conversation.", "begin": 21479.859, "end": 21519.979, "localBegin": 2008.16, "localEnd": 2048.28}, {"id": "c007_f000098", "text": "Indeed, one can generalize and define a community as a space within which many rules of competition and hierarchy are lifted, where the collective prevails over one's interest. Of course there will be tension with the outside, but that's another discussion. This idea of competition being lifted within a group or a tribe was, once again, present in the notion of a group as studied by Elinor Ostrom.", "begin": 21519.979, "end": 21547.139, "localBegin": 2048.28, "localEnd": 2075.44}, {"id": "c007_f000099", "text": "NONLINEARITY OF PROGRESS", "begin": 21547.139, "end": 21549.059, "localBegin": 2075.44, "localEnd": 2077.36}, {"id": "c007_f000100", "text": "Now let us generalize to progress in general. Do you want society to get wealthy, or is there something else you prefer - avoidance of poverty? Are your choices yours or those of salespeople?", "begin": 21549.059, "end": 21562.139, "localBegin": 2077.36, "localEnd": 2090.44}, {"id": "c007_f000101", "text": "Let's return to the restaurant experience and discuss constructed preferences as compared to natural ones. If I had a choice between paying $200 for a pizza or $6.95 for the French complicated experience, I would readily pay $200 for the pizza, plus $9.95 for a bottle of Malbec wine. Actually I would pay to not have the Michelin experience.", "begin": 21562.139, "end": 21587.179, "localBegin": 2090.44, "localEnd": 2115.48}, {"id": "c007_f000102", "text": "This reasoning shows that sophistication can, at some level, cause degradation, what economists call \"negative utility.\" This tells us something about wealth and the growth of gross domestic product in society; it shows the presence of an inverted U curve with a level beyond which you get incremental harm. It is detectable only if you get rid of constructed preferences.", "begin": 21587.179, "end": 21610.859, "localBegin": 2115.48, "localEnd": 2139.16}, {"id": "c007_f000103", "text": "Now, many societies have been getting wealthier and wealthier, many beyond the positive part of the inverted U curve, not counting the effect of the increased comfort on their spoiled children. And I am certain that if pizza were priced at $200, the people with corks plugged in their behinds would be lining up for it. But it is too easy to produce, so they opt for the costly, and pizza with fresh natural ingredients will be always cheaper than the complicated crap.", "begin": 21610.859, "end": 21638.899, "localBegin": 2139.16, "localEnd": 2167.2}, {"id": "c007_f000104", "text": "So long as society is getting richer, someone will try to sell you something until the point of degradation of your well-being, and a bit beyond that.", "begin": 21638.899, "end": 21651.699, "localBegin": 2167.2, "localEnd": 2180.0}, {"id": "c007_f000105", "text": "NEXT", "begin": 21651.699, "end": 21652.259, "localBegin": 2180.0, "localEnd": 2180.56}, {"id": "c007_f000106", "text": "The next chapter will present the rule of no verbal threat through the history of the experts of the craft, the sect of the Assassins.", "begin": 21652.259, "end": 21661.459, "localBegin": 2180.56, "localEnd": 2189.76}, {"id": "c007_f000107", "text": "Chapter 11 Facta non Verba (Deeds Before Words)", "begin": 21661.459, "end": 21670.819, "localBegin": 2189.76, "localEnd": 2199.12}, {"id": "c007_f000108", "text": "Dead horse in your bed - Friendship via poisoned cake - Roman emperors and U.S. presidents - A living enemy is worth ten dead ones", "begin": 21670.819, "end": 21682.019, "localBegin": 2199.12, "localEnd": 2210.32}, {"id": "c007_f000109", "text": "The best enemy is the one you own by putting skin in his game and letting him know the exact rules that come with it. You keep him alive, with the knowledge that he owes his life to your benevolence. The notion that an enemy you own is better than a dead one was perfected by the order of the Assassins, so we will do some digging into the work of that secret society.", "begin": 21682.019, "end": 21704.379, "localBegin": 2210.32, "localEnd": 2232.68}, {"id": "c007_f000110", "text": "AN OFFER VERY HARD TO REFUSE", "begin": 21704.379, "end": 21709.219, "localBegin": 2232.68, "localEnd": 2237.52}, {"id": "c007_f000111", "text": "There is this formidable scene in the Godfather when a Hollywood executive wakes up with the bloody severed head of his cherished race horse in his bed.", "begin": 21709.219, "end": 21718.059, "localBegin": 2237.52, "localEnd": 2246.36}, {"id": "c007_f000112", "text": "He had refused to hire a Sicilian-American actor for reasons that appeared iniquitous, as while he knew the latter was the best for the role, he was resentful of the \"olive oil voice\" that had charmed one of his past mistresses and fearful of its powers to seduce future ones. It turned out that the actor, who in real life was (possibly) Frank Sinatra, had friends and friends of friends, that type of thing; he was even the godson of a capo. A visit from the consigliere of the \"family\" neither succeeded to sway the executive, nor softened his Hollywood abrasiveness - the fellow failed to realize that by flying across the country to make the request, the high-ranking mobster was not just providing the type of recommendation letter you mail to the personnel department of a state university. He had made him an offer that he could not refuse (the expression was popularized by that scene in the movie).", "begin": 21718.059, "end": 21771.899, "localBegin": 2246.36, "localEnd": 2300.2}, {"id": "c007_f000113", "text": "It was a threat, and not an empty threat.", "begin": 21771.899, "end": 21775.899, "localBegin": 2300.2, "localEnd": 2304.2}, {"id": "c007_f000114", "text": "As I am writing these lines, people discuss terrorism and terrorist groups while making severe category mistakes; there are in fact two totally distinct varieties. The first group are terrorists for about everyone, that is, for every person equipped with the ability to discern and isn't a resident of Saudi Arabia and doesn't work for a think tank funded by sheikhs; the second are militia groups largely called terrorists by their enemies, and \"resistance\" or \"freedom fighters\" by those who don't dislike them.", "begin": 21775.899, "end": 21807.499, "localBegin": 2304.2, "localEnd": 2335.8}, {"id": "c007_f000115", "text": "The first includes nonsoldiers who indiscriminately kill civilians for effect and don't bother with military targets, as their aim isn't to make military gains, just to make a statement, harm some living humans, produce some noise, and, for some, find a low-error way to go to paradise. Most Sunni jihadis, of the type who take incommensurable pleasure in blowing up civilians, such as Al Qaeda, ISIS, and the \"moderate rebels\" in Syria sponsored by former U.S. president Obama, are in that category. The second group is about strategic political assassination - the Irish Republican Army, most Shiite organizations, Algerian independence fighters against France, French resistance fighters during the German occupation, etc.", "begin": 21807.499, "end": 21853.059, "localBegin": 2335.8, "localEnd": 2381.36}, {"id": "c007_f000116", "text": "For Shiites and similar varieties in the Near and Middle East, the ancestry, methods, and rules originate in the order of the Assassins, itself following the modus of the Judean Sicarii during Roman times. The Sicarii are named after the daggers they used to kill Roman soldiers and, mostly, their Judean collaborators, due to what they perceived as the profanation of their temple and the land.", "begin": 21853.059, "end": 21877.459, "localBegin": 2381.36, "localEnd": 2405.76}, {"id": "c007_f000117", "text": "I have the misfortune to know a bit about the subject. My high school, the Franco-Lebanese Lycée of Beirut, has a list of \"notable\" former students. I am the only one who is \"notable\" for reasons other than being the victim of a successful or attempted assassination (although I have enough Salafi enemies and there is still time to satisfy such requirement - skin in the game).", "begin": 21877.459, "end": 21900.259, "localBegin": 2405.76, "localEnd": 2428.56}, {"id": "c007_f000118", "text": "THE ASSASSINS", "begin": 21900.259, "end": 21903.819, "localBegin": 2428.56, "localEnd": 2432.12}, {"id": "c007_f000119", "text": "The most interesting thing about the Assassins is that actual assassination was low on their agenda. They understood non-cheap messaging. They preferred to own their enemies. And the only enemy you cannot manipulate is a dead one.", "begin": 21903.819, "end": 21920.619, "localBegin": 2432.12, "localEnd": 2448.92}, {"id": "c007_f000120", "text": "In 1118, Ahmad Sanjar became the sultan of the Seljuk Turkish Empire of Asia minor (that is, modern-day Turkey), Iran, and parts of Afghanistan. Soon after his accession, he woke up one day with a dagger next to his bed, firmly planted in the ground. In one version of the legend, a letter informed him that the dagger thrust in hard ground was preferable to the alternative, being plunged in his soft breast. It was a characteristic message of the Hashishins, aka Assassins, making him aware of the need to leave them alone, send them birthday gifts, or hire their actors for his next movie. Sultan Sanjar had previously snubbed their peace negotiators, so they moved to phase two of a demonstrably well planned-out process. They convinced him that his life was in their hands and that, crucially, he didn't have to worry if he did the right thing. Indeed Sanjar and the Assassins had a happy life together ever after.", "begin": 21920.619, "end": 21978.019, "localBegin": 2448.92, "localEnd": 2506.32}, {"id": "c007_f000121", "text": "You will note that no explicit verbal threat was issued. Verbal threats reveal nothing beyond weakness and unreliability. Remember, once again, no verbal threats.", "begin": 21978.019, "end": 21989.939, "localBegin": 2506.32, "localEnd": 2518.24}, {"id": "c007_f000122", "text": "The Assassins were an eleventh- through fourteenth-century sect related to Shiite Islam, and were (and still are through their reincarnations) violently anti-Sunni. They were often associated with the Knights Templar as they fought frequently on the side of the crusaders - and if they seem to share some of the values of the Templars, in sparing the innocent and the weak, it is likely because the former group transmitted some of their values to the latter. The chivalric code of honor has, for its second clause: I shall respect and defend the weak, the sick, and the needy.", "begin": 21989.939, "end": 22024.179, "localBegin": 2518.24, "localEnd": 2552.48}, {"id": "c007_f000123", "text": "The Assassins supposedly sent the same message to Saladin (the Kurdish ruler of Syria who conquered Jerusalem from the Crusaders), informing him that the cake he was about to eat was poisoned…by themselves.", "begin": 22024.179, "end": 22037.499, "localBegin": 2552.48, "localEnd": 2565.8}, {"id": "c007_f000124", "text": "The ethical system of the Assassins held that political assassination helped prevent war; threats of the dagger-by-your-bed variety are even better for bloodless control. They supposedly aimed at sparing civilians and people who were not directly targeted. Their precision was meant to reduce what is now called \"collateral damage.\"", "begin": 22037.499, "end": 22072.859, "localBegin": 2565.8, "localEnd": 2601.16}, {"id": "c007_f000125", "text": "ASSASSINATION AS MARKETING", "begin": 22072.859, "end": 22077.179, "localBegin": 2601.16, "localEnd": 2605.48}, {"id": "c007_f000126", "text": "Those readers who may have tried to get rid of pebbles in their shoes (that is, someone who bothers you and doesn't get the hint) might know that \"contracts\" on ordinary citizens (that is, to trigger their funeral) are relatively easy to perform and inexpensive to buy. There is a relatively active underground market for these contracts. In general, you need to pay a bit more to \"make it look like an accident.\" However, skilled historians and observers of martial history would recommend the exact opposite: in politics, you should have to pay more to make it look intentional.", "begin": 22077.179, "end": 22112.459, "localBegin": 2605.48, "localEnd": 2640.76}, {"id": "c007_f000127", "text": "In fact, what Captain Mark Weisenborn, Pasquale Cirillo, and I discovered, when we tried doing a systematic study of violence (debunking the confabulatory thesis by Steven Pinker that we mentioned earlier, holding that violence has dropped), was that war numbers have been historically inflated…by both sides. Both the Mongols (during their sweep across Eurasia in the Middle Ages) and their panicky victims had an incentive to exaggerate, which acted as a deterrent. Mongols weren't interested in killing everybody; they just wanted submission, which came cheaply through terror. Further, having spent some time perusing the genetic imprints of invaded populations, it is clear that if the warriors coming from the Eastern steppes left a cultural imprint, they certainly left their genes at home. Gene transfer between areas happens by group migrations, inclement climate, and unaccommodating soil rather than war.", "begin": 22112.459, "end": 22168.099, "localBegin": 2640.76, "localEnd": 2696.4}, {"id": "c007_f000128", "text": "More recently, the Hama \"massacre\" in 1982 of Syrian jihadis by Assad senior caused documented casualties (by my estimation) at least an order of magnitude lower than what is reported; the rest came from inflation - numbers swelling over time from two thousand to close to forty thousand without significant new information. Both the Syrian regime and its enemies had an interest in numbers being inflated. Interestingly the number has continued to climb in recent years. We will return to historians in Chapter 14, where we show how empirical rigor is quite foreign to their discipline.", "begin": 22168.099, "end": 22206.379, "localBegin": 2696.4, "localEnd": 2734.68}, {"id": "c007_f000129", "text": "ASSASSINATION AS DEMOCRACY", "begin": 22206.379, "end": 22210.939, "localBegin": 2734.68, "localEnd": 2739.24}, {"id": "c007_f000130", "text": "Now, political life; if the democratic system doesn't fully deliver governance - it patently doesn't, owing to cronyisms and the Hillary Monsanto-Malmaison style of covert legal corruption - we have known forever what does: an increased turnover at the top. Count Ernst zu Münster's epigrammatic description of the Russian Constitution explains it: \"Absolutism tempered by assassination.\"", "begin": 22210.939, "end": 22237.379, "localBegin": 2739.24, "localEnd": 2765.68}, {"id": "c007_f000131", "text": "While today's politicians have no skin in the game and do not have to worry so long as they play the game, they stay longer and longer on the job, thanks to the increased life expectancy of modern times. France's caviar socialist François Mitterrand reigned for fourteen years, longer than many French kings; and thanks to technology he had more power over the population than most French kings. Even a United States president, the modern kind of emperor (unlike Napoleon and the czars, Roman emperors before Diocletian were not absolutists) tends to last at least four years on the throne, while Rome had five emperors in a single year and four in another. The mechanism worked: consider that all the bad emperors - Caligula, Caracalla, Elagabalus, and Nero - ended their careers either murdered by the Praetorian Guard or, in the case of Nero, dead by suicide in anticipation. Recall that in the first four hundred years of empire, less than a third of emperors died a natural death, assuming these deaths were truly natural.", "begin": 22237.379, "end": 22301.819, "localBegin": 2765.68, "localEnd": 2830.12}, {"id": "c007_f000132", "text": "THE CAMERA FOR SKIN IN THE GAME", "begin": 22301.819, "end": 22306.179, "localBegin": 2830.12, "localEnd": 2834.48}, {"id": "c007_f000133", "text": "Thanks to the camera, you no longer need to put horses' heads in boutique hotels or villas in the Hamptons to own people. You may no longer even need to assassinate anyone.", "begin": 22306.179, "end": 22317.259, "localBegin": 2834.48, "localEnd": 2845.56}, {"id": "c007_f000134", "text": "We used to live in small communities; our reputations were directly determined by what we did - we were watched. Today, anonymity brings out the a**hole in people. So I accidentally discovered a way to change the behavior of unethical and abusive persons without verbal threat. Take their pictures. Just the act of taking their pictures is similar to holding their lives in your hands and controlling their future behavior thanks to your silence. They don't know what you can do with it, and will live in a state of uncertainty.", "begin": 22317.259, "end": 22350.019, "localBegin": 2845.56, "localEnd": 2878.32}, {"id": "c007_f000135", "text": "I discovered the magic of the camera in reestablishing civil/ethical behavior as follows. One day, in the New York subway underground corridor, I hesitated for a few seconds trying to get my bearings in front of the list of exits. A well-dressed man with a wiry build and neurotic personality started heaping insults at me \"for stopping.\" Instead of hitting him as a conversation starter, as I would have done in 1921, I pulled my cell out and took his picture while calmly calling him a \"mean idiot, abusive to lost persons.\" He freaked out and ran away from me, hiding his face in his hands to prevent further photographs.", "begin": 22350.019, "end": 22387.139, "localBegin": 2878.32, "localEnd": 2915.44}, {"id": "c007_f000136", "text": "Another time, a man in upstate New York got into my parking spot as I was backing into it. I told him it was against etiquette, he acted as an a**hole. Same thing, I silently photographed him and his license plate. He rapidly drove away and liberated the parking spot. Finally, near my house, there is a forest preserve banned to bicycles as they harm the environment. Two mountain cyclists rode on it every weekend during my 4 P.M. walk. I admonished them to no avail. One day I calmly took a dozen pictures, making sure they noticed. The bigger guy complained, but they then left rapidly. They have never returned.", "begin": 22387.139, "end": 22425.859, "localBegin": 2915.44, "localEnd": 2954.16}, {"id": "c007_f000137", "text": "Of course, I destroyed their pictures. But I never thought handhelds could be such a weapon. And it would be unfair to use their pictures for web-mobbing. In the past, bad deeds were only transmitted to acquaintances who knew how to put things in perspective. Today, strangers, incapable of judging a person's general character, have become self-appointed behavior police. Web-shaming is much more powerful than past reputational blots, and more of a tail risk.", "begin": 22425.859, "end": 22454.019, "localBegin": 2954.16, "localEnd": 2982.32}, {"id": "c007_f000138", "text": "In Book 2 of Plato's Republic, there is a discussion between Socrates and Plato's brother, Glaucon, about the ring of the Gyges, which gives its holder the power to be invisible at will and watch others. Clearly Plato anticipated the later Christian contrivance \"you are watched.\" The discussion was whether people behave in a right manner because they are watched - or, according to Socrates, because of their character. Of course we side with Socrates, but we will even go beyond, by defining virtue as something that goes beyond pleasing the watchers, and can actually irritate them. Remember that Socrates was put to death because he would not compromise his standards. More on that, in a few chapters, when we discuss real virtue.", "begin": 22454.019, "end": 22498.379, "localBegin": 2982.32, "localEnd": 3026.68}, {"id": "c007_f000139", "text": "Chapter 12 The Facts Are True, the News Is Fake", "begin": 22498.379, "end": 22506.939, "localBegin": 3026.68, "localEnd": 3035.24}, {"id": "c007_f000140", "text": "I never said that I said - No news is mostly news - Information flows in both directions", "begin": 22506.939, "end": 22515.259, "localBegin": 3035.24, "localEnd": 3043.56}, {"id": "c007_f000141", "text": "HOW TO DISAGREE WITH YOURSELF", "begin": 22515.259, "end": 22518.939, "localBegin": 3043.56, "localEnd": 3047.24}, {"id": "c007_f000142", "text": "In the summer of 2009, I partook of an hour-long public discussion with David Cameron, who was in the running for, and later became, the U.K. prime minister. The discussion was about how to make society robust, even immune to Black Swans, what structure was needed for both decentralization and accountability, and how the system should be built, ce genre de trucs. It was an interesting fifty-nine minutes around the topics of the Incerto, and I felt great communicating all the points in bulk for the first time. The room in the elegant Royal Society for the Arts was full of journalists. I subsequently went to a Chinese restaurant in (London's) Soho to celebrate with a few people when I received a phone call from a horrified friend. All London newspapers were calling me a \"climate denier,\" portraying me as part of a dark anti-environment conspiracy.", "begin": 22518.939, "end": 22571.179, "localBegin": 3047.24, "localEnd": 3099.48}, {"id": "c007_f000143", "text": "The entire fifty-nine minutes were summarized by the press and reported from a tangential comment that lasted twenty seconds taken in reverse of the intended meaning. Someone who didn't attend the conference would have been under the impression that that was the whole conversation.", "begin": 22571.179, "end": 22587.299, "localBegin": 3099.48, "localEnd": 3115.6}, {"id": "c007_f000144", "text": "It turned out that I presented my version of the precautionary principle during the conversation, worth restating here. It asserts that one does not need complex models as a justification to avoid a certain action. If we don't understand something and it has a systemic effect, just avoid it. Models are error-prone, something I knew well with finance; most risks only appear in analyses after harm is done. As far as I know, we only have one planet. So the burden is on those who pollute - or who introduce new substances in larger than usual quantities - to show a lack of tail risk. In fact, the more uncertainty about the models, the more conservative one should be. The same newspapers had lauded The Black Swan in which this very point was fleshed out clearly - so visibly the attack had nothing to do with the point I was making, rather they wanted to weaken Cameron by demonizing me. I realized that they would have found another reason to tarnish me no matter what I said.", "begin": 22587.299, "end": 22647.579, "localBegin": 3115.6, "localEnd": 3175.88}, {"id": "c007_f000145", "text": "I managed to defend myself by making a lot of noise, and, with explicit legal threats, forced every newspaper to publish my correction. Even then someone at The Guardian tried (unsuccessfully) to tone down my letter by showing that it was some type of disagreement with what I said, not a correction of their misrepresentation. In other words, they wanted me to say that I was disagreeing with myself.", "begin": 22647.579, "end": 22672.819, "localBegin": 3175.88, "localEnd": 3201.12}, {"id": "c007_f000146", "text": "The London newspapers were actively misrepresenting something to their own public. Someone who read the paper was mistaking the journalist for an intermediary between him- or herself and the product, the piece of news. But if I eventually set the record straight, thanks to my bully pulpit, many can't do the same.", "begin": 22672.819, "end": 22692.059, "localBegin": 3201.12, "localEnd": 3220.36}, {"id": "c007_f000147", "text": "So clearly there is an agency problem. There is no difference between a journalist at The Guardian and the restaurant owner in Milan, who, when you ask for a taxi, calls his cousin who does a tour of the city to inflate the meter before showing up. Or the doctor who willfully misdiagnoses you to sell you a drug in which he has a vested interest.", "begin": 22692.059, "end": 22712.259, "localBegin": 3220.36, "localEnd": 3240.56}, {"id": "c007_f000148", "text": "INFORMATION DOESN'T LIKE TO BE OWNED", "begin": 22712.259, "end": 22717.179, "localBegin": 3240.56, "localEnd": 3245.48}, {"id": "c007_f000149", "text": "Journalism isn't Lindy compatible. Information transmits organically by word of mouth, which circulates in a two-way manner. In Ancient Rome, people got information without a centralized filter. In the ancient Mediterranean marketplaces, people talked; they were the receivers and the purveyors of news. Barbers offered comprehensive services; they doubled as surgeons, dispute-resolution experts, and news reporters. If people were left to filter their own rumors, they were also part of the transmission. Same with pubs and London coffee houses. In the Eastern Mediterranean (currently Greece and the Levant), condolences were the source of gathering and transmission - and represented the bulk of social life. Dissemination of the news took place at these gatherings. My social grandmother would have her \"rounds\" of visits of condolences some days in Beirut's then-significant Greek Orthodox community, and knew practically everything down to the most insignificant details. If the child of someone prominent flunked an exam, she knew it. Practically every affair in town was detected.", "begin": 22717.179, "end": 22783.899, "localBegin": 3245.48, "localEnd": 3312.2}, {"id": "c007_f000150", "text": "Unreliable people carried less weight than reliable ones. You can't fool people more than twice.", "begin": 22783.899, "end": 22791.299, "localBegin": 3312.2, "localEnd": 3319.6}, {"id": "c007_f000151", "text": "The period of time that corresponds to reliance on one-sided accounts such as television and newspapers, which can be controlled by the mandarins, lasted from the middle of the twentieth century until the U.S. election of 2016. At that point, social networks, allowing a two-way flow of information, returned the mechanism of tidings to its natural format - Lindy had to strike. As with participants in markets and souks, there is a long-term advantage to being dependable.", "begin": 22791.299, "end": 22832.939, "localBegin": 3319.6, "localEnd": 3361.24}, {"id": "c007_f000152", "text": "Further, such an agency problem as that of the current press is systemic, as its interests will keep diverging from that of its public until the eventual systemic blowup as we saw with the Bob Rubin trade. As an illustration: I was less frustrated by the misinterpretation of my ideas than by the fact that no reader would have realized that 99 percent of my discussion with Cameron was about things other than climate change. If the former could have been a misunderstanding, the latter is a structural defect. And you never cure structural defects; the system corrects itself by collapsing.", "begin": 22832.939, "end": 22910.459, "localBegin": 3361.24, "localEnd": 3438.76}, {"id": "c007_f000153", "text": "The divergence is evident in that journos worry considerably more about the opinion of other journalists than the judgment of their readers. Compare this to a healthy system, say, that of restaurants. As we saw in Chapter 8, restaurant owners worry about the opinion of their customers, not those of other restaurant owners, which keeps them in check and prevents the business from straying collectively away from its interests. Further, skin in the game creates diversity, not monoculture. Economic insecurity worsens the condition. Journalists are currently in the most insecure profession you can find: the majority live hand to mouth, and ostracism by their friends would be terminal. Thus they become easily prone to manipulation by lobbyists, as we saw with GMOs, the Syrian wars, etc. You say something unpopular in that profession about Brexit, GMOs, or Putin, and you become history. This is the opposite of business where me-tooism is penalized.", "begin": 22910.459, "end": 22970.819, "localBegin": 3438.76, "localEnd": 3499.12}, {"id": "c007_f000154", "text": "THE ETHICS OF DISAGREEMENT", "begin": 22970.819, "end": 22975.019, "localBegin": 3499.12, "localEnd": 3503.32}, {"id": "c007_f000155", "text": "Now let us get deeper into the application of the Silver Rule in intellectual debates. You can criticize either what a person said or what a person meant. The former is more sensational, hence lends itself more readily to dissemination. The mark of a charlatan - say the writer and pseudo-rationalist Sam Harris - is to defend his position or attack a critic by focusing on some specific statement (\"look at what he said\") rather than blasting his exact position (\"look at what he means\" or, more broadly, \"look at what he stands for\") - for the latter requires an extensive grasp of the proposed idea. Note that the same applies to the interpretation of religious texts, often extracted from their broader circumstances.", "begin": 22975.019, "end": 23019.459, "localBegin": 3503.32, "localEnd": 3547.76}, {"id": "c007_f000156", "text": "It is impossible for anyone to write a perfectly rationally argued document without a segment that, out of context, can be transformed by some dishonest copywriter to appear totally absurd and lend itself to sensationalization, so politicians, charlatans, and, more disturbingly, journalists hunt for these segments. \"Give me a few lines written by any man and I will find enough to get him hung\" goes the saying attributed to Richelieu, Voltaire, Talleyrand, a vicious censor during the French revolution phase of terror, and a few others. As Donald Trump said, \"The facts are true, the news is fake\" - ironically at a press conference in which he subsequently suffered the same selective reporting as my RSA event.", "begin": 23019.459, "end": 23064.659, "localBegin": 3547.76, "localEnd": 3592.96}, {"id": "c007_f000157", "text": "The great Karl Popper often started a discussion with an unerring representation of his opponent's positions, often exhaustive, as if he were marketing them as his own ideas, before proceeding to systematically dismantle them. Also, take Hayek's diatribes Contra Keynes and Cambridge: it was a \"contra,\" but not a single line misrepresents Keynes or makes an overt attempt at sensationalizing. (It helped that people were too intimidated by Keynes's intellect and aggressive personality to risk triggering his ire.)", "begin": 23064.659, "end": 23096.339, "localBegin": 3592.96, "localEnd": 3624.64}, {"id": "c007_f000158", "text": "Read Aquinas's Summa Theologica, written eight centuries ago; you will notice sections titled \"Questio,\" then \"Praeteria,\" \"Objectiones,\" \"Sed Contra,\" etc., describing with a legalistic precision the positions being challenged and looking for a flaw in them before submitting a compromise. If you notice a similarity with the Talmud, it is no accident: it appears that both methods originate with Roman legal reasoning.", "begin": 23096.339, "end": 23124.419, "localBegin": 3624.64, "localEnd": 3652.72}, {"id": "c007_f000159", "text": "Note the associated straw man arguments by which one not only extracts a comment but also provides an interpretation or promotes misinterpretation. As an author, I consider straw man no different from theft.", "begin": 23124.419, "end": 23139.539, "localBegin": 3652.72, "localEnd": 3667.84}, {"id": "c007_f000160", "text": "Some types of lies in an open market cause others to treat the perpetrator as if he were invisible. It is not about the lie; it is about the system that requires some modicum of trust. For purveyors of calumnies did not survive in ancient environments.", "begin": 23139.539, "end": 23155.899, "localBegin": 3667.84, "localEnd": 3684.2}, {"id": "c007_f000161", "text": "The principle of charity stipulates that you try to understand a message as if you were yourself its author. It, and revulsion at its violations, are Lindy compatible. For instance, Isaiah 29:21 states: That make a man an offender for a word, and lay a snare for him that reproveth in the gate, and turn aside the just for a thing of nought. The wicked ensnare you. Calumny was already a very severe crime in Babylon, where the person who made a false accusation was punished as if he committed the exact crime.", "begin": 23155.899, "end": 23192.299, "localBegin": 3684.2, "localEnd": 3720.6}, {"id": "c007_f000162", "text": "However, in philosophy, the principle of charity - as principle - is only sixty years old. As with other things, if the principle of charity had to become a principle, it must be because some old ethical practices were abandoned.", "begin": 23192.299, "end": 23208.659, "localBegin": 3720.6, "localEnd": 3736.96}, {"id": "c007_f000163", "text": "NEXT", "begin": 23208.659, "end": 23211.939, "localBegin": 3736.96, "localEnd": 3740.24}, {"id": "c007_f000164", "text": "The next chapter will take us to virtue as skin in the game.", "begin": 23211.939, "end": 23221.019, "localBegin": 3740.24, "localEnd": 3749.32}]}, {"kind": "chapter", "number": 8, "title": "Chapters 13-17: Virtue, Peace, and Religion", "audio": "audio/chapter_008.mp3", "start": 23221.054, "end": 26660.963, "duration": 3439.909, "paragraphs": [{"id": "c008_f000001", "text": "Chapter 13 The Merchandising of Virtue", "begin": 23221.054, "end": 23227.374, "localBegin": 0.0, "localEnd": 6.32}, {"id": "c008_f000002", "text": "Sontag is about Sontag - Virtue is what you do when nobody is looking - Have the guts to be unpopular - Meetings breed meetings - Call someone lonely on Saturdays after tennis", "begin": 23227.374, "end": 23242.734, "localBegin": 6.32, "localEnd": 21.68}, {"id": "c008_f000003", "text": "Lycurgus, the Spartan lawmaker, responded to a suggestion to allow democracy there, saying \"begin with your own family.\"", "begin": 23242.734, "end": 23251.974, "localBegin": 21.68, "localEnd": 30.92}, {"id": "c008_f000004", "text": "I will always remember my encounter with the writer and cultural icon Susan Sontag, largely because I met the great Benoit Mandelbrot on the same day. It took place in 2001, two months after the terrorist event of September, in a radio station in New York. Sontag, who was being interviewed, was piqued by the idea of a fellow who \"studies randomness\" and came to engage me. When she discovered that I was a trader, she blurted out that she was \"against the market system\" and turned her back to me as I was in mid-sentence, just to humiliate me (note here that courtesy is an application of the Silver Rule), while her assistant gave me a look as if I had been convicted of child killing. I sort of justified her behavior in order to forget the incident, imagining that she lived in some rural commune, grew her own vegetables, wrote with pencil and paper, engaged in barter transactions, that type of stuff.", "begin": 23251.974, "end": 23306.254, "localBegin": 30.92, "localEnd": 85.2}, {"id": "c008_f000005", "text": "No, she did not grow her own vegetables, it turned out. Two years later, I accidentally found her obituary (I waited a decade and a half before writing about the incident to avoid speaking ill of the departed). People in publishing were complaining about her rapacity; she had squeezed her publisher, Farrar, Straus and Giroux, for what would be several million dollars today for a novel. She shared, with a girlfriend, a mansion in New York City, later sold for $28 million. Sontag probably felt that insulting people with money inducted her into some unimpeachable sainthood, exempting her from having skin in the game.", "begin": 23306.254, "end": 23343.654, "localBegin": 85.2, "localEnd": 122.6}, {"id": "c008_f000006", "text": "It is immoral to be in opposition to the market system and not live (somewhere in Vermont or Northwestern Afghanistan) in a hut or cave isolated from it.", "begin": 23343.654, "end": 23354.774, "localBegin": 122.6, "localEnd": 133.72}, {"id": "c008_f000007", "text": "But there is worse:", "begin": 23354.774, "end": 23357.254, "localBegin": 133.72, "localEnd": 136.2}, {"id": "c008_f000008", "text": "It is much more immoral to claim virtue without fully living with its direct consequences.", "begin": 23357.254, "end": 23363.414, "localBegin": 136.2, "localEnd": 142.36}, {"id": "c008_f000009", "text": "This will be the main topic of this chapter: exploiting virtue for image, personal gain, careers, social status, these kinds of things - and by personal gain I mean anything that does not share the downside of a negative action.", "begin": 23363.414, "end": 23378.574, "localBegin": 142.36, "localEnd": 157.52}, {"id": "c008_f000010", "text": "By contrast with Sontag, I have met a few people who live their public ideas. Ralph Nader, for instance, leads the life of a monk, identical to a member of a monastery in the sixteenth century. And the secular saint Simone Weil, while coming from the French Jewish upper class, spent a year in a car factory so the working class could be something other than an abstract construct for her.", "begin": 23378.574, "end": 23402.734, "localBegin": 157.52, "localEnd": 181.68}, {"id": "c008_f000011", "text": "THE PUBLIC AND THE PRIVATE", "begin": 23402.734, "end": 23404.894, "localBegin": 181.68, "localEnd": 183.84}, {"id": "c008_f000012", "text": "As we saw with the interventionistas, a certain class of theoretical people can despise the details of reality. If you manage to convince yourself that you are right in theory, you don't really care how your ideas affect others. Your ideas give you a virtuous status that makes you impervious to how they affect others.", "begin": 23404.894, "end": 23425.174, "localBegin": 183.84, "localEnd": 204.12}, {"id": "c008_f000013", "text": "Likewise, if you believe that you are \"helping the poor\" by spending money on PowerPoint presentations and international meetings, the type of meetings that lead to more meetings (and PowerPoint presentations) you can completely ignore individuals - the poor become an abstract reified construct that you do not encounter in your real life. Your efforts at conferences give you license to humiliate them in person. Hillary Monsanto-Malmaison, sometimes known as Hillary Clinton, found it permissible to heap abuse on secret service agents. I was recently told that a famous Canadian socialist environmentalist, with whom I was part of a lecture series, abused waiters in restaurants, between lectures on equity, diversity, and fairness.", "begin": 23425.174, "end": 23469.294, "localBegin": 204.12, "localEnd": 248.24}, {"id": "c008_f000014", "text": "Kids with rich parents talk about \"class privilege\" at privileged colleges such as Amherst - but in one instance, one of them could not answer Dinesh D'Souza's simple and logical suggestion: Why don't you go to the registrar's office and give your privileged spot to the minority student next in line?", "begin": 23469.294, "end": 23487.774, "localBegin": 248.24, "localEnd": 266.72}, {"id": "c008_f000015", "text": "Clearly the defense given by people under such a situation is that they want others to do so as well - they require a systemic solution to every local perceived problem of injustice. I find that immoral. I know of no ethical system that allows you to let someone drown without helping him because other people are not helping, no system that says, \"I will save people from drowning only if others too save other people from drowning.\"", "begin": 23487.774, "end": 23514.134, "localBegin": 266.72, "localEnd": 293.08}, {"id": "c008_f000016", "text": "Which brings us to the principle:", "begin": 23514.134, "end": 23516.174, "localBegin": 293.08, "localEnd": 295.12}, {"id": "c008_f000017", "text": "If your private life conflicts with your intellectual opinion, it cancels your intellectual ideas, not your private life.", "begin": 23516.174, "end": 23525.054, "localBegin": 295.12, "localEnd": 304.0}, {"id": "c008_f000018", "text": "And a solution to the vapid universalism we discussed in the Prologue:", "begin": 23525.054, "end": 23529.054, "localBegin": 304.0, "localEnd": 308.0}, {"id": "c008_f000019", "text": "If your private actions do not generalize, then you cannot have general ideas.", "begin": 23529.054, "end": 23535.614, "localBegin": 308.0, "localEnd": 314.56}, {"id": "c008_f000020", "text": "This is not strictly about ethics, but information. If a car salesman tries to sell you a Detroit car while driving a Honda, he is signaling that the wares he is touting may have a problem.", "begin": 23535.614, "end": 23548.654, "localBegin": 314.56, "localEnd": 327.6}, {"id": "c008_f000021", "text": "THE VIRTUE MERCHANTS", "begin": 23548.654, "end": 23551.574, "localBegin": 327.6, "localEnd": 330.52}, {"id": "c008_f000022", "text": "In about every hotel chain, from Argentina to Kazakhstan, the bathroom will have a sign meant to get your attention: PROTECT THE ENVIRONMENT. They want you to hold off from sending the towels to the laundry and reuse them for a while, because avoiding excess laundry saves them tens of thousands of dollars a year. This is similar to the salesperson telling you what is good for you when it is mostly (and centrally) good for him. Hotels, of course, love the environment, but you can bet that they wouldn't advertise it so loudly if it weren't good for their bottom line.", "begin": 23551.574, "end": 23585.774, "localBegin": 330.52, "localEnd": 364.72}, {"id": "c008_f000023", "text": "So these global causes - poverty (particularly children's), the environment, justice for some minority trampled upon by colonial powers, or some as-yet-unknown gender that will be persecuted - are now the last refuge of the scoundrel advertising virtue.", "begin": 23585.774, "end": 23603.134, "localBegin": 364.72, "localEnd": 382.08}, {"id": "c008_f000024", "text": "Virtue is not something you advertise. It is not an investment strategy. It is not a cost-cutting scheme. It is not a bookselling (or, worse, concert-ticket-selling) strategy.", "begin": 23603.134, "end": 23615.414, "localBegin": 382.08, "localEnd": 394.36}, {"id": "c008_f000025", "text": "Now I have wondered why, by the Lindy effect, there is so little mention of what is called virtue signaling in the ancient texts. How could it be new?", "begin": 23615.414, "end": 23625.134, "localBegin": 394.36, "localEnd": 404.08}, {"id": "c008_f000026", "text": "Well, it is not new, but was not seen as prevalent enough in the past to warrant much complaining and get named a vice. But mention there is; let's check Matthew 6:1-4, where the highest mitzvah is the one done secretly:", "begin": 23625.134, "end": 23641.694, "localBegin": 404.08, "localEnd": 420.64}, {"id": "c008_f000027", "text": "Be careful not to practice your righteousness in front of others to be seen by them. If you do, you will have no reward from your Father in heaven.", "begin": 23641.694, "end": 23650.414, "localBegin": 420.64, "localEnd": 429.36}, {"id": "c008_f000028", "text": "So when you give to the needy, do not announce it with trumpets, as the hypocrites do in the synagogues and on the streets, to be honored by others. Truly I tell you, they have received their reward in full. But when you give to the needy, do not let your left hand know what your right hand is doing, so that your giving may be in secret. Then your Father, who sees what is done in secret, will reward you.", "begin": 23650.414, "end": 23674.014, "localBegin": 429.36, "localEnd": 452.96}, {"id": "c008_f000029", "text": "TO BE OR TO SEEM?", "begin": 23674.014, "end": 23679.814, "localBegin": 452.96, "localEnd": 458.76}, {"id": "c008_f000030", "text": "The investor Charlie Munger once said: \"Look it. Would you rather be the world's greatest lover, but have everyone think you're the world's worst lover? Or would you rather be the world's worst lover but have everyone think you're the world's greatest lover?\" As usual, if it makes sense, it has to be in the classics, where it is found under the name esse quam videri, which I translate as to be or to be seen as such. It can be found in Cicero, Sallust, even Machiavelli, who, characteristically, inverted it to videri quam esse, \"show rather than be.\"", "begin": 23679.814, "end": 23715.534, "localBegin": 458.76, "localEnd": 494.48}, {"id": "c008_f000031", "text": "SIMONY", "begin": 23715.534, "end": 23717.774, "localBegin": 494.48, "localEnd": 496.72}, {"id": "c008_f000032", "text": "At some point in history, if you had money, you could part with some of it to exonerate your sins. The opulent could clear their conscience thanks to the purchase of ecclesiastical favors and indulgences, and while the practice peaked in the ninth and tenth centuries, it continued in a milder and more subtle form later, and most certainly contributed to the exasperation with church practices that led to the Reformation.", "begin": 23717.774, "end": 23742.174, "localBegin": 496.72, "localEnd": 521.12}, {"id": "c008_f000033", "text": "Simony was a convenient way for the church to raise funds, by selling offices, and everybody was happy with the arrangement. Same with indulgences: the buyer had an inexpensive option on paradise, the seller was selling something that cost nothing. It was, as we call it in trading, \"free money.\" Yet technically it was a violation of canon law, as it commuted something temporal for the spiritual and intemporal. It was most certainly Lindy compatible: technically, indulgences were not markedly different from the pagan practice of giving offerings to propitiate the gods, a part of which went to line the pockets of the high priest.", "begin": 23742.174, "end": 23779.974, "localBegin": 521.12, "localEnd": 558.92}, {"id": "c008_f000034", "text": "Now consider publicly giving a million dollars to some \"charity.\" Part of that money will be spent to advertise that you are giving money, a charity being defined as some organization that aims to make no profit, and to \"spend\" a chunk of the money on its specialization: meetings, future fundraising, and multiplicative intercompany emails (all meant to help a country after an earthquake, for instance). Do you see any difference between this and simony and indulgences? Indeed, simony and indulgences reincarnated themselves in lay society in the form of charity dinners (for some reason, black tie), of people feeling useful engaging in the otherwise selfish activity of running marathons - no longer selfish as it aims at saving other people's kidneys (as if kidneys could not be saved by people writing checks to save kidneys), and of executives giving their names to buildings so they could be remembered as virtuous. So you can scam the world for a billion; all you need to do is spend part of it, say, a million or two, to enter the section of paradise reserved for the \"givers.\"", "begin": 23779.974, "end": 23845.854, "localBegin": 558.92, "localEnd": 624.8}, {"id": "c008_f000035", "text": "Now, I am not saying that all those who put their names on a building are necessarily non-virtuous and buying a spot in paradise. Many are forced by peer and social pressures to do so, so it could be a way to get some people off their backs.", "begin": 23845.854, "end": 23861.494, "localBegin": 624.8, "localEnd": 640.44}, {"id": "c008_f000036", "text": "We have argued that virtue is not an ornament, not something one can buy. Let us go a step beyond and see where virtue requires skin in the game in terms of risk taking, particularly when it is one's reputation that is at risk.", "begin": 23861.494, "end": 23877.574, "localBegin": 640.44, "localEnd": 656.52}, {"id": "c008_f000037", "text": "VIRTUE IS ABOUT OTHERS AND THE COLLECTIVE", "begin": 23877.574, "end": 23881.614, "localBegin": 656.52, "localEnd": 660.56}, {"id": "c008_f000038", "text": "From the scaling property, we can safely establish that virtue is doing something for the collective, particularly when such an action conflicts with your narrowly defined interests. Virtue isn't in just being nice to people others are prone to care about.", "begin": 23881.614, "end": 23896.974, "localBegin": 660.56, "localEnd": 675.92}, {"id": "c008_f000039", "text": "So true virtue lies mostly in also being nice to those who are neglected by others, the less obvious cases, those people the grand charity business tends to miss. Or people who have no friends and would like someone once in while to just call them for a chat or a cup of fresh roasted Italian-style coffee.", "begin": 23896.974, "end": 23916.374, "localBegin": 675.92, "localEnd": 695.32}, {"id": "c008_f000040", "text": "UNPOPULAR VIRTUE", "begin": 23916.374, "end": 23919.134, "localBegin": 695.32, "localEnd": 698.08}, {"id": "c008_f000041", "text": "Further, the highest form of virtue is unpopular. This does not mean that virtue is inherently unpopular, or correlates with unpopularity, only that unpopular acts signal some risk taking and genuine behavior.", "begin": 23919.134, "end": 23931.934, "localBegin": 698.08, "localEnd": 710.88}, {"id": "c008_f000042", "text": "Courage is the only virtue you cannot fake.", "begin": 23931.934, "end": 23936.614, "localBegin": 710.88, "localEnd": 715.56}, {"id": "c008_f000043", "text": "If I were to describe the perfect virtuous act, it would be to take an uncomfortable position, one penalized by the common discourse.", "begin": 23936.614, "end": 23945.214, "localBegin": 715.56, "localEnd": 724.16}, {"id": "c008_f000044", "text": "Let us take an example. For some reason, during the Syrian war, thanks to Qatari-funded public relations firms, the monoculture succeeded in penalizing everyone who stood against jihadi headcutters (the Syrian so-called rebels who in fact were fighting for the establishment of a Salafi-Wahhabi state in Syria). The labels \"Assadist\" and \"baby killer\" were designed to scare journalists from questioning any support for these jihadists. And it is always the children. Recall that Monsanto shills often accuse those opposing them of \"starving the children.\"", "begin": 23945.214, "end": 23979.694, "localBegin": 724.16, "localEnd": 758.64}, {"id": "c008_f000045", "text": "Sticking up for truth when it is unpopular is far more of a virtue, because it costs you something - your reputation. If you are a journalist and act in a way that risks ostracism, you are virtuous. Some people only express their opinions as part of mob shaming, when it is safe to do so, and, in the bargain, think that they are displaying virtue. This is not virtue but vice, a mixture of bullying and cowardice.", "begin": 23979.694, "end": 24004.814, "localBegin": 758.64, "localEnd": 783.76}, {"id": "c008_f000046", "text": "TAKE RISK", "begin": 24004.814, "end": 24009.934, "localBegin": 783.76, "localEnd": 788.88}, {"id": "c008_f000047", "text": "Finally, when young people who \"want to help mankind\" come to me asking, \"What should I do? I want to reduce poverty, save the world,\" and similar noble aspirations at the macro-level, my suggestion is:", "begin": 24009.934, "end": 24023.294, "localBegin": 788.88, "localEnd": 802.24}, {"id": "c008_f000048", "text": "1) Never engage in virtue signaling;", "begin": 24023.294, "end": 24026.174, "localBegin": 802.24, "localEnd": 805.12}, {"id": "c008_f000049", "text": "2) Never engage in rent-seeking;", "begin": 24026.174, "end": 24031.814, "localBegin": 805.12, "localEnd": 810.76}, {"id": "c008_f000050", "text": "3) You must start a business. Put yourself on the line, start a business.", "begin": 24031.814, "end": 24038.574, "localBegin": 810.76, "localEnd": 817.52}, {"id": "c008_f000051", "text": "Yes, take risk, and if you get rich (which is optional), spend your money generously on others. We need people to take (bounded) risks. The entire idea is to move the descendants of Homo sapiens away from the macro, away from abstract universal aims, away from the kind of social engineering that brings tail risks to society. Doing business will always help (because it brings about economic activity without large-scale risky changes in the economy); institutions (like the aid industry) may help, but they are equally likely to harm (I am being optimistic; I am certain that except for a few most do end up harming).", "begin": 24038.574, "end": 24078.534, "localBegin": 817.52, "localEnd": 857.48}, {"id": "c008_f000052", "text": "Courage (risk taking) is the highest virtue. We need entrepreneurs.", "begin": 24078.534, "end": 24085.494, "localBegin": 857.48, "localEnd": 864.44}, {"id": "c008_f000053", "text": "Chapter 14 Peace, Neither Ink nor Blood", "begin": 24085.494, "end": 24096.094, "localBegin": 864.44, "localEnd": 875.04}, {"id": "c008_f000054", "text": "Arabs fighting to the last Palestinian - Where are the lions? - Italians don't die easily - Make historians build rockets - Commerce makes people equal (or unequal, but that's another subject)", "begin": 24096.094, "end": 24112.374, "localBegin": 875.04, "localEnd": 891.32}, {"id": "c008_f000055", "text": "One of the problems of the interventionista - wanting to get involved in other people's affairs \"in order to help\" - results in disrupting some of the peace-making mechanisms that are inherent in human affairs, a combination of collaboration and strategic hostility. As we saw in the Prologue 1, the error continues because someone else is paying the price.", "begin": 24112.374, "end": 24134.614, "localBegin": 891.32, "localEnd": 913.56}, {"id": "c008_f000056", "text": "I speculate that had IYIs and their friends not gotten involved, problems such as the Israeli-Palestinian one would have been solved, sort of - and both parties, especially the Palestinians, would have been better off. As I am writing these lines the problem has lasted seventy years, with way too many cooks in the same tiny kitchen, most of whom never have to taste the food. I conjecture that when you leave people alone, they tend to settle for practical reasons.", "begin": 24134.614, "end": 24161.614, "localBegin": 913.56, "localEnd": 940.56}, {"id": "c008_f000057", "text": "People on the ground, those with skin in the game, are not too interested in geopolitics or grand abstract principles, but rather in having bread on the table, beer (or, for some, nonalcoholic fermented beverages such as yoghurt drinks) in the refrigerator, and good weather at outdoor family picnics. Also they don't want to be humiliated in their human contact with others.", "begin": 24161.614, "end": 24184.574, "localBegin": 940.56, "localEnd": 963.52}, {"id": "c008_f000058", "text": "For imagine the absurdity of Arab states prodding the Palestinians to fight for their principles while their potentates are sitting in carpeted alcohol-free palaces (with well-stocked refrigerators full of nonalcoholic fermented beverages such as yoghurt) while the recipients of their advice live in refugee camps. Had the Palestinians settled in 1947, they would have been better off. But the idea was to throw the Jews and neo-crusaders in the Mediterranean; Arab rhetoric came from Arab parties who were hundreds, thousands of miles away arguing for \"principles\" when Palestinians were displaced, living in tents. Then came the war of 1948. Had Palestinians settled then, things would have worked out. But, no, there were \"principles.\" But then came the war of 1967. Now they feel they would be lucky if they recovered the territory lost in 1967. Then in 1992 came the Oslo peace treaty, from the top. No peace proceeds from bureaucratic ink. If you want peace, make people trade, as they have done for millennia. They will be eventually forced to work something out.", "begin": 24184.574, "end": 24255.774, "localBegin": 963.52, "localEnd": 1034.72}, {"id": "c008_f000059", "text": "We are largely collaborative - except when institutions get in the way. I surmise that if we put those \"people wanting to help\" in the State Department on paid vacation to do ceramics, pottery, or whatever low-testosterone people do when they take a sabbatical, it would be great for peace.", "begin": 24255.774, "end": 24272.854, "localBegin": 1034.72, "localEnd": 1051.8}, {"id": "c008_f000060", "text": "Further, these people tend to see everything as geopolitics, as if the world was polarized into two big players, not a collection of people with diverse interests. To spite Russia, the State Department is urged to perpetuate the war in Syria, which in fact just punishes Syrians.", "begin": 24272.854, "end": 24291.174, "localBegin": 1051.8, "localEnd": 1070.12}, {"id": "c008_f000061", "text": "Peace from the top differs from real peace: consider that today's Morocco, Egypt, and to some extent Saudi Arabia, with more or less overtly pro-Israeli governments (with well-stocked refrigerators full of nonalcoholic fermented drinks such as yoghurt), have local populations conspicuously hostile to Jews. Compare this to Iran, with a local population that is squarely pro-Western and tolerant of Jews. Yet some people with no skin in the game who have read too much about the Treaty of Westphalia (and not enough on complex systems) still insist on conflating relations between countries with relations between governments.", "begin": 24291.174, "end": 24333.654, "localBegin": 1070.12, "localEnd": 1112.6}, {"id": "c008_f000062", "text": "MARS VS. SATURN", "begin": 24333.654, "end": 24336.814, "localBegin": 1112.6, "localEnd": 1115.76}, {"id": "c008_f000063", "text": "If you understand nothing about the problem (like D.C. pundits) and have no skin in the game, then everything is seen through the prism of geopolitics. For these ignorant pundits, it is all Iran vs. Saudi Arabia, the U.S. vs. Russia, Mars vs. Saturn.", "begin": 24336.814, "end": 24355.214, "localBegin": 1115.76, "localEnd": 1134.16}, {"id": "c008_f000064", "text": "I recall, during the Lebanese war, noticing how the local conflict was metamorphosed into an \"Israel vs. Iran\" problem. I described in The Black Swan how war journalists who came to Lebanon got all their information from other war journalists who came to Lebanon, hence they could live in a parallel world without ever seeing the true problems - absence of skin in the game does wonders in distorting information. But to those of us on the ground, the objective was to make things work and have a life, not sacrifice our existence for the sake of geopolitics. Real people are interested in commonalities and peace, not conflicts and wars.", "begin": 24355.214, "end": 24393.974, "localBegin": 1134.16, "localEnd": 1172.92}, {"id": "c008_f000065", "text": "Let us now examine history as it runs by itself, as opposed to what's seen by \"intellectuals\" and institutions.", "begin": 24393.974, "end": 24403.094, "localBegin": 1172.92, "localEnd": 1182.04}, {"id": "c008_f000066", "text": "WHERE ARE THE LIONS?", "begin": 24403.094, "end": 24406.014, "localBegin": 1182.04, "localEnd": 1184.96}, {"id": "c008_f000067", "text": "As I was writing Antifragile, I spent some time in South Africa in a wild reserve, doing Safari-style tours during part of the day and tinkering with the book in the afternoons. I went to the reserve to \"see the lions.\" In an entire week I only saw one lion and it was such a big event that it caused a traffic jam of tourists coming from all the neighboring camp-style resorts. People kept shouting \"kuru\" in Zulu as if they had found gold. Meanwhile, on the twice-daily failed tours to find the lions, I saw giraffes, elephants, zebras, wild boars, impalas, more impalas, even more impalas. Everyone else was like me, looking for kurus and getting peaceful animals: a South African fellow we encountered in another car in the middle of the savannah, after the usual sighting of boring (and bored) animals, cracked the joke while pointing his finger at a hill: \"Look, we saw two giraffes and three impalas over there.\"", "begin": 24406.014, "end": 24463.694, "localBegin": 1184.96, "localEnd": 1242.64}, {"id": "c008_f000068", "text": "It turned out that I had squarely made the error that I warn against, of mistaking the lurid for the empirical: there are very, very few predators compared to what one can call collaborative animals. The camp in the wild reserve was next to a watering hole, and in the afternoon it got crowded with hundreds of animals of different species who apparently got along rather well with one another. But of the thousands of animals that I spotted cumulatively, the image of the lion in a state of majestic calm dominates my memory. It may make sense from a risk-management point of view to overestimate the role of the lion - but not in our interpretation of world affairs.", "begin": 24463.694, "end": 24503.054, "localBegin": 1242.64, "localEnd": 1282.0}, {"id": "c008_f000069", "text": "If the \"law of the jungle\" means anything, it means collaboration for the most part, with a few perceptional distortions caused by our otherwise well-functioning risk-management intuitions. Even predators end up in some type of arrangement with their prey.", "begin": 24503.054, "end": 24520.294, "localBegin": 1282.0, "localEnd": 1299.24}, {"id": "c008_f000070", "text": "HISTORY SEEN FROM THE EMERGENCY ROOM", "begin": 24520.294, "end": 24524.014, "localBegin": 1299.24, "localEnd": 1302.96}, {"id": "c008_f000071", "text": "History is largely peace punctuated by wars, rather than wars punctuated by peace. The problem is that we humans are prone to the availability heuristic, by which the salient is mistaken for the statistical, and the conspicuous and emotional effect of an event makes us think it is occurring more regularly than in reality. This helps us to be prudent and careful in daily life, forcing us to add an extra layer of protection, but it does not help with scholarship.", "begin": 24524.014, "end": 24553.734, "localBegin": 1302.96, "localEnd": 1332.68}, {"id": "c008_f000072", "text": "For when you read histories of international affairs, you might fall under the illusion that history is mostly wars, that states like to fight as a default condition, whenever they have the chance, and that the only coordination between entities takes place when two countries have a \"strategic\" alliance against a common danger. Or some unification under a top-down bureaucratic structure. Recent peace among European states is attributed to the rule of verbose bureaucrats devoid of \"toxic masculinity\" (the most recent pathologification in universities), rather than American and Soviet occupation.", "begin": 24553.734, "end": 24589.694, "localBegin": 1332.68, "localEnd": 1368.64}, {"id": "c008_f000073", "text": "We are fed a steady diet of histories of wars, fewer histories of peace. As a trader, I was trained to look for the first question people forget to ask: who wrote these books? Well, historians, international affairs scholars, and policy experts did. Can these people be fooled? Let's be polite and say that they are in the majority no rocket scientists, and operate under a structural bias. It looks like, in spite of quite a bit of lip service and introspection, an empirically rigorous approach in history and international relations is rare.", "begin": 24589.694, "end": 24625.654, "localBegin": 1368.64, "localEnd": 1404.6}, {"id": "c008_f000074", "text": "First, there are problems of \"overfitting,\" overnarrating, extracting too much via positiva and not enough via negativa from past data. Even in the empirical sciences, positive results (\"this works\") tends to get more press than negative ones (\"this doesn't work\") so it should be no surprise that historians and international relations scholars fall squarely into the same trap.", "begin": 24625.654, "end": 24652.294, "localBegin": 1404.6, "localEnd": 1431.24}, {"id": "c008_f000075", "text": "Second, these scholars, as non-rocket scientists, fail to get a central mathematical property, confusing intensity with frequency. In the five centuries preceding the unification of Italy, there was supposed to be \"a lot of warfare\" ravaging the place. Therefore, many of these scholars insist, unification \"brought peace.\" But more than six hundred thousand Italians died in the Great War, during the \"period of stability,\" almost one order of magnitude higher than all the cumulative fatalities in the five hundred years preceding it. Many of the \"conflicts\" that took place between states or statelings were between professional soldiers, often mercenaries, and much of the population was unaware of them. Now, in my experience, after presenting these facts, I am almost always confronted with \"Still, there were more wars and instability.\" This is the Robert Rubin trade argument, that trades that lose money infrequently are more stable, even if they end up eventually wiping you out.", "begin": 24652.294, "end": 24739.574, "localBegin": 1431.24, "localEnd": 1518.52}, {"id": "c008_f000076", "text": "Third, there is a problem of representativeness, or to what extent the narrated maps to the empirical. Historians and international affairistas who reach us are more motivated by stories of conflict than by organic collaboration on the ground between a broader set of noninstitutional players, merchants, barbers, doctors, money changers, plumbers, prostitutes, and others. Peace and commerce might be of some interest, but it's not quite what interests people - and while the French Annales school brought some awareness that history is the whole life of an organism, not episodes of lurid wars, they failed to change much in the minds of the neighboring disciplines such as international affairs. Even I, while aware of the point and writing a chapter on it, tend to find accounts of real life boring.", "begin": 24739.574, "end": 24787.934, "localBegin": 1518.52, "localEnd": 1566.88}, {"id": "c008_f000077", "text": "Fourth, as we said before with the research done by Captain Mark Weisenborn, Pasquale Cirillo, and myself, accounts of past wars are fraught with overestimation biases. The lurid rises to the surface and keeps rising from account to account.", "begin": 24787.934, "end": 24804.894, "localBegin": 1566.88, "localEnd": 1583.84}, {"id": "c008_f000078", "text": "Journalism is about \"events,\" not absence of events, and many historians and policy scholars are glorified journalists with high fact-checking standards who allow themselves to be a little boring in order to be taken seriously. But being boring doesn't make them scientists, nor does \"fact checking\" make them empirical, as these scholars miss the notion of absence of data points and silent facts. Learning from the Russian school of probability makes one conscious of the need to think in terms of one-sided inequalities: what is absent from the data should be taken into account - absence of Black Swans in the record doesn't
