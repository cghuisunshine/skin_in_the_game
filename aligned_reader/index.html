l. If superstition is what it takes, not only is there absolutely no violation of the axioms of rationality there, but it would be technically irrational to stand in its way. If superstition is what's needed to satisfy ergodicity, let it be.", "begin": 28911.883, "end": 28943.603, "localBegin": 2250.92, "localEnd": 2282.64}, {"id": "c009_f000110", "text": "Let us return to Warren Buffett. He did not make his billions by cost-benefit analysis; rather, he did so simply by establishing a high filter, then picking opportunities that pass such a threshold. \"The difference between successful people and really successful people is that really successful people say no to almost everything,\" he said. Likewise our wiring might be adapted to \"say no\" to tail risk. For there are a zillion ways to make money without taking tail risk. There are a zillion ways to solve problems (say, feed the world) without complicated technologies that entail fragility and an unknown possibility of tail blowup. Whenever I hear someone saying \"we need to take (tail) risks\" I know it is not coming from a surviving practitioner but from a finance academic or a banker - the latter, we saw, almost always blows up, usually with other people's money.", "begin": 28943.603, "end": 29010.123, "localBegin": 2282.64, "localEnd": 2349.16}, {"id": "c009_f000111", "text": "Indeed, it doesn't cost us much to refuse some new shoddy technologies. It doesn't cost me much to go with my \"refined paranoia,\" even if wrong. For all it takes is for my paranoia to be right once, and it saves my life.", "begin": 29010.123, "end": 29030.843, "localBegin": 2349.16, "localEnd": 2369.88}, {"id": "c009_f000112", "text": "LOVE SOME RISKS", "begin": 29030.843, "end": 29032.283, "localBegin": 2369.88, "localEnd": 2371.32}, {"id": "c009_f000113", "text": "Antifragile shows how people confuse risk of ruin with variations and fluctuations - a simplification that violates a deeper, more rigorous logic of things. I make the case for risk loving, for systematic \"convex\" tinkering, and for taking a lot of risks that don't have tail risks but offer tail profits. Volatile things are not necessarily risky, and the reverse is also true. Jumping from a bench would be good for you and your bones, while falling from the twenty-second floor will never be so. Small injuries will be beneficial, never larger ones, those that have irreversible effects. Fearmongering about some classes of events is fearmongering; about others it is not. Risk and ruin are different tings.", "begin": 29032.283, "end": 29091.203, "localBegin": 2371.32, "localEnd": 2430.24}, {"id": "c009_f000114", "text": "NAIVE EMPIRICISM", "begin": 29091.203, "end": 29092.923, "localBegin": 2430.24, "localEnd": 2431.96}, {"id": "c009_f000115", "text": "All risks are not equal. We often hear that \"Ebola is causing fewer deaths than people drowning in their bathtubs,\" or something of the sort, based on \"evidence.\" This is another class of problems that your grandmother can get, but the semi-educated cannot.", "begin": 29092.923, "end": 29108.483, "localBegin": 2431.96, "localEnd": 2447.52}, {"id": "c009_f000116", "text": "Never compare a multiplicative, systemic, and fat-tailed risk to a non-multiplicative, idiosyncratic, and thin-tailed one.", "begin": 29108.483, "end": 29120.203, "localBegin": 2447.52, "localEnd": 2459.24}, {"id": "c009_f000117", "text": "Recall that I worry about the correlation between the death of one person and that of another. So we need to be concerned with systemic effects: things that can affect more than one person should they happen.", "begin": 29120.203, "end": 29131.723, "localBegin": 2459.24, "localEnd": 2470.76}, {"id": "c009_f000118", "text": "A refresher here. There are two categories in which random events fall: Mediocristan and Extremistan. Mediocristan is thin-tailed and affects the individual without correlation to the collective. Extremistan, by definition, affects many people. Hence Extremistan has a systemic effect that Mediocristan doesn't. Multiplicative risks - such as epidemics - are always from Extremistan. They may not be lethal (say, the flu), but they remain from Extremistan.", "begin": 29131.723, "end": 29160.843, "localBegin": 2470.76, "localEnd": 2499.88}, {"id": "c009_f000119", "text": "More technically:", "begin": 29160.843, "end": 29161.923, "localBegin": 2499.88, "localEnd": 2500.96}, {"id": "c009_f000120", "text": "Mediocristan risks are subjected to the Chernoff bound.", "begin": 29161.923, "end": 29165.403, "localBegin": 2500.96, "localEnd": 2504.44}, {"id": "c009_f000121", "text": "The Chernoff bound can be explained as follows. The probability that the number of people who drown in their bathtubs in the United States doubles next year - assuming no changes in population or bathtubs - is one per several trillions lifetimes of the universe. This cannot be said about the doubling of the number of people killed by terrorism over the same period.", "begin": 29165.403, "end": 29189.603, "localBegin": 2504.44, "localEnd": 2528.64}, {"id": "c009_f000122", "text": "Journalists and social scientists are pathologically prone to such nonsense - particularly those who think that a regression and a graph are sophisticated ways to approach a problem. Simply, they have been trained with tools for Mediocristan. So we often see the headline that many more American citizens slept with Kim Kardashian than died of Ebola. Or that more people were killed by their own furniture than by terrorism. Your grandmother's logic would debunk these claims. Just consider that: it is impossible for a billion people to sleep with Kim Kardashian (even her), but that there is a non-zero probability that a multiplicative process (a pandemic) causes such a number of Ebola deaths. Or even if such events were not multiplicative, say, terrorism, there is a probability of actions such as polluting the water supply that can cause extreme deviations. The other argument is one of feedback: if terrorism casualties are low, it is because of vigilance (we tend to search passengers before boarding planes), and the argument that such vigilance is superfluous indicates a severe flaw in reasoning. Your bathtub is not trying to kill you.", "begin": 29189.603, "end": 29286.763, "localBegin": 2528.64, "localEnd": 2625.8}, {"id": "c009_f000123", "text": "I was wondering why the point appears to be unnatural to many \"scientists\" (which includes policymakers), but natural to some other people, such as the probabilist Paul Embrechts. Simply, Embrechts looks at things from the tail. Embrechts studies a branch of probability called extreme value theory and is part of a group we call \"extremists\" - a narrow group of researchers who specialize, as I do, in extreme events. Well, Embrechts and his peers look at the difference between processes for extremes, never the ordinary. Do not confuse this with Extremistan: they study what happens for extremes, which includes both Extremistan and Mediocristan - it just happens that Mediocristan is milder than Extremistan. They classify what can happen \"in the tails\" according to the generalized extreme value distribution. Things are a lot - a lot - clearer in the tails. And things are a lot - a lot - clearer in probability than they are in words.", "begin": 29286.763, "end": 29370.403, "localBegin": 2625.8, "localEnd": 2709.44}, {"id": "c009_f000124", "text": "SUMMARY", "begin": 29370.403, "end": 29370.883, "localBegin": 2709.44, "localEnd": 2709.92}, {"id": "c009_f000125", "text": "We close this chapter with a few summarizing lines.", "begin": 29370.883, "end": 29374.363, "localBegin": 2709.92, "localEnd": 2713.4}, {"id": "c009_f000126", "text": "One may be risk loving yet completely averse to ruin.", "begin": 29374.363, "end": 29376.643, "localBegin": 2713.4, "localEnd": 2715.68}, {"id": "c009_f000127", "text": "The central asymmetry of life is:", "begin": 29376.643, "end": 29378.963, "localBegin": 2715.68, "localEnd": 2718.0}, {"id": "c009_f000128", "text": "In a strategy that entails ruin, benefits never offset risks of ruin.", "begin": 29378.963, "end": 29387.323, "localBegin": 2718.0, "localEnd": 2726.36}, {"id": "c009_f000129", "text": "Further:", "begin": 29387.323, "end": 29387.843, "localBegin": 2726.36, "localEnd": 2726.88}, {"id": "c009_f000130", "text": "Ruin and other changes in condition are different animals.", "begin": 29387.843, "end": 29392.123, "localBegin": 2726.88, "localEnd": 2731.16}, {"id": "c009_f000131", "text": "Every single risk you take adds up to reduce your life expectancy.", "begin": 29392.123, "end": 29396.723, "localBegin": 2731.16, "localEnd": 2735.76}, {"id": "c009_f000132", "text": "Finally:", "begin": 29396.723, "end": 29397.843, "localBegin": 2735.76, "localEnd": 2736.88}, {"id": "c009_f000133", "text": "Rationality is avoidance of systemic ruin.", "begin": 29397.843, "end": 29401.443, "localBegin": 2736.88, "localEnd": 2740.48}, {"id": "c009_f000134", "text": "Epilogue", "begin": 29401.443, "end": 29402.883, "localBegin": 2740.48, "localEnd": 2741.92}, {"id": "c009_f000135", "text": "What Lindy Told Me", "begin": 29402.883, "end": 29408.723, "localBegin": 2741.92, "localEnd": 2747.76}, {"id": "c009_f000136", "text": "Now, reader, comes the end of the journey - and a fifth installment of the Incerto. So while trying to summarize the book, with the obligatory distillation, I saw the reflection of my face in a restaurant's mirror: dominated by a whitish beard, and a defiant East-Med (East Mediterranean) Greco-Phoenician pride in aging. It was more than two and a half decades ago that I put pen to paper for the Incerto, before my beard turned gray. Lindy was telling me that, for a certain class of things, I had less to prove, less to explain, and less to theorize. I had overheard someone in the restaurant saying emphatically, \"It is what it is,\" and the phrase kept repeating itself in my head.", "begin": 29408.723, "end": 29467.683, "localBegin": 2747.76, "localEnd": 2806.72}, {"id": "c009_f000137", "text": "No summary this time, no summary anymore. Per Lindy:", "begin": 29467.683, "end": 29471.243, "localBegin": 2806.72, "localEnd": 2810.28}, {"id": "c009_f000138", "text": "When the beard (or hair) is black, heed the reasoning, but ignore the conclusion. When the beard is gray, consider both reasoning and conclusion. When the beard is white, skip the reasoning, but mind the conclusion.", "begin": 29471.243, "end": 29484.843, "localBegin": 2810.28, "localEnd": 2823.88}, {"id": "c009_f000139", "text": "So let me finish this book with a (long) maxim, via negativa style:", "begin": 29484.843, "end": 29490.923, "localBegin": 2823.88, "localEnd": 2829.96}, {"id": "c009_f000140", "text": "No muscles without strength,", "begin": 29490.923, "end": 29492.803, "localBegin": 2829.96, "localEnd": 2831.84}, {"id": "c009_f000141", "text": "friendship without trust,", "begin": 29492.803, "end": 29494.643, "localBegin": 2831.84, "localEnd": 2833.68}, {"id": "c009_f000142", "text": "opinion without consequence,", "begin": 29494.643, "end": 29496.523, "localBegin": 2833.68, "localEnd": 2835.56}, {"id": "c009_f000143", "text": "change without aesthetics,", "begin": 29496.523, "end": 29497.483, "localBegin": 2835.56, "localEnd": 2836.52}, {"id": "c009_f000144", "text": "age without values,", "begin": 29497.483, "end": 29499.323, "localBegin": 2836.52, "localEnd": 2838.36}, {"id": "c009_f000145", "text": "life without effort,", "begin": 29499.323, "end": 29500.203, "localBegin": 2838.36, "localEnd": 2839.24}, {"id": "c009_f000146", "text": "water without thirst,", "begin": 29500.203, "end": 29501.243, "localBegin": 2839.24, "localEnd": 2840.28}, {"id": "c009_f000147", "text": "food without nourishment,", "begin": 29501.243, "end": 29502.723, "localBegin": 2840.28, "localEnd": 2841.76}, {"id": "c009_f000148", "text": "love without sacrifice,", "begin": 29502.723, "end": 29505.043, "localBegin": 2841.76, "localEnd": 2844.08}, {"id": "c009_f000149", "text": "power without fairness,", "begin": 29505.043, "end": 29506.803, "localBegin": 2844.08, "localEnd": 2845.84}, {"id": "c009_f000150", "text": "facts without rigor,", "begin": 29506.803, "end": 29508.483, "localBegin": 2845.84, "localEnd": 2847.52}, {"id": "c009_f000151", "text": "statistics without logic,", "begin": 29508.483, "end": 29510.163, "localBegin": 2847.52, "localEnd": 2849.2}, {"id": "c009_f000152", "text": "mathematics without proof,", "begin": 29510.163, "end": 29513.083, "localBegin": 2849.2, "localEnd": 2852.12}, {"id": "c009_f000153", "text": "teaching without experience,", "begin": 29513.083, "end": 29515.163, "localBegin": 2852.12, "localEnd": 2854.2}, {"id": "c009_f000154", "text": "politeness without warmth,", "begin": 29515.163, "end": 29517.083, "localBegin": 2854.2, "localEnd": 2856.12}, {"id": "c009_f000155", "text": "values without embodiment,", "begin": 29517.083, "end": 29519.523, "localBegin": 2856.12, "localEnd": 2858.56}, {"id": "c009_f000156", "text": "degrees without erudition,", "begin": 29519.523, "end": 29522.643, "localBegin": 2858.56, "localEnd": 2861.68}, {"id": "c009_f000157", "text": "militarism without fortitude,", "begin": 29522.643, "end": 29527.043, "localBegin": 2861.68, "localEnd": 2866.08}, {"id": "c009_f000158", "text": "progress without civilization,", "begin": 29527.043, "end": 29529.763, "localBegin": 2866.08, "localEnd": 2868.8}, {"id": "c009_f000159", "text": "friendship without investment,", "begin": 29529.763, "end": 29532.363, "localBegin": 2868.8, "localEnd": 2871.4}, {"id": "c009_f000160", "text": "virtue without risk,", "begin": 29532.363, "end": 29533.803, "localBegin": 2871.4, "localEnd": 2872.84}, {"id": "c009_f000161", "text": "probability without ergodicity,", "begin": 29533.803, "end": 29535.843, "localBegin": 2872.84, "localEnd": 2874.88}, {"id": "c009_f000162", "text": "wealth without exposure,", "begin": 29535.843, "end": 29537.883, "localBegin": 2874.88, "localEnd": 2876.92}, {"id": "c009_f000163", "text": "complication without depth,", "begin": 29537.883, "end": 29540.283, "localBegin": 2876.92, "localEnd": 2879.32}, {"id": "c009_f000164", "text": "fluency without content,", "begin": 29540.283, "end": 29544.643, "localBegin": 2879.32, "localEnd": 2883.68}, {"id": "c009_f000165", "text": "decision without asymmetry,", "begin": 29544.643, "end": 29547.163, "localBegin": 2883.68, "localEnd": 2886.2}, {"id": "c009_f000166", "text": "science without skepticism,", "begin": 29547.163, "end": 29549.483, "localBegin": 2886.2, "localEnd": 2888.52}, {"id": "c009_f000167", "text": "religion without tolerance,", "begin": 29549.483, "end": 29551.443, "localBegin": 2888.52, "localEnd": 2890.48}, {"id": "c009_f000168", "text": "and, most of all:", "begin": 29551.443, "end": 29554.403, "localBegin": 2890.48, "localEnd": 2893.44}, {"id": "c009_f000169", "text": "nothing without skin in the game.", "begin": 29554.403, "end": 29556.603, "localBegin": 2893.44, "localEnd": 2895.64}, {"id": "c009_f000170", "text": "And thank you for reading my book.", "begin": 29556.603, "end": 29558.883, "localBegin": 2895.64, "localEnd": 2897.92}, {"id": "c009_f000171", "text": "Glossary", "begin": 29558.883, "end": 29559.563, "localBegin": 2897.92, "localEnd": 2898.6}, {"id": "c009_f000172", "text": "Rent Seeking: trying to use protective regulations or \"rights\" to derive income without adding anything to economic activity, without increasing the wealth of others. As Fat Tony would define it, it is like being forced to pay protection money to the Mafia without getting the economic benefits of protection.", "begin": 29559.563, "end": 29578.443, "localBegin": 2898.6, "localEnd": 2917.48}, {"id": "c009_f000173", "text": "Revelation of Preferences: the theory, originating with Paul Samuelson (initially in the context of choice of public goods), that agents do not have full access to the reasoning behind their actions; actions are observables, while thought is not, which prevents the latter from being used for rigorous scientific investigation. In economics, experiments require an actual expenditure by the agent. Fat Tony's summary is \"tawk is always cheap.\"", "begin": 29578.443, "end": 29609.883, "localBegin": 2917.48, "localEnd": 2948.92}, {"id": "c009_f000174", "text": "Regulatory Capture: situations where regulations end up being \"gamed\" by an agent, often in divergence from the original intent of the regulation. Some bureaucrats and businesspersons may owe part of their income to protective regulations and franchises, and lobby for them. Note that regulations are easier to put in than to correct and remove.", "begin": 29609.883, "end": 29635.763, "localBegin": 2948.92, "localEnd": 2974.8}, {"id": "c009_f000175", "text": "Scientism: the belief that science looks…like science, with too much emphasis on the cosmetic aspects, rather than its skeptical machinery. It prevails in domains with administrators judging contributions according to metrics. It also prevails in domains left to people who talk about science without \"doing,\" such as journalists and schoolteachers.", "begin": 29635.763, "end": 29660.003, "localBegin": 2974.8, "localEnd": 2999.04}, {"id": "c009_f000176", "text": "Naive Rationalism: Belief that we have access to what makes the world work and that what we don't understand doesn't exist.", "begin": 29660.003, "end": 29668.123, "localBegin": 2999.04, "localEnd": 3007.16}, {"id": "c009_f000177", "text": "Intellectual Yet Idiot: an idiot.", "begin": 29668.123, "end": 29670.203, "localBegin": 3007.16, "localEnd": 3009.24}, {"id": "c009_f000178", "text": "Pseudo-rationalism: 1) focusing on the rationality of a belief rather than its consequences, 2) the use of bad probabilistic models to naively decry people's \"irrationality\" when they engage in a certain class of actions.", "begin": 29670.203, "end": 29686.803, "localBegin": 3009.24, "localEnd": 3025.84}, {"id": "c009_f000179", "text": "Agency Problem: misalignment of interest between the agent and the principal, say between the car salesman and you (the potential owner), or between the doctor and the patient.", "begin": 29686.803, "end": 29696.323, "localBegin": 3025.84, "localEnd": 3035.36}, {"id": "c009_f000180", "text": "Bob Rubin Trade: payoff in a skewed domain where the benefits are visible (and rewarded with some compensation) and the detriment is rare (and unpunished owing to absence of skin in the game). Can be generalized to politics, anything where the penalty is weak and the victims are abstract and distributed (say taxpayers or shareholders).", "begin": 29696.323, "end": 29722.083, "localBegin": 3035.36, "localEnd": 3061.12}, {"id": "c009_f000181", "text": "Interventionista: someone who causes fragility because he thinks he understands what's going on. He is not exposed to the filter and discipline of skin in the game. Also, usually lacks sense of humor.", "begin": 29722.083, "end": 29735.283, "localBegin": 3061.12, "localEnd": 3074.32}, {"id": "c009_f000182", "text": "Green Lumber Fallacy: mistaking the source of important or even necessary knowledge - the greenness of lumber - for another, less visible from the outside, less tractable one. How theoreticians impute wrong weights to what one should know in a certain business, or, more generally, how many things we call \"relevant knowledge\" aren't so much so.", "begin": 29735.283, "end": 29757.003, "localBegin": 3074.32, "localEnd": 3096.04}, {"id": "c009_f000183", "text": "Lecturing-Birds-How-to-Fly Effect: inverting the arrow of knowledge to read academia ➝ practice, or education ➝ wealth, to make it look as though technology owes more to institutional science than it actually does. See Antifragile.", "begin": 29757.003, "end": 29772.643, "localBegin": 3096.04, "localEnd": 3111.68}, {"id": "c009_f000184", "text": "Lindy Effect: when a technology, idea, corporation, or anything nonperishable has an increase in life expectancy with every additional day of survival - unlike perishable items (such as humans, cats, dogs, economic theories, and tomatoes). So a book that has been a hundred years in print is likely to stay in print another hundred years - provided its sales remain healthy.", "begin": 29772.643, "end": 29799.283, "localBegin": 3111.68, "localEnd": 3138.32}, {"id": "c009_f000185", "text": "Ergodicity: In our context here, ergodicity holds when a collection of players have the same statistical properties (particularly expectation) as a single player over time. Ensemble probabilities are similar to time probabilities. Absence of ergodicity makes the risk properties not directly transferable from observed probability to the payoff of a strategy subjected to ruin (or any absorbing barrier or \"uncle point\") - in other words, not probabilistically sustainable.", "begin": 29799.283, "end": 29829.003, "localBegin": 3138.32, "localEnd": 3168.04}, {"id": "c009_f000186", "text": "Mediocristan: a process dominated by the mediocre, with few extreme successes or failures (say, income for a dentist). No single observation can meaningfully affect the aggregate. Also called \"thin-tailed,\" or member of the Gaussian family of distributions.", "begin": 29829.003, "end": 29841.643, "localBegin": 3168.04, "localEnd": 3180.68}, {"id": "c009_f000187", "text": "Extremistan: a process where the total can be conceivably impacted by a single observation (say, income for a writer). Also called \"fat-tailed.\" Includes the fractal, or power-law, family of distributions. See subexponentiality in the Appendix.", "begin": 29841.643, "end": 29855.443, "localBegin": 3180.68, "localEnd": 3194.48}, {"id": "c009_f000188", "text": "Minority Rule: an asymmetry by which the behavior of the total is dictated by the preferences of a minority. Smokers can be in smoke-free areas but nonsmokers cannot be in smoking ones, so nonsmokers will prevail, not because they are initially a majority, but because they are asymmetric. It is held by the author that languages, ethics, and (some) religions spread by minority rule.", "begin": 29855.443, "end": 29886.203, "localBegin": 3194.48, "localEnd": 3225.24}, {"id": "c009_f000189", "text": "Via Negativa: in theology and philosophy, the focus on what something is not, an indirect definition, deemed less prone to fallacies than via positiva. In action, it is a recipe for what to avoid, what not to do - subtraction, not addition, works better in domains with multiplicative and unpredictable side effects. In medicine, stopping someone from smoking has fewer adverse effects than giving pills and treatments.", "begin": 29886.203, "end": 29919.323, "localBegin": 3225.24, "localEnd": 3258.36}, {"id": "c009_f000190", "text": "Scalability: The qualities of entities change, often abruptly, when they get smaller or larger: cities are different from large states, continents are very different from islands. Collective behavior switches when the size of the groups increases, an argument for localism and against unfettered globalism.", "begin": 29919.323, "end": 29939.083, "localBegin": 3258.36, "localEnd": 3278.12}, {"id": "c009_f000191", "text": "Intellectual Monoculture: Journalists, academics, and other slaves without skin in the game in a given subject converge to a \"bien pensant\" mode that can be manipulated and often resists empirical backing. The reason is that penalty from divergence is often penalized with labels such as \"Putinist,\" \"baby killer,\" or \"racist\" (children are always used by charlatans as a sensationalist argument). This is similar to the way ecological diversity decreases when an island gets larger (see The Black Swan).", "begin": 29939.083, "end": 29972.483, "localBegin": 3278.12, "localEnd": 3311.52}, {"id": "c009_f000192", "text": "Virtue Merchandising: the debasing of virtue by using it as a marketing strategy. Classically, virtue needs to be kept private, which clashes with modern \"save the environment\"-style messages. Virtue merchandisers are often hypocrites. Further, virtue devoid of courage, sacrifice, and skin in the game is never virtue. Virtue merchandising is similar to simony, which in the Middle Ages allowed someone of means to buy ecclesiastical positions or indulgences, to expunge his or her sins by payment.", "begin": 29972.483, "end": 30011.403, "localBegin": 3311.52, "localEnd": 3350.44}, {"id": "c009_f000193", "text": "Golden Rule (symmetry): Treat others the way you would like them to treat you.", "begin": 30011.403, "end": 30019.523, "localBegin": 3350.44, "localEnd": 3358.56}, {"id": "c009_f000194", "text": "Silver Rule (negative golden rule): Do not do to others what you would not like them to do to you. Note the difference from the Golden Rule, as the silver one prevents busybodies from attempting to run your life.", "begin": 30019.523, "end": 30038.883, "localBegin": 3358.56, "localEnd": 3377.92}, {"id": "c009_f000195", "text": "Principle of Charity: Exercise symmetry in intellectual debates; represent the argument of the opponent as accurately as you would like yours to be represented. The opposite of \"strawman.\"", "begin": 30038.883, "end": 30059.043, "localBegin": 3377.92, "localEnd": 3398.08}]}]};
    const PROGRESS_KEY = `aligned-reader-progress:${manifest.title}`;
    const audio = document.getElementById('audio');
    const chapterList = document.getElementById('chapterList');
    const reader = document.getElementById('reader');
    const chapterTitle = document.getElementById('chapterTitle');
    const playButton = document.getElementById('playButton');
    const prevButton = document.getElementById('prevButton');
    const nextButton = document.getElementById('nextButton');
    const seekBar = document.getElementById('seekBar');
    const timeLabel = document.getElementById('timeLabel');
    const chapterTime = document.getElementById('chapterTime');
    let currentIndex = 0;
    let currentParagraphId = null;

    function saveProgress(paragraph) {
      if (!paragraph) return;
      localStorage.setItem(PROGRESS_KEY, JSON.stringify({
        chapterIndex: currentIndex,
        paragraphId: paragraph.id,
        currentTime: paragraph.localBegin,
      }));
    }

    function loadProgress() {
      try {
        return JSON.parse(localStorage.getItem(PROGRESS_KEY) || 'null');
      } catch {
        return null;
      }
    }

    function formatTime(seconds) {
      seconds = Math.max(0, Math.floor(seconds || 0));
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = seconds % 60;
      return h ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${m}:${String(s).padStart(2, '0')}`;
    }

    function renderNav() {
      chapterList.innerHTML = '';
      manifest.chapters.forEach((chapter, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'chapter-link' + (index === currentIndex ? ' active' : '');
        const number = chapter.kind === 'chapter' ? String(chapter.number).padStart(2, '0') : '--';
        button.innerHTML = `<span class="chapter-number">${number}</span><span>${chapter.title}</span>`;
        button.addEventListener('click', () => loadChapter(index, true));
        chapterList.appendChild(button);
      });
    }

    function chapterAudioStart(chapter) {
      return chapter.audioStart || 0;
    }

    function loadChapter(index, autoplay = false, seek = true) {
      currentIndex = Math.max(0, Math.min(index, manifest.chapters.length - 1));
      const chapter = manifest.chapters[currentIndex];
      currentParagraphId = null;
      const nextSource = new URL(chapter.audio, window.location.href).href;
      const sourceChanged = audio.src !== nextSource;
      if (sourceChanged) {
        audio.src = chapter.audio;
      }
      chapterTitle.textContent = chapter.kind === 'chapter' ? `Chapter ${chapter.number}. ${chapter.title}` : chapter.title;
      reader.innerHTML = '';
      if (chapter.paragraphs.length) {
        chapter.paragraphs.forEach((paragraph) => {
          const node = document.createElement('p');
          node.className = 'paragraph';
          node.id = paragraph.id;
          node.textContent = paragraph.text;
          node.addEventListener('click', () => {
            saveProgress(paragraph);
            audio.currentTime = paragraph.localBegin;
            audio.play();
          });
          reader.appendChild(node);
        });
      } else {
        const node = document.createElement('p');
        node.className = 'outro';
        node.textContent = 'Audio outro';
        reader.appendChild(node);
      }
      renderNav();
      updateTimes();
      const startPlayback = () => {
        if (seek) {
          audio.currentTime = chapterAudioStart(chapter);
        }
        if (autoplay) {
          audio.play();
        }
      };
      if (sourceChanged && audio.readyState < 1) {
        audio.addEventListener('loadedmetadata', startPlayback, { once: true });
      } else {
        startPlayback();
      }
    }

    function updateTimes() {
      const chapter = manifest.chapters[currentIndex];
      const audioClock = audio.currentTime || 0;
      const local = Math.max(0, audioClock - chapterAudioStart(chapter));
      timeLabel.textContent = `${formatTime(chapter.start + local)} / ${formatTime(manifest.duration)}`;
      chapterTime.textContent = `${formatTime(local)} / ${formatTime(chapter.duration)}`;
      seekBar.value = chapter.duration ? String(Math.round((local / chapter.duration) * 1000)) : '0';
      updateHighlight(audioClock);
      const nextChapter = manifest.chapters[currentIndex + 1];
      if (!audio.paused && nextChapter && nextChapter.audio === chapter.audio && local >= chapter.duration - 0.15) {
        loadChapter(currentIndex + 1, true, false);
      }
    }

    function updateHighlight(local) {
      const chapter = manifest.chapters[currentIndex];
      const paragraph = chapter.paragraphs.find((item) => local >= item.localBegin && local < item.localEnd);
      const nextId = paragraph ? paragraph.id : null;
      if (nextId === currentParagraphId) return;
      if (currentParagraphId) {
        document.getElementById(currentParagraphId)?.classList.remove('active');
      }
      currentParagraphId = nextId;
      if (currentParagraphId) {
        const node = document.getElementById(currentParagraphId);
        node?.classList.add('active');
        node?.scrollIntoView({ block: 'center', behavior: 'smooth' });
        saveProgress(paragraph);
      }
    }

    playButton.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
    });
    prevButton.addEventListener('click', () => loadChapter(currentIndex - 1, !audio.paused));
    nextButton.addEventListener('click', () => loadChapter(currentIndex + 1, !audio.paused));
    seekBar.addEventListener('input', () => {
      const chapter = manifest.chapters[currentIndex];
      audio.currentTime = chapterAudioStart(chapter) + (Number(seekBar.value) / 1000) * chapter.duration;
    });
    audio.addEventListener('play', () => playButton.textContent = 'Pause');
    audio.addEventListener('pause', () => playButton.textContent = 'Play');
    audio.addEventListener('timeupdate', updateTimes);
    audio.addEventListener('loadedmetadata', updateTimes);
    audio.addEventListener('ended', () => {
      if (currentIndex < manifest.chapters.length - 1) {
        loadChapter(currentIndex + 1, true);
      }
    });

    const initialProgress = loadProgress();
    if (initialProgress && Number.isInteger(initialProgress.chapterIndex)) {
      loadChapter(initialProgress.chapterIndex, false);
      if (Number.isFinite(initialProgress.currentTime)) {
        audio.addEventListener('loadedmetadata', () => audio.currentTime = initialProgress.currentTime, { once: true });
      }
    } else {
      loadChapter(0, false);
    }
  </script>
