ly British-ruled) venue as a forum in the event of a dispute: Hong Kong and Singapore are the favorites in Asia, London and New York in the West. Common law is about the spirit while regulation, owing to its rigidity, is all about the letter.", "begin": 4086.71, "end": 4134.71, "localBegin": 2296.8, "localEnd": 2344.8}, {"id": "c002_f000096", "text": "If a big corporation pollutes your neighborhood, you can get together with your neighbors and sue the hell out of it. Some greedy lawyer will have the paperwork ready. The enemies of the corporation will be glad to help. And the potential costs of the settlement would be enough of a deterrent for the corporation to behave.", "begin": 4134.71, "end": 4151.23, "localBegin": 2344.8, "localEnd": 2361.32}, {"id": "c002_f000097", "text": "This doesn't mean one should never regulate at all. Some systemic effects may require regulation (say hidden tail risks of environmental ruins that show up too late). If you can't effectively sue, regulate.", "begin": 4151.23, "end": 4168.27, "localBegin": 2361.32, "localEnd": 2378.36}, {"id": "c002_f000098", "text": "Now, even if regulations had a small net payoff for society, I would still prefer to be as free as possible, but assume my civil responsibility, face my fate, and pay the penalty if I harm others. This attitude is called deontic libertarianism (deontic comes from \"duties\"): by regulating you are robbing people of freedom. Some of us believe that freedom is one's first most essential good. This includes the freedom to make mistakes (those that harm only you); it is sacred to the point that it must never be traded against economic or other benefits.", "begin": 4168.27, "end": 4216.59, "localBegin": 2378.36, "localEnd": 2426.68}, {"id": "c002_f000099", "text": "IV. SOUL IN THE GAME", "begin": 4216.59, "end": 4218.79, "localBegin": 2426.68, "localEnd": 2428.88}, {"id": "c002_f000100", "text": "Finally and centrally, skin in the game is about honor as an existential commitment, and risk taking (a certain class of risks) as a separation between man and machine and (some may hate it) a ranking of humans.", "begin": 4218.79, "end": 4234.75, "localBegin": 2428.88, "localEnd": 2444.84}, {"id": "c002_f000101", "text": "If you do not take risks for your opinion, you are nothing.", "begin": 4234.75, "end": 4238.99, "localBegin": 2444.84, "localEnd": 2449.08}, {"id": "c002_f000102", "text": "And I will keep mentioning that I have no other definition of success than leading an honorable life. We intimated that it is dishonorable to let others die in your stead.", "begin": 4238.99, "end": 4248.23, "localBegin": 2449.08, "localEnd": 2458.32}, {"id": "c002_f000103", "text": "Honor implies that there are some actions you would categorically never do, regardless of the material rewards. She accepts no Faustian bargain, would not sell her body for $500; it also means she wouldn't do it for a million, nor a billion, nor a trillion. And it is not just a via negativa stance, honor means that there are things you would do unconditionally, regardless of the consequences. Consider duels, which have robbed us of the great Russian poet Pushkin, the French mathematician Galois, and, of course, many more, at a young age (and, in the case of Galois, a very young age): people incurred a significant probability of death just to save face. Living as a coward was simply no option, and death was vastly preferable, even if, as in the case of Galois, one invented a new and momentous branch of mathematics while still a teenager. As a Spartan mother tells her departing son: \"With it or on it,\" meaning either return with your shield or don't come back alive (the custom was to carry the dead body flat on it); only cowards throw away their shields to run faster.", "begin": 4248.23, "end": 4329.59, "localBegin": 2458.32, "localEnd": 2539.68}, {"id": "c002_f000104", "text": "If you want to consider how modernity has destroyed some of the foundations of human values, contrast the above unconditionals with modernistic accommodations: people who, say, work for disgusting lobbies (representing the interests of, say, Saudi Arabia in Washington) or knowingly play the usual unethical academic game, come to grips with their condition by producing arguments such as \"I have children to put through college.\" People who are not morally independent tend to fit ethics to their profession (with a minimum of spinning), rather than find a profession that fits their ethics.", "begin": 4329.59, "end": 4364.71, "localBegin": 2539.68, "localEnd": 2574.8}, {"id": "c002_f000105", "text": "Now there is another dimension of honor: engaging in actions going beyond mere skin in the game to put oneself at risk for others, have your skin in other people's game; sacrifice something significant for the sake of the collective.", "begin": 4364.71, "end": 4381.07, "localBegin": 2574.8, "localEnd": 2591.16}, {"id": "c002_f000106", "text": "However, there are activities in which one is imbued with a sense of pride and honor without grand-scale sacrifice: artisanal ones.", "begin": 4381.07, "end": 4391.55, "localBegin": 2591.16, "localEnd": 2601.64}, {"id": "c002_f000107", "text": "Artisans", "begin": 4391.55, "end": 4393.75, "localBegin": 2601.64, "localEnd": 2603.84}, {"id": "c002_f000108", "text": "Anything you do to optimize your work, cut some corners, or squeeze more \"efficiency\" out of it (and out of your life) will eventually make you dislike it.", "begin": 4393.75, "end": 4403.91, "localBegin": 2603.84, "localEnd": 2614.0}, {"id": "c002_f000109", "text": "Artisans have their soul in the game.", "begin": 4403.91, "end": 4406.23, "localBegin": 2614.0, "localEnd": 2616.32}, {"id": "c002_f000110", "text": "Primo, artisans do things for existential reasons first, financial and commercial ones later. Their decision making is never fully financial, but it remains financial. Secundo, they have some type of \"art\" in their profession; they stay away from most aspects of industrialization; they combine art and business. Tertio, they put some soul in their work: they would not sell something defective or even of compromised quality because it hurts their pride. Finally, they have sacred taboos, things they would not do even if it markedly increased profitability.", "begin": 4406.23, "end": 4443.87, "localBegin": 2616.32, "localEnd": 2653.96}, {"id": "c002_f000111", "text": "Compendiaria res improbitas, virtusque tarda - the villainous takes the short road, virtue the longer one. In other words, cutting corners is dishonest.", "begin": 4443.87, "end": 4457.03, "localBegin": 2653.96, "localEnd": 2667.12}, {"id": "c002_f000112", "text": "Let me illustrate with my own profession. It is easy to see that a writer is effectively an artisan: book sales are not the end motive, only a secondary target (even then). You preserve some sanctity of the product with strong prohibitions. For instance, in the early 2000s, the writer Fay Weldon was paid by the jewelry chain Bulgari to advertise their brand by weaving recommendations for their great products into the plot of her novel. A nightmare ensued; there was a generalized feeling of disgust on the part of the literary community.", "begin": 4457.03, "end": 4490.11, "localBegin": 2667.12, "localEnd": 2700.2}, {"id": "c002_f000113", "text": "I also recall in the 1980s some people trying to give away books for free, but with advertisements in the midst of the text, as with magazines. The project failed.", "begin": 4490.11, "end": 4501.95, "localBegin": 2700.2, "localEnd": 2712.04}, {"id": "c002_f000114", "text": "Nor do we industrialize writing. You would be disappointed if I hired a group of writers to \"help\" as it would be more efficient. Some authors, such as Jerzy Kosinski, have tried to write books by subcontracting sections, leading to a complete ostracism after the discovery. Few of those writers-cum-contractors have seen their work survive. But there are exceptions, such as Alexandre Dumas père who was said to run a workshop of ghostwriters (forty-five), which allowed him to scale his production up to one hundred and fifty novels, with the joke that he read some of his own books. But in general, output is not scalable (even if the sales of a book are). Dumas may be the exception that confirms the rule.", "begin": 4501.95, "end": 4547.87, "localBegin": 2712.04, "localEnd": 2757.96}, {"id": "c002_f000115", "text": "Now, something very practical. One of the best pieces of advice I have ever received was the recommendation by a very successful (and happy) older entrepreneur, Yossi Vardi, to have no assistant. The mere presence of an assistant suspends your natural filtering - and its absence forces you to do only things you enjoy, and progressively steer your life that way. (By assistant here I exclude someone hired for a specific task, such as grading papers, helping with accounting, or watering plants; just some guardian angel overseeing all your activities). This is a via negativa approach: you want maximal free time, not maximal activity, and you can assess your own \"success\" according to such metric. Otherwise, you end up assisting your assistants, or being forced to \"explain\" how to do things, which requires more mental effort than doing the thing itself. In fact, beyond my writing and research life, this has proved to be great financial advice as I am freer, more nimble, and have a very high benchmark for doing something, while my peers have their days filled with unnecessary \"meetings\" and unnecessary correspondence.", "begin": 4547.87, "end": 4617.11, "localBegin": 2757.96, "localEnd": 2827.2}, {"id": "c002_f000116", "text": "Having an assistant (except for the strictly necessary) removes your soul from the game.", "begin": 4617.11, "end": 4623.27, "localBegin": 2827.2, "localEnd": 2833.36}, {"id": "c002_f000117", "text": "Think of the effect of using a handheld translator on your next trip to Mexico in place of acquiring a robust vocabulary in Spanish by contact with locals. Assistance moves you one step away from authenticity.", "begin": 4623.27, "end": 4638.75, "localBegin": 2833.36, "localEnd": 2848.84}, {"id": "c002_f000118", "text": "Academics can be artisans. Even those economists who, misunderstanding Adam Smith, claim that humans are here to \"seek maximization\" of their income, express these ideas for free, and boast to not be into lowly commercial profit seeking, not seeing the contradiction.", "begin": 4638.75, "end": 4658.47, "localBegin": 2848.84, "localEnd": 2868.56}, {"id": "c002_f000119", "text": "A Caveat with Entrepreneurs", "begin": 4658.47, "end": 4660.19, "localBegin": 2868.56, "localEnd": 2870.28}, {"id": "c002_f000120", "text": "Entrepreneurs are heroes in our society. They fail for the rest of us. But owing to funding and current venture capital mechanisms, many people mistaken for entrepreneurs fail to have true skin in the game in the sense that their aim is to either cash out by selling the company they helped create to someone else, or \"go public\" by issuing shares in the stock market. The true value of the company, what it makes, and its long-term survival are of small relevance to them. This is a pure financing scheme and we will exclude this class of people from our \"entrepreneur\" risk-taker class (this form of entrepreneurship is the equivalent of bringing great-looking and marketable children into the world with the sole aim of selling them at age four). We can easily identify them by their ability to write a convincing business plan.", "begin": 4660.19, "end": 4710.63, "localBegin": 2870.28, "localEnd": 2920.72}, {"id": "c002_f000121", "text": "Companies beyond the entrepreneur stage start to rot. One of the reasons corporations have the mortality of cancer patients is the assignment of time-defined duties. Once you change assignment - or, better, company - you can now say about the deep Bob Rubin-style risks that emerge: \"It's not my problem anymore.\" The same happens when you sell out, so remember that:", "begin": 4710.63, "end": 4734.15, "localBegin": 2920.72, "localEnd": 2944.24}, {"id": "c002_f000122", "text": "The skills at making things diverge from those at selling things.", "begin": 4734.15, "end": 4738.79, "localBegin": 2944.24, "localEnd": 2948.88}, {"id": "c002_f000123", "text": "Arrogant Will Do", "begin": 4738.79, "end": 4742.55, "localBegin": 2948.88, "localEnd": 2952.64}, {"id": "c002_f000124", "text": "Products or companies that bear the owner's name convey very valuable messages. They are shouting that they have something to lose. Eponymy indicates both a commitment to the company and a confidence in the product. A friend of mine, Paul Wilmott, is often called an egomaniac for having his name on a mathematical finance technical journal (Wilmott), which at the time of writing is undoubtedly the best. \"Egomaniac\" is good for the product. But if you can't get \"egomaniac,\" \"arrogant\" will do.", "begin": 4742.55, "end": 4775.11, "localBegin": 2952.64, "localEnd": 2985.2}, {"id": "c002_f000125", "text": "Citizenship de Plaisance", "begin": 4775.11, "end": 4779.91, "localBegin": 2985.2, "localEnd": 2990.0}, {"id": "c002_f000126", "text": "Many well-to-do people who come to live in the United States avoid becoming citizens while living here indefinitely. They have a permanent residence permit as a free option, as it is a right, but not an obligation, for they can return it with a simple procedure. You ask them why they don't take the oath in front of a judge, then throw a cocktail party at a waterfront country club. The typical answer is: taxes. Once you become a U.S. citizen, you will have to pay taxes on your worldwide income, even if you live overseas. And it is not easily reversible, so you lose the optionality. But other Western countries, such as France and the United Kingdom, allow their citizens considerable exemptions if they reside in some tax haven. This invites a collection of people to \"buy\" a citizenship via investments and minimum residence, get the passport, then go live somewhere tax-free.", "begin": 4779.91, "end": 4835.35, "localBegin": 2990.0, "localEnd": 3045.44}, {"id": "c002_f000127", "text": "A country should not tolerate fair-weather friends. There is something offensive in having a nationality without skin in the game, just to travel and pass borders, without the downside that comes with the passport.", "begin": 4835.35, "end": 4848.87, "localBegin": 3045.44, "localEnd": 3058.96}, {"id": "c002_f000128", "text": "My parents are French citizens, which would have made it easy for me to get naturalized a few decades ago. But it did not feel right; it even felt downright offensive. And unless I developed an emotional attachment to France via skin in the game, I couldn't. It would have felt fake to see my bearded face on a French passport. The only passport I would have considered is the Greek (or Cypriot) one, as I feel some deep ancestral and socio-cultural bond to the Hellenistic world.", "begin": 4848.87, "end": 4877.31, "localBegin": 3058.96, "localEnd": 3087.4}, {"id": "c002_f000129", "text": "But I came to the U.S., embraced the place, and took the passport as commitment: it became my identity, good or bad, tax or no tax. Many people made fun of my decision, as most of my income comes from overseas and, if I took official residence in, say, Cyprus or Malta, I would be making many more dollars. If wanted to lower taxes for myself, and I do, I am obligated to fight for it, for both myself and the collective, other taxpayers, and to not run away.", "begin": 4877.31, "end": 4909.67, "localBegin": 3087.4, "localEnd": 3119.76}, {"id": "c002_f000130", "text": "Skin in the game.", "begin": 4909.67, "end": 4912.27, "localBegin": 3119.76, "localEnd": 3122.36}, {"id": "c002_f000131", "text": "Heroes Were Not Library Rats", "begin": 4912.27, "end": 4917.35, "localBegin": 3122.36, "localEnd": 3127.44}, {"id": "c002_f000132", "text": "If you want to study classical values such as courage or learn about stoicism, don't necessarily look for classicists. One is never a career academic without a reason. Read the texts themselves: Seneca, Caesar, or Marcus Aurelius, when possible. Or read commentators on the classics who were doers themselves, such as Montaigne - people who at some point had some skin in the game, then retired to write books. Avoid the intermediary, when possible. Or fuhgetaboud the texts, just engage in acts of courage.", "begin": 4917.35, "end": 4952.31, "localBegin": 3127.44, "localEnd": 3162.4}, {"id": "c002_f000133", "text": "For studying courage in textbooks doesn't make you any more courageous than eating cow meat makes you bovine.", "begin": 4952.31, "end": 4959.95, "localBegin": 3162.4, "localEnd": 3170.04}, {"id": "c002_f000134", "text": "By some mysterious mental mechanism, people fail to realize that the principal thing you can learn from a professor is how to be a professor - and the chief thing you can learn from, say, a life coach or inspirational speaker is how to become a life coach or inspirational speaker. So remember that the heroes of history were not classicists and library rats, those people who live vicariously in their texts. They were people of deeds and had to be endowed with the spirit of risk taking. To get into their psyches, you will need someone other than a career professor teaching stoicism. They almost always don't get it (actually, they never get it). In my experience, from a series of personal fights, many of these \"classicists,\" who know in intimate detail what people of courage such as Alexander, Cleopatra, Caesar, Hannibal, Julian, Leonidas, Zenobia ate for breakfast, can't produce a shade of intellectual valor. Is it that academia (and journalism) is fundamentally the refuge of the stochastophobe tawker? That is, the voyeur who wants to watch but not take risks? It appears so. The most important chapter of the book, and conveniently the last one, \"The Logic of Risk Taking,\" shows how some central elements of risks, while obvious to practitioners, can be missed by theoreticians for more than two centuries!", "begin": 4959.95, "end": 5061.31, "localBegin": 3170.04, "localEnd": 3271.4}, {"id": "c002_f000135", "text": "Soul in the Game and Some (Not Too Much) Protectionism", "begin": 5061.31, "end": 5067.51, "localBegin": 3271.4, "localEnd": 3277.6}, {"id": "c002_f000136", "text": "Let us now apply these ideas to modern times. Recall the story of the architects separated from the real users. This extends to more general systemic effects, such as protectionism and globalism. Seen that way, the rise of some protectionism may have a strong rationale - and an economic one.", "begin": 5067.51, "end": 5087.91, "localBegin": 3277.6, "localEnd": 3298.0}, {"id": "c002_f000137", "text": "I leave aside the argument that globalization leads to a Tower-of-Babel style cacophony, owing to the imbalance in the noise-signal ratio. The point here is that workers, people who do things, have each an artisan in them. For, contrary to what lobbyists paid by international large corporations are trying to make us believe, such protectionism does not even conflict with economic thinking, what is called neoclassical economics. It is not inconsistent with the mathematical axioms of economic decision making, on which economics lays its foundations, to behave in a way that does not maximize one's narrowly defined dollar-denominated bottom line at the expense of other things. As I said earlier in the chapter, it is not irrational, according to economic theory, to leave money on the table because of your personal preference; the notion of incentives as limited to financial gain cannot otherwise explain the very existence of an economics academia that promotes the idea of self-interest.", "begin": 5087.91, "end": 5163.43, "localBegin": 3298.0, "localEnd": 3373.52}, {"id": "c002_f000138", "text": "We may be better off in a narrowly defined accounting sense (in the aggregate) by exporting jobs. But that's not what people may really want. I write because that's what I am designed to do, just as a knife cuts because that's what its mission is, Aristotle's arête - and subcontracting my research and writing to China or Tunisia would (perhaps) increase my productivity, but deprive me of my identity.", "begin": 5163.43, "end": 5199.47, "localBegin": 3373.52, "localEnd": 3409.56}, {"id": "c002_f000139", "text": "So people might want to do things. Just to do things, because they feel it is part of their identity. A shoemaker in Westchester County wants to be a shoemaker, to enjoy the fruits of his labor and the pride of seeing his merchandise in the stores, even if his so-called \"economic\" condition might benefit from letting a Chinese factory make the shoes and converting to another profession. Even if such a new system allows him to buy flat-screen TV sets, more cotton shirts, and cheaper bicycles, something is missing. It may be cruel to cheat people of their profession. People want to have their soul in the game.", "begin": 5199.47, "end": 5237.15, "localBegin": 3409.56, "localEnd": 3447.24}, {"id": "c002_f000140", "text": "In that sense, decentralization and fragmentation, aside from stabilizing the system, improves people's connection to their labor.", "begin": 5237.15, "end": 5247.03, "localBegin": 3447.24, "localEnd": 3457.12}, {"id": "c002_f000141", "text": "Skin in the Ruling", "begin": 5247.03, "end": 5251.19, "localBegin": 3457.12, "localEnd": 3461.28}, {"id": "c002_f000142", "text": "Let us close with a historical anecdote.", "begin": 5251.19, "end": 5254.87, "localBegin": 3461.28, "localEnd": 3464.96}, {"id": "c002_f000143", "text": "Some might well ask: law is great, but what would you do with a corrupt or incompetent judge? He could make mistakes with impunity. He could be the weak link. Not quite, or at least not historically. A friend once showed me a Dutch painting representing the Judgment of Cambyses. The scene is from the story reported by Herodotus, concerning the corrupt Persian judge Sisamnes. He was flayed alive on the order of King Cambyses as a punishment for violating the rules of justice. The scene of the painting is Sisamnes's son dispensing justice from his father's chair, upholstered with the flayed skin as a reminder that justice comes with, literally, skin in the game.", "begin": 5254.87, "end": 5302.15, "localBegin": 3464.96, "localEnd": 3512.24}]}, {"kind": "chapter", "number": 3, "title": "Prologue, Part 3 and Chapter 1", "audio": "audio/chapter_003.mp3", "start": 5302.178, "end": 8665.077, "duration": 3362.899, "paragraphs": [{"id": "c003_f000001", "text": "Prologue, Part 3 T he Ribs of the Incerto", "begin": 5302.178, "end": 5308.258, "localBegin": 0.0, "localEnd": 6.08}, {"id": "c003_f000002", "text": "Seven pages per sitting, seven pages annum is the perfect rate - Rereaders need rereviewers", "begin": 5308.258, "end": 5317.018, "localBegin": 6.08, "localEnd": 14.84}, {"id": "c003_f000003", "text": "Now that we've outlined the main ideas, let us see how this discussion fits the rest of the Incerto project. Just as Eve came out of Adam's ribs, so does each book of the Incerto emerge from the penultimate one's ribs. The Black Swan was an occasional discussion in Fooled by Randomness; the concept of convexity to random events, the theme of Antifragile, was adumbrated in The Black Swan; and, finally, Skin in the Game was a segment of Antifragile under the banner: Thou shalt not become antifragile at the expense of others. Simply, asymmetry in risk bearing leads to imbalances and, potentially, to systemic ruin.", "begin": 5317.018, "end": 5358.138, "localBegin": 14.84, "localEnd": 55.96}, {"id": "c003_f000004", "text": "The Bob Rubin trade connects to my business as a trader (as we saw, when these people make money, they keep the profits; when they lose, someone else bears the costs while they do their Black Swan invocation). Its manifestations are so ubiquitous that it has been the backbone of every book of the Incerto. Whenever there is a mismatch between a bonus period (yearly) and the statistical occurrence of a blowup (every, say, ten years) the agent has an incentive to play the Bob Rubin risk-transfer game. Given the number of people trying to get on the money-making bus, there is a progressive accumulation of Black Swan risks in such systems. Then, boom, the systemic blowup happens.", "begin": 5358.138, "end": 5400.138, "localBegin": 55.96, "localEnd": 97.96}, {"id": "c003_f000005", "text": "THE ROAD", "begin": 5400.138, "end": 5400.978, "localBegin": 97.96, "localEnd": 98.8}, {"id": "c003_f000006", "text": "We will be guided by what is most lively. The ethics side is straightforward, as part of the general Fat Tony-Isocrates asymmetry, and I have gone deeply into the matter thanks to a highly argumentative collaboration with the philosopher (and walking companion) Constantine Sandis. Tort law is equally straightforward, and I had thought it would occupy a large section of this volume, but it will thankfully be minimal. Why?", "begin": 5400.978, "end": 5455.738, "localBegin": 98.8, "localEnd": 153.56}, {"id": "c003_f000007", "text": "Tort law is insipid to those who don't have the temperament that takes one to law school. For, prompted by the fearless Ralph Nader, a coffee table in my study accumulated close to twenty volumes on contract law and torts. But I found the topic so dull that it was a Herculean task for me to read more than seven lines per sitting (which is the reason God mercifully invented social media and Twitter fights): unlike science and mathematics, law, while being very rigorous, doesn't offer surprises. Law cannot be playful. The mere sight of these books reminds me of a lunch with a former member of the Federal Reserve Board, the kind of thing to which one should never be subjected more than once per lifetime. So I will dispatch the topic of torts in a few lines.", "begin": 5455.738, "end": 5500.618, "localBegin": 153.56, "localEnd": 198.44}, {"id": "c003_f000008", "text": "As we intimated in the first paragraphs of the introduction, some nonsoporific topics (pagan theology, religious practices, complexity theory, ancient and medieval history, and, of course, probability and risk taking) match this author's naturalistic filter. Simply: if you can't put your soul into something, give it up and leave that stuff to someone else.", "begin": 5500.618, "end": 5521.498, "localBegin": 198.44, "localEnd": 219.32}, {"id": "c003_f000009", "text": "Talking about soul in the game, I had to overcome some shame as follows. In the Paris episode of Hammurabi at the Louvre, when I stood in front of the imposing basalt stele (in the room with Koreans with selfie sticks), I felt uneasy not being able to read the stuff and having to rely on experts. What experts? This would have been fine if it was a cultural journey, but here I am professionally writing a book going very deep into that stuff! It felt like cheating not knowing the ancient text the way it was read and recited at the time. In addition, one of my episodic hobbies is Semitic philology, so I had no excuse. So I have been distracted by an obsession to learn enough Akkadian in order to recite Hammurabi's law with Semitic phonetics, sort of having some soul in the game. It may have delayed the completion of this book, but, at least, when I mention Hammurabi, my conscience doesn't make me feel I am faking anything.", "begin": 5521.498, "end": 5580.578, "localBegin": 219.32, "localEnd": 278.4}, {"id": "c003_f000010", "text": "AN ENHANCED DETECTOR", "begin": 5580.578, "end": 5584.098, "localBegin": 278.4, "localEnd": 281.92}, {"id": "c003_f000011", "text": "This book came after a deep - nonacademic - unplanned flirtation with mathematics. For after finishing Antifragile, I thought of retiring my pen for a while and settling into the comfortable life of a quarter university position, enjoying squid-ink pasta in bon vivant company, lifting weights with my blue-collar friends, and playing bridge in the afternoon, the kind of tranquil, worry-free life of the nineteenth-century gentry.", "begin": 5584.098, "end": 5610.778, "localBegin": 281.92, "localEnd": 308.6}, {"id": "c003_f000012", "text": "What I didn't forecast is that my dream of a tranquil life lasted only a few weeks. For I exhibited no skills whatsoever in retirement activities such as contract bridge, chess, lotto, visits to the pyramids in Mexico, etc. I once, by happenstance, tried to solve a mathematical brain teaser, and it lead to five years of compulsive, time-invasive mathematical practice, with the obsessive bouts that plague people inhabited with problems. As usual with these things, I didn't do mathematics to solve a problem, just to satisfy a fixation. But I never expected the following effect. It made my bull***t detector so sensitive that listening to well-marketed nonsense (by verbalistic people, especially academics) had the same effect as being put in a room with instances of randomly occurring piercing and jarring sounds, the type that kill animals. I am never bothered by normal people; it is the bull***tter in the \"intellectual\" profession who bothers me. Seeing the psychologist Steven Pinker making pronouncements about things intellectual has a similar effect to encountering a drive-in Burger King while hiking in the middle of a national park.", "begin": 5610.778, "end": 5683.698, "localBegin": 308.6, "localEnd": 381.52}, {"id": "c003_f000013", "text": "It is under such an oversensitive bull***t detector that I have been writing this book.", "begin": 5683.698, "end": 5691.378, "localBegin": 381.52, "localEnd": 389.2}, {"id": "c003_f000014", "text": "THE BOOK REVIEWERS", "begin": 5691.378, "end": 5694.538, "localBegin": 389.2, "localEnd": 392.36}, {"id": "c003_f000015", "text": "And since we are talking about books, I close this introductory section with that one thing I've learned from my time in that business. Many book reviewers are intellectually honest and straightforward people, but the industry has a fundamental conflict with the public, even while appointing itself as representative of the general class of readers. For instance, when it comes to books written by risk takers, the general public (and some, but very few, book editors) can detect what is interesting to them in a certain account, something those in the fake space of word production (in other words, nondoers) chronically fail to get - and they cannot understand what it is that they don't understand because they are not really part of active and transactional life.", "begin": 5694.538, "end": 5740.658, "localBegin": 392.36, "localEnd": 438.48}, {"id": "c003_f000016", "text": "Nor can book reviewers - by the very definition of their function - judge books that one rereads. For those familiar with the idea of nonlinear effects from Antifragile, learning is rooted in repetition and convexity, meaning that the reading of a single text twice is more profitable than reading two different things once, provided of course that said text has some depth of content. The convexity is implanted in Semitic vocabulary: mishnah, which in Hebrew refers to the pre-Talmudic compilation of oral tradition, means \"doubling\"; midrash itself may also be related to stamping and repeated grinding, and has a counterpart in the madrassa of the children of Ishmael.", "begin": 5740.658, "end": 5783.978, "localBegin": 438.48, "localEnd": 481.8}, {"id": "c003_f000017", "text": "Books should be organized the way the reader reads, or wants to read, and according to how deep the author wants to go into a topic, not to make life easy for the critics to write reviews. Book reviewers are bad middlemen; they are currently in the process of being disintermediated just like taxi companies (what some call Uberized).", "begin": 5783.978, "end": 5806.178, "localBegin": 481.8, "localEnd": 504.0}, {"id": "c003_f000018", "text": "How? There is, here again, a skin-in-the-game problem: a conflict of interest between professional reviewers who think they ought to decide how books should be written, and genuine readers who actually read books because they like to read books. For one, reviewers command an unchecked and arbitrary power over authors: someone has to have read the book to notice that a reviewer is full of baloney, so in the absence of skin in the game, reviewers such as Michiko Kakutani of TheNew York Times (now retired) or David Runciman, who writes for The Guardian, can go on forever without anyone knowing they are either fabricating or drunk (or, as I am certain, in the case of Kakutani, both). Book reviews are judged according to how plausible and well written they are, never in how they map to the book (unless of course the author makes them accountable for misrepresentations).", "begin": 5806.178, "end": 5868.698, "localBegin": 504.0, "localEnd": 566.52}, {"id": "c003_f000019", "text": "Now, almost two decades after the first installment of the Incerto, I have established ways to interact directly with you, the reader.", "begin": 5868.698, "end": 5886.218, "localBegin": 566.52, "localEnd": 584.04}, {"id": "c003_f000020", "text": "ORGANIZATION OF THE BOOK", "begin": 5886.218, "end": 5889.538, "localBegin": 584.04, "localEnd": 587.36}, {"id": "c003_f000021", "text": "Book 1 was the introduction we just saw, with its three parts.", "begin": 5889.538, "end": 5894.498, "localBegin": 587.36, "localEnd": 592.32}, {"id": "c003_f000022", "text": "Book 2, \"A First Look at Agency,\" is a deeper exposition of symmetry and agency in risk sharing, bridging commercial conflict of interest with general ethics. It also introduces us briefly to the notion of scaling and the difference between individual and collective, hence the limitations of globalism and universalism.", "begin": 5894.498, "end": 5915.098, "localBegin": 592.32, "localEnd": 612.92}, {"id": "c003_f000023", "text": "Book 3, \"That Greatest Asymmetry,\" is about the minority rule by which a small segment of the population inflicts its preferences on the general population. The (short) appendix for Book 3 shows 1) how a collection of units doesn't behave like a sum of units, but something with a mind of its own, and 2) the consequences of much of something called social \"science.\"", "begin": 5915.098, "end": 5939.738, "localBegin": 612.92, "localEnd": 637.56}, {"id": "c003_f000024", "text": "Book 4, \"Wolves Among Dogs,\" deals with dependence and, let's call a spade a spade, slavery in modern life: why employees exist because they have much more to lose than contractors. It also shows how, even if you are independent and have f*** you money, you are vulnerable if people you care about can be targeted by evil corporations and groups.", "begin": 5939.738, "end": 5963.498, "localBegin": 637.56, "localEnd": 661.32}, {"id": "c003_f000025", "text": "Book 5, \"Being Alive Means Taking Certain Risks,\" shows in Chapter 5 how risk taking makes you look superficially less attractive, but vastly more convincing. It clarifies the difference between life as real life and life as imagined in an experience machine, how Jesus had to be man, not quite god, and how Donaldo won the election thanks to his imperfections. Chapter 6, \"The Intellectual Yet Idiot,\" presents the IYI who doesn't know that having skin in the game makes you understand the world (which includes bicycle riding) better than lectures. Chapter 7 explains the difference between inequality in risk and inequality in salary: you can be richer, but then you should be a real person and take some risk. It also presents a dynamic view of inequality, as opposed to the IYI static one. The most egregious contributor to inequality is the condition of a high-ranking civil servant or tenured academic, not that of an entrepreneur. Chapter 8 explains the Lindy effect, that expert of experts who can tell us why plumbers are experts, but not clinical psychologists, why The New Yorker commentators on experts are not themselves experts. The Lindy effect separates things that gain from time from those that are destroyed by it.", "begin": 5963.498, "end": 6044.978, "localBegin": 661.32, "localEnd": 742.8}, {"id": "c003_f000026", "text": "Book 6, \"Deeper into Agency,\" looks for consequential hidden asymmetries. Chapter 9 shows that, viewed from the standpoint of practice, the world is simpler and solid experts don't look like actors playing the part. The chapter presents BS detection heuristics. Chapter 10 shows how rich people are suckers who fall prey to people complicating their lifestyle to sell them something. Chapter 11 explains the difference between threats and real threats and shows how you can own an enemy by not killing him. Chapter 12 presents the agency problem of journalists: they will sacrifice truth and build a wrong narrative because of the necessity to please other journalists. Chapter 13 explains why virtue requires risk taking, not the reputational risk reduction of playing white knight on the Internet or writing a check to some nongovernmental organization (NGO) who might help destroy the world. Chapter 14 explains the agency problem of people in geopolitics, and historians who tend to report on wars rather than peace, leaving us with a deformed view of the past. History is also plagued with probabilistic confusions. If we got rid of \"peace\" experts, the world would be safer and many problems would be solved organically.", "begin": 6044.978, "end": 6125.778, "localBegin": 742.8, "localEnd": 823.6}, {"id": "c003_f000027", "text": "Book 7, \"Religion, Belief, and Skin in the Game,\" explains creeds in terms of skin in the game and revealed preferences: how atheists are functionally indistinguishable from Christians, though not Salafi Muslims. Avoid the verbalistic: \"religions\" are not quite religions: some are philosophies, others are just legal systems.", "begin": 6125.778, "end": 6147.898, "localBegin": 823.6, "localEnd": 845.72}, {"id": "c003_f000028", "text": "Book 8, \"Risk and Rationality,\" has the two central chapters, which I elected to leave for the end. There is no rigorous definition of rationality that is not related to skin in the game; it is all about actions, not verbs, thoughts, and tawk. Chapter 19, \"The Logic of Risk Taking,\" summarizes all my tenets about risk and exposes the errors concerning small-probability events. It also classifies risks in layers (from the individual to the collective) and manages to prove that courage and prudence are not in contradiction provided one is acting for the benefit of the collective. It explains ergodicity, which was left hanging. Finally, the chapter outlines what we call the precautionary principle.", "begin": 6147.898, "end": 6196.138, "localBegin": 845.72, "localEnd": 893.96}, {"id": "c003_f000029", "text": "Appendix: Asymmetries in Life and Things", "begin": 6196.138, "end": 6199.578, "localBegin": 893.96, "localEnd": 897.4}, {"id": "c003_f000030", "text": "Table 2 • Asymmetries in Society Where we left off in Antifragile No Skin in the Game Skin in the Game Skin in the Game", "begin": 6199.578, "end": 6212.018, "localBegin": 897.4, "localEnd": 909.84}, {"id": "c003_f000031", "text": "Book 2 A First Look at Agency", "begin": 6212.018, "end": 6214.658, "localBegin": 909.84, "localEnd": 912.48}, {"id": "c003_f000032", "text": "Chapter 1 Why Each One Should Eat His Own Turtles: Equality in Uncertainty", "begin": 6214.658, "end": 6225.258, "localBegin": 912.48, "localEnd": 923.08}, {"id": "c003_f000033", "text": "Taste of turtle - Where are the new customers? - Sharia and asymmetry - There are the Swiss, and other people - Rav Safra and the Swiss (but different Swiss)", "begin": 6225.258, "end": 6238.098, "localBegin": 923.08, "localEnd": 935.92}, {"id": "c003_f000034", "text": "You who caught the turtles better eat them, goes the ancient adage.", "begin": 6238.098, "end": 6245.258, "localBegin": 935.92, "localEnd": 943.08}, {"id": "c003_f000035", "text": "The origin of the expression is as follows. It was said that a group of fishermen caught a large number of turtles. After cooking them, they found out at the communal meal that these sea animals were much less edible than they thought: not many members of the group were willing to eat them. But Mercury happened to be passing by - Mercury was the most multitasking, sort of put-together god, as he was the boss of commerce, abundance, messengers, the underworld, as well as the patron of thieves and brigands and, not surprisingly, luck. The group invited him to join them and offered him the turtles to eat. Detecting that he was only invited to relieve them of the unwanted food, he forced them all to eat the turtles, thus establishing the principle that you need to eat what you feed others.", "begin": 6245.258, "end": 6326.938, "localBegin": 943.08, "localEnd": 1024.76}, {"id": "c003_f000036", "text": "A CUSTOMER IS BORN EVERY DAY", "begin": 6326.938, "end": 6333.858, "localBegin": 1024.76, "localEnd": 1031.68}, {"id": "c003_f000037", "text": "I have learned a lesson from my own naive experiences:", "begin": 6333.858, "end": 6336.258, "localBegin": 1031.68, "localEnd": 1034.08}, {"id": "c003_f000038", "text": "Beware of the person who gives advice, telling you that a certain action on your part is \"good for you\" while it is also good for him, while the harm to you doesn't directly affect him.", "begin": 6336.258, "end": 6358.098, "localBegin": 1034.08, "localEnd": 1055.92}, {"id": "c003_f000039", "text": "Of course such advice is usually unsolicited. The asymmetry is when said advice applies to you but not to him - he may be selling you something, or trying to get you to marry his daughter or hire his son-in-law.", "begin": 6358.098, "end": 6379.818, "localBegin": 1055.92, "localEnd": 1077.64}, {"id": "c003_f000040", "text": "Years ago I received a letter from a lecture agent. His letter was clear; it had about ten questions of the type \"Do you have the time to field requests?,\" \"Can you handle the organization of the trip?\" The gist of it was that a lecture agent would make my life better and make room for the pursuit of knowledge or whatever else I was about (a deeper understanding of gardening, stamp collections, Mediterranean genetics, or squid-ink recipes) while the burden of the gritty would fall on someone else. And it wasn't any lecture agent: only he could do all these things; he reads books and can get in the mind of intellectuals (at the time I didn't feel insulted by being called an intellectual). As is typical with people who volunteer unsolicited advice, I smelled a rat: at no phase in the discussion did he refrain from letting me know that it was \"good for me.\"", "begin": 6379.818, "end": 6463.058, "localBegin": 1077.64, "localEnd": 1160.88}, {"id": "c003_f000041", "text": "As a sucker, while I didn't buy into the argument, I ended up doing business with him, letting him handle a booking in the foreign country where he was based. Things went fine until, six years later, I received a letter from the tax authorities of that country. I immediately contacted him to wonder if similar U.S. citizens he had hired incurred such tax conflict, or if he had heard of similar situations. His reply was immediate and curt: \"I am not your tax attorney\" - volunteering no information as to whether other U.S. customers who hired him because it was \"good for them\" encountered such a problem.", "begin": 6463.058, "end": 6510.938, "localBegin": 1160.88, "localEnd": 1208.76}, {"id": "c003_f000042", "text": "Indeed, in the dozen or so cases I can pull from memory, it always turns out that what is presented as good for you is not really good for you but certainly good for the other party. As a trader, you learn to identify and deal with upright people, those who inform you that they have something to sell, by explaining that the transaction arises for their own benefit, with such questions as \"Do you have an ax?\" (meaning an inquiry whether you have a certain interest). Avoid at all costs those who call you to tout a certain product disguised with advice. In fact the story of the turtle is the archetype of the history of transactions between mortals.", "begin": 6510.938, "end": 6564.698, "localBegin": 1208.76, "localEnd": 1262.52}, {"id": "c003_f000043", "text": "I worked once for a U.S. investment bank, one of the prestigious variety, called \"white shoe\" because the partners were members of hard-to-join golf clubs for proto-aristocrats where they played the game wearing white footwear. As with all such firms, an image of ethics and professionalism was cultivated, emphasized, and protected. But the job of the salespeople (actually, salesmen) on days when they wore black shoes was to \"unload\" inventory with which traders were \"stuffed,\" that is, securities they had in excess in their books and needed to get rid of to lower their risk profile. Selling to other dealers was out of the question as professional traders, typically non-golfers, would smell excess inventory and cause the price to drop. So they needed to sell to some client, on what is called the \"buy side.\" Some traders paid the sales force with (percentage) \"points,\" a variable compensation that increased with our eagerness to part with securities. Salesmen took clients out to dinner, bought them expensive wine (often, ostensibly the highest on the menu), and got a huge return on the thousands of dollars of restaurant bills by unloading the unwanted stuff on them. One expert salesman candidly explained to me: \"If I buy the client, someone working for the finance department of a municipality who buys his suits at some department store in New Jersey, a bottle of $2,000 wine, I own him for the next few months. I can get at least $100,000 profits out of him. Nothing in the mahket gives you such return.\"", "begin": 6564.698, "end": 6697.058, "localBegin": 1262.52, "localEnd": 1394.88}, {"id": "c003_f000044", "text": "Salesmen hawked how a given security would be perfect for the client's portfolio, how they were certain it would rise in price and how the client would suffer great regret if he missed \"such an opportunity\" - that type of discourse. Salespeople are experts in the art of psychological manipulation, making the client trade, often against his own interest, all the while being happy about it and loving them and their company. One of the top salesmen at the firm, a man with huge charisma who came to work in a chauffeured Rolls Royce, was once asked whether customers didn't get upset when they got the short end of the stick. \"Rip them off, don't tick them off\" was his answer. He also added, \"Remember that every day a new customer is born.\"", "begin": 6697.058, "end": 6754.418, "localBegin": 1394.88, "localEnd": 1452.24}, {"id": "c003_f000045", "text": "As the Romans were fully aware, one lauds merrily the merchandise to get rid of it.", "begin": 6754.418, "end": 6759.698, "localBegin": 1452.24, "localEnd": 1457.52}, {"id": "c003_f000046", "text": "THE PRICE OF CORN IN RHODES", "begin": 6759.698, "end": 6761.458, "localBegin": 1457.52, "localEnd": 1459.28}, {"id": "c003_f000047", "text": "So, \"giving advice\" as a sales pitch is fundamentally unethical - selling cannot be deemed advice. We can safely settle on that. You can give advice, or you can sell (by advertising the quality of the product), and the two need to be kept separate.", "begin": 6761.458, "end": 6783.778, "localBegin": 1459.28, "localEnd": 1481.6}, {"id": "c003_f000048", "text": "But there is an associated problem in the course of the transactions: how much should the seller reveal to the buyer?", "begin": 6783.778, "end": 6796.178, "localBegin": 1481.6, "localEnd": 1494.0}, {"id": "c003_f000049", "text": "The question \"Is it ethical to sell something to someone knowing the price will eventually drop?\" is an ancient one - but its solution is no less straightforward. The debate goes back to a disagreement between two stoic philosophers, Diogenes of Babylon and his student Antipater of Tarsus, who took the higher moral ground on asymmetric information and seems to match the ethics endorsed by this author. Not a piece from both authors is extant, but we know quite a bit from secondary sources, or, in the case of Cicero, tertiary. The question was presented as follows, retailed by Cicero in De Officiis. Assume a man brought a large shipment of corn from Alexandria to Rhodes, at a time when corn was expensive in Rhodes because of shortage and famine. Suppose that he also knew that many boats had set sail from Alexandria on their way to Rhodes with similar merchandise. Does he have to inform the Rhodians? How can one act honorably or dishonorably in these circumstances?", "begin": 6796.178, "end": 6886.098, "localBegin": 1494.0, "localEnd": 1583.92}, {"id": "c003_f000050", "text": "We traders had a straightforward answer. Again, \"stuffing\" - selling quantities to people without informing them that there are large inventories waiting to be sold. An upright trader will not do that to other professional traders; it was a no-no. The penalty was ostracism. But it was sort of permissible to do it to the anonymous market and the faceless nontraders, or those we called \"the Swiss,\" some random suckers far away. There were people with whom we had a relational rapport, others with whom we had a transactional one. The two were separated by an ethical wall, much like the case with domestic animals that cannot be harmed, while rules on cruelty are lifted when it comes to cockroaches.", "begin": 6886.098, "end": 6935.058, "localBegin": 1583.92, "localEnd": 1632.88}, {"id": "c003_f000051", "text": "Diogenes held that the seller ought to disclose as much as civil law requires. As for Antipater, he believed that everything ought to be disclosed - beyond the law - so that there was nothing that the seller knew that the buyer didn't know.", "begin": 6935.058, "end": 6948.258, "localBegin": 1632.88, "localEnd": 1646.08}, {"id": "c003_f000052", "text": "Clearly Antipater's position is more robust - robust being invariant to time, place, situation, and color of the eyes of the participants. Take for now that", "begin": 6948.258, "end": 6960.658, "localBegin": 1646.08, "localEnd": 1658.48}, {"id": "c003_f000053", "text": "The ethical is always more robust than the legal. Over time, it is the legal that should converge to the ethical, never the reverse.", "begin": 6960.658, "end": 6970.858, "localBegin": 1658.48, "localEnd": 1668.68}, {"id": "c003_f000054", "text": "Hence:", "begin": 6970.858, "end": 6971.698, "localBegin": 1668.68, "localEnd": 1669.52}, {"id": "c003_f000055", "text": "Laws come and go; ethics stay.", "begin": 6971.698, "end": 6974.378, "localBegin": 1669.52, "localEnd": 1672.2}, {"id": "c003_f000056", "text": "For the notion of \"law\" is ambiguous and highly jurisdiction dependent: in the U.S., civil law, thanks to consumer advocates and similar movements, integrates such disclosures, while other countries have different laws. This is particularly visible with securities laws, as there are \"front running\" regulations and those concerning insider information that make such disclosure mandatory in the U.S., though this wasn't so for a long time in Europe.", "begin": 6974.378, "end": 7003.458, "localBegin": 1672.2, "localEnd": 1701.28}, {"id": "c003_f000057", "text": "Indeed much of the work of investment banks in my day was to play on regulations, find loopholes in the laws. And, counterintuitively, the more regulations, the easier it was to make money.", "begin": 7003.458, "end": 7018.538, "localBegin": 1701.28, "localEnd": 1716.36}, {"id": "c003_f000058", "text": "EQUALITY IN UNCERTAINTY", "begin": 7018.538, "end": 7022.258, "localBegin": 1716.36, "localEnd": 1720.08}, {"id": "c003_f000059", "text": "Which brings us to asymmetry, the core concept behind skin in the game. The question becomes: to what extent can people in a transaction have an informational differential between them? The ancient Mediterranean and, to some extent, the modern world, seem to have converged to Antipater's position. While we have \"buyer beware\" (caveat emptor) in the Anglo-Saxon West, the idea is rather new, and never general, often mitigated by lemon laws. (A \"lemon\" was originally a chronically defective car, say, my convertible Mini, in love with the garage, now generalized to apply to anything that moves).", "begin": 7022.258, "end": 7060.978, "localBegin": 1720.08, "localEnd": 1758.8}, {"id": "c003_f000060", "text": "So, to the question voiced by Cicero in the debate between the two ancient stoics, \"If a man knowingly offers for sale wine that is spoiling, ought he to tell his customers?,\" the world is getting closer to the position of transparency, not necessarily via regulations as much as thanks to tort laws, and one's ability to sue for harm in the event a seller deceives him or her. Recall that tort laws put some of the seller's skin back into the game - which is why they are reviled, hated by corporations. But tort laws have side effects - they should only be used in a nonnaive way, that is, in a way that cannot be gamed. As we will see in the discussion of the visit to the doctor, they will be gamed.", "begin": 7060.978, "end": 7105.538, "localBegin": 1758.8, "localEnd": 1803.36}, {"id": "c003_f000061", "text": "Sharia, in particular the law regulating Islamic transactions and finance, is of interest to us insofar as it preserves some of the lost Mediterranean and Babylonian methods and practices - not to prop up the ego of Saudi princes. It exists at the intersection of Greco-Roman law (as reflected from people in Semitic territories' contact with the school of law of Berytus), Phoenician trading rules, Babylonian legislations, and Arab tribal commercial customs and, as such, it provides a repository of ancient Mediterranean and Semitic lore. I hence view Sharia as a museum of the history of ideas on symmetry in transactions. Sharia establishes the interdict of gharar, drastic enough to be totally banned in any form of transaction. It is an extremely sophisticated term in decision theory that does not exist in English; it means both uncertainty and deception - my personal take is that it means something beyond informational asymmetry between agents: inequality of uncertainty. Simply, as the aim is for both parties in a transaction to have the same uncertainty facing random outcomes, an asymmetry becomes equivalent to theft. Or more robustly:", "begin": 7105.538, "end": 7181.218, "localBegin": 1803.36, "localEnd": 1879.04}, {"id": "c003_f000062", "text": "No person in a transaction should have certainty about the outcome while the other one has uncertainty.", "begin": 7181.218, "end": 7188.978, "localBegin": 1879.04, "localEnd": 1886.8}, {"id": "c003_f000063", "text": "Gharar, like every legalistic construct, will have its flaws; it remains weaker than Antipater's approach. If only one party in a transaction has certainty all the way through, it is a violation of Sharia. But if there is a weak form of asymmetry, say, someone has inside information which gives an edge in the markets, there is no gharar as there remains enough uncertainty for both parties, given that the price is in the future and only God knows the future. Selling a defective product (where there is certainty as to the defect), on the other hand, is illegal. So the knowledge by the seller of corn in Rhodes in my first example does not fall under gharar, while the second case, that of a defective liquid, would.", "begin": 7188.978, "end": 7234.818, "localBegin": 1886.8, "localEnd": 1932.64}, {"id": "c003_f000064", "text": "As we see, the problem of asymmetry is so complicated that different schools give different ethical solutions, so let us look at the Talmudic approach.", "begin": 7234.818, "end": 7247.098, "localBegin": 1932.64, "localEnd": 1944.92}, {"id": "c003_f000065", "text": "RAV SAFRA AND THE SWISS", "begin": 7247.098, "end": 7249.058, "localBegin": 1944.92, "localEnd": 1946.88}, {"id": "c003_f000066", "text": "Jewish ethics on the matter is closer to Antipater than Diogenes in its aims at transparency. Not only should there be transparency concerning the merchandise, but perhaps there has to be transparency concerning what the seller has in mind, what he thinks deep down. The medieval rabbi Shlomo Yitzhaki (aka Salomon Isaacides), known as \"Rashi,\" relates the following story. Rav Safra, a third-century Babylonian scholar who was also an active trader, was offering some goods for sale. A buyer came as he was praying in silence, tried to purchase the merchandise at an initial price, and given that the rabbi did not reply, raised the price. But Rav Safra had no intention of selling at a higher price than the initial offer, and felt that he had to honor the initial intention. Now the question: Is Rav Safra obligated to sell at the initial price, or should he take the improved one?", "begin": 7249.058, "end": 7309.098, "localBegin": 1946.88, "localEnd": 2006.92}, {"id": "c003_f000067", "text": "Such total transparency is not absurd and not uncommon in what seems to be a cutthroat world of transactions, my former world of trading. I have frequently faced that problem as a trader and will side in favor of Rav Safra's action in the debate. Let us follow the logic. Recall the rapacity of salespeople earlier in the chapter. Sometimes I would offer something for sale for, say, $5, but communicated with the client through a salesperson, and the salesperson would come back with an \"improvement,\" of $5.10. Something never felt right about the extra ten cents. It was, simply, not a sustainable way of doing business. What if the customer subsequently discovered that my initial offer was $5? No compensation is worth the feeling of shame. The overcharge falls in the same category as the act of \"stuffing\" people with bad merchandise. Now, to apply this to Rav Safra's story, what if he sold to one client at the marked-up price, and to another one the exact same item for the initial price, and the two buyers happened to know one another? What if they were agents for the same customer?", "begin": 7309.098, "end": 7380.138, "localBegin": 2006.92, "localEnd": 2077.96}, {"id": "c003_f000068", "text": "It may not be ethically required, but the most effective, shame-free policy is maximal transparency, even transparency of intentions.", "begin": 7380.138, "end": 7390.818, "localBegin": 2077.96, "localEnd": 2088.64}, {"id": "c003_f000069", "text": "However, the story doesn't tell us whether the purchaser was a \"Swiss,\" those outsiders our ethical rules don't apply to. I suspect that there would be a species for which our ethical rules would be relaxed or possibly lifted. Recall our discussion of Kant: theory is too theoretical for humans. The more confined our ethics, the less abstract, the better it works. Otherwise, as we will see with Elinor Ostrom's result later in this chapter, the system cannot function properly. And, before Ostrom, our old friend Friedrich Nietzsche got the point:", "begin": 7390.818, "end": 7425.418, "localBegin": 2088.64, "localEnd": 2123.24}, {"id": "c003_f000070", "text": "Sympathy for all would be tyranny for thee, my good neighbor.", "begin": 7425.418, "end": 7430.138, "localBegin": 2123.24, "localEnd": 2127.96}, {"id": "c003_f000071", "text": "Nietzsche, by the way, is the one person Fat Tony (upon hearing his quotes) said he would never debate.", "begin": 7430.138, "end": 7439.538, "localBegin": 2127.96, "localEnd": 2137.36}, {"id": "c003_f000072", "text": "MEMBERS AND NON-MEMBERS", "begin": 7439.538, "end": 7443.298, "localBegin": 2137.36, "localEnd": 2141.12}, {"id": "c003_f000073", "text": "For the exclusion of the \"Swiss\" from our ethical realm is not trivial. Things don't \"scale\" and generalize, which is why I have trouble with intellectuals talking about abstract notions. A country is not a large city, a city is not a large family, and, sorry, the world is not a large village. There are scale transformations we will discuss here, and in the appendix of Book 3.", "begin": 7443.298, "end": 7468.178, "localBegin": 2141.12, "localEnd": 2166.0}, {"id": "c003_f000074", "text": "When Athenians treat all opinions equally and discuss \"democracy,\" they only apply it to their citizens, not slaves or metics (the equivalent of green card or H-1B visa holders). Effectively, Theodosius's code deprived Roman citizens who married \"barbarians\" of their legal rights - hence ethical parity with others. They lost their club membership. As to Jewish ethics: it distinguishes between thick blood and thin blood: we are all brothers, but some are more brothers than others.", "begin": 7468.178, "end": 7499.378, "localBegin": 2166.0, "localEnd": 2197.2}, {"id": "c003_f000075", "text": "Free citizens, in ancient and post-classical societies, were traditionally part of clubs, with rules and member behavior similar to those in today's country clubs, with an inside and an outside. As club members know, the very purpose of a club is exclusion and size limitation. Spartans could hunt and kill Helots, those noncitizens with a status of slaves, for training, but they were otherwise equal to other Spartans and expected to die for the sake of Sparta. The large cities in the pre-Christian ancient world, particularly in the Levant and Asia Minor, were full of fraternities and clubs, open and (often) secret societies - there was even such a thing as funeral clubs, where members shared the costs, and participated in the ceremonials, of funerals.", "begin": 7499.378, "end": 7547.458, "localBegin": 2197.2, "localEnd": 2245.28}, {"id": "c003_f000076", "text": "Today's Roma people (aka Gypsies) have tons of strict rules of behavior toward Gypsies, and others toward the unclean non-Gypsies called payos. And, as the anthropologist David Graeber has observed, even the investment bank Goldman Sachs, known for its aggressive cupidity, acts like a communist community from within, thanks to the partnership system of governance.", "begin": 7547.458, "end": 7573.978, "localBegin": 2245.28, "localEnd": 2271.8}, {"id": "c003_f000077", "text": "So we exercise our ethical rules, but there is a limit - from scaling - beyond which the rules cease to apply. It is unfortunate, but the general kills the particular. The question we will reexamine later, after deeper discussion of complexity theory, is whether it is possible to be both ethical and universalist. In theory, yes, but, sadly, not in practice. For whenever the \"we\" becomes too large a club, things degrade, and each one starts fighting for his own interest. The abstract is way too abstract for us. This is the main reason I advocate political systems that start with the municipality, and work their way up (ironically, as in Switzerland, those \"Swiss\"), rather than the reverse, which has failed with larger states. Being somewhat tribal is not a bad thing - and we have to work in a fractal way in the organized harmonious relations between tribes, rather than merge all tribes in one large soup. In that sense, an American-style federalism is the ideal system.", "begin": 7573.978, "end": 7638.858, "localBegin": 2271.8, "localEnd": 2336.68}, {"id": "c003_f000078", "text": "This scale transformation from the particular to the general is behind my skepticism about unfettered globalization and large centralized multiethnic states. The physicist and complexity researcher Yaneer Bar-Yam showed quite convincingly that \"better fences make better neighbors\" - something both \"policymakers\" and local governments fail to get about the Near East. Scaling matters, I will keep repeating until I get hoarse. Putting Shiites, Christians, and Sunnis in one pot and asking them to sing \"Kumbaya\" around the campfire while holding hands in the name of unity and fraternity of mankind has failed. (Interventionistas aren't yet aware that \"should\" is not a sufficiently empirically valid statement to \"build nations.\") Blaming people for being \"sectarian\" - instead of making the best of such a natural tendency - is one of the stupidities of interventionistas. Separate tribes for administrative purposes (as the Ottomans did), or just put some markers somewhere, and they suddenly become friendly to one another. The Levant has suffered (and keeps suffering) from Western (usually Anglo-Saxon) Arabists enamored with their subject, with no skin in the game in the place, who somehow have a vicious mission to destroy local indigenous cultures and languages, and separate the Levant from its Mediterranean roots.", "begin": 7638.858, "end": 7745.578, "localBegin": 2336.68, "localEnd": 2443.4}, {"id": "c003_f000079", "text": "But we don't have to go very far to get the importance of scaling. You know instinctively that people get along better as neighbors than roommates.", "begin": 7745.578, "end": 7772.618, "localBegin": 2443.4, "localEnd": 2470.44}, {"id": "c003_f000080", "text": "When you think about this, it is obvious, even trite, from the well-known behavior of crowds in the \"anonymity\" of big cities compared to groups in small villages. I spend some time in my ancestral village, where it feels like a family. People attend others' funerals (funeral clubs were mostly for large cities), help out, and care about the neighbor, even if they hate his dog. There is no way you can get the same cohesion in a larger city when the \"other\" is a theoretical entity, and our behavior toward him or her is governed by some general ethical rule, not someone in flesh and blood. We get it easily when seen that way, but fail to generalize that ethics is something fundamentally local.", "begin": 7772.618, "end": 7843.178, "localBegin": 2470.44, "localEnd": 2541.0}, {"id": "c003_f000081", "text": "Now what's the reason? Modernity put it in our heads that there are two units: the individual and the universal collective - in that sense, skin in the game for you would be just for you, as a unit. In reality, my skin lies in a broader set of people, one that includes a family, a community, a tribe, a fraternity. But it cannot possibly be the universal.", "begin": 7843.178, "end": 7866.138, "localBegin": 2541.0, "localEnd": 2563.96}, {"id": "c003_f000082", "text": "NON MIHI NON TIBI, SED NOBIS (NEITHER MINE NOR YOURS, BUT OURS)", "begin": 7866.138, "end": 7877.298, "localBegin": 2563.96, "localEnd": 2575.12}, {"id": "c003_f000083", "text": "Let us get into the gut of Ostrom's idea. The \"tragedy of the commons,\" as exposed by economists, is as follows - the commons being a collective property, say, a forest or fishing waters or your local public park. Collectively, farmers as a community prefer to avoid overgrazing, and fishermen overfishing - the entire resource becomes thus degraded. But every single individual farmer would personally gain from his own overgrazing or overfishing under, of course, the condition that others don't. And that is what plagues socialism: people's individual interests do not quite work well under collectivism. But it is a critical mistake to think that people can function only under a private property system.", "begin": 7877.298, "end": 7924.498, "localBegin": 2575.12, "localEnd": 2622.32}, {"id": "c003_f000084", "text": "What Ostrom found empirically is that there exists a certain community size below which people act as collectivists, protecting the commons, as if the entire unit became rational. Such a commons cannot be too large. It is like a club. Groups behave differently at a different scale. This explains why the municipal is different from the national. It also explains how tribes operate: you are part of a specific group that is larger than the narrow you, but narrower than humanity in general. Critically, people share some things but not others within a specified group. And there is a protocol for dealing with the outside. Arab pastoral tribes have firm rules of hospitality toward nonhostile strangers who don't threaten their commons, but get violent when the stranger is a threat.", "begin": 7924.498, "end": 7972.018, "localBegin": 2622.32, "localEnd": 2669.84}, {"id": "c003_f000085", "text": "The skin-in-the-game definition of a commons: a space in which you are treated by others the way you treat them, where everyone exercises the Silver Rule.", "begin": 7972.018, "end": 7983.938, "localBegin": 2669.84, "localEnd": 2681.76}, {"id": "c003_f000086", "text": "The \"public good\" is something abstract, taken out of a textbook. We will see further in Chapter 19 that the \"individual\" is an ill-defined entity. \"Me\" is more likely to be a group than a single person.", "begin": 7983.938, "end": 8000.138, "localBegin": 2681.76, "localEnd": 2697.96}, {"id": "c003_f000087", "text": "ARE YOU ON THE DIAGONAL?", "begin": 8000.138, "end": 8003.498, "localBegin": 2697.96, "localEnd": 2701.32}, {"id": "c003_f000088", "text": "A saying by the brothers Geoff and Vince Graham summarizes the ludicrousness of scale-free political universalism.", "begin": 8003.498, "end": 8011.138, "localBegin": 2701.32, "localEnd": 2708.96}, {"id": "c003_f000089", "text": "I am, at the Fed level, libertarian;", "begin": 8011.138, "end": 8014.218, "localBegin": 2708.96, "localEnd": 2712.04}, {"id": "c003_f000090", "text": "at the state level, Republican;", "begin": 8014.218, "end": 8016.498, "localBegin": 2712.04, "localEnd": 2714.32}, {"id": "c003_f000091", "text": "at the local level, Democrat;", "begin": 8016.498, "end": 8018.738, "localBegin": 2714.32, "localEnd": 2716.56}, {"id": "c003_f000092", "text": "and at the family and friends level, a socialist.", "begin": 8018.738, "end": 8022.738, "localBegin": 2716.56, "localEnd": 2720.56}, {"id": "c003_f000093", "text": "If that saying doesn't convince you of the fatuousness of left vs. right labels, nothing will.", "begin": 8022.738, "end": 8027.898, "localBegin": 2720.56, "localEnd": 2725.72}, {"id": "c003_f000094", "text": "The Swiss are obsessive about governance - and indeed their political system is neither \"left\" nor \"right,\" but governance-based. The thoughtful mathematician Hans Gersbach once organized a workshop on skin in the game in Zurich on how to properly reward (and punish) politicians whose interests are not lined up with those of the people they represent. It struck me that if things worked well in Switzerland and other Germanic countries, it is not because of accountability so much as scaling, which makes them very prone to accountability: Germany is a federation.", "begin": 8027.898, "end": 8062.418, "localBegin": 2725.72, "localEnd": 2760.24}, {"id": "c003_f000095", "text": "Let us next generalize to risk sharing.", "begin": 8062.418, "end": 8066.258, "localBegin": 2760.24, "localEnd": 2764.08}, {"id": "c003_f000096", "text": "ALL (LITERALLY) IN THE SAME BOAT", "begin": 8066.258, "end": 8071.938, "localBegin": 2764.08, "localEnd": 2769.76}, {"id": "c003_f000097", "text": "Greek is a language of precision; it has a word describing the opposite of risk transfer: risk sharing. Synkyndineo means \"taking risks together,\" which was a requirement in maritime transactions.", "begin": 8071.938, "end": 8092.538, "localBegin": 2769.76, "localEnd": 2790.36}, {"id": "c003_f000098", "text": "The Acts of the Apostles describes a voyage of St. Paul on a cargo ship from Sidon to Crete to Malta. As they hit a storm: \"When they had eaten what they wanted they lightened the ship by throwing the corn overboard into the sea.\"", "begin": 8092.538, "end": 8111.538, "localBegin": 2790.36, "localEnd": 2809.36}, {"id": "c003_f000099", "text": "Now while they jettisoned particular goods, all owners were to be proportioned the costs of the lost merchandise, not just the specific owners of the lost merchandise. For it turned out that they were following a practice that dates to at least 800 B.C., codified in Lex Rhodia, Rhodian Law, after the mercantile Aegean island of Rhodes; the code is no longer extant but has been cited since antiquity. It stipulates that the risks and costs for contingencies are to be incurred equally, with no concern for responsibility. Justinian's code summarizes it:", "begin": 8111.538, "end": 8148.658, "localBegin": 2809.36, "localEnd": 2846.48}, {"id": "c003_f000100", "text": "It is provided by the Rhodian Law that where merchandise is thrown overboard for the purpose of lightening a ship, what has been lost for the benefit of all must be made up by the contribution of all.", "begin": 8148.658, "end": 8159.818, "localBegin": 2846.48, "localEnd": 2857.64}, {"id": "c003_f000101", "text": "And the same mechanism for risk sharing took place with caravans along desert routes. If merchandise was stolen or lost, all merchants had to split the costs, not just its owner.", "begin": 8159.818, "end": 8170.738, "localBegin": 2857.64, "localEnd": 2868.56}, {"id": "c003_f000102", "text": "Synkyndineo has been translated into Latin by maestro classicist Armand D'Angour as compericlitor, hence, if it ever makes it into English, it should be compericlity, and its opposite, the Bob Rubin risk transfer, will be incompericlity. But I guess risk sharing will do in the meanwhile.", "begin": 8170.738, "end": 8192.698, "localBegin": 2868.56, "localEnd": 2890.52}, {"id": "c003_f000103", "text": "Next, we discuss some distortions from the introduction of skin in the game.", "begin": 8192.698, "end": 8196.698, "localBegin": 2890.52, "localEnd": 2894.52}, {"id": "c003_f000104", "text": "TALKING ONE'S BOOK", "begin": 8196.698, "end": 8203.298, "localBegin": 2894.52, "localEnd": 2901.12}, {"id": "c003_f000105", "text": "I went on television once to announce a newly published book and got stuck in the studio, drafted to become part of a roundtable with two journalists plus the anchor. The topic of the day was Microsoft, a company that was in existence at the time. Everyone, including the anchor, chipped in. My turn came: \"I own no Microsoft stock, I am short no Microsoft stock [i.e., would benefit from its decline], hence I can't talk about it.\" I repeated my dictum of Prologue 1: Don't tell me what you think, tell me what you have in your portfolio. There was immeasurable confusion in the faces: a journalist is typically not supposed to talk about stocks he owns - and, what is worse, is supposed to always, always make pronouncements about stuff he can barely find on a map. A journalist is meant to be an impartial \"judge,\" yet, unlike Sisamnes in the Judgment of Cambyses, there is no threat of a secondary use of his skin.", "begin": 8203.298, "end": 8258.778, "localBegin": 2901.12, "localEnd": 2956.6}, {"id": "c003_f000106", "text": "There are two types of \"talking one's book.\" One consists of buying a stock because you like it, then commenting on it (and disclosing such ownership) - the most reliable advocate for a product is its user. Another is buying a stock so you can advertise the qualities of the company, then selling it, benefiting from the trumpeting - this is called market manipulation, and it is certainly a conflict of interest. We removed the skin in the game of journalists in order to prevent market manipulation, thinking that it would be a net gain to society. The arguments in this book are that the former (market manipulation) and conflicts of interest are more benign than impunity for bad advice. The main reason, we will see, is that in the absence of skin in the game, journalists will imitate, to be safe, the opinion of other journalists, thus creating monoculture and collective mirages.", "begin": 8258.778, "end": 8331.258, "localBegin": 2956.6, "localEnd": 3029.08}, {"id": "c003_f000107", "text": "In general, skin in the game comes with conflict of interest. What I hope this book will do is show that the former is more important than the latter. There is no problem if people have a conflict of interest if it is congruous with downside risk for themselves.", "begin": 8331.258, "end": 8346.098, "localBegin": 3029.08, "localEnd": 3043.92}, {"id": "c003_f000108", "text": "A SHORT VISIT TO THE DOCTOR'S OFFICE", "begin": 8346.098, "end": 8351.178, "localBegin": 3043.92, "localEnd": 3049.0}, {"id": "c003_f000109", "text": "The doctor doesn't have the Antaeus problem: medicine, while wrapping the garment of science around it, is fundamentally apprenticeship-based and, like engineering, grounded in experience, not just experimentation and theories. While economists say \"assume that…\" and produce some weird theory, doctors have none of that. So there is skin in the game at many degrees, except perhaps not fully in the agency effect separating customer from provider. And attempts at putting skin in the game there have brought a certain class of adverse effects, in shifting uncertainty from the doctor to the patient.", "begin": 8351.178, "end": 8389.178, "localBegin": 3049.0, "localEnd": 3087.0}, {"id": "c003_f000110", "text": "The legal system and regulatory measures are likely to put the skin of the doctor in the wrong game.", "begin": 8389.178, "end": 8395.618, "localBegin": 3087.0, "localEnd": 3093.44}, {"id": "c003_f000111", "text": "How? The problem resides in the reliance on metrics. Every metric is gameable - the cholesterol lowering we mentioned in Prologue 1 is a metric-gaming technique taken to its limit. More realistically, say a cancer doctor or hospital is judged by the five-year survival rates of patients, and needs to face a variety of modalities for a new patient: what choice of treatment would they elect to do? There is a tradeoff between laser surgery (a precise surgical procedure) and radiation therapy, which is toxic to both patient and cancer. Statistically, laser surgery may have worse five-year outcomes than radiation therapy, but the latter tends to create second tumors in the longer run and offers comparatively reduced twenty-year disease-specific survival. Given that the window used for the calculation of patient survival is five years, not twenty, the incentive is to shoot for radiation.", "begin": 8395.618, "end": 8450.938, "localBegin": 3093.44, "localEnd": 3148.76}, {"id": "c003_f000112", "text": "So the doctor is likely to be in the process of shifting uncertainty away from him or her by electing the second-best option.", "begin": 8450.938, "end": 8459.338, "localBegin": 3148.76, "localEnd": 3157.16}, {"id": "c003_f000113", "text": "A doctor is pushed by the system to transfer risk from himself to you, and from the present into the future, or from the immediate future into a more distant future.", "begin": 8459.338, "end": 8471.578, "localBegin": 3157.16, "localEnd": 3169.4}, {"id": "c003_f000114", "text": "You need to remember that, when you visit a medical office, you will be facing someone who, in spite of his authoritative demeanor, is in a fragile situation. He is not you, not a member of your family, so he has no direct emotional loss should your health experience a degradation. His objective is, naturally, to avoid a lawsuit, something that can prove disastrous to his career.", "begin": 8471.578, "end": 8494.658, "localBegin": 3169.4, "localEnd": 3192.48}, {"id": "c003_f000115", "text": "Some metrics can actually kill you. Now, say you happen to visit a cardiologist and turn out to be in the mild risk category, something that doesn't really raise your risk of a cardiovascular event, but precedes the stage of a possibly worrisome condition. (There is a strong nonlinearity: a person classified as prediabetic or prehypertensive is, in probability space, 90 percent closer to a normal person than to one with the condition.) But the doctor is pressured to treat you to protect himself. Should you drop dead a few weeks after the visit, a low probability event, the doctor can be sued for negligence, for not having prescribed the right medicine that is temporarily believed to be
