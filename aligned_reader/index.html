n the world around us - in other words, the real thing. His style is so rigorous that he is known for the Coase Theorem (about how markets are very smart about allocating resources and nuisances such as pollution), an idea that he posited without a single word of mathematics, but which is as fundamental as many things written in mathematics.", "begin": 12566.162, "end": 12596.482, "localBegin": 783.24, "localEnd": 813.56}, {"id": "c005_f000038", "text": "Aside from his theorem, Coase was the first to shed light on why firms exist. For him, contracts can be too costly to negotiate due to transaction costs; the solution is to incorporate your business and hire employees with clear job descriptions because you can't afford legal and organizational bills for every transaction. A free market is a place where forces act to determine specialization, and information travels via price point; but within a firm these market forces are lifted because they cost more to run than the benefits they bring. So market forces will cause the firm to aim for the optimal ratio of employees and outside contractors.", "begin": 12596.482, "end": 12636.962, "localBegin": 813.56, "localEnd": 854.04}, {"id": "c005_f000039", "text": "As we can see, Coase stopped one or two inches short of the notion of skin in the game. He never thought in risk terms to realize that an employee is also a risk-management strategy.", "begin": 12636.962, "end": 12648.162, "localBegin": 854.04, "localEnd": 865.24}, {"id": "c005_f000040", "text": "Had economists, Coase or Shmoase, had any interest in the ancients, they would have discovered the risk-management strategy relied upon by Roman families who customarily had a slave for treasurer, the person responsible for the finances of the household and the estate. Why? Because you can inflict a much higher punishment on a slave than a free person or a freedman - and you do not need to rely on the mechanism of the law for that. You can be bankrupted by an irresponsible or dishonest steward who can divert your estate's funds to Bithynia. A slave has more downside.", "begin": 12648.162, "end": 12681.842, "localBegin": 865.24, "localEnd": 898.92}, {"id": "c005_f000041", "text": "COMPLEXITY", "begin": 12681.842, "end": 12686.722, "localBegin": 898.92, "localEnd": 903.8}, {"id": "c005_f000042", "text": "Welcome to the modern world. In a world in which products are increasingly made by subcontractors with increasing degrees of specialization, employees are even more necessary than before for some specific, delicate tasks. If you miss one step in a process, often the entire business shuts down - which explains why today, in a supposedly more efficient world with lower inventories and more subcontractors, things appear to run smoothly and efficiently, but errors are costlier and delays are considerably longer than in the past. One single delay in the chain can stop the entire process.", "begin": 12686.722, "end": 12725.042, "localBegin": 903.8, "localEnd": 942.12}, {"id": "c005_f000043", "text": "A CURIOUS FORM OF SLAVE OWNERSHIP", "begin": 12725.042, "end": 12728.642, "localBegin": 942.12, "localEnd": 945.72}, {"id": "c005_f000044", "text": "Slave ownership by companies has traditionally taken very curious forms. The best slave is someone you overpay and who knows it, terrified of losing his status. Multinational companies created the expat category, a sort of diplomat with a higher standard of living who represents the firm far away and runs its business there. All large corporations had (and some still have) employees with expat status and, in spite of its costs, it is an extremely effective strategy. Why? Because the further from headquarters an employee is located, the more autonomous his unit, the more you want him to be a slave so he does nothing strange on his own.", "begin": 12728.642, "end": 12769.202, "localBegin": 945.72, "localEnd": 986.28}, {"id": "c005_f000045", "text": "A bank in New York sends a married employee with his family to a foreign location, say, a tropical country with cheap labor, with perks and privileges such as country club membership, a driver, a nice company villa with a gardener, a yearly trip back home with the family in first class, and keeps him there for a few years, enough to be addicted. He earns much more than the \"locals,\" in a hierarchy reminiscent of colonial days. He builds a social life with other expats. He progressively wants to stay in the location longer, but he is far from headquarters and has no idea of his minute-to-minute standing in the firm except through signals. Eventually, like a diplomat, he begs for another location when time comes for a reshuffle. Returning to the home office means loss of perks, having to revert to his base salary - a return to lower-middle-class life in the suburbs of New York City, taking the commuter train, perhaps, or, God forbid, a bus, and eating a sandwich for lunch! The person is terrified when the big boss snubs him. Ninety-five percent of the employee's mind will be on company politics…which is exactly what the company wants. The big boss in the board room will have a supporter in the event of some intrigue.", "begin": 12769.202, "end": 12843.682, "localBegin": 986.28, "localEnd": 1060.76}, {"id": "c005_f000046", "text": "FREEDOM IS NEVER FREE", "begin": 12843.682, "end": 12846.922, "localBegin": 1060.76, "localEnd": 1064.0}, {"id": "c005_f000047", "text": "In the famous tale by Ahiqar, later picked up by Aesop (then again by La Fontaine), the dog boasts to the wolf all the contraptions of comfort and luxury he has, almost prompting the wolf to enlist. Until the wolf asks the dog about his collar and is terrified when he understands its use. \"Of all your meals, I want nothing.\" He ran away and is still running.", "begin": 12846.922, "end": 12872.442, "localBegin": 1064.0, "localEnd": 1089.52}, {"id": "c005_f000048", "text": "The question is: what would you like to be, a dog or a wolf?", "begin": 12872.442, "end": 12878.082, "localBegin": 1089.52, "localEnd": 1095.16}, {"id": "c005_f000049", "text": "The original Aramaic version had a wild ass, instead of a wolf, showing off his freedom. But the wild ass ends up eaten by the lion. Freedom entails risks - real skin in the game. Freedom is never free.", "begin": 12878.082, "end": 12893.242, "localBegin": 1095.16, "localEnd": 1110.32}, {"id": "c005_f000050", "text": "Whatever you do, just don't be a dog claiming to be a wolf. In Harris's sparrows, males develop secondary traits that correlate with their fighting ability. Darker color is associated with dominance. However, experimental darkening of lighter males does not raise their status, because their behavior is not altered. In fact these darker birds get killed - as the researcher Terry Burnham once told me: \"birds know that you need to walk the walk.\"", "begin": 12893.242, "end": 12921.522, "localBegin": 1110.32, "localEnd": 1138.6}, {"id": "c005_f000051", "text": "Another aspect of the dog vs. wolf dilemma: the feeling of false stability. A dog's life may appear smooth and secure, but in the absence of an owner, a dog does not survive. Most people prefer to adopt puppies, not grown-up dogs; in many countries, unwanted dogs are euthanized. A wolf is trained to survive. Employees abandoned by their employers, as we saw in the IBM story, cannot bounce back.", "begin": 12921.522, "end": 12950.202, "localBegin": 1138.6, "localEnd": 1167.28}, {"id": "c005_f000052", "text": "WOLVES AMONG THE DOGS", "begin": 12950.202, "end": 12953.242, "localBegin": 1167.28, "localEnd": 1170.32}, {"id": "c005_f000053", "text": "There is a category of employees who aren't slaves, but these represent a very small proportion of the pool. You can identify them as follows: they don't give a f*** about their reputation, at least not their corporate reputation.", "begin": 12953.242, "end": 12967.642, "localBegin": 1170.32, "localEnd": 1184.72}, {"id": "c005_f000054", "text": "After business school, I spent a year in a banking training program - by some accident, as the bank was confused about my background and aims and wanted me to become an international banker. There, I was surrounded by highly employable persons (my most unpleasant experience in life), until I switched to trading (with another firm) and discovered that there were some wolves among the dogs.", "begin": 12967.642, "end": 12991.162, "localBegin": 1184.72, "localEnd": 1208.24}, {"id": "c005_f000055", "text": "One type was the salesperson whose resignation could cause a loss of business, or, what's worse, could benefit a competitor by bringing clients there. Salespeople had tension with the firm as the firm tried to dissociate accounts from them by depersonalizing the relationships with clients, usually unsuccessfully: people like people, and they drop business when they get some generic and polite person on the phone in place of their warm and often exuberant salesperson-friend. The other type was the trader about whom only one thing mattered: the profits and losses, or P and L. Firms had a love-hate relationship with these two types as they were unruly - traders and salespeople were only manageable when they were unprofitable, in which case they weren't wanted.", "begin": 12991.162, "end": 13034.482, "localBegin": 1208.24, "localEnd": 1251.56}, {"id": "c005_f000056", "text": "Traders who made money, I realized, could get so disruptive that they needed to be kept away from the rest of the employees. That's the price you pay for turning individuals into profit centers, meaning no other criterion mattered. I recall once threatening a trader who was abusing the terrified accountant with impunity, telling him such things as \"I am busy earning money to pay your salary\" (intimating that accounting did not add to the bottom line of the firm). But no problem; the people you meet when riding high are also those you meet when riding low, and I saw the fellow getting some (more subtle) abuse from the same accountant before he got fired, as he eventually ran out of luck. You are free - but only as free as your last trade. As we saw with Ahiqar's wild ass, freedom is never free.", "begin": 13034.482, "end": 13085.122, "localBegin": 1251.56, "localEnd": 1302.2}, {"id": "c005_f000057", "text": "When I switched firms away from the proto-company man, I was explicitly told that my employment would terminate the minute I ceased to meet the P and L target. I had my back to the wall, but I took the gamble, which forced me to engage in arbitrage, low-risk transactions with small downsides that were possible at the time because the sophistication of operators in the financial markets was very low.", "begin": 13085.122, "end": 13108.002, "localBegin": 1302.2, "localEnd": 1325.08}, {"id": "c005_f000058", "text": "I recall being asked why I didn't wear a tie, which at the time was the equivalent of walking down Fifth Avenue naked. \"One part arrogance, one part aesthetics, one part convenience,\" was my usual answer. If you were profitable you could give managers all the crap you wanted and they ate it because they needed you and were afraid of losing their own jobs. Risk takers can be socially unpredictable people. Freedom is always associated with risk taking, whether it leads to it or comes from it. You take risks, you feel part of history. And risk takers take risks because it is in their nature to be wild animals.", "begin": 13108.002, "end": 13145.362, "localBegin": 1325.08, "localEnd": 1362.44}, {"id": "c005_f000059", "text": "Note the linguistic dimension - and why, in addition to sartorial considerations, traders needed to be kept away from the rest of nonfree, non-risk-taking people. In my day, nobody cursed in public except for gang members and those who wanted to signal that they were not slaves: traders cursed like sailors, and I have kept the habit of strategic foul language, used only outside of my writings and family life. Those who use foul language on social networks (such as Twitter) are sending an expensive signal that they are free - and, ironically, competent. You don't signal competence if you don't take risks for it - there are few such low-risk strategies. So cursing today is a status symbol, just as oligarchs in Moscow wear blue jeans at special events to signal their power. Even in banks, traders were shown to customers on tours of the firm as if they were animals in a zoo, and the sight of a trader cursing on a phone while in a shouting match with a broker was part of the scenery.", "begin": 13145.362, "end": 13227.122, "localBegin": 1362.44, "localEnd": 1444.2}, {"id": "c005_f000060", "text": "So while cursing and bad language can be a sign of doglike status and total ignorance - the \"canaille,\" which etymologically relates these people to dogs. Ironically the highest status, that of a free man, is usually indicated by voluntarily adopting the mores of the lowest class. It is no different from Diogenes (the one with the barrel) insulting Alexander the Great by asking him to stand out of his sun, just for signaling (legend, of course). Consider that English \"manners\" were imposed on the middle class as a way of domesticating them, along with instilling in them the fear of breaking rules and violating social norms.", "begin": 13227.122, "end": 13283.242, "localBegin": 1444.2, "localEnd": 1500.32}, {"id": "c005_f000061", "text": "LOSS AVERSION", "begin": 13283.242, "end": 13284.122, "localBegin": 1500.32, "localEnd": 1501.2}, {"id": "c005_f000062", "text": "Take for now the following:", "begin": 13284.122, "end": 13287.522, "localBegin": 1501.2, "localEnd": 1504.6}, {"id": "c005_f000063", "text": "What matters isn't what a person has or doesn't have; it is what he or she is afraid of losing.", "begin": 13287.522, "end": 13293.402, "localBegin": 1504.6, "localEnd": 1510.48}, {"id": "c005_f000064", "text": "The more you have to lose, the more fragile you are. Ironically, in my debates, I've seen numerous winners of the so-called Nobel in Economics (the Riksbank Prize in Honor of Alfred Nobel) concerned about losing an argument. I noticed years ago that four of them were actually concerned that I, a nonperson and trader, publicly called them frauds. Why did they care? Well, the higher you go in that business, the more insecure you get, as losing an argument to a lesser person exposes you more than if you lose to some hotshot.", "begin": 13293.402, "end": 13328.762, "localBegin": 1510.48, "localEnd": 1545.84}, {"id": "c005_f000065", "text": "Being higher up in life only works under some conditions. You would think that the head of the CIA would be the most powerful person in America, but it turned out that the venerated David Petraeus was more vulnerable than a truck driver. The fellow couldn't even have an extramarital relationship. You can risk people's lives, but you remain a slave. The entire structure of the civil service is organized that way.", "begin": 13328.762, "end": 13355.002, "localBegin": 1545.84, "localEnd": 1572.08}, {"id": "c005_f000066", "text": "WAITING FOR CONSTANTINOPLE", "begin": 13355.002, "end": 13358.242, "localBegin": 1572.08, "localEnd": 1575.32}, {"id": "c005_f000067", "text": "The exact obverse of the public-hotshot as slave is the autocrat.", "begin": 13358.242, "end": 13364.042, "localBegin": 1575.32, "localEnd": 1581.12}, {"id": "c005_f000068", "text": "As I am writing these lines, we are witnessing a nascent confrontation between several parties, which includes the current \"heads\" of state of members of the North Atlantic Treaty Organization (modern states don't quite have heads, just people who talk big) and the Russian Vladimir Putin. Clearly, except for Putin, all the others need to be elected, can come under fire by their party, and have to calibrate every single statement with how it could be misinterpreted the least by the press. On the other hand, Putin has the equivalent of f***you money, projecting a visible \"I don't care,\" which in turn brings him more followers and more support. In such a confrontation Putin looks and acts as a free citizen confronting slaves who need committees, approval, and who of course feel like they have to fit their decisions to an immediate rating.", "begin": 13364.042, "end": 13411.882, "localBegin": 1581.12, "localEnd": 1628.96}, {"id": "c005_f000069", "text": "Putin's attitude mesmerizes his followers, particularly the Christians in the Levant - especially those Orthodox Christians who remember when Catherine the Great's fleet came to allow the tolling of the bells of the Saint George Cathedral in Beirut. Catherine the Great was \"the last czar with balls,\" and she is the one who took the Crimea from the Ottomans. Before that, the Sunni Ottomans had banned Christians in the coastal cities under their control from ringing church bells - only inaccessible mountain villages allowed themselves such freedom. These Christians lost the active protection of the Russian czar in 1917 and now are hoping that Byzantium is coming back about a hundred years later. It is much easier to do business with the owner of the business than some employee who is likely to lose his job next year; likewise it is easier to trust the word of an autocrat than a fragile elected official.", "begin": 13411.882, "end": 13466.722, "localBegin": 1628.96, "localEnd": 1683.8}, {"id": "c005_f000070", "text": "Watching Putin made me realize that domesticated (and sterilized) animals don't stand a chance against a wild predator. Not a single one. Fughedabout military capabilities: it is the trigger that counts.", "begin": 13466.722, "end": 13506.762, "localBegin": 1683.8, "localEnd": 1723.84}, {"id": "c005_f000071", "text": "Historically, the autocrat was both freer and - as in the special case of traditional monarchs in small principalities - in some cases had skin in the game in improving the place, more so than an elected official whose objective function is to show paper gains. This is not the case in modern times, as dictators, aware that their time might be limited, indulge in pillaging the place and transferring assets to their Swiss bank accounts - as in the case of the Saudi Royal family.", "begin": 13506.762, "end": 13539.162, "localBegin": 1723.84, "localEnd": 1756.24}, {"id": "c005_f000072", "text": "DO NOT ROCK BUREAUCRISTAN", "begin": 13539.162, "end": 13543.682, "localBegin": 1756.24, "localEnd": 1760.76}, {"id": "c005_f000073", "text": "More generally:", "begin": 13543.682, "end": 13546.002, "localBegin": 1760.76, "localEnd": 1763.08}, {"id": "c005_f000074", "text": "People whose survival depends on qualitative \"job assessments\" by someone of higher rank in an organization cannot be trusted for critical decisions.", "begin": 13546.002, "end": 13556.882, "localBegin": 1763.08, "localEnd": 1773.96}, {"id": "c005_f000075", "text": "Although employees are reliable by design, it remains the case that they cannot be trusted in making decisions, hard decisions, anything that entails serious tradeoffs. Nor can they face emergencies unless they are in the emergency business, say, firefighters. The employee has a very simple objective function: fulfill the tasks that his or her supervisor deems necessary, or satisfy some gameable metric. If the employee when coming to work in the morning discovers the potential for huge opportunities, say selling anti-diabetes products to prediabetic Saudi Arabian visitors, he cannot stop and start exploiting it if he is officially in the light fixtures business, selling chandeliers to old-fashioned Park Avenue widows.", "begin": 13556.882, "end": 13601.842, "localBegin": 1773.96, "localEnd": 1818.92}, {"id": "c005_f000076", "text": "So although an employee is here to prevent an emergency, should there be a change of plan, the employee is stuck. While this paralysis can arise because the distribution of responsibilities causes a serious dilution, there is another problem of scale.", "begin": 13601.842, "end": 13618.162, "localBegin": 1818.92, "localEnd": 1835.24}, {"id": "c005_f000077", "text": "We saw the effect with the Vietnam War. Most people (sort of) believed that certain courses of action were absurd, but it was easier to continue than to stop - particularly since one can always spin a story explaining why continuing is better than stopping (the backfitting story of sour grapes now known as cognitive dissonance). We have been witnessing the same problem in the U.S. attitude toward Saudi Arabia. It is clear since the attack on the World Trade Center (in which most of the attackers were Saudi citizens) that someone in that nonpartying kingdom had a hand - somehow - in the matter. But no bureaucrat, fearful of oil disruptions, made the right decision - instead, the absurd invasion of Iraq was endorsed because it appeared to be simpler.", "begin": 13618.162, "end": 13664.242, "localBegin": 1835.24, "localEnd": 1881.32}, {"id": "c005_f000078", "text": "Since 2001 the policy for fighting Islamic terrorists has been, to put it politely, missing the elephant in the room, sort of like treating symptoms and completely missing the disease. Policymakers and slow-thinking bureaucrats stupidly let terrorism grow by ignoring its roots - because that was not a course that was optimal for their jobs, even if optimal for the country. So we lost a generation: someone who went to grammar school in Saudi Arabia (our \"ally\") after September 11 is now an adult, indoctrinated into believing and supporting Salafi violence, hence encouraged to finance it. Even worse, the Wahhabis have accelerated their brainwashing of East and West Asians with their madrassas, thanks to high oil revenues. Instead of invading Iraq or blowing up \"Jihadi John\" and other individual terrorists, thus causing a multiplication of these agents, it would have been better to focus on the source of the problems: Wahhabi/Salafi education and the promotion of intolerant beliefs according to which a Shiite or an Ezidi or a Christian are deviant people. But, to repeat, this is not a decision that can be made by a collection of bureaucrats with a job description.", "begin": 13664.242, "end": 13736.922, "localBegin": 1881.32, "localEnd": 1954.0}, {"id": "c005_f000079", "text": "The same thing happened in 2009 with the banks. I said in Prologue 1 that the Obama administration was complicit with the Bob Rubin trade. We have plenty of evidence that they were afraid of rocking the boat and contradicting the cronies.", "begin": 13736.922, "end": 13751.482, "localBegin": 1954.0, "localEnd": 1968.56}, {"id": "c005_f000080", "text": "Now compare these policies to ones in which decision makers have skin in the game as a substitute for their annual \"job assessment,\" and you will picture a different world.", "begin": 13751.482, "end": 13763.202, "localBegin": 1968.56, "localEnd": 1980.28}, {"id": "c005_f000081", "text": "NEXT", "begin": 13763.202, "end": 13765.402, "localBegin": 1980.28, "localEnd": 1982.48}, {"id": "c005_f000082", "text": "Next, let's talk about the Achilles' heel of the free who is not so free.", "begin": 13765.402, "end": 13770.202, "localBegin": 1982.48, "localEnd": 1987.28}, {"id": "c005_f000083", "text": "Chapter 4 The Skin of Others in Your Game", "begin": 13770.202, "end": 13779.682, "localBegin": 1987.28, "localEnd": 1996.76}, {"id": "c005_f000084", "text": "How to be a whistleblower - James Bond isn't a Jesuit priest, but he is a bachelor - So are both Professor Moriarty and Sherlock Holmes - Total intelligence in the P.R. firm Ketchum - Putting the skin on terrorists", "begin": 13779.682, "end": 13797.042, "localBegin": 1996.76, "localEnd": 2014.12}, {"id": "c005_f000085", "text": "A MORTGAGE AND TWO CATS", "begin": 13797.042, "end": 13798.802, "localBegin": 2014.12, "localEnd": 2015.88}, {"id": "c005_f000086", "text": "Imagine working for a corporation that produces a (so far) hidden harm to the community, in concealing a cancer-causing property that kills thousands by an effect that is not (yet) fully visible. You could alert the public, but you would automatically lose your job. There is a risk that the company's evil scientists would disprove you, causing additional humiliation. You are aware of what Monsanto shills did to the French scientist Gilles-Éric Séralini, who, until he won his defamation suit, lived in total scientific disgrace, the reputational equivalent of leprosy. Or the news will come and go and you may end up being ignored. You are familiar with the history of whistleblowers, which shows that even if you end up vindicated, it may take time for the truth to emerge over the noise created by corporate shills. Meanwhile you will pay the price. A smear campaign against you will destroy any hope of getting another job.", "begin": 13798.802, "end": 13857.762, "localBegin": 2015.88, "localEnd": 2074.84}, {"id": "c005_f000087", "text": "You have nine children, a sick parent, and as a result of taking a stand, your children's future may be compromised. Their college hopes will evaporate - you may even have trouble feeding them properly. You are severely conflicted between your obligation to the collective and to your progeny. You feel you are part of the crime, and unless you do something, you are an agent: thousands are dying from the hidden poisoning by the corporation. Being ethical comes at a huge cost to others.", "begin": 13857.762, "end": 13887.682, "localBegin": 2074.84, "localEnd": 2104.76}, {"id": "c005_f000088", "text": "In the James Bond movie Spectre, agent Bond found himself fighting - on his own, whistleblower style - a conspiracy of dark forces that took over the British service, including his supervisors. Q, who built the new fancy car and other gadgets for him, when asked to help against the conspiracy, said, \"I have a mortgage and two cats\" - in jest of course, because he ended up risking the lives of his two cats to fight the bad guys.", "begin": 13887.682, "end": 13914.762, "localBegin": 2104.76, "localEnd": 2131.84}, {"id": "c005_f000089", "text": "Society likes saints and moral heroes to be celibate so they do not have family pressures that may force them into the dilemma of needing to compromise their sense of ethics to feed their children. The entire human race, something rather abstract, becomes their family. Some martyrs, such as Socrates, had young children (although he was in his seventies), and overcame the dilemma at their expense. Many can't.", "begin": 13914.762, "end": 13944.922, "localBegin": 2131.84, "localEnd": 2162.0}, {"id": "c005_f000090", "text": "The vulnerability of heads of households has been remarkably exploited in history. The samurai had to leave their families in Edo as hostages, thus guaranteeing to the authorities that they would not take positions against the rulers. The Romans and Huns partook of the practice of exchanging permanent \"visitors,\" the children of rulers on both sides, who grew up at the courts of the foreign nation in a form of gilded captivity.", "begin": 13944.922, "end": 13991.522, "localBegin": 2162.0, "localEnd": 2208.6}, {"id": "c005_f000091", "text": "The Ottomans relied on janissaries, who were extracted as babies from Christian families and never married. Having no family (or no contact with their family), they were entirely devoted to the sultan.", "begin": 13991.522, "end": 14005.842, "localBegin": 2208.6, "localEnd": 2222.92}, {"id": "c005_f000092", "text": "It is no secret that large corporations prefer people with families; those with downside risk are easier to own, particularly when they are choking under a large mortgage.", "begin": 14005.842, "end": 14015.282, "localBegin": 2222.92, "localEnd": 2232.36}, {"id": "c005_f000093", "text": "And of course most fictional heroes such as Sherlock Holmes or James Bond don't have the encumbrance of a family that can become a target of, say, evil professor Moriarty.", "begin": 14015.282, "end": 14027.882, "localBegin": 2232.36, "localEnd": 2244.96}, {"id": "c005_f000094", "text": "Let us go one step further.", "begin": 14027.882, "end": 14029.402, "localBegin": 2244.96, "localEnd": 2246.48}, {"id": "c005_f000095", "text": "To make ethical choices you cannot have dilemmas between the particular (friends, family) and the general.", "begin": 14029.402, "end": 14036.322, "localBegin": 2246.48, "localEnd": 2253.4}, {"id": "c005_f000096", "text": "Celibacy has been a way to force men to implement such heroism: for instance, the rebellious ancient sect the Essenes were celibate. So by definition they did not reproduce - unless one considers that their sect mutated to merge with what is known today as Christianity. A celibacy requirement might help with rebellious causes, but it isn't the greatest way to multiply your sect through the ages.", "begin": 14036.322, "end": 14061.122, "localBegin": 2253.4, "localEnd": 2278.2}, {"id": "c005_f000097", "text": "Financial independence is another way to solve ethical dilemmas, but such independence is hard to ascertain: many seemingly independent people aren't particularly so. While, in Aristotle's days, a person of independent means was free to follow his conscience, this is no longer as common in modern days.", "begin": 14061.122, "end": 14082.322, "localBegin": 2278.2, "localEnd": 2299.4}, {"id": "c005_f000098", "text": "Intellectual and ethical freedom requires the absence of the skin of others in one's game, which is why the free are so rare. I cannot possibly imagine the activist Ralph Nader, when he was the target of large motor companies, raising a family with 2.2 kids and a dog.", "begin": 14082.322, "end": 14098.282, "localBegin": 2299.4, "localEnd": 2315.36}, {"id": "c005_f000099", "text": "But neither celibacy nor financial independence makes one unconditionally immune, as we see next.", "begin": 14098.282, "end": 14106.322, "localBegin": 2315.36, "localEnd": 2323.4}, {"id": "c005_f000100", "text": "FINDING HIDDEN VULNERABILITIES", "begin": 14106.322, "end": 14110.602, "localBegin": 2323.4, "localEnd": 2327.68}, {"id": "c005_f000101", "text": "So far we have seen that the requirement of celibacy is enough evidence that society has, traditionally, been implicitly penalizing some layer of a collective for the actions of a person. This is never done explicitly: nobody says, \"I will punish your family because you are criticizing the big agrichemical firms,\" when in effect this is what happens in practice when there is the threat of the reduction in the volume of the objects under the Christmas tree, or the degradation of the quality of food in the refrigerator.", "begin": 14110.602, "end": 14142.762, "localBegin": 2327.68, "localEnd": 2359.84}, {"id": "c005_f000102", "text": "I have f*** you money, so I appear to be fully independent (though I am certain that my independence is unrelated to my finances). But there are people I care about who can be affected by my actions, and those who want to harm me may want to go after them. In the campaign against me waged by Big Ag, the public relation firms (hired to discredit those who were skeptical of the risk of transgenics) couldn't threaten my livelihood. Nor could they tag me with the \"antiscience\" label (the central part of their arsenal) since I have a history of standing for probabilistic rigor in science expressed in technical language, and several million readers who understand my reasoning. It is a bit too late for that now. In fact, by creating analogies between some cherry-picked passages from my writings taken out of context and those of the new age guru Deepak Chopra, they have caused some people to suspect that Chopra was a logician, an application of Wittgenstein's ruler: by measuring the table with a ruler am I measuring the ruler or measuring the table? Far-fetched comparisons are more likely to discredit the commentator than the commentated.", "begin": 14142.762, "end": 14212.122, "localBegin": 2359.84, "localEnd": 2429.2}, {"id": "c005_f000103", "text": "So these P.R. firms resorted to harassing New York University's staff by using web-mobs to flood them with emails - which includes overwhelming a defenseless assistant and people who had no idea I worked for the university since I am there only quarter-time. This method - of hitting you where they think it hurts - implies hitting people around you who are more vulnerable than you. General Motors, in the campaign against Ralph Nader (who uncovered flaws in their products), desperate to stop him, resorted to harassing Rose Nader, his mother, calling her at three in the morning - in the days when it was hard to trace a telephone call. Clearly it was meant to make Ralph Nader feel he was guilty of harming his own mother. It turned out that Rose Nader was herself an activist and felt flattered by the calls (at least she was not left out of the battle).", "begin": 14212.122, "end": 14262.762, "localBegin": 2429.2, "localEnd": 2479.84}, {"id": "c005_f000104", "text": "I am privileged to have other enemies than Big Ag. A couple of years ago, a university in Lebanon offered me an honorary doctorate. I accepted out of respect, counter to my habit of refusing honors, (largely) because I get very bored during ceremonies. Plus, in my experience, people who collect honorary doctorates are typically hierarchy-conscious, and I abide by Cato's injunction: he preferred to be asked why he didn't have a statue rather than why he had one. The staff of the university became automatically the target of my detractors, of Salafi-sympathizers among the student body, and of people who were ticked off by my enthusiasm for and defense of Shiite Islam, and my desire to return Lebanon to the Eastern Mediterranean, the Greco-Roman world to which it tangibly belongs, away from the disastrous and fictional construction called Arabism. Visibly, deans and presidents of universities are far more vulnerable than independent persons, and animals know where weakness lies. By the minority rule, all it takes is a very small number of detractors using misplaced buzzwords of the type that makes people cringe (such as \"racist\") to scare an entire institution. Institutions are employees - vulnerable, reputation-conscious employees. Being Salafi is not a race but a political movement-cum-criminal organization, yet people fear being labeled racists so much that they lose their logical faculties. But in the end the efforts of the detractors were to no avail: on one hand I cannot be harmed; on the other the university would have more to lose from the withdrawal of an honor than from harassment by Pan-Arabists and Salafis.", "begin": 14262.762, "end": 14362.122, "localBegin": 2479.84, "localEnd": 2579.2}, {"id": "c005_f000105", "text": "These methods of going after vulnerable people associated with you are eventually ineffective. For one thing, odious people (and Salafi sympathizers) tend to be dumb, along with people who act only in mobs. In addition, those who engage in smear campaigning as a profession are necessarily incompetent at everything else - hence at that business too - so the industry accumulates rejects who are prone to ethical stretches. Did any of your business-smart, streetwise, or academically gifted peers in high school declare that their dream was to become the world's expert in smearing whistleblowers? Or even work as a lobbyist or public relations expert? These jobs are indicative of necessary failure in other things.", "begin": 14362.122, "end": 14405.762, "localBegin": 2579.2, "localEnd": 2622.84}, {"id": "c005_f000106", "text": "Further:", "begin": 14405.762, "end": 14407.762, "localBegin": 2622.84, "localEnd": 2624.84}, {"id": "c005_f000107", "text": "To be free of conflict you need to have no friends.", "begin": 14407.762, "end": 14412.002, "localBegin": 2624.84, "localEnd": 2629.08}, {"id": "c005_f000108", "text": "Which is why Cleon was said to have renounced all of his friendships during his office.", "begin": 14412.002, "end": 14418.202, "localBegin": 2629.08, "localEnd": 2635.28}, {"id": "c005_f000109", "text": "So far we have seen that the link between the individual and the collective is too fuzzy to interpret naively. So let us consider the classical situation of the terrorist who thinks he is immune to harm.", "begin": 14418.202, "end": 14429.282, "localBegin": 2635.28, "localEnd": 2646.36}, {"id": "c005_f000110", "text": "HOW TO PUT SKIN IN THE GAME OF SUICIDE BOMBERS", "begin": 14429.282, "end": 14434.442, "localBegin": 2646.36, "localEnd": 2651.52}, {"id": "c005_f000111", "text": "Can someone punish a family for the crimes of an individual? The scriptures are self-contradictory - you can get both answers from the Old Testament. Exodus and Numbers show God as \"visiting the iniquity of the fathers on the children to the third or fourth generation.\" Deuteronomy makes a separation: \"Fathers shall not be put to death because of their children, nor shall children be put to death because of their fathers. Each one shall be put to death for his own sin.\" Even today the question isn't fully settled, nor is the answer clear-cut. You are not responsible for the debts of your parents, but German taxpayers are still responsible for war reparations for crimes committed by their grandparents and great-grandparents. And even in ancient times, when debt was a burden that crossed generations, the answer wasn't clear-cut: there was a balancing mechanism of periodic (literal) cleaning of the slate, with jubilee debt forgiveness.", "begin": 14434.442, "end": 14491.922, "localBegin": 2651.52, "localEnd": 2709.0}, {"id": "c005_f000112", "text": "However, the answer is clear in the case of terrorism. The rule should be: You kill my family with supposed impunity; I will make yours pay some indirect price for it. Indirect responsibility isn't part of the standard crime-and-punishment methodology of a civilized society, but confronting terrorists (who threaten innocents) isn't standard either. For we have rarely in history faced a situation in which the perpetrator of a crime has a completely asymmetric payoff and upside from death itself.", "begin": 14491.922, "end": 14539.882, "localBegin": 2709.0, "localEnd": 2756.96}, {"id": "c005_f000113", "text": "Hammurabi's code actually makes such a provision, transferring liability across generations. For, on that same basalt stele surrounded by Korean selfie sticks, is written the following: \"If the architect built a house and the house subsequently collapses, killing the firstborn son of the master, the firstborn son of the architect shall be put to death.\" The individual as we understand it today did not exist as a standalone unit; the family did.", "begin": 14539.882, "end": 14569.722, "localBegin": 2756.96, "localEnd": 2786.8}, {"id": "c005_f000114", "text": "Gypsies have rules that remained for a long time opaque to outsiders; it was probably not until the movie Vengo (2000) that the general public discovered a dark custom among Gitano tribes. In a case where a member of one family kills a member of another, a direct relative of the killer will be delivered to the family of the victim.", "begin": 14569.722, "end": 14590.162, "localBegin": 2786.8, "localEnd": 2807.24}, {"id": "c005_f000115", "text": "The unusual nuisance with jihadi terrorism is that we are totally defenseless in front of a deluded person willing to kill scores of innocents without any true downside, that is, no skin in the game. In Northern Phoenicia, Alawis are terrorized by Salafis wearing bomb-filled jackets that they can activate in a public place. There is almost no way they can be \"caught\" without activation. Killing them on sight leads to false positives, but we can't afford false negatives. As a result, we have instances of private citizens cornering and \"hugging\" perceived self-bombers in places where detonation would be least harmful. This is a form of counter-suicide bombing.", "begin": 14590.162, "end": 14632.722, "localBegin": 2807.24, "localEnd": 2849.8}, {"id": "c005_f000116", "text": "Explicit communal punishment can be used where other methods of justice have failed, provided they are not based on an emotional reaction, but on a well-outlined method of justice defined prior to the event, so that it becomes a deterrent. One who is sacrificing himself for a perceived upside for a given collective needs a deterrent, so it is a form of injection of skin in the game where there are no other methods. And the skin is visible: that very collective.", "begin": 14632.722, "end": 14660.722, "localBegin": 2849.8, "localEnd": 2877.8}, {"id": "c005_f000117", "text": "The only way we have left to control suicide-terrorists would be precisely to convince them that blowing themselves up is not the worst-case scenario for them, nor the end scenario at all. Making their families and loved ones bear a financial burden - just as Germans still pay for war crimes - would immediately add consequences to their actions. The penalty needs to be properly calibrated to be a true disincentive, without imparting any sense of heroism or martyrdom to the families in question.", "begin": 14660.722, "end": 14691.002, "localBegin": 2877.8, "localEnd": 2908.08}, {"id": "c005_f000118", "text": "But I feel queasy about transferring a crime from one unit, an individual, to another, a collective. What I do not feel bad about is preventing the family of the perpetrators of terrorist acts from benefiting from those acts - many terrorist groups reward the families of suicide bombers, and this can be safely terminated without any ethical dilemma.", "begin": 14691.002, "end": 14712.922, "localBegin": 2908.08, "localEnd": 2930.0}, {"id": "c005_f000119", "text": "NEXT", "begin": 14712.922, "end": 14716.042, "localBegin": 2930.0, "localEnd": 2933.12}, {"id": "c005_f000120", "text": "In the last two chapters we examined the good and the bad of dependence and the constraints on our freedoms coming from skin in the game. Next, let us look at the thrills (of the right type) of risk taking.", "begin": 14716.042, "end": 14729.402, "localBegin": 2933.12, "localEnd": 2946.48}, {"id": "c005_f000121", "text": "Book 5 Being Alive Means Taking Certain Risks", "begin": 14729.402, "end": 14738.442, "localBegin": 2946.48, "localEnd": 2955.52}, {"id": "c005_f000122", "text": "Chapter 5 Life in the Simulation Machine", "begin": 14738.442, "end": 14745.402, "localBegin": 2955.52, "localEnd": 2962.48}, {"id": "c005_f000123", "text": "How to dress while reading Borges and Proust - There are many ways to convince with an ice pick - Councils of bickering bishops - Theosis - Why Trump will win (he actually did win)", "begin": 14745.402, "end": 14761.562, "localBegin": 2962.48, "localEnd": 2978.64}, {"id": "c005_f000124", "text": "I once sat in a dinner party at a large round table across from a courteous fellow called David. The host was a physicist, Edgar C., in his New York club, a literary sort of club, where, except for David, almost everyone was dressed like people who either read Borges and Proust, wanted to be known as readers of Borges and Proust, or just liked to spend time with people who read Borges and Proust (corduroy, ascot, suede shoes, or just business suit). As for David, he was dressed like someone who didn't know that people who read Borges and Proust needed to dress in a certain way when they congregated. At some point during the dinner, David unexpectedly pulled out an ice pick and made it go through his hand. I had no clue what the fellow did for a living - nor was I aware that Edgar was into magic as a side hobby. It turned out that the David in question was a magician (his name is David Blaine), and that he was very famous.", "begin": 14761.562, "end": 14817.602, "localBegin": 2978.64, "localEnd": 3034.68}, {"id": "c005_f000125", "text": "I knew very little about magicians, assumed it was all about optical illusions - the central inverse problem we mentioned in Prologue 2 that makes it easier to engineer than reverse-engineer. But something struck me at the end of the party. David was standing by the coat check using a handkerchief to sop up drops of blood coming out of his hand.", "begin": 14817.602, "end": 14836.562, "localBegin": 3034.68, "localEnd": 3053.64}, {"id": "c005_f000126", "text": "So the fellow was really making an icepick go through his hand - with all the risks that entailed. He suddenly became another person in my eyes. He was now real. He took risks. He had skin in the game.", "begin": 14836.562, "end": 14851.882, "localBegin": 3053.64, "localEnd": 3068.96}, {"id": "c005_f000127", "text": "I met him again a few months later and, as I tried to shake hands with him, noticed a scar where the icepick had come out of his hand.", "begin": 14851.882, "end": 14858.882, "localBegin": 3068.96, "localEnd": 3075.96}, {"id": "c005_f000128", "text": "JESUS WAS A RISK TAKER", "begin": 14858.882, "end": 14863.082, "localBegin": 3075.96, "localEnd": 3080.16}, {"id": "c005_f000129", "text": "This allowed me to finally figure out this business of the Trinity. The Christian religion, throughout Chalcedon, Nicea, and other ecumenical councils and various synods of argumentative bishops, kept insisting on the dual nature of Jesus Christ. It would be theologically simpler if God were god and Jesus were man, just like another prophet, the way Islam views him, or the way Judaism views Abraham. But no, he had to be both man and god; the duality is so central it kept coming back though all manner of refinement: whether the duality allowed sharing the same substance (Orthodoxy), the same will (Monothelites), the same nature (Monophysites). The trinity is what caused other monotheists to see traces of polytheism in Christianity, and caused many Christians who fell into the hands of the Islamic State to be beheaded.", "begin": 14863.082, "end": 14914.362, "localBegin": 3080.16, "localEnd": 3131.44}, {"id": "c005_f000130", "text": "So it appears that the church founders really wanted Christ to have skin in the game; he did actually suffer on the cross, sacrifice himself, and experience death. He was a risk taker. More crucially to our story, he sacrificed himself for the sake of others. A god stripped of humanity cannot have skin in the game in such a manner, cannot really suffer (or, if he does, such a redefinition of a god injected with a human nature would back up our argument). A god who didn't really suffer on the cross would be like a magician who performed an illusion, not someone who actually bled after sliding an icepick between his carpal bones.", "begin": 14914.362, "end": 14953.522, "localBegin": 3131.44, "localEnd": 3170.6}, {"id": "c005_f000131", "text": "The Orthodox Church goes further, making the human side flow upward rather than downward. The fourth-century bishop Athanasius of Alexandria wrote: \"Jesus Christ was incarnate so we could be made God\" (emphasis mine). It is the very human character of Jesus that can allow us mortals to access God and merge with him, become part of him, in order to partake of the divine. That fusion is called theosis. The human nature of Christ makes the divine possible for all of us.", "begin": 14953.522, "end": 14985.282, "localBegin": 3170.6, "localEnd": 3202.36}, {"id": "c005_f000132", "text": "PASCAL'S WAGER", "begin": 14985.282, "end": 14989.882, "localBegin": 3202.36, "localEnd": 3206.96}, {"id": "c005_f000133", "text": "This argument (that real life is risk taking) reveals the theological weakness of Pascal's wager, which stipulates that believing in the creator has a positive payoff in case he truly exists, and no downside in case he doesn't. Hence the wager would be to believe in God as a free option. But there are no free options. If you follow the idea to its logical end, you can see that it proposes religion without skin in the game, making it a purely academic and sterile activity. But what applies to Jesus should also apply to other believers. We will see that, traditionally, there is no religion without some skin in the game.", "begin": 14989.882, "end": 15039.762, "localBegin": 3206.96, "localEnd": 3256.84}, {"id": "c005_f000134", "text": "THE MATRIX", "begin": 15039.762, "end": 15043.242, "localBegin": 3256.84, "localEnd": 3260.32}, {"id": "c005_f000135", "text": "Philosophers, unlike the equally argumentative but vastly more sophisticated (and more colorfully dressed) bishops, don't get the point with their experience machine thought experiment. The procedure is as follows. Simply, you sit in an apparatus and a technician plugs a few cables into your brain, after which you undergo an \"experience.\" You feel exactly as if an event took place, except that it all happened in virtual reality; it was all mental. Alas, such an experience will never be in the same category as the real - only an academic philosopher who never took risk can believe such nonsense. Why?", "begin": 15043.242, "end": 15082.082, "localBegin": 3260.32, "localEnd": 3299.16}, {"id": "c005_f000136", "text": "Because, to repeat, life is sacrifice and risk taking, and nothing that doesn't entail some moderate amount of the former, under the constraint of satisfying the latter, is close to what we can call life. If you do not undertake a risk of real harm, reparable or even potentially irreparable, from an adventure, it is not an adventure.", "begin": 15082.082, "end": 15104.002, "localBegin": 3299.16, "localEnd": 3321.08}, {"id": "c005_f000137", "text": "Our argument - that the real requires peril - can lead to niceties about the mind-body problem, but don't tell your local philosopher.", "begin": 15104.002, "end": 15113.122, "localBegin": 3321.08, "localEnd": 3330.2}, {"id": "c005_f000138", "text": "Now, one may argue: once inside the machine, you may believe that you have skin in the game, and experience the pains and consequences as if you were living the actual harm. But this is once inside, not outside, and there is no risk of irreversible harm, things that linger and make time flow in one direction not the other. The reason a dream is not reality is that when you suddenly wake up from falling from a Chinese skyscraper, life continues, and there is no absorbing barrier, the mathematical name for that irreversible state that we will discuss at length in Chapter 19, along with ergodicity, the most powerful concept I know.", "begin": 15113.122, "end": 15153.282, "localBegin": 3330.2, "localEnd": 3370.36}, {"id": "c005_f000139", "text": "Next, let us consider the signaling benefits of overt flaws.", "begin": 15153.282, "end": 15158.802, "localBegin": 3370.36, "localEnd": 3375.88}, {"id": "c005_f000140", "text": "THE DONALD", "begin": 15158.802, "end": 15163.522, "localBegin": 3375.88, "localEnd": 3380.6}, {"id": "c005_f000141", "text": "I have a tendency to watch television with the sound off. When I saw Donald Trump in the Republican primary standing next to other candidates, I became certain he was going to win that stage of the process, no matter what he said or did. Actually, it was because he had visible deficiencies. Why? Because he was real, and the public - composed of people who usually take risks, not the lifeless non-risk-taking analysts we will present in the next chapter - would vote anytime for someone who actually bled after putting an icepick in his hand rather than someone who did not. Arguments that Trump was a failed entrepreneur, even if true, actually prop up this argument: you'd even rather have a failed real person than a successful one, as blemishes, scars, and character flaws increase the distance between a human and a ghost.", "begin": 15163.522, "end": 15227.802, "localBegin": 3380.6, "localEnd": 3444.88}, {"id": "c005_f000142", "text": "Scars signal skin in the game.", "begin": 15227.802, "end": 15231.562, "localBegin": 3444.88, "localEnd": 3448.64}, {"id": "c005_f000143", "text": "And", "begin": 15231.562, "end": 15232.322, "localBegin": 3448.64, "localEnd": 3449.4}, {"id": "c005_f000144", "text": "People can detect the difference between front- and back-office operators.", "begin": 15232.322, "end": 15236.922, "localBegin": 3449.4, "localEnd": 3454.0}, {"id": "c005_f000145", "text": "NEXT", "begin": 15236.922, "end": 15240.002, "localBegin": 3454.0, "localEnd": 3457.08}, {"id": "c005_f000146", "text": "Before we end, take some Fat Tony wisdom: always do more than you talk. And precede talk with action. For it will always remain that action without talk supersedes talk without action.", "begin": 15240.002, "end": 15254.202, "localBegin": 3457.08, "localEnd": 3471.28}, {"id": "c005_f000147", "text": "Otherwise you will resemble the person we expose in the next chapter (which hopefully will offend many \"intellectuals\"), the insidious disease of modern times: back-office people (that is, support staff) acting as front-office ones (business generators).", "begin": 15254.202, "end": 15271.602, "localBegin": 3471.28, "localEnd": 3488.68}, {"id": "c005_f000148", "text": "Chapter 6 The Intellectual Yet Idiot", "begin": 15271.602, "end": 15279.682, "localBegin": 3488.68, "localEnd": 3496.76}, {"id": "c005_f000149", "text": "People who don't have skin in the game - Lipid phobias - Teach a professor how to deadlift", "begin": 15279.682, "end": 15287.202, "localBegin": 3496.76, "localEnd": 3504.28}, {"id": "c005_f000150", "text": "What we saw worldwide from 2014 to 2018, from India to the U.K. to the U.S., was a rebellion against the inner circle of no-skin-in-the-game policymaking \"clerks\" and journalists-insiders, that class of paternalistic semi-intellectual experts with some Ivy League, Oxford-Cambridge or similar label-driven education who are telling the rest of us 1) what to do, 2) what to eat, 3) how to speak, 4) how to think, and…5) whom to vote for.", "begin": 15287.202, "end": 15322.362, "localBegin": 3504.28, "localEnd": 3539.44}, {"id": "c005_f000151", "text": "WHERE TO FIND A COCONUT", "begin": 15322.362, "end": 15326.242, "localBegin": 3539.44, "localEnd": 3543.32}, {"id": "c005_f000152", "text": "But the problem is the one-eyed following the blind: these self-described members of the \"intelligentsia\" can't find a coconut on Coconut Island, meaning they aren't intelligent enough to define intelligence, hence fall into circularities - their main skill is a capacity to pass exams written by people like them, or to write papers read by people like them. Some of us - not Fat Tony - have been blind to their serial incompetence. With psychology studies replicating less than 40 percent of the time, dietary advice reversing after thirty years of dietary fat phobia, macroeconomics and financial economics (while trapped in an intricate Gargantuan patch of words) scientifically worse than astrology (this is what the reader of the Incerto has known since Fooled by Randomness), the reappointment of Bernanke (in 2010) who was less than clueless about financial risk as the Federal Reserve boss, and pharmaceutical trials replicating at best only a third of the time, people are perfectly entitled to rely on their own ancestral instincts and to listen to their grandmothers (or to Montaigne and such filtered classical knowledge), who have a better track record than these policymaking goons.", "begin": 15326.242, "end": 15400.642, "localBegin": 3543.32, "localEnd": 3617.72}, {"id": "c005_f000153", "text": "SCIENCE AND SCIENTISM", "begin": 15400.642, "end": 15404.682, "localBegin": 3617.72, "localEnd": 3621.76}, {"id": "c005_f000154", "text": "Indeed, one can see that these academico-bureaucrats who feel entitled to run our lives aren't even rigorous, whether in medical statistics or policymaking. They can't tell science from scientism - in fact in their eyes scientism looks more scientific than real science. For instance, it is trivial to show the following: much of what the Cass Sunstein and Richard Thaler types - those who want to \"nudge\" us into some behavior - much of what they would classify as \"rational\" or \"irrational\" (or some such categories indicating deviation from a desired or prescribed protocol) comes from their misunderstanding of probability theory and cosmetic use of first-order models. They are also prone to mistake the ensemble for the linear aggregation of its components - that is, they think that our understanding of single individuals allows us to understand crowds and markets, or that our understanding of ants allows us to understand ant colonies.", "begin": 15404.682, "end": 15463.362, "localBegin": 3621.76, "localEnd": 3680.44}, {"id": "c005_f000155", "text": "The Intellectual Yet Idiot (IYI) is a product of modernity, hence has been proliferating since at least the mid-twentieth century, to reach a local supremum today, to the point that we have experienced a takeover by people without skin in the game. In most countries, the government's role is between five and ten times what it was a century ago (expressed in percentage of gross domestic product). The IYI seems ubiquitous in our lives but is still a small minority and is rarely seen outside specialized outlets, think tanks, the media, and university social science departments - most people have proper jobs and there are not many openings for the IYI, which explains how they can be so influential in spite of their low numbers.", "begin": 15463.362, "end": 15508.282, "localBegin": 3680.44, "localEnd": 3725.36}, {"id": "c005_f000156", "text": "The IYI pathologizes others for doing things he doesn't understand without ever realizing it is his understanding that may be limited. He thinks people should act according to their best interests and he knows their interests, particularly if they are \"rednecks\" or from the English non-crisp-vowel class who voted for Brexit. When plebeians do something that makes sense to themselves, but not to him, the IYI uses the term \"uneducated.\" What we generally call participation in the political process, he calls by two distinct designations: \"democracy\" when it fits the IYI, and \"populism\" when plebeians dare to vote in a way that contradicts IYI preferences. While rich people believe in one tax dollar one vote, more humanistic ones in one man one vote, Monsanto in one lobbyist one vote, the IYI believes in one Ivy League degree one vote, with some equivalence for foreign elite schools and PhDs, as these are needed in the club.", "begin": 15508.282, "end": 15569.682, "localBegin": 3725.36, "localEnd": 3786.76}, {"id": "c005_f000157", "text": "They are what Nietzsche called Bildungsphilisters - educated philistines. Beware the slightly erudite who thinks he is an erudite, as well as the barber who decides to perform brain surgery.", "begin": 15569.682, "end": 15583.042, "localBegin": 3786.76, "localEnd": 3800.12}, {"id": "c005_f000158", "text": "The IYI also fails to naturally detect sophistry.", "begin": 15583.042, "end": 15588.322, "localBegin": 3800.12, "localEnd": 3805.4}, {"id": "c005_f000159", "text": "INTELLECTUAL YET PHILISTINE", "begin": 15588.322, "end": 15592.802, "localBegin": 3805.4, "localEnd": 3809.88}, {"id": "c005_f000160", "text": "The IYI subscribes to The New Yorker, a journal designed so philistines can learn to fake a conversation about evolution, neurosomething, cognitive biases, and quantum mechanics. He never curses on social media. He speaks of \"equality of races\" and \"economic equality,\" but never goes out drinking with a minority cab driver (again, no real skin in the game, as, I will repeat until I am hoarse, the concept is fundamentally foreign to the IYI). The modern IYI has attended more than one TED talk in person or watched more than two TED talks on YouTube. Not only did he vote for Hillary Monsanto-Malmaison because she seemed electable or some such circular reasoning, but he holds that anyone who didn't do so is mentally ill.", "begin": 15592.802, "end": 15640.962, "localBegin": 3809.88, "localEnd": 3858.04}, {"id": "c005_f000161", "text": "The IYI mistakes the Near East (ancient Eastern Mediterranean) for the Middle East.", "begin": 15640.962, "end": 15647.522, "localBegin": 3858.04, "localEnd": 3864.6}, {"id": "c005_f000162", "text": "The IYI has a copy of the first hardback edition of The Black Swan on his shelf, but mistakes absence of evidence for evidence of absence. He believes that GMOs are \"science,\" that their \"technology\" is in the same risk class as conventional breeding.", "begin": 15647.522, "end": 15664.002, "localBegin": 3864.6, "localEnd": 3881.08}, {"id": "c005_f000163", "text": "Typically, the IYI get first-order logic right, but not second-order (or higher) effects, making him totally incompetent in complex domains.", "begin": 15664.002, "end": 15674.522, "localBegin": 3881.08, "localEnd": 3891.6}, {"id": "c005_f000164", "text": "The IYI has been wrong, historically, about Stalinism, Maoism, GMOs, Iraq, Libya, Syria, lobotomies, urban planning, low carbohydrate diets, gym machines, behaviorism, trans-fats, Freudianism, portfolio theory, linear regression, HFCS (High-Fructose Corn Syrup), Gaussianism, Salafism, dynamic stochastic equilibrium modeling, housing projects, marathon running, selfish genes, election-forecasting models, Bernie Madoff (pre-blowup), and p-values. But he is still convinced that his current position is right.", "begin": 15674.522, "end": 15715.162, "localBegin": 3891.6, "localEnd": 3932.24}, {"id": "c005_f000165", "text": "NEVER GOTTEN DRUNK WITH RUSSIANS", "begin": 15715.162, "end": 15724.002, "localBegin": 3932.24, "localEnd": 3941.08}, {"id": "c005_f000166", "text": "The IYI joins a club to get travel privileges; if he is a social scientist, he uses statistics without knowing how they are derived (like Steven Pinker and psycholophasters in general); when in the United Kingdom, he goes to literary festivals and eats cucumber sandwiches, taking small bites at a time; he drinks red wine with steak (never white); he used to believe that dietary fat was harmful and has now completely reversed himself (information in both cases is derived from the same source); he takes statins because his doctor told him to do so; he fails to understand ergodicity, and, when explained to him, he forgets about it soon after; he doesn't use Yiddish words even when talking business; he studies grammar before speaking a language; he has a cousin who worked with someone who knows the Queen; he has never read Frédéric Dard, Libanius Antiochus, Michael Oakeshott, John Gray, Ammianus Marcellinus, Ibn Battuta, Saadia Gaon, or Joseph de Maistre; he has never gotten drunk with Russians; he never drinks to the point where he starts breaking glasses (or, preferably, chairs); he doesn't even know the difference between Hecate and Hecuba (which in Brooklynese is \"can't tell sh**t from shinola\"); he doesn't know that there is no difference between \"pseudointellectual\" and \"intellectual\" in the absence of skin in the game; he has mentioned quantum mechanics at least twice in the past five years in conversations that had nothing to do with physics.", "begin": 15724.002, "end": 15853.842, "localBegin": 3941.08, "localEnd": 4070.92}, {"id": "c005_f000167", "text": "The IYI likes to use buzzwords from philosophy of science when discussing unrelated phenomena; he goes two or three levels too theoretical for a given problem.", "begin": 15853.842, "end": 15870.562, "localBegin": 4070.92, "localEnd": 4087.64}, {"id": "c005_f000168", "text": "TO CONCLUDE", "begin": 15870.562, "end": 15872.322, "localBegin": 4087.64, "localEnd": 4089.4}, {"id": "c005_f000169", "text": "The Intellectual Yet Idiot knows at any given point in time what his words or actions are doing to his reputation.", "begin": 15872.322, "end": 15885.642, "localBegin": 4089.4, "localEnd": 4102.72}, {"id": "c005_f000170", "text": "But a much easier marker: he doesn't even deadlift.", "begin": 15885.642, "end": 15889.162, "localBegin": 4102.72, "localEnd": 4106.24}, {"id": "c005_f000171", "text": "POSTSCRIPT", "begin": 15889.162, "end": 15892.522, "localBegin": 4106.24, "localEnd": 4109.6}, {"id": "c005_f000172", "text": "From the reactions to this chapter (which was posted before the presidential elections of 2016), I discovered that the typical IYI has difficulty, when reading, in differentiating between the satirical and the literal.", "begin": 15892.522, "end": 15907.362, "localBegin": 4109.6, "localEnd": 4124.44}, {"id": "c005_f000173", "text": "Next, we stop the satirical and return to the main book with the sooooo misunderstood topic of economic inequality. By IYIs.", "begin": 15907.362, "end": 15922.362, "localBegin": 4124.44, "localEnd": 4139.44}]}, {"kind": "chapter", "number": 6, "title": "Chapters 7 and 8: Inequality and Lindy", "audio": "audio/chapter_006.mp3", "start": 15922.39, "end": 19471.699, "duration": 3549.309, "paragraphs": [{"id": "c006_f000001", "text": "Chapter 7 Inequality and Skin in the Game", "begin": 15922.39, "end": 15928.47, "localBegin": 0.0, "localEnd": 6.08}, {"id": "c006_f000002", "text": "The static and the dynamic - How to go bankrupt and be loved by the many - Piketty's equals", "begin": 15928.47, "end": 15937.47, "localBegin": 6.08, "localEnd": 15.08}, {"id": "c006_f000003", "text": "INEQUALITY VS. INEQUALITY", "begin": 15937.47, "end": 15941.31, "localBegin": 15.08, "localEnd": 18.92}, {"id": "c006_f000004", "text": "There is inequality and inequality.", "begin": 15941.31, "end": 15945.11, "localBegin": 18.92, "localEnd": 22.72}, {"id": "c006_f000005", "text": "The first is the inequality people tolerate, such as one's understanding compared to that of people deemed heroes, say, Einstein, Michelangelo, or the recluse mathematician Grisha Perelman, in comparison to whom one has no difficulty acknowledging a large surplus. This applies to entrepreneurs, artists, soldiers, heroes, the singer Bob Dylan, Socrates, the current local celebrity chef, some Roman Emperor of good repute, say, Marcus Aurelius; in short, those for whom one can naturally be a \"fan.\" You may like to imitate them, you may aspire to be like them, but you don't resent them.", "begin": 15945.11, "end": 15984.35, "localBegin": 22.72, "localEnd": 61.96}, {"id": "c006_f000006", "text": "The second is the inequality people find intolerable because the subject appears to be just a person like you, except that he has been playing the system, and getting himself into rent-seeking, acquiring privileges that are not warranted - and although he has something you would not mind having (which may include his Russian girlfriend), you cannot possibly become a fan. The latter category includes bankers, bureaucrats who get rich, former senators shilling for the evil firm Monsanto, clean-shaven chief executives who wear ties, and talking heads on television making outsized bonuses. You don't just envy them; you take umbrage at their fame, and the sight of their expensive or even semi-expensive car triggers some feeling of bitterness. They make you feel smaller.", "begin": 15984.35, "end": 16030.31, "localBegin": 61.96, "localEnd": 107.92}, {"id": "c006_f000007", "text": "There may be something dissonant in the spectacle of a rich slave.", "begin": 16030.31, "end": 16039.27, "localBegin": 107.92, "localEnd": 116.88}, {"id": "c006_f000008", "text": "The author Joan C. Williams, in an insightful article, explains that the American working class is impressed by the rich, as role models - something people in the media, who communicate with one another but rarely with subjects in the real world, don't realize, as they impart normative ideas to people (\"this is how they should think\"). Michèle Lamont, the author of The Dignity of Working Men, cited by Williams, did a systematic interview of blue-collar Americans and found a resentment of high-paid professionals but, unexpectedly, not of the rich.", "begin": 16039.27, "end": 16087.59, "localBegin": 116.88, "localEnd": 165.2}, {"id": "c006_f000009", "text": "It is safe to say that the American public - actually all publics - despises people who make a lot of money on a salary, or, rather, salarymen who make a lot of money. This is indeed generalized to other countries: a few years ago the Swiss, of all people, ran a referendum for a law capping salaries of managers to a set multiple of the lowest wage. The law didn't pass, but the fact that they thought in these terms is rather significant. For the same Swiss hold rich entrepreneurs, and people who have derived their celebrity by other means, in some respect.", "begin": 16087.59, "end": 16121.07, "localBegin": 165.2, "localEnd": 198.68}, {"id": "c006_f000010", "text": "Further, in countries where wealth comes from rent-seeking, political patronage, or regulatory capture (which, I remind the reader, is how the powerful and the insiders use regulation to scam the public, or red tape to slow down competition), wealth is seen as zero-sum. What Peter gets is extracted from Paul. Someone getting rich is doing so at other people's expense. In countries such as the U.S., where wealth can come from destruction, people can easily see that someone getting rich is not taking dollars from your pocket; odds are he is even putting some in yours. On the other hand, inequality, by definition, is zero sum.", "begin": 16121.07, "end": 16168.79, "localBegin": 198.68, "localEnd": 246.4}, {"id": "c006_f000011", "text": "In this chapter, I will propose that what people resent - or should resent - is the person at the top who has no skin in the game, that is, because he doesn't bear his allotted risk, he is immune to the possibility of falling from his pedestal, exiting his income or wealth bracket, and waiting in line outside the soup kitchen. Again, on that account, the detractors of Donald Trump, when he was still a candidate, not only misunderstood the value of scars as risk signaling, but they also failed to realize that, by advertising his episode of bankruptcy and his personal losses of close to a billion dollars, he removed the resentment (the second type of inequality) people may have had toward him. There is something respectable in losing a billion dollars, provided it is your own money.", "begin": 16168.79, "end": 16216.07, "localBegin": 246.4, "localEnd": 293.68}, {"id": "c006_f000012", "text": "In addition, someone without skin in the game - say, a corporate executive with upside and no financial downside (the type to speak clearly in meetings) - is paid according to some metrics that do not necessarily reflect the health of his company; these he can manipulate, hide risks, get the bonus, then retire (or go do the same thing at another company) and blame his successor for subsequent results.", "begin": 16216.07, "end": 16241.51, "localBegin": 293.68, "localEnd": 319.12}, {"id": "c006_f000013", "text": "We will also, in the process, redefine inequality and put the notion on more rigorous grounds. But we first need to introduce the difference between two types of approaches, the static and the dynamic, as skin in the game can transform one type of inequality into another.", "begin": 16241.51, "end": 16258.51, "localBegin": 319.12, "localEnd": 336.12}, {"id": "c006_f000014", "text": "Take also the two following remarks:", "begin": 16258.51, "end": 16260.95, "localBegin": 336.12, "localEnd": 338.56}, {"id": "c006_f000015", "text": "True equality is equality in probability.", "begin": 16260.95, "end": 16264.47, "localBegin": 338.56, "localEnd": 342.08}, {"id": "c006_f000016", "text": "and", "begin": 16264.47, "end": 16265.11, "localBegin": 342.08, "localEnd": 342.72}, {"id": "c006_f000017", "text": "Skin in the game prevents systems from rotting.", "begin": 16265.11, "end": 16270.79, "localBegin": 342.72, "localEnd": 348.4}, {"id": "c006_f000018", "text": "THE STATIC AND THE DYNAMIC", "begin": 16270.79, "end": 16274.11, "localBegin": 348.4, "localEnd": 351.72}, {"id": "c006_f000019", "text": "Visibly, a problem with economists (particularly those who never took risk) is that they have mental difficulties with things that move and are unable to consider that things that move have different attributes from things that don't. That's the reason complexity theory and fat tails (which we will explain a few pages down) are foreign to most of them; they also have (severe) difficulties with the mathematical and conceptual intuitions required for deeper probability theory. Blindness to ergodicity, which we will begin to define a few paragraphs down, is indeed in my opinion the best marker separating a genuine scholar who understands something about the world from an academic hack who partakes of ritualistic paper writing.", "begin": 16274.11, "end": 16316.75, "localBegin": 351.72, "localEnd": 394.36}, {"id": "c006_f000020", "text": "A few definitions:", "begin": 16316.75, "end": 16318.43, "localBegin": 394.36, "localEnd": 396.04}, {"id": "c006_f000021", "text": "Static inequality is a snapshot view of inequality; it does not reflect what will happen to you in the course of your life.", "begin": 16318.43, "end": 16327.43, "localBegin": 396.04, "localEnd": 405.04}, {"id": "c006_f000022", "text": "Consider that about 10 percent of Americans will spend at least a year in the top 1 percent, and more than half of all Americans will spend a year in the top 10 percent. This is visibly not the same for the more static - but nominally more equal - Europe. For instance, only 10 percent of the wealthiest five hundred American people or dynasties were so thirty years ago; more than 60 percent on the French list are heirs and a third of the richest Europeans were the richest centuries ago. In Florence, it was just revealed that things are even worse: the same handful of families have kept the wealth for five centuries.", "begin": 16327.43, "end": 16377.75, "localBegin": 405.04, "localEnd": 455.36}, {"id": "c006_f000023", "text": "Dynamic (ergodic) inequality takes into account the entire future and past life.", "begin": 16377.75, "end": 16384.19, "localBegin": 455.36, "localEnd": 461.8}, {"id": "c006_f000024", "text": "You do not create dynamic equality just by raising the level of those at the bottom, but rather by making the rich rotate - or by forcing people to incur the possibility of creating an opening.", "begin": 16384.19, "end": 16395.63, "localBegin": 461.8, "localEnd": 473.24}, {"id": "c006_f000025", "text": "The way to make society more equal is by forcing (through skin in the game) the rich to be subjected to the risk of exiting from the 1 percent.", "begin": 16395.63, "end": 16411.67, "localBegin": 473.24, "localEnd": 489.28}, {"id": "c006_f000026", "text": "Our condition here is stronger than mere income mobility. Mobility means that someone can become rich. The no-absorbing-barrier condition means that someone who is rich should never be certain to stay rich.", "begin": 16411.67, "end": 16425.11, "localBegin": 489.28, "localEnd": 502.72}, {"id": "c006_f000027", "text": "Now, even more mathematically,", "begin": 16425.11, "end": 16427.87, "localBegin": 502.72, "localEnd": 505.48}, {"id": "c006_f000028", "text": "Dynamic equality is what restores ergodicity, making time and ensemble probabilities substitutable.", "begin": 16427.87, "end": 16436.27, "localBegin": 505.48, "localEnd": 513.88}, {"id": "c006_f000029", "text": "Let me explain ergodicity - something that we said is foreign to the intelligentsia. Chapter 19 at the back of the book goes into the details; it cancels most crucial psychological experiments related to probability and rationality. The intuition for now is as follows. Take a cross-sectional picture of the U.S. population. You have, say, a minority of millionaires in the one percent, some overweight, some tall, some humorous. You also have a high majority of people in the lower middle class, yoga instructors, baking experts, gardening consultants, spreadsheet theoreticians, dancing advisors, and piano repairpersons - plus of course the Spanish grammar specialist. Take the percentages of each income or wealth bracket (note that the inequality of income is typically flatter than that of wealth). Perfect ergodicity means that each one of us, should he live forever, would spend a proportion of time in the economic conditions of the entire cross-section: out of, say, a century, an average of sixty years in the lower middle class, ten years in the upper middle class, twenty years in the blue-collar class, and perhaps one single year in the one percent.", "begin": 16436.27, "end": 16549.63, "localBegin": 513.88, "localEnd": 627.24}, {"id": "c006_f000030", "text": "The exact opposite of perfect ergodicity is an absorbing state. The term absorption is derived from particles that, when they hit an obstacle, get absorbed or stick to it. An absorbing barrier is like a trap, once in, you can't get out, good or bad. A person gets rich by some process, then, having arrived, he stays rich. And if someone enters the lower middle class (from above), he will never have the chance to exit from it and become rich should he want to, of course - hence will be justified to resent the rich. You will notice that where the state is large, people at the top tend to have little downward mobility - in such places as France, the state is chummy with large corporations and protects their executives and shareholders from experiencing such descent; it even encourages their ascent.", "begin": 16549.63, "end": 16599.63, "localBegin": 627.24, "localEnd": 677.24}, {"id": "c006_f000031", "text": "And no downside for some means no upside for the rest.", "begin": 16599.63, "end": 16603.67, "localBegin": 677.24, "localEnd": 681.28}, {"id": "c006_f000032", "text": "PIKETTISM AND THE REVOLT OF THE MANDARIN CLASS", "begin": 16603.67, "end": 16616.15, "localBegin": 681.28, "localEnd": 693.76}, {"id": "c006_f000033", "text": "There is a class often called the Mandarins, after the fictionalized memoirs of the French author Simone de Beauvoir, named after the scholars of the Ming dynasty (the high Chinese language is also called Mandarin). I have always been aware of their existence, but a salient - and pernicious - attribute came to me while observing the reactions of its members to the works of the French economist Thomas Piketty.", "begin": 16616.15, "end": 16639.19, "localBegin": 693.76, "localEnd": 716.8}, {"id": "c006_f000034", "text": "Piketty followed Karl Marx by writing an ambitious book on capital. A friend gave me the book as a gift when it was still in French (and unknown outside France) because I find it commendable that people publish their original, nonmathematical work in social science in book format. The book, Capital in the Twenty-first Century, makes aggressive claims about the alarming rise of inequality, adding to it a theory of why capital tends to command too much return in relation to labor and how the absence of redistribution and dispossession might make the world collapse. Piketty's theory about the increase in the return of capital in relation to labor is patently wrong, as anyone who has witnessed the rise of what is called the \"knowledge economy\" (or anyone who has had investments in general) knows.", "begin": 16639.19, "end": 16686.19, "localBegin": 716.8, "localEnd": 763.8}, {"id": "c006_f000035", "text": "Clearly, when you say that inequality changes from year one to year two, you need to show that those who are at the top are the same people - something Piketty doesn't do (remember that he is an economist and has trouble with things that move). But the problem doesn't stop there. Soon, I discovered that - aside from deriving conclusions from static measures of inequality - the methods he used were flawed: Piketty's tools did not match what he purported to show about the rise in inequality. There was no mathematical rigor. I soon wrote two articles (one in collaboration with Raphael Douady, another with Andrea Fontanari and Pasquale Cirillo, published in Physica A: Statistical Mechanics and Applications), about the measure of inequality that consists in taking the ownership of, say, th
