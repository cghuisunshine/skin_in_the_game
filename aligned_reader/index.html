e top 1 percent and monitoring its variations. The flaw is that if you take the inequality thus measured in Europe as a whole, you will find it is higher than the average inequality across component countries; the bias increases in severity with processes that deliver a high degree of inequality. All in all, the papers had enough theorems and proofs to make them about as ironclad a piece of work as one can have in science; although it was not necessary, I insisted on putting the results in theorem form because someone cannot contest a formally proved theorem without putting in question his own understanding of mathematics.", "begin": 16686.19, "end": 16773.95, "localBegin": 763.8, "localEnd": 851.56}, {"id": "c006_f000036", "text": "The reason these errors were not known was because economists who work with inequality were not familiar with…inequality. Inequality is the disproportion of the role of the tail - rich people were in the tails of the distribution. The more inequality in the system, the more the winner-take-all effect, the more we depart from the methods of thin-tailed Mediocristan (see Glossary) in which economists were trained. The wealth process is dominated by winner-take-all effects. Any form of control of the wealth process - typically instigated by bureaucrats - tends to lock people with privileges in their state of entitlement. So the solution is to allow the system to destroy the strong, something that works best in the United States.", "begin": 16773.95, "end": 16843.15, "localBegin": 851.56, "localEnd": 920.76}, {"id": "c006_f000037", "text": "But there was something far, far more severe than a scholar being wrong.", "begin": 16843.15, "end": 16848.71, "localBegin": 920.76, "localEnd": 926.32}, {"id": "c006_f000038", "text": "The problem is never the problem; it is how people handle it. What was worse than Piketty's flaws was the discovery of how that Mandarin class operates. They got so prematurely excited by the \"evidence\" of the rise in inequality that their reactions were like fake news. Actually, they were fake news. Economists got so carried away; they praised Piketty for his \"erudition\" because he discussed Balzac and Jane Austen, the equivalent to hailing as a weight lifter someone spotted carrying a briefcase across Terminal B. And they completely ignored my results - and when they didn't, it was to declare that I was \"arrogant\"(recall the strategy of using formal mathematics as a way to make it impossible to say you are wrong) - which is a form of scientific compliment. Even Paul Krugman (a currently famous economist and public intellectual) wrote, \"If you think you've found an obvious hole, empirical or logical, in Piketty, you're very probably wrong. He's done his homework!\" When I met him in person and pointed out the flaw to him, he evaded it - not necessarily out of malice, but most likely because probability and combinatorics eluded him, by his own admission.", "begin": 16848.71, "end": 16920.11, "localBegin": 926.32, "localEnd": 997.72}, {"id": "c006_f000039", "text": "Now consider that the likes of Krugman and Piketty have no downside in their existence - lowering inequality brings them up in the ladder of life. Unless the university system or the French state goes bust, they will continue receiving their paychecks. The fellow you just saw in the steak restaurant dripping with gold chains is exposed to the risk of the soup kitchen, not them. Just as those who live by the sword die by the sword, those who earn their living taking risks will lose their livelihood taking risks.", "begin": 16920.11, "end": 16965.79, "localBegin": 997.72, "localEnd": 1043.4}, {"id": "c006_f000040", "text": "We've made a big deal out of Piketty here because the widespread enthusiasm for his book was representative of the behavior of that class of people who love to theorize and engage in false solidarity with the oppressed, while consolidating their privileges.", "begin": 16965.79, "end": 17006.31, "localBegin": 1043.4, "localEnd": 1083.92}, {"id": "c006_f000041", "text": "COBBLER ENVIES COBBLER", "begin": 17006.31, "end": 17012.19, "localBegin": 1083.92, "localEnd": 1089.8}, {"id": "c006_f000042", "text": "The reason regular people are not as acrimonious as the \"intellectuals\" and bureaucrats is because envy does not travel long distance or cross many social classes. Envy does not originate with the impoverished, concerned with the betterment of their condition, but with the clerical class. Simply, it looks like it was the university professors (who have \"arrived\") and people who have permanent stability of income, in the form of tenure, governmental or academic, who bought heavily into Piketty's argument. From conversations, I became convinced that people who counterfactual upwards (i.e., compare themselves to those richer) want to actively dispossess the rich. As with all communist movements, it is often the bourgeois or clerical classes who are the early adopters of revolutionary theories. So class envy doesn't originate from a truck driver in South Alabama, but from a New York or Washington, D.C., Ivy League-educated IYI (say Paul Krugman or Joseph Stiglitz) with a sense of entitlement, upset some \"less smart\" persons are much richer.", "begin": 17012.19, "end": 17078.47, "localBegin": 1089.8, "localEnd": 1156.08}, {"id": "c006_f000043", "text": "Aristotle, in his Rhetoric, postulated that envy is something you are more likely to encounter in your own kin: lower classes are more likely to experience envy toward their cousins or the middle class than toward the very rich. And the expression Nobody is a prophet in his own land, making envy a geographical thing (mistakenly thought to originate with Jesus), originates from that passage in the Rhetoric. Aristotle himself was building on Hesiod: cobbler envies cobbler, carpenter envies carpenter. Later, Jean de La Bruyère wrote that jealousy is to be found within the same art, talent, and condition.", "begin": 17078.47, "end": 17117.63, "localBegin": 1156.08, "localEnd": 1195.24}, {"id": "c006_f000044", "text": "So I doubt Piketty bothered to ask blue-collar Frenchmen what they want, as Michelle Lamont did (as we saw earlier in the chapter). I am certain that they would ask for better beer, a new dishwasher, or faster trains for their commute, not to bring down some rich businessman invisible to them. But, again, people can frame questions and portray enrichment as theft, as was done before the French Revolution, in which case the blue-collar class would ask, once again, for heads to roll.", "begin": 17117.63, "end": 17147.63, "localBegin": 1195.24, "localEnd": 1225.24}, {"id": "c006_f000045", "text": "INEQUALITY, WEALTH, AND VERTICAL SOCIALIZATION", "begin": 17147.63, "end": 17157.55, "localBegin": 1225.24, "localEnd": 1235.16}, {"id": "c006_f000046", "text": "If intellectuals are overly worried about inequality, it is because they tend to view themselves in hierarchical terms, and thus think that others do too. Furthermore, as if by pathology, discussions in \"competitive\" universities are all about hierarchy. Most people in the real world don't obsess over it.", "begin": 17157.55, "end": 17199.79, "localBegin": 1235.16, "localEnd": 1277.4}, {"id": "c006_f000047", "text": "In the more rural past, envy was rather controlled; wealthy people were not as exposed to other persons of their class. They didn't have the pressure to keep up with other wealthy persons and compete with them. The wealthy stayed within their region, surrounded by people who depended on them, say a lord on his property. Except for the occasional season in the cities, their social life was quite vertical. Their children played with the children of the servants.", "begin": 17199.79, "end": 17227.07, "localBegin": 1277.4, "localEnd": 1304.68}, {"id": "c006_f000048", "text": "It was in mercantile urban environments that socializing within social classes took place. And, over time, with industrialization, the rich started moving to cities or suburbs surrounded by other people of similar - but not completely similar - condition. Hence they needed to keep up with each other, racing on a treadmill.", "begin": 17227.07, "end": 17247.35, "localBegin": 1304.68, "localEnd": 1324.96}, {"id": "c006_f000049", "text": "For a rich person isolated from vertical socializing with the poor, the poor become something entirely theoretical, a textbook reference. As I mentioned in the past chapter, I have yet to see a bien pensant Cambridge don hanging out with Pakistani cab drivers or lifting weights with cockney speakers. The intelligentsia therefore feels entitled to deal with the poor as a construct; one they created. Thus they become convinced that they know what is best for them.", "begin": 17247.35, "end": 17277.95, "localBegin": 1324.96, "localEnd": 1355.56}, {"id": "c006_f000050", "text": "EMPATHY AND HOMOPHILY", "begin": 17277.95, "end": 17280.91, "localBegin": 1355.56, "localEnd": 1358.52}, {"id": "c006_f000051", "text": "Recall the scaling problem, the idea that people's ethical rules are not universal; they vary according to whether someone is \"Swiss,\" that is, an outsider or not.", "begin": 17280.91, "end": 17292.43, "localBegin": 1358.52, "localEnd": 1370.04}, {"id": "c006_f000052", "text": "The same applies to empathy (the reverse of envy). You can see that people feel more for those of their class. Traditionally, the upper class engaged in rescuing those from ruined families by making them \"stewards\" or dames de compagnie. Such in-group protection has a self-insurance attribute - something that can only work for a limited number of people and can't be universalized: you take care of my progeny if they are ruined; I will take care of yours.", "begin": 17292.43, "end": 17320.55, "localBegin": 1370.04, "localEnd": 1398.16}, {"id": "c006_f000053", "text": "DATA, SHMATA", "begin": 17320.55, "end": 17325.91, "localBegin": 1398.16, "localEnd": 1403.52}, {"id": "c006_f000054", "text": "Another lesson from Piketty's ambitious volume: it was loaded with charts and tables. There is a lesson here: what we learn from professionals in the real world is that data is not necessarily rigor. One reason I - as a probability professional - left data out of The Black Swan (except for illustrative purposes) is that it seems to me that people flood their stories with numbers and graphs in the absence of solid or logical arguments. Further, people mistake empiricism for a flood of data. Just a little bit of significant data is needed when one is right, particularly when it is disconfirmatory empiricism, or counterexamples: only one data point (a single extreme deviation) is sufficient to show that Black Swans exist.", "begin": 17325.91, "end": 17371.23, "localBegin": 1403.52, "localEnd": 1448.84}, {"id": "c006_f000055", "text": "Traders, when they make profits, have short communications; when they lose they drown you in details, theories, and charts.", "begin": 17371.23, "end": 17381.35, "localBegin": 1448.84, "localEnd": 1458.96}, {"id": "c006_f000056", "text": "Probability, statistics, and data science are principally logic fed by observations - and absence of observations. For many environments, the relevant data points are those in the extremes; these are rare by definition, and it suffices to focus on those few but big to get an idea of the story. If you want to show that a person has more than, say $10 million, all you need is to show the $50 million in his brokerage account, not, in addition, list every piece of furniture in his house, including the $500 painting in his study and the silver spoons in the pantry. So I've discovered, with experience, that when you buy a thick book with tons of graphs and tables used to prove a point, you should be suspicious. It means something didn't distill right! But for the general public and those untrained in statistics, such tables appear convincing - another way to substitute the true with the complicated.", "begin": 17381.35, "end": 17437.83, "localBegin": 1458.96, "localEnd": 1515.44}, {"id": "c006_f000057", "text": "For instance, the science journalist Steven Pinker played that trick with his book The Better Angels of Our Nature, which claims a decline of violence in modern human history, and attributes this to modern institutions. My collaborator Pasquale Cirillo and I, when we put his \"data\" under scrutiny, found out that either he didn't understand his own numbers (actually, he didn't), or he had a story in mind and kept adding charts, not realizing that statistics isn't about data but distillation, rigor, and avoiding being fooled by randomness - but no matter, the general public and his state-worshipping IYI colleagues found it impressive (for a while).", "begin": 17437.83, "end": 17479.79, "localBegin": 1515.44, "localEnd": 1557.4}, {"id": "c006_f000058", "text": "ETHICS OF CIVIL SERVICE", "begin": 17479.79, "end": 17482.79, "localBegin": 1557.4, "localEnd": 1560.4}, {"id": "c006_f000059", "text": "Let us finish this discussion with an unfairness that is worse than inequality: the sore sight of back office, non-risk-takers getting rich from public service.", "begin": 17482.79, "end": 17493.71, "localBegin": 1560.4, "localEnd": 1571.32}, {"id": "c006_f000060", "text": "When, on leaving office, Barack Obama accepted a sum of more than $40 million to write his memoirs, many people were outraged. His supporters, statists who were defending him, on the other hand, were critical of the rich entrepreneurs hired by the subsequent administration. Money is greed, for them - but those who did not earn the money via commerce were illogically exempt. I had a rough time explaining that having rich people in a public office is very different from having public people become rich - again, it is the dynamics, the sequence, that matters.", "begin": 17493.71, "end": 17528.79, "localBegin": 1571.32, "localEnd": 1606.4}, {"id": "c006_f000061", "text": "Rich people in public office have shown some evidence of lack of total incompetence - success may come from randomness, of course, but we at least have a hint of some skill in the real world, some evidence that the person has dealt with reality. This is of course conditional on the person having had skin in the game - and it is better if the person felt a blowup, has experienced at least once the loss of part of his or her fortune and the angst associated with it.", "begin": 17528.79, "end": 17556.03, "localBegin": 1606.4, "localEnd": 1633.64}, {"id": "c006_f000062", "text": "As usual, there is a mix of the ethical and the effective here.", "begin": 17556.03, "end": 17560.19, "localBegin": 1633.64, "localEnd": 1637.8}, {"id": "c006_f000063", "text": "It is downright unethical to use public office for enrichment.", "begin": 17560.19, "end": 17565.11, "localBegin": 1637.8, "localEnd": 1642.72}, {"id": "c006_f000064", "text": "A good rule for society is to oblige those who start in public office to pledge never subsequently to earn from the private sector more than a set amount; the rest should go to the taxpayer. This will ensure sincerity in, literally, \"service\" - where employees are supposedly underpaid because of their emotional reward from serving society. It would prove that they are not in the public sector as an investment strategy: you do not become a Jesuit priest because it may help you get hired by Goldman Sachs later, after your eventual defrocking - given the erudition and the masterly control of casuistry generally associated with the Society of Jesus.", "begin": 17565.11, "end": 17602.23, "localBegin": 1642.72, "localEnd": 1679.84}, {"id": "c006_f000065", "text": "Currently, most civil servants tend to stay in civil service - except for those in delicate areas that industry controls: the agro-alimentary segment, finance, aerospace, anything related to Saudi Arabia…", "begin": 17602.23, "end": 17617.99, "localBegin": 1679.84, "localEnd": 1695.6}, {"id": "c006_f000066", "text": "A civil servant can make rules that are friendly to an industry such as banking - and then go off to J.P. Morgan and recoup a multiple of the difference between his or her current salary and the market rate. (Regulators, you may recall, have an incentive to make rules as complex as possible so their expertise can later be hired at a higher price.)", "begin": 17617.99, "end": 17637.47, "localBegin": 1695.6, "localEnd": 1715.08}, {"id": "c006_f000067", "text": "So there is an implicit bribe in civil service: you act as a servant to an industry, say, Monsanto, and they take care of you later on. They do not do it out of a sense of honor: simply, it is necessary to keep the system going and encourage the next guy to play by these rules. The IYI-cum-cronyist former Treasury Secretary Tim Geithner - with whom I share the Calabrese barber of the Prologue - was overtly rewarded by the industry he helped bail out. He helped bankers get bailouts, let them pay themselves from the largest bonus pool in history after the crisis, in 2010 (that is, using taxpayer money), and then got a multimillion-dollar job at a financial institution as his reward for good behavior.", "begin": 17637.47, "end": 17686.67, "localBegin": 1715.08, "localEnd": 1764.28}, {"id": "c006_f000068", "text": "NEXT", "begin": 17686.67, "end": 17688.75, "localBegin": 1764.28, "localEnd": 1766.36}, {"id": "c006_f000069", "text": "There is a vicious domain-dependence of expertise: the electrician, dentist, scholar of Portuguese irregular verbs, assistant colonoscopist, London cabby, and algebraic geometer are experts (plus or minus some local variations), while the journalist, State Department bureaucrat, clinical psychologist, management theorist, publishing executive, and macroeconomist are not. This allows us to answer the questions: Who is the real expert? Who decides who is and who is not an expert? Where is the meta-expert?", "begin": 17688.75, "end": 17721.79, "localBegin": 1766.36, "localEnd": 1799.4}, {"id": "c006_f000070", "text": "Time is the expert. Or, rather, the temperamental and ruthless Lindy, as we see in the next chapter.", "begin": 17721.79, "end": 17734.59, "localBegin": 1799.4, "localEnd": 1812.2}, {"id": "c006_f000071", "text": "Chapter 8 An Expert Called Lindy", "begin": 17734.59, "end": 17737.75, "localBegin": 1812.2, "localEnd": 1815.36}, {"id": "c006_f000072", "text": "She is the one and only expert - Don't eat their cheesecake - Meta-experts judged by meta-meta-experts - Prostitutes, nonprostitutes, and amateurs", "begin": 17737.75, "end": 17752.83, "localBegin": 1815.36, "localEnd": 1830.44}, {"id": "c006_f000073", "text": "Lindy is a deli in New York, now a tourist trap, that proudly claims to be famous for its cheesecake, but in fact has been known for fifty or so years by physicists and mathematicians thanks to the heuristic that developed there. Actors who hung out there gossiping about other actors discovered that Broadway shows that lasted for, say, one hundred days, had a future life expectancy of a hundred more. For those that lasted two hundred days, two hundred more. The heuristic became known as the Lindy effect.", "begin": 17752.83, "end": 17784.27, "localBegin": 1830.44, "localEnd": 1861.88}, {"id": "c006_f000074", "text": "Let me warn the reader: while the Lindy effect is one of the most useful, robust, and universal heuristics I know, Lindy's cheesecake is…much less distinguished. Odds are the deli will not survive, by the Lindy effect.", "begin": 17784.27, "end": 17797.55, "localBegin": 1861.88, "localEnd": 1875.16}, {"id": "c006_f000075", "text": "There had been a bevy of mathematical models that sort of fit the story, though not really, until a) yours truly figured out that the Lindy effect can be best understood using the theory of fragility and antifragility, and b) the mathematician Iddo Eliazar formalized its probabilistic structure. Actually the theory of fragility directly leads to the Lindy effect. Simply, my collaborators and I managed to define fragility as sensitivity to disorder: the porcelain owl sitting in front of me on the writing desk, as I am writing these lines, wants tranquility. It dislikes shocks, disorder, variations, earthquakes, mishandling by dust-phobic cleaning service operators, travel in a suitcase transiting through Terminal 5 in Heathrow, and shelling by Saudi Barbaria-sponsored Islamist militias. Clearly, it has no upside from random events and, more generally, disorder. (More technically, being fragile, it necessarily has a nonlinear reaction to stressors: up until its breaking point, shocks of larger intensity affect it disproportionally more than smaller ones).", "begin": 17797.55, "end": 17868.43, "localBegin": 1875.16, "localEnd": 1946.04}, {"id": "c006_f000076", "text": "Now, crucially, time is equivalent to disorder, and resistance to the ravages of time, that is, what we gloriously call survival, is the ability to handle disorder.", "begin": 17868.43, "end": 17879.79, "localBegin": 1946.04, "localEnd": 1957.4}, {"id": "c006_f000077", "text": "That which is fragile has an asymmetric response to volatility and other stressors, that is, will experience more harm than benefit from it.", "begin": 17879.79, "end": 17889.99, "localBegin": 1957.4, "localEnd": 1967.6}, {"id": "c006_f000078", "text": "In probability, volatility and time are the same. The idea of fragility helped put some rigor around the notion that the only effective judge of things is time - by things we mean ideas, people, intellectual productions, car models, scientific theories, books, etc. You can't fool Lindy: books of the type written by the current hotshot Op-Ed writer at TheNew York Times may get some hype at publication time, manufactured or spontaneous, but their five-year survival rate is generally less than that of pancreatic cancer.", "begin": 17889.99, "end": 17925.83, "localBegin": 1967.6, "localEnd": 2003.44}, {"id": "c006_f000079", "text": "WHO IS THE \"REAL\" EXPERT?", "begin": 17925.83, "end": 17928.95, "localBegin": 2003.44, "localEnd": 2006.56}, {"id": "c006_f000080", "text": "Effectively Lindy answers the age-old meta-questions: Who will judge the expert? Who will guard the guard? (Quis custodiet ipsos custodes?) Who will judge the judges? Well, survival will.", "begin": 17928.95, "end": 17944.79, "localBegin": 2006.56, "localEnd": 2022.4}, {"id": "c006_f000081", "text": "For time operates through skin in the game. Things that have survived are hinting to us ex post that they have some robustness - conditional on their being exposed to harm. For without skin in the game, via exposure to reality, the mechanism of fragility is disrupted: things may survive for no reason for a while, at some scale, then ultimately collapse, causing a lot of collateral harm.", "begin": 17944.79, "end": 17970.43, "localBegin": 2022.4, "localEnd": 2048.04}, {"id": "c006_f000082", "text": "A few more details (for those interested in the intricacies, the Lindy effect has been covered at length in Antifragile). There are two ways things handle time. First, there is aging and perishability: things die because they have a biological clock, what we call senescence. Second, there is hazard, the rate of accidents. What we witness in physical life is the combination of the two: when you are old and fragile, you don't handle accidents very well. These accidents don't have to be external, like falling from a ladder or being attacked by a bear; they can also be internal, from random malfunctioning of your organs or circulation. On the other hand, animals that don't really age, say turtles and crocodiles, seem to have a remaining life expectancy that stays constant for a long time. If a twenty-year-old crocodile has forty more years to live (owing to the perils of the habitat), a forty-year-old one will also have about forty years to live.", "begin": 17970.43, "end": 18029.47, "localBegin": 2048.04, "localEnd": 2107.08}, {"id": "c006_f000083", "text": "Let us use as shorthand \"Lindy proof,\" \"is Lindy,\" or \"Lindy compatible\" (one can substitute for another) to show something that seems to belong to the class of things that have proven to have the following property:", "begin": 18029.47, "end": 18041.47, "localBegin": 2107.08, "localEnd": 2119.08}, {"id": "c006_f000084", "text": "That which is \"Lindy\" is what ages in reverse, i.e., its life expectancy lengthens with time, conditional on survival.", "begin": 18041.47, "end": 18052.07, "localBegin": 2119.08, "localEnd": 2129.68}, {"id": "c006_f000085", "text": "Only the nonperishable can be Lindy. When it comes to ideas, books, technologies, procedures, institutions, and political systems under Lindy, there is no intrinsic aging and perishability. A physical copy of War and Peace can age (particularly when the publisher cuts corners to save twenty cents on paper for a fifty-dollar book); the book itself as an idea doesn't.", "begin": 18052.07, "end": 18076.71, "localBegin": 2129.68, "localEnd": 2154.32}, {"id": "c006_f000086", "text": "Note that thanks to Lindy, no expert is the final expert anymore and we do not need meta-experts judging the expertise of experts one rank below them. We solve the \"turtles all the way down\" problem. Fragility is the expert, hence time and survival.", "begin": 18076.71, "end": 18109.19, "localBegin": 2154.32, "localEnd": 2186.8}, {"id": "c006_f000087", "text": "THE LINDY OF LINDY", "begin": 18109.19, "end": 18114.59, "localBegin": 2186.8, "localEnd": 2192.2}, {"id": "c006_f000088", "text": "The idea of the Lindy effect is itself Lindy-proof. The pre-Socratic thinker Periander of Corinth wrote, more than twenty-five hundred years ago: Use laws that are old but food that is fresh.", "begin": 18114.59, "end": 18126.43, "localBegin": 2192.2, "localEnd": 2204.04}, {"id": "c006_f000089", "text": "Likewise, Alfonso X of Spain, nicknamed El Sabio, \"the wise,\" had as a maxim: Burn old logs. Drink old wine. Read old books. Keep old friends.", "begin": 18126.43, "end": 18140.55, "localBegin": 2204.04, "localEnd": 2218.16}, {"id": "c006_f000090", "text": "The insightful and luckily nonacademic historian Tom Holland once commented: \"The thing I most admire about the Romans was the utter contempt they were capable of showing the cult of youth.\" He also wrote: \"The Romans judged their political system by asking not whether it made sense but whether it worked,\" which is why, while dedicating this book, I called Ron Paul a Roman among Greeks.", "begin": 18140.55, "end": 18166.19, "localBegin": 2218.16, "localEnd": 2243.8}, {"id": "c006_f000091", "text": "DO WE NEED A JUDGE?", "begin": 18166.19, "end": 18170.23, "localBegin": 2243.8, "localEnd": 2247.84}, {"id": "c006_f000092", "text": "As I mentioned earlier in Prologue 3, I have held for most of my (sort of) academic career no more than a quarter position. A quarter is enough to have somewhere to go, particularly when it rains in New York, without being emotionally socialized and losing intellectual independence for fear of missing a party or having to eat alone. But one (now \"resigned\") department head one day came to me and emitted the warning: \"Just as, when a businessman and author you are judged by other businessmen and authors, here as an academic you are judged by other academics. Life is about peer assessment.\"", "begin": 18170.23, "end": 18208.11, "localBegin": 2247.84, "localEnd": 2285.72}, {"id": "c006_f000093", "text": "It took me a while to overcome my disgust - I am still not fully familiar with the way non-risk-takers work; they actually don't realize that others are not like them, and can't get what makes real people tick. No, businessmen as risk takers are not subjected to the judgment of other businessmen, only to that of their personal accountant. They just need to avoid having a documented record of (some) ethical violations. Furthermore, not only did you not want peer approval, you wanted disapproval (except for ethical matters): an old fellow pit trader once shared his wisdom: \"If people over here like you, you are doing something wrong.\"", "begin": 18208.11, "end": 18249.71, "localBegin": 2285.72, "localEnd": 2327.32}, {"id": "c006_f000094", "text": "Further,", "begin": 18249.71, "end": 18250.79, "localBegin": 2327.32, "localEnd": 2328.4}, {"id": "c006_f000095", "text": "You can define a free person precisely as someone whose fate is not centrally or directly dependent on peer assessment.", "begin": 18250.79, "end": 18258.15, "localBegin": 2328.4, "localEnd": 2335.76}, {"id": "c006_f000096", "text": "And as an essayist, I am not judged by other writers, book editors, and book reviewers, but by readers. Readers? Maybe, but wait a minute…not today's readers. Only those of tomorrow, and the day after tomorrow. So, my only real judge being time, it is the stability and robustness of the readership (that is, future readers) that counts. The fashion-oriented steady reader of the most recently reviewed book in TheNew York Times is of no interest to me. And as a risk taker, only time counts - for I could fool my accountant with steady earnings with a lot of hidden risk, but time will eventually reveal them.", "begin": 18258.15, "end": 18297.71, "localBegin": 2335.76, "localEnd": 2375.32}, {"id": "c006_f000097", "text": "Being reviewed or assessed by others matters if and only if one is subjected to the judgment of future - not just present - others.", "begin": 18297.71, "end": 18324.95, "localBegin": 2375.32, "localEnd": 2402.56}, {"id": "c006_f000098", "text": "And recall that, a free person does not need to win arguments - just win.", "begin": 18324.95, "end": 18334.91, "localBegin": 2402.56, "localEnd": 2412.52}, {"id": "c006_f000099", "text": "TEA WITH THE QUEEN", "begin": 18334.91, "end": 18338.51, "localBegin": 2412.52, "localEnd": 2416.12}, {"id": "c006_f000100", "text": "Peers devolve honors, memberships in academies, Nobels, invitations to Davos and similar venues, tea (and cucumber sandwiches) with the Queen, requests by rich name-droppers to attend cocktail parties where you see only people who are famous. Believe me, there are rich people whose lives revolve around these things. They usually claim to be trying to save the world, the bears, the children, the mountains, the deserts - all the ingredients of the broadcasting of virtue.", "begin": 18338.51, "end": 18394.27, "localBegin": 2416.12, "localEnd": 2471.88}, {"id": "c006_f000101", "text": "But clearly they can't influence Lindy - in fact, it is the reverse. If you spend your time trying to impress others in the New York club 21, there may be something wrong with you.", "begin": 18394.27, "end": 18436.51, "localBegin": 2471.88, "localEnd": 2514.12}, {"id": "c006_f000102", "text": "Contemporary peers are valuable collaborators, not final judges.", "begin": 18436.51, "end": 18452.51, "localBegin": 2514.12, "localEnd": 2530.12}, {"id": "c006_f000103", "text": "INSTITUTIONS", "begin": 18452.51, "end": 18455.59, "localBegin": 2530.12, "localEnd": 2533.2}, {"id": "c006_f000104", "text": "In fact, there is something worse than peer-assessment: the bureaucratization of the activity creates a class of new judges: university administrators, who have no clue what someone is doing except via external signals, yet become the actual arbiters.", "begin": 18455.59, "end": 18492.35, "localBegin": 2533.2, "localEnd": 2569.96}, {"id": "c006_f000105", "text": "These arbiters fail to realize that \"prestigious\" publication, determined by peer-reviewers in a circular manner, are not Lindy-compatible - they only mean that a certain set of (currently) powerful people are happy with your work.", "begin": 18492.35, "end": 18507.71, "localBegin": 2569.96, "localEnd": 2585.32}, {"id": "c006_f000106", "text": "Hard science might be robust to the pathologies - even then. So let us take a look at social science. Given that the sole judges of a contributor are his \"peers,\" there is a citation ring in place that can lead to all manner of rotting. Macroeconomics, for instance, can be nonsense since it is easier to macrobull***t than microbull***t - nobody can tell if a theory really works.", "begin": 18507.71, "end": 18534.23, "localBegin": 2585.32, "localEnd": 2611.84}, {"id": "c006_f000107", "text": "If you say something crazy you will be deemed crazy. But if you create a collection of, say, twenty people who set up an academy and say crazy things accepted by the collective, you now have \"peer-reviewing\" and can start a department in a university.", "begin": 18534.23, "end": 18549.91, "localBegin": 2611.84, "localEnd": 2627.52}, {"id": "c006_f000108", "text": "Academia has a tendency, when unchecked (from lack of skin in the game), to evolve into a ritualistic self-referential publishing game.", "begin": 18549.91, "end": 18560.07, "localBegin": 2627.52, "localEnd": 2637.68}, {"id": "c006_f000109", "text": "Now, while academia has turned into an athletic contest, Wittgenstein held the exact opposite viewpoint: if anything, knowledge is the reverse of an athletic contest. In philosophy, the winner is the one who finishes last, he said.", "begin": 18560.07, "end": 18574.39, "localBegin": 2637.68, "localEnd": 2652.0}, {"id": "c006_f000110", "text": "Further,", "begin": 18574.39, "end": 18577.07, "localBegin": 2652.0, "localEnd": 2654.68}, {"id": "c006_f000111", "text": "Anything that smacks of competition destroys knowledge.", "begin": 18577.07, "end": 18582.59, "localBegin": 2654.68, "localEnd": 2660.2}, {"id": "c006_f000112", "text": "In some areas, such as gender studies or psychology, the ritualistic publishing game gradually maps less and less to real research, by the very nature of the agency problem, to reach a Mafia-like divergence of interest: researchers have their own agenda, at variance with what their clients, that is, society and the students, are paying them for. The opacity of the subject to outsiders helps them control the gates. Knowing \"economics\" doesn't mean knowing anything about economics in the sense of the real activity, but rather the theories, most of which are bull***t, produced by economists. And courses in universities, for which hard-working parents need to save over decades, easily degenerate into fashion. You work hard and save for your children to be taught a post-colonial study-oriented critique of quantum mechanics.", "begin": 18582.59, "end": 18633.27, "localBegin": 2660.2, "localEnd": 2710.88}, {"id": "c006_f000113", "text": "But there is a ray of hope. Actually, recent events indicate how the system will fold: alumni (who happen to have worked in the real world) are starting to cut funds to spurious and farcical disciplines (though not to the farcical approaches within traditional disciplines). After all, it so happens that someone needs to pay the salaries of macroeconomists and post-colonial gender \"experts.\" And university education needs to compete with professional training workshops: once upon a time, studying post-colonial theories could help one get a job other than serving French fries. No longer.", "begin": 18633.27, "end": 18670.59, "localBegin": 2710.88, "localEnd": 2748.2}, {"id": "c006_f000114", "text": "AGAINST ONE'S INTEREST", "begin": 18670.59, "end": 18674.83, "localBegin": 2748.2, "localEnd": 2752.44}, {"id": "c006_f000115", "text": "The most convincing statements are those in which one stands to lose, ones in which one has maximal skin in the game; the most unconvincing ones are those in which one patently (but unknowingly) tries to enhance one's status without making a tangible contribution (like, as we saw, in the great majority of academic papers that say nothing and take no risks). But it doesn't have to be that way. Showing off is reasonable; it is human. As long as the substance exceeds the showoff, you are fine. Stay human, take as much as you can, under the condition that you give more than you take.", "begin": 18674.83, "end": 18713.87, "localBegin": 2752.44, "localEnd": 2791.48}, {"id": "c006_f000116", "text": "One should give more weight to research that, while being rigorous, contradicts other peers, particularly if it entails costs and reputational harm for its author.", "begin": 18713.87, "end": 18724.03, "localBegin": 2791.48, "localEnd": 2801.64}, {"id": "c006_f000117", "text": "Further,", "begin": 18724.03, "end": 18726.03, "localBegin": 2801.64, "localEnd": 2803.64}, {"id": "c006_f000118", "text": "Someone with a high public presence who is controversial and takes risks for his opinion is less likely to be a bull***t vendor.", "begin": 18726.03, "end": 18741.79, "localBegin": 2803.64, "localEnd": 2819.4}, {"id": "c006_f000119", "text": "SOUL IN THE GAME, AGAIN", "begin": 18741.79, "end": 18747.99, "localBegin": 2819.4, "localEnd": 2825.6}, {"id": "c006_f000120", "text": "The deprostitutionalization of research will eventually be done as follows. Force people who want to do \"research\" to do it on their own time, that is, to derive their income from other sources. Sacrifice is necessary. It may seem absurd to brainwashed contemporaries, but Antifragile documents the outsized historical contributions of the nonprofessional, or, rather, the non-meretricious. For their research to be genuine, they should first have a real-world day job, or at least spend ten years as: lens maker, patent clerk, Mafia operator, professional gambler, postman, prison guard, medical doctor, limo driver, militia member, social security agent, trial lawyer, farmer, restaurant chef, high-volume waiter, firefighter (my favorite), lighthouse keeper, etc., while they are building their original ideas.", "begin": 18747.99, "end": 18808.03, "localBegin": 2825.6, "localEnd": 2885.64}, {"id": "c006_f000121", "text": "It is a filtering, nonsense-expurgating mechanism. I have no sympathy for moaning professional researchers. I for my part spent twenty-three years in a full-time, highly demanding, extremely stressful profession while studying, researching, and writing my first three books at night; it lowered (in fact, eliminated) my tolerance for career-building research.", "begin": 18808.03, "end": 18830.11, "localBegin": 2885.64, "localEnd": 2907.72}, {"id": "c006_f000122", "text": "(There is this illusion that just as businessmen are motivated and rewarded by profits, scientists should be motivated and rewarded by honors and recognition. That's not how it works. Remember, science is a minority rule: a few will run it, others are just back-office clerks.)", "begin": 18830.11, "end": 18847.79, "localBegin": 2907.72, "localEnd": 2925.4}, {"id": "c006_f000123", "text": "SCIENCE IS LINDY-PRONE", "begin": 18847.79, "end": 18851.99, "localBegin": 2925.4, "localEnd": 2929.6}, {"id": "c006_f000124", "text": "We said earlier that without skin in game, survival mechanisms are severely disrupted. This also applies to ideas.", "begin": 18851.99, "end": 18860.23, "localBegin": 2929.6, "localEnd": 2937.84}, {"id": "c006_f000125", "text": "Karl Popper's idea of science is an enterprise that produces claims that can be contradicted by eventual observations, not a series of verifiable ones: science is fundamentally disconfirmatory, not confirmatory. This mechanism of falsification is entirely Lindy-compatible; it actually requires the operation of the Lindy effect (in combination with the minority rule). Although Popper saw the statics, he didn't study the dynamics, nor did he look at the risk dimension of things. The reason science works isn't because there is a proper \"scientific method\" derived by some nerds in isolation, or some \"standard\" that passes a test similar to the eye exam of the Department of Motor Vehicles; rather it is because scientific ideas are Lindy-prone, that is, subjected to their own natural fragility. Ideas need to have skin in the game. You know an idea will fail if it is not useful, and can be therefore vulnerable to the falsification of time (and not that of naive falsificationism, that is, according to some government-printed black-and-white guideline). The longer an idea has been around without being falsified, the longer its future life expectancy. For if you read Paul Feyerabend's account of the history of scientific discoveries, you can clearly see that anything goes in the process - but not with the test of time. That appears to be nonnegotiable.", "begin": 18860.23, "end": 18949.11, "localBegin": 2937.84, "localEnd": 3026.72}, {"id": "c006_f000126", "text": "Note that I am here modifying Popper's idea; we can replace \"true\" (rather, not false) with \"useful,\" even \"not harmful,\" even \"protective to its users.\" So I will diverge from Popper in the following. For things to survive, they necessarily need to fare well in the risk dimension, that is, be good at not dying. By the Lindy effect, if an idea has skin in the game, it is not in the truth game, but in the harm game. An idea survives if it is a good risk manager, that is, not only doesn't harm its holders, but favors their survival - this also applies to superstitions that have crossed centuries because they led to some protective actions. More technically, an idea needs to be convex (antifragile), or at least bring about a beneficial reduction of fragility somewhere.", "begin": 18949.11, "end": 19002.39, "localBegin": 3026.72, "localEnd": 3080.0}, {"id": "c006_f000127", "text": "EMPIRICAL OR THEORETIC?", "begin": 19002.39, "end": 19006.39, "localBegin": 3080.0, "localEnd": 3084.0}, {"id": "c006_f000128", "text": "Academics divide research into theoretical and empirical areas. Empiricism consists in looking at data on a computer in search for what they call \"statistically significant,\" or doing experiments in the laboratory under some purposefully narrow conditions. Doing things in the real world, in some professions (such as medicine), bears the name clinical, which is not deemed to be scientific. Many disciplines lack this third dimension, the clinical one.", "begin": 19006.39, "end": 19035.71, "localBegin": 3084.0, "localEnd": 3113.32}, {"id": "c006_f000129", "text": "For in fact, by the Lindy effect, robustness to time, that is, doing things under risk-taking conditions, is checked by survival. Things work 1) if those who have been doing the doing took some type of risk, and 2) their work manages to cross generations.", "begin": 19035.71, "end": 19054.39, "localBegin": 3113.32, "localEnd": 3132.0}, {"id": "c006_f000130", "text": "Which brings me to the grandmother.", "begin": 19054.39, "end": 19057.59, "localBegin": 3132.0, "localEnd": 3135.2}, {"id": "c006_f000131", "text": "THE GRANDMOTHER VS. THE RESEARCHERS", "begin": 19057.59, "end": 19062.47, "localBegin": 3135.2, "localEnd": 3140.08}, {"id": "c006_f000132", "text": "If you hear advice from a grandmother or elders, odds are that it works 90 percent of the time. On the other hand, in part because of scientism and academic prostitution, in part because the world is hard, if you read anything by psychologists and behavioral scientists, odds are that it works at less than 10 percent, unless it is has also been covered by the grandmother and the classics, in which case why would you need a psychologist? Consider that a recent effort to replicate the hundred psychology papers in \"prestigious\" journals of 2008 found that, out of a hundred, only thirty-nine replicated. Of these thirty-nine, I believe that fewer than ten are actually robust and transfer outside the narrowness of the experiment. Similar defects have been found in medicine and neuroscience; more on those later. (I will discuss the point further in Chapters 18 and (mostly) 19, as well as why the warnings of your grandmother or interdicts aren't \"irrational\"; most of what is called \"irrational\" comes from misunderstanding of probability.)", "begin": 19062.47, "end": 19143.79, "localBegin": 3140.08, "localEnd": 3221.4}, {"id": "c006_f000133", "text": "It is critical that it is not just that the books of the ancients are still around and have been filtered by Lindy, but that those populations who read them have survived as well.", "begin": 19143.79, "end": 19152.71, "localBegin": 3221.4, "localEnd": 3230.32}, {"id": "c006_f000134", "text": "While our knowledge of physics was not available to the ancients, human nature was. So everything that holds in social science and psychology has to be Lindy-proof, that is, have an antecedent in the classics; otherwise it will not replicate or not generalize beyond the experiment. By classics we can define the Latin (and late Hellenistic) moral literature (moral sciences meant something else than they do today): Cicero, Seneca, Marcus Aurelius, Epictetus, Lucian, or the poets: Juvenal, Horace, or the later French so-called \"moralists\" (La Rochefoucauld, Vauvenargues, La Bruyère, Chamfort). Bossuet is a class on his own. One can use Montaigne and Erasmus as a portal to the ancients: Montaigne was the popularizer of his day; Erasmus was the thorough compiler.", "begin": 19152.71, "end": 19207.11, "localBegin": 3230.32, "localEnd": 3284.72}, {"id": "c006_f000135", "text": "A BRIEF TOUR OF YOUR GRANDPARENTS' WISDOM", "begin": 19207.11, "end": 19211.79, "localBegin": 3284.72, "localEnd": 3289.4}, {"id": "c006_f000136", "text": "Let us now close by sampling a few ideas that exist in both ancient lore and are sort of reconfirmed by modern psychology. These are sampled organically, meaning they are not the result of research but of what spontaneously comes to mind (remember this book is called Skin in the Game), then verified in the texts.", "begin": 19211.79, "end": 19231.95, "localBegin": 3289.4, "localEnd": 3309.56}, {"id": "c006_f000137", "text": "Cognitive dissonance (a psychological theory by Leon Festinger about sour grapes, by which people, in order to avoid inconsistent beliefs, rationalize that, say, the grapes they can't reach got to be sour). It is seen first in Aesop, of course, repackaged by La Fontaine. But its roots look even more ancient, with the Assyrian Ahiqar of Nineveh.", "begin": 19231.95, "end": 19255.99, "localBegin": 3309.56, "localEnd": 3333.6}, {"id": "c006_f000138", "text": "Loss aversion (a psychological theory by which a loss is more painful than a gain is pleasant): in Livy's Annals (XXX, 21) Men feel the good less intensely than the bad. Nearly all the letters of Seneca have some element of loss aversion.", "begin": 19255.99, "end": 19274.99, "localBegin": 3333.6, "localEnd": 3352.6}, {"id": "c006_f000139", "text": "Negative advice (via negativa): We know the wrong better than what's right; recall the superiority of the Silver over the Golden Rule. The good is not as good as the absence of bad, Ennius, repeated by Cicero.", "begin": 19274.99, "end": 19291.63, "localBegin": 3352.6, "localEnd": 3369.24}, {"id": "c006_f000140", "text": "Skin in the game (literally): We start with the Yiddish proverb: You can't chew with somebody else's teeth. \"Your fingernail can best scratch your itch,\" picked up by Scaliger circa 1614 in Proverborum Arabicorum.", "begin": 19291.63, "end": 19309.31, "localBegin": 3369.24, "localEnd": 3386.92}, {"id": "c006_f000141", "text": "Antifragility: There are tens of ancient sayings. Let us just mention Cicero. When our souls are mollified, a bee can sting. See also Machiavelli and Rousseau for its application to political systems.", "begin": 19309.31, "end": 19324.91, "localBegin": 3386.92, "localEnd": 3402.52}, {"id": "c006_f000142", "text": "Time discounting: \"A bird in the hand is better than ten on the tree.\" (Levantine proverb)", "begin": 19324.91, "end": 19333.07, "localBegin": 3402.52, "localEnd": 3410.68}, {"id": "c006_f000143", "text": "Madness of crowds: Nietzsche: Madness is rare in individuals, but in groups, parties, nations, it is the rule. (This counts as ancient wisdom since Nietzsche was a classicist; I've seen many such references in Plato.)", "begin": 19333.07, "end": 19349.11, "localBegin": 3410.68, "localEnd": 3426.72}, {"id": "c006_f000144", "text": "Less is more:Truth is lost with too much altercation, in Publilius Syrus. But of course the expression \"less is more\" is in an 1855 poem by Robert Browning.", "begin": 19349.11, "end": 19362.75, "localBegin": 3426.72, "localEnd": 3440.36}, {"id": "c006_f000145", "text": "Overconfidence: \"I lost money because of my excessive confidence,\" Erasmus inspired by Theognis of Megara (Confident, I lost everything; defiant, I saved everything) and Epicharmus of Kos (Remain sober and remember to watch out).", "begin": 19362.75, "end": 19381.59, "localBegin": 3440.36, "localEnd": 3459.2}, {"id": "c006_f000146", "text": "The Paradox of progress, and the paradox of choice: There is a familiar story of a New York banker vacationing in Greece, who, from talking to a fisherman and scrutinizing the fisherman's business, comes up with a scheme to help the fisherman make it a big business. The fisherman asked him what the benefits were; the banker answered that he could make a pile of money in New York and come back to vacation in Greece; something that seemed ludicrous to the fisherman, who was already there doing the kind of things bankers do when they go on vacation in Greece.", "begin": 19381.59, "end": 19414.43, "localBegin": 3459.2, "localEnd": 3492.04}, {"id": "c006_f000147", "text": "The story was well known in antiquity, under a more elegant form, as retold by Montaigne (my translation): When King Pyrrhus tried to cross into Italy, Cynéas, his wise adviser, tried to make him feel the vanity of such action. \"To what end are you going into such enterprise?\" he asked. Pyrrhus answered, \"To make myself the master of Italy.\" Cynéas: \"And so?\" Pyrrhus: \"To get to Gaul, then Spain.\" Cynéas: \"Then?\" Pyrrhus: \"To conquer Africa, then…come rest at ease.\" Cynéas: \"But you are already there; why take more risks?\" Montaigne then cites the well-known passage in Lucretius' De Rerum Natura (V, 1431) on how human nature knows no upper bound, as if to punish itself.", "begin": 19414.43, "end": 19471.67, "localBegin": 3492.04, "localEnd": 3549.28}]}, {"kind": "chapter", "number": 7, "title": "Book 6: Deeper into Agency", "audio": "audio/chapter_007.mp3", "start": 19471.699, "end": 23221.054, "duration": 3749.355, "paragraphs": [{"id": "c007_f000001", "text": "Book 6 Deeper into Agency", "begin": 19471.699, "end": 19478.739, "localBegin": 0.0, "localEnd": 7.04}, {"id": "c007_f000002", "text": "Chapter 9 Surgeons Should Not Look Like Surgeons", "begin": 19478.739, "end": 19484.459, "localBegin": 7.04, "localEnd": 12.76}, {"id": "c007_f000003", "text": "Literature doesn't look like literature - Donaldo hiring practitioners - The glory of bureaucracy - Teach a professor how to deadlift - Looking the part", "begin": 19484.459, "end": 19497.619, "localBegin": 12.76, "localEnd": 25.92}, {"id": "c007_f000004", "text": "LOOKING THE PART", "begin": 19497.619, "end": 19500.099, "localBegin": 25.92, "localEnd": 28.4}, {"id": "c007_f000005", "text": "Say you had the choice between two surgeons of similar rank in the same department in some hospital. The first is highly refined in appearance; he wears silver-rimmed glasses, has a thin build, delicate hands, measured speech, and elegant gestures. His hair is silver and well combed. He is the person you would put in a movie if you needed to impersonate a surgeon. His office prominently boasts Ivy League diplomas, both for his undergraduate and medical schools.", "begin": 19500.099, "end": 19528.979, "localBegin": 28.4, "localEnd": 57.28}, {"id": "c007_f000006", "text": "The second one looks like a butcher; he is overweight, with large hands, uncouth speech, and an unkempt appearance. His shirt is dangling from the back. No known tailor on the East Coast of the U.S. is capable of making his shirt button at the neck. He speaks unapologetically with a strong New Yawk accent, as if he wasn't aware of it. He even has a gold tooth showing when he opens his mouth. The absence of diplomas on the wall hints at the lack of pride in his education: he perhaps went to some local college. In a movie, you would expect him to impersonate a retired bodyguard for a junior congressman, or a third-generation cook in a New Jersey cafeteria.", "begin": 19528.979, "end": 19570.579, "localBegin": 57.28, "localEnd": 98.88}, {"id": "c007_f000007", "text": "Now if I had to pick, I would overcome my sucker-proneness and take the butcher any minute. Even more: I would seek the butcher as a third option if my choice was between two doctors who looked like doctors. Why? Simply the one who doesn't look the part, conditional on having made a (sort of) successful career in his profession, had to have much to overcome in terms of perception. And if we are lucky enough to have people who do not look the part, it is thanks to the presence of some skin in the game, the contact with reality that filters out incompetence, as reality is blind to looks.", "begin": 19570.579, "end": 19606.699, "localBegin": 98.88, "localEnd": 135.0}, {"id": "c007_f000008", "text": "When results come from dealing directly with reality rather than through the agency of commentators, image matters less, even if it correlates to skills. But image matters quite a bit when there is hierarchy and standardized \"job evaluation.\" Consider the chief executive officers of corporations: they don't just look the part, they even look the same. And, worse, when you listen to them talk, they sound the same, down to the same vocabulary and metaphors. But that's their job: as I will keep reminding the reader, counter to the common belief, executives are different from entrepreneurs and are supposed to look like actors.", "begin": 19606.699, "end": 19645.099, "localBegin": 135.0, "localEnd": 173.4}, {"id": "c007_f000009", "text": "Now there may be some correlation between looks and skills (someone who looks athletic is likely to be athletic), but, conditional on having had some success in spite of not looking the part, it is potent, even crucial, information.", "begin": 19645.099, "end": 19660.139, "localBegin": 173.4, "localEnd": 188.44}, {"id": "c007_f000010", "text": "So it becomes no wonder that the job of chief executive of the country was once filled by a former actor, Ronald Reagan. Actually, the best actor is the one nobody realizes is an actor: a closer look at Barack Obama shows that he was even more of an actor: a fancy Ivy League education combined with a liberal reputation is compelling as an image builder.", "begin": 19660.139, "end": 19681.859, "localBegin": 188.44, "localEnd": 210.16}, {"id": "c007_f000011", "text": "Much has been written about the millionaire next door: the person who is actually rich, on balance, but doesn't look like the person you would expect to be rich, and vice versa. About every private banker is taught to not be fooled by the looks of the client and avoid chasing Ferrari owners at country clubs. As I am writing these lines, a neighbor in my ancestral village (and like almost everyone there, a remote relative), who led a modest but comfortable life, ate food he grew by himself, drank his own pastis (arak), that sort of thing, left an estate of a hundred million dollars, a hundred times what one would have expected him to leave.", "begin": 19681.859, "end": 19720.299, "localBegin": 210.16, "localEnd": 248.6}, {"id": "c007_f000012", "text": "So the next time you randomly pick a novel, avoid the one with the author photo representing a pensive man with an ascot standing in front of wall-to-wall bookshelves.", "begin": 19720.299, "end": 19731.099, "localBegin": 248.6, "localEnd": 259.4}, {"id": "c007_f000013", "text": "By the same reasoning, and flipping the arguments, skilled thieves at large should not look like thieves. Those who do are more likely to be in jail.", "begin": 19731.099, "end": 19741.099, "localBegin": 259.4, "localEnd": 269.4}, {"id": "c007_f000014", "text": "Next, we will get deeper into the following:", "begin": 19741.099, "end": 19743.979, "localBegin": 269.4, "localEnd": 272.28}, {"id": "c007_f000015", "text": "In any type of activity or business divorced from the direct filter of skin in the game, the great majority of people know the jargon, play the part, and are intimate with the cosmetic details, but are clueless about the subject.", "begin": 19743.979, "end": 19760.099, "localBegin": 272.28, "localEnd": 288.4}, {"id": "c007_f000016", "text": "THE GREEN LUMBER FALLACY", "begin": 19760.099, "end": 19763.139, "localBegin": 288.4, "localEnd": 291.44}, {"id": "c007_f000017", "text": "The idea of this chapter is Lindy-compatible. Don't think that beautiful apples taste better, goes the Latin saying. This is a subtler version of the common phrase \"all that glitters is not gold\" - something it has taken consumers half a century to figure out; even then, as they have been continuously fooled by the aesthetics of produce.", "begin": 19763.139, "end": 19784.859, "localBegin": 291.44, "localEnd": 313.16}, {"id": "c007_f000018", "text": "An expert rule in my business is to never hire a well-dressed trader. But it goes beyond:", "begin": 19784.859, "end": 19790.739, "localBegin": 313.16, "localEnd": 319.04}, {"id": "c007_f000019", "text": "Hire the successful trader, conditional on a solid track record, whose details you can understand the least.", "begin": 19790.739, "end": 19798.619, "localBegin": 319.04, "localEnd": 326.92}, {"id": "c007_f000020", "text": "Not the most: the least. Why so?", "begin": 19798.619, "end": 19802.979, "localBegin": 326.92, "localEnd": 331.28}, {"id": "c007_f000021", "text": "I've introduced this point in Antifragile, where I called it the green lumber fallacy. A fellow made a fortune in green lumber without knowing what appears to be essential details about the product he traded - he wasn't aware that green lumber stood for freshly cut wood, not lumber that was painted green. Meanwhile, by contrast, the person who related the story went bankrupt while knowing every intimate detail about the green lumber. The fallacy is that what one may need to know in the real world does not necessarily match what one can perceive through intellect: it doesn't mean that details are not relevant, only that those we tend (IYI-style) to believe are important can distract us from more central attributes of the price mechanism.", "begin": 19802.979, "end": 19846.659, "localBegin": 331.28, "localEnd": 374.96}, {"id": "c007_f000022", "text": "In any activity, hidden details are only revealed via Lindy.", "begin": 19846.659, "end": 19851.379, "localBegin": 374.96, "localEnd": 379.68}, {"id": "c007_f000023", "text": "Another aspect:", "begin": 19851.379, "end": 19852.779, "localBegin": 379.68, "localEnd": 381.08}, {"id": "c007_f000024", "text": "What can be phrased and expressed in a clear narrative that convinces suckers will be a sucker trap.", "begin": 19852.779, "end": 19859.979, "localBegin": 381.08, "localEnd": 388.28}, {"id": "c007_f000025", "text": "My friend Terry B., who taught an investment class, invited two speakers. One looked the part of the investment manager, down to a tee: tailored clothes, expensive watch, shiny shoes, and clarity of exposition. He also talked big, projecting the type of confidence you would desire in an executive. The second looked closer to our butcher-surgeon and was totally incomprehensible; he even gave the impression that he was confused. Now, when Terry asked the students which of the two they believed was more successful, they didn't even get close. The first, not unexpectedly, was in the equivalent of the soup kitchen of that business; the second was at least a centimillionaire.", "begin": 19859.979, "end": 19901.099, "localBegin": 388.28, "localEnd": 429.4}, {"id": "c007_f000026", "text": "The late Jimmy Powers, a die-hard New York Irishman with whom I worked in an investment bank early in my trading career, was successful in spite of being a college dropout, with the background of a minor Brooklyn street gangster. He would discuss our trading activities in meetings with such sentences as: \"We did this and then did that, badaboom, badabing, and then it was all groovy,\" to an audience of extremely befuddled executives who didn't mind not understanding what he was talking about, so long as our department was profitable. Remarkably, after a while, I learned to effortlessly understand what Jimmy meant. I also learned, in my early twenties, that the people you understand most easily were necessarily the bull***tters.", "begin": 19901.099, "end": 19944.939, "localBegin": 429.4, "localEnd": 473.24}, {"id": "c007_f000027", "text": "BEST-DRESSED BUSINESS PLAN", "begin": 19944.939, "end": 19948.219, "localBegin": 473.24, "localEnd": 476.52}, {"id": "c007_f000028", "text": "Literature should not look like literature. The author Georges Simenon worked as a teenager in journalism as an assistant to the famous French writer Colette; she taught him to resist the idea of putting imperfect subjunctives and references to zephyrs, rhododendrons, and firmaments in his text - the kind of stuff one does when waxing literary. Simenon took this advice to the extreme: his style is similar to that of, say, Graham Greene; it is stripped to the core, and as a result, words do not stand in the way of conveying atmosphere - you feel wetness penetrating your shoes just reading his accounts of commissar Maigret spending endless hours in the Parisian rain; it is as if his central character is the background.", "begin": 19948.219, "end": 19993.339, "localBegin": 476.52, "localEnd": 521.64}, {"id": "c007_f000029", "text": "Likewise, the illusion prevails that businesses work via business plans and science via funding. This is strictly not true: a business plan is a useful narrative for those who want to convince a sucker. It works because, as I said in Prologue 2, firms in the entrepreneurship business make most of their money packaging companies and selling them; it is not easy to sell without some strong narrative. But for a real business (as opposed to a fund-raising scheme), something that should survive on its own, business plans and funding work backward. At the time of writing, most big recent successes (Microsoft, Apple, Facebook, Google) were started by people with skin and soul in the game and grew organically - if they had recourse to funding, it was to expand or allow the managers to cash out; funding was not the prime source of creation. You don't create a firm by creating a firm; nor do you do science by doing science.", "begin": 19993.339, "end": 20052.939, "localBegin": 521.64, "localEnd": 581.24}, {"id": "c007_f000030", "text": "A BISHOP FOR HALLOWEEN", "begin": 20052.939, "end": 20055.779, "localBegin": 581.24, "localEnd": 584.08}, {"id": "c007_f000031", "text": "Which brings me back to social science. I have in many instances quickly jotted down ideas on a piece of paper, along with mathematical proofs, and posted them somewhere, planning to get them published. No fluff or the ideas-free verbose circularity of social science papers. In some fake fields like economics, ritualistic and dominated by citation rings, I discovered that everything is in the presentation. So the criticism I've received has never been about the content, but rather the looks. There is a certain language one needs to learn through a long investment, and papers are just iterations around that language.", "begin": 20055.779, "end": 20093.419, "localBegin": 584.08, "localEnd": 621.72}, {"id": "c007_f000032", "text": "Never hire an academic unless his function is to partake of the rituals of writing papers or taking exams.", "begin": 20093.419, "end": 20101.539, "localBegin": 621.72, "localEnd": 629.84}, {"id": "c007_f000033", "text": "Which brings us to the attributes of scientism. For it is not just some presentation that matters to these idiots. It is unnecessary complication.", "begin": 20101.539, "end": 20111.579, "localBegin": 629.84, "localEnd": 639.88}, {"id": "c007_f000034", "text": "But there is a logic behind these academic complications and rituals. Did you ever wonder why a bishop is dressed for Halloween?", "begin": 20111.579, "end": 20120.099, "localBegin": 639.88, "localEnd": 648.4}, {"id": "c007_f000035", "text": "Mediterranean societies are traditionally ones in which the highest-ranking person is the one with the most skin in the game. And if anything characterizes today's America, it is economic risk taking, thanks to a happy transfer of martial values to business and commerce in Anglo-Saxon society - remarkably, traditional Arabic culture also puts the same emphasis on the honor of economic risk-taking. But history shows that there were - and still are - societies in which the intellectual was at the top. The Hindus held the Brahman to be first in the hierarchy, the Celts had the druids (so do their Druze possible-cousins), the Egyptians had their scribes, and the Chinese had for a relatively brief time the scholar. Let me add postwar France. You can notice a remarkable similarity to the way these intellectuals held power and separated themselves from the rest: through complex, extremely elaborate rituals, mysteries that stay within the caste, and an overriding focus on the cosmetic.", "begin": 20120.099, "end": 20183.059, "localBegin": 648.4, "localEnd": 711.36}, {"id": "c007_f000036", "text": "Even within the \"normal\" warrior-run or doer-run societies, the class of intellectuals is all about rituals: without pomp and ceremony, the intellectual is just a talker, that is, pretty much nothing. Consider the bishop in my parts, the Greek-Orthodox church: it's a show of dignity. A bishop on rollerblades would no longer be a bishop. There is nothing wrong with the decorative if it remains what it is, decorative, as remains true today. However, science and business must not be decorative.", "begin": 20183.059, "end": 20215.419, "localBegin": 711.36, "localEnd": 743.72}, {"id": "c007_f000037", "text": "-", "begin": 20215.419, "end": 20215.419, "localBegin": 743.72, "localEnd": 743.72}, {"id": "c007_f000038", "text": "Next, we examine the following points:", "begin": 20215.419, "end": 20218.099, "localBegin": 743.72, "localEnd": 746.4}, {"id": "c007_f000039", "text": "Just as the slick fellow in a Ferrari looks richer than the rumpled centimillionaire, scientism looks more scientific than real science.", "begin": 20218.099, "end": 20226.099, "localBegin": 746.4, "localEnd": 754.4}, {"id": "c007_f000040", "text": "True intellect should not appear to be intellectual.", "begin": 20226.099, "end": 20232.099, "localBegin": 754.4, "localEnd": 760.4}, {"id": "c007_f000041", "text": "THE GORDIAN KNOT", "begin": 20232.099, "end": 20234.779, "localBegin": 760.4, "localEnd": 763.08}, {"id": "c007_f000042", "text": "Never pay for complexity of presentation when all you need is results.", "begin": 20234.779, "end": 20240.819, "localBegin": 763.08, "localEnd": 769.12}, {"id": "c007_f000043", "text": "Alexander the Magnus was once called to solve the following challenge in the Phrygian city of Gordium (as usual with Greek stories, in modern-day Turkey). When he entered Gordium, he found an old wagon, its yoke tied with a multitude of knots, all so tightly entangled that it was impossible to figure out how they were fastened. An oracle had declared that he who would untie the knot would rule all of what was then called \"Asia,\" that is, Asia Minor, the Levant, and the Middle East.", "begin": 20240.819, "end": 20271.339, "localBegin": 769.12, "localEnd": 799.64}, {"id": "c007_f000044", "text": "After wrestling with the knot, the Magnus drew back from the lump of gnarled ropes, then made a proclamation that it didn't matter for the prophecy how the tangle was to be unraveled. He then drew his sword and, with a single stroke, cut the knot in half.", "begin": 20271.339, "end": 20286.379, "localBegin": 799.64, "localEnd": 814.68}, {"id": "c007_f000045", "text": "No \"successful\" academic could ever afford to follow such a policy. And no Intellectual Yet Idiot. It took medicine a long time to realize that when a patient shows up with a headache, it is much better to give him aspirin or recommend a good night's sleep than do brain surgery, although the latter appears to be more \"scientific.\" But most \"consultants\" and others paid by the hour are not there yet.", "begin": 20286.379, "end": 20312.819, "localBegin": 814.68, "localEnd": 841.12}, {"id": "c007_f000046", "text": "OVERINTELLECTUALIZATION OF LIFE", "begin": 20312.819, "end": 20317.019, "localBegin": 841.12, "localEnd": 845.32}, {"id": "c007_f000047", "text": "The researchers Gerd Gigerenzer and Henry Brighton contrast the approaches of the \"rationalistic\" school (in quotation marks, as there is little that is rational in these rationalists) and that of the heuristic one, in the following example on how a baseball player catches the ball by Richard Dawkins:", "begin": 20317.019, "end": 20335.019, "localBegin": 845.32, "localEnd": 863.32}, {"id": "c007_f000048", "text": "Richard Dawkins (…) argues that \"He behaves as if he had solved a set of differential equations in predicting the trajectory of the ball. At some subconscious level, something functionally equivalent to the mathematical calculations is going on.\"", "begin": 20335.019, "end": 20348.859, "localBegin": 863.32, "localEnd": 877.16}, {"id": "c007_f000049", "text": "(…) Instead, experiments have shown that players rely on several heuristics. The gaze heuristic is the simplest one and works if the ball is already high up in the air: Fix your gaze on the ball, start running, and adjust your running speed so that the angle of gaze remains constant.", "begin": 20348.859, "end": 20367.899, "localBegin": 877.16, "localEnd": 896.2}, {"id": "c007_f000050", "text": "This error by the science writer Richard Dawkins generalizes to, simply, overintellectualizing humans in their responses to all manner of natural phenomena, rather than accepting the role of a collection of mental heuristics used for specific purposes. The baseball player has no clue about the exact heuristic, but he goes with it - otherwise he would lose the game to another, nonintellectualizing, competitor. Likewise, as we will see in Chapter 18, religious \"beliefs\" are simply mental heuristics that solve a collection of problems - without the agent really knowing how. Solving equations in order to make a decision isn't a skill we humans can aspire to have - it is computationally impossible. What we can rationally do is neutralize some harmful aspects of these heuristics, defang them so to speak.", "begin": 20367.899, "end": 20420.939, "localBegin": 896.2, "localEnd": 949.24}, {"id": "c007_f000051", "text": "ANOTHER BUSINESS OF INTERVENTION", "begin": 20420.939, "end": 20422.739, "localBegin": 949.24, "localEnd": 951.04}, {"id": "c007_f000052", "text": "People who have always operated without skin in the game (or without their skin in the right game) seek the complicated and centralized, and avoid the simple like the plague. Practitioners, on the other hand, have opposite instincts, looking for the simplest heuristics. Some rules:", "begin": 20422.739, "end": 20440.499, "localBegin": 951.04, "localEnd": 968.8}, {"id": "c007_f000053", "text": "People who are bred, selected, and compensated to find complicated solutions do not have an incentive to implement simplified ones.", "begin": 20440.499, "end": 20449.859, "localBegin": 968.8, "localEnd": 978.16}, {"id": "c007_f000054", "text": "And it gets more complicated as the remedy has itself a skin-in-the-game problem.", "begin": 20449.859, "end": 20454.779, "localBegin": 978.16, "localEnd": 983.08}, {"id": "c007_f000055", "text": "This is particularly acute in the meta-problem, when the solution is about solving this very problem.", "begin": 20454.779, "end": 20461.059, "localBegin": 983.08, "localEnd": 989.36}, {"id": "c007_f000056", "text": "In other words, many problems in society come from the interventions of people who sell complicated solutions because that's what their position and training invite them to do. There is absolutely no gain for someone in such a position to propose something simple: you are rewarded for perception, not results. Meanwhile, they pay no price for the side effects that grow nonlinearly with such complications.", "begin": 20461.059, "end": 20485.939, "localBegin": 989.36, "localEnd": 1014.24}, {"id": "c007_f000057", "text": "This also holds true when it comes to solutions that are profitable to technologists.", "begin": 20485.939, "end": 20493.099, "localBegin": 1014.24, "localEnd": 1021.4}, {"id": "c007_f000058", "text": "GOLD AND RICE", "begin": 20493.099, "end": 20495.859, "localBegin": 1021.4, "localEnd": 1024.16}, {"id": "c007_f000059", "text": "Now, indeed, we know by instinct that brain surgery is not more \"scientific\" than aspirin, any more than flying the forty or so miles between JFK and Newark airports represent \"efficiency,\" although there is more technology involved. But we don't easily translate this to other domains and remain victims of scientism, which is to science what a Ponzi scheme is to investment, or what advertisement or propaganda are to genuine scientific communication. You magnify the cosmetic attributes.", "begin": 20495.859, "end": 20528.539, "localBegin": 1024.16, "localEnd": 1056.84}, {"id": "c007_f000060", "text": "Recall the genetic modifications of Book 3 (and the smear campaign of Chapter 4). Let us consider the story of the genetically modified Golden Rice. There has been a problem of malnutrition and nutrient deficiency in many developing countries, which my collaborators Yaneer Bar-Yam and Joe Norman attribute to a simple and very straightforward transportation issue. Simply, we waste more than a third of our food supply, and the gains from simple improvement in distribution would far outweigh those from modification of supply. Simply consider that close to 80 or 85 percent of the cost of a tomato can be attributed to transportation, storage, and waste (unsold inventories), rather than the cost at the farmer level. So visibly our efforts should be on low-tech distribution.", "begin": 20528.539, "end": 20577.819, "localBegin": 1056.84, "localEnd": 1106.12}, {"id": "c007_f000061", "text": "Now the \"techies\" saw an angle of intervention. First, you show pictures of starving children to elicit sympathy and prevent further discussion - anyone who argues in the presence of dying children is a heartless a**hole. Second, you make it look like any critic of your method is arguing against saving the children. Third, you propose some scientific-looking technique that is lucrative to you and, should it cause a catastrophe or blight, insulates you from the long-term effects. Fourth, you enlist journalists and useful idiots, people who hate things that appear \"unscientific\" in their unscientific eyes. Fifth, you create a smear campaign to harm the reputations of researchers who, not having f*** you money, are very vulnerable to the slightest blemish to their reputations.", "begin": 20577.819, "end": 20627.179, "localBegin": 1106.12, "localEnd": 1155.48}, {"id": "c007_f000062", "text": "The technique in question consists in genetically modifying rice to have the grains include vitamins. My colleagues and I made an effort to show the following, which is a criticism of the method in general. First, transgenics, that is the type of genetic modifications thus obtained, was not analytically in the same category as the crossbreeding of plants and animals that have characterized human activities since husbandry - say, potatoes or mandarin oranges. We skipped complexity classes, and the effects on the environment are not foreseeable - nobody studied the interactions. Recall that fragility is in the dosage: falling from the 20th floor is not in the same risk category as falling from your chair. We even showed that there was a patent increase in systemic risk. Second, there was no proper risk study, and the statistical methods in the papers in support of the argument were flawed. Third, we invoked the principle of simplicity, which was called antiscience. Why don't we give these people rice and vitamins separately? After all, we don't have genetically modified coffee that has milk with it. Fourth, we were able to show that GMOs brought a bevy of hidden risk to the environment, because of the higher use of pesticide, which kills the microbiome (that is, the bacteria and other life in the soil).", "begin": 20627.179, "end": 20708.219, "localBegin": 1155.48, "localEnd": 1236.52}, {"id": "c007_f000063", "text": "I realized soon after that, owing to the minority rule, there was no point continuing. As I said in Book 3, GMOs lost simply because a minority of intelligent and intransigent people stood against them.", "begin": 20708.219, "end": 20723.379, "localBegin": 1236.52, "localEnd": 1251.68}, {"id": "c007_f000064", "text": "THE COMPENSATION", "begin": 20723.379, "end": 20726.059, "localBegin": 1251.68, "localEnd": 1254.36}, {"id": "c007_f000065", "text": "Simply, the minute one is judged by others rather than by reality, things become warped as follows. Firms that haven't gone bankrupt yet have something called personnel departments. So there are metrics used and \"evaluation forms\" to fill.", "begin": 20726.059, "end": 20739.979, "localBegin": 1254.36, "localEnd": 1268.28}, {"id": "c007_f000066", "text": "The minute one has evaluation forms, distortions occur. Recall that in The Black Swan I had to fill my evaluation form asking for the percentage of profitable days, encouraging traders to make steady money at the expense of hidden risks of Black Swans, consequential losses. Russian Roulette allows you to make money five times out of six. This has bankrupted banks, as banks lose less than one in one hundred quarters, but then they lose more than they ever made. My declared approach was to try to make money infrequently. I tore the evaluation form in front of the big boss and they left me alone.", "begin": 20739.979, "end": 20779.379, "localBegin": 1268.28, "localEnd": 1307.68}, {"id": "c007_f000067", "text": "Now the mere fact that an evaluation causes you to be judged not by the end results, but by some intermediary metric that invites you to look sophisticated, brings some distortions.", "begin": 20779.379, "end": 20792.699, "localBegin": 1307.68, "localEnd": 1321.0}, {"id": "c007_f000068", "text": "EDUCATION AS LUXURY GOOD", "begin": 20792.699, "end": 20796.139, "localBegin": 1321.0, "localEnd": 1324.44}, {"id": "c007_f000069", "text": "Ivy League universities are becoming in the eyes of the new Asian upper class the ultimate status luxury good. Harvard is like a Vuitton bag and a Cartier watch. It is a huge drag on the middle class, who have been plowing an increased share of their savings into educational institutions, transferring their money to bureaucrats, real estate developers, tenured professors of some discipline that would not otherwise exist (gender studies, comparative literature, or international economics), and other parasites. In the United States, we have a buildup of student loans that automatically transfer to these rent extractors. In a way it is no different from racketeering: one needs a decent university \"name\" to get ahead in life. But we have evidence that collectively society doesn't advance with organized education, rather the reverse: the level of (formal) education in a country is the result of wealth.", "begin": 20796.139, "end": 20867.219, "localBegin": 1324.44, "localEnd": 1395.52}, {"id": "c007_f000070", "text": "A BS DETECTION HEURISTIC", "begin": 20867.219, "end": 20870.779, "localBegin": 1395.52, "localEnd": 1399.08}, {"id": "c007_f000071", "text": "The heuristic here would be to use education in reverse: hire, conditional on an equal set of skills, the person with the least label-oriented education. It means that the person had to succeed in spite of th
