  <script>
    const manifest = {"title": "Skin in the Game: Hidden Asymmetries in Daily Life", "duration": 30059.049, "chapters": [{"kind": "chapter", "number": 1, "title": "Skin in the Game", "audio": "audio/chapter_001.mp3", "start": 0.0, "end": 1789.91, "duration": 1789.91, "paragraphs": [{"id": "c001_f000001", "text": "Book Title, Skin in the Game: Hidden Asymmetries in Daily Life, Author, Nassim Nicholas Taleb, Imprint, Random House", "begin": 0.0, "end": 11.48, "localBegin": 0.0, "localEnd": 11.48}, {"id": "c001_f000002", "text": "Two men of courage:", "begin": 11.48, "end": 16.48, "localBegin": 11.48, "localEnd": 16.48}, {"id": "c001_f000003", "text": "Ron Paul, a Roman among Greeks;", "begin": 16.48, "end": 19.6, "localBegin": 16.48, "localEnd": 19.6}, {"id": "c001_f000004", "text": "Ralph Nader, Greco-Phoenician saint", "begin": 19.6, "end": 26.64, "localBegin": 19.6, "localEnd": 26.64}, {"id": "c001_f000005", "text": "Book 1 Introduction", "begin": 26.64, "end": 31.28, "localBegin": 26.64, "localEnd": 31.28}, {"id": "c001_f000006", "text": "This book, while standalone, is a continuation of the Incerto collection, which is a combination of a) practical discussions, b) philosophical tales, and c) scientific and analytical commentary on the problems of randomness, and how to live, eat, sleep, argue, fight, befriend, work, have fun, and make decisions under uncertainty. While accessible to a broad group of readers, don't be fooled: the Incerto is an essay, not a popularization of works done elsewhere in boring form (leaving aside the Incerto's technical companion).", "begin": 31.28, "end": 68.4, "localBegin": 31.28, "localEnd": 68.4}, {"id": "c001_f000007", "text": "Skin in the Game is about four topics in one: a) uncertainty and the reliability of knowledge (both practical and scientific, assuming there is a difference), or in less polite words bull***t detection, b) symmetry in human affairs, that is, fairness, justice, responsibility, and reciprocity, c) information sharing in transactions, and d) rationality in complex systems and in the real world. That these four cannot be disentangled is something that is obvious when one has…skin in the game.", "begin": 68.4, "end": 105.36, "localBegin": 68.4, "localEnd": 105.36}, {"id": "c001_f000008", "text": "It is not just that skin in the game is necessary for fairness, commercial efficiency, and risk management: skin in the game is necessary to understand the world.", "begin": 105.36, "end": 133.8, "localBegin": 105.36, "localEnd": 133.8}, {"id": "c001_f000009", "text": "First, it is bull***t identification and filtering, that is, the difference between theory and practice, cosmetic and true expertise, and academia (in the bad sense of the word) and the real world. To emit a Yogiberrism, in academia there is no difference between academia and the real world; in the real world, there is.", "begin": 133.8, "end": 171.4, "localBegin": 133.8, "localEnd": 171.4}, {"id": "c001_f000010", "text": "Second, it is about the distortions of symmetry and reciprocity in life: If you have the rewards, you must also get some of the risks, not let others pay the price of your mistakes. If you inflict risk on others, and they are harmed, you need to pay some price for it. Just as you should treat others in the way you'd like to be treated, you would like to share the responsibility for events without unfairness and inequity.", "begin": 171.4, "end": 196.84, "localBegin": 171.4, "localEnd": 196.84}, {"id": "c001_f000011", "text": "If you give an opinion, and someone follows it, you are morally obligated to be, yourself, exposed to its consequences. In case you are giving economic views:", "begin": 196.84, "end": 207.56, "localBegin": 196.84, "localEnd": 207.56}, {"id": "c001_f000012", "text": "Don't tell me what you \"think,\" just tell me what's in your portfolio.", "begin": 207.56, "end": 213.08, "localBegin": 207.56, "localEnd": 213.08}, {"id": "c001_f000013", "text": "Third, the book is about how much information one should practically share with others, what a used car salesman should - or shouldn't - tell you about the vehicle on which you are about to spend a large segment of your savings.", "begin": 213.08, "end": 226.84, "localBegin": 213.08, "localEnd": 226.84}, {"id": "c001_f000014", "text": "Fourth, it is about rationality and the test of time. Rationality in the real world isn't about what makes sense to your New Yorker journalist or some psychologist using naive first-order models, but something vastly deeper and statistical, linked to your own survival.", "begin": 226.84, "end": 244.64, "localBegin": 226.84, "localEnd": 244.64}, {"id": "c001_f000015", "text": "Do not mistake skin in the game as defined here and used in this book for just an incentive problem, just having a share of the benefits (as it is commonly understood in finance). No. It is about symmetry, more like having a share of the harm, paying a penalty if something goes wrong. The very same idea ties together notions of incentives, used car buying, ethics, contract theory, learning (real life vs. academia), Kantian imperative, municipal power, risk science, contact between intellectuals and reality, the accountability of bureaucrats, probabilistic social justice, option theory, upright behavior, bull***t vendors, theology…I stop for now.", "begin": 244.64, "end": 293.48, "localBegin": 244.64, "localEnd": 293.48}, {"id": "c001_f000016", "text": "THE LESS OBVIOUS ASPECTS OF SKIN IN THE GAME", "begin": 293.48, "end": 298.28, "localBegin": 293.48, "localEnd": 298.28}, {"id": "c001_f000017", "text": "A more correct (though more awkward) title of the book would have been: The Less Obvious Aspects of Skin in the Game:Those Hidden Asymmetries and Their Consequences. For I just don't like reading books that inform me of the obvious. I like to be surprised. So as a skin-in-the-game-style reciprocity, I will not not drive the reader into a dull college-lecture-type predictable journey, but rather into the type of adventure I'd like to have.", "begin": 298.28, "end": 325.72, "localBegin": 298.28, "localEnd": 325.72}, {"id": "c001_f000018", "text": "Accordingly, the book is organized in the following manner. It doesn't take more than about sixty pages for the reader to get the importance, prevalence, and ubiquity of skin in the game (that is, symmetry) in most of its aspects. But never engage in detailed overexplanations of why something important is important: one debases a principle by endlessly justifying it.", "begin": 325.72, "end": 350.04, "localBegin": 325.72, "localEnd": 350.04}, {"id": "c001_f000019", "text": "The nondull route entails focusing on the second step: the surprising implications - those hidden asymmetries that do not immediately come to mind - as well as the less obvious consequences, some of which are quite uncomfortable, and many unexpectedly helpful. Understanding the workings of skin in the game allows us to understand serious puzzles underlying the fine-grained matrix of reality.", "begin": 350.04, "end": 375.6, "localBegin": 350.04, "localEnd": 375.6}, {"id": "c001_f000020", "text": "For instance:", "begin": 375.6, "end": 376.92, "localBegin": 375.6, "localEnd": 376.92}, {"id": "c001_f000021", "text": "How is it that maximally intolerant minorities run the world and impose their taste on us? How does universalism destroy the very people it means to help? How is it that we have more slaves today than we did during Roman times? Why shouldn't surgeons look like surgeons? Why did Christian theology keep insisting on a human side for Jesus Christ that is necessarily distinct from the divine? How do historians confuse us by reporting on war, not peace? How is it that cheap signaling (without anything to risk) fails equally in economic and religious environments? How do candidates for political office with obvious character flaws seem more real than bureaucrats with impeccable credentials? Why do we worship Hannibal? How do companies go bust the minute they have professional managers interested in doing good? How is paganism more symmetrical across populations? How should foreign affairs be conducted? Why should you never give money to organized charities unless they operate in a highly distributive manner (what is called Uberized in modern lingo)? Why do genes and languages spread differently? Why does the scale of communities matter (a community of fishermen turns from collaborative to adversarial once one moves the scale, that is the number of people involved, a notch)? Why does behavioral economics have nothing to do with the study of the behavior of individuals - and markets have little to do with the biases of participants? How is rationality survival and survival only? What is the foundational logic of risk bearing?", "begin": 376.92, "end": 476.8, "localBegin": 376.92, "localEnd": 476.8}, {"id": "c001_f000022", "text": "But, to this author, skin in the game is mostly about justice, honor, and sacrifice, things that are existential for humans.", "begin": 476.8, "end": 488.84, "localBegin": 476.8, "localEnd": 488.84}, {"id": "c001_f000023", "text": "-", "begin": 488.84, "end": 488.84, "localBegin": 488.84, "localEnd": 488.84}, {"id": "c001_f000024", "text": "Skin in the game, applied as a rule, reduces the effects of the following divergences that grew with civilization: those between action and cheap talk (tawk), consequence and intention, practice and theory, honor and reputation, expertise and charlatanism, concrete and abstract, ethical and legal, genuine and cosmetic, merchant and bureaucrat, entrepreneur and chief executive, strength and display, love and gold-digging, Coventry and Brussels, Omaha and Washington, D.C., human beings and economists, authors and editors, scholarship and academia, democracy and governance, science and scientism, politics and politicians, love and money, the spirit and the letter, Cato the Elder and Barack Obama, quality and advertising, commitment and signaling, and, centrally, collective and individual.", "begin": 488.84, "end": 551.52, "localBegin": 488.84, "localEnd": 551.52}, {"id": "c001_f000025", "text": "Let us first connect a few dots of the items in the list above with two vignettes, just to give the flavor of how the idea transcends categories.", "begin": 551.52, "end": 564.6, "localBegin": 551.52, "localEnd": 564.6}, {"id": "c001_f000026", "text": "Prologue, Part 1 Antaeus Whacked", "begin": 564.6, "end": 570.04, "localBegin": 564.6, "localEnd": 570.04}, {"id": "c001_f000027", "text": "Never run away from Mamma - I keep finding warlords - Bob Rubin and his trade - Systems like car accidents", "begin": 570.04, "end": 580.48, "localBegin": 570.04, "localEnd": 580.48}, {"id": "c001_f000028", "text": "Antaeus was a giant, or rather a semi-giant of sorts, the literal son of Mother Earth, Gaea, and Poseidon, the god of the sea. He had a strange occupation, which consisted of forcing passersby in his country, (Greek) Libya, to wrestle; his thing was to pin his victims to the ground and crush them. This macabre hobby was apparently the expression of filial devotion; Antaeus aimed at building a temple to his father, Poseidon, using for raw material the skulls of his victims.", "begin": 580.48, "end": 613.8, "localBegin": 580.48, "localEnd": 613.8}, {"id": "c001_f000029", "text": "Antaeus was deemed to be invincible, but there was a trick. He derived his strength from contact with his mother, Earth. Physically separated from contact with Earth, he lost all his powers. Hercules, as part of his twelve labors (in one variation of the tale), had for homework to whack Antaeus. He managed to lift him off the ground and terminated him by crushing him as his feet remained out of contact with his mamma.", "begin": 613.8, "end": 641.96, "localBegin": 613.8, "localEnd": 641.96}, {"id": "c001_f000030", "text": "We retain from this first vignette that, just like Antaeus, you cannot separate knowledge from contact with the ground. Actually, you cannot separate anything from contact with the ground. And the contact with the real world is done via skin in the game - having an exposure to the real world, and paying a price for its consequences, good or bad. The abrasions of your skin guide your learning and discovery, a mechanism of organic signaling, what the Greeks called pathemata mathemata (\"guide your learning through pain,\" something mothers of young children know rather well). I have shown in Antifragile that most things that we believe were \"invented\" by universities were actually discovered by tinkering and later legitimized by some type of formalization. The knowledge we get by tinkering, via trial and error, experience, and the workings of time, in other words, contact with the earth, is vastly superior to that obtained through reasoning, something self-serving institutions have been very busy hiding from us.", "begin": 641.96, "end": 706.92, "localBegin": 641.96, "localEnd": 706.92}, {"id": "c001_f000031", "text": "Next, we will apply this to what is miscalled \"policy making.\"", "begin": 706.92, "end": 714.12, "localBegin": 706.92, "localEnd": 714.12}, {"id": "c001_f000032", "text": "LIBYA AFTER ANTAEUS", "begin": 714.12, "end": 717.84, "localBegin": 714.12, "localEnd": 717.84}, {"id": "c001_f000033", "text": "Second vignette. As I am writing these lines, a few thousand years later, Libya, the putative land of Antaeus, now has slave markets, as a result of a failed attempt at what is called \"regime change\" in order to \"remove a dictator.\" Yes, in 2017, improvised slave markets in parking lots, where captured sub-Saharan Africans are sold to the highest bidders.", "begin": 717.84, "end": 744.52, "localBegin": 717.84, "localEnd": 744.52}, {"id": "c001_f000034", "text": "A collection of people classified as interventionistas (to name names of people operating at the time of writing: Bill Kristol, Thomas Friedman, and others) who promoted the Iraq invasion of 2003, as well as the removal of the Libyan leader in 2011, are advocating the imposition of additional such regime change on another batch of countries, which includes Syria, because it has a \"dictator.\"", "begin": 744.52, "end": 769.68, "localBegin": 744.52, "localEnd": 769.68}, {"id": "c001_f000035", "text": "These interventionistas and their friends in the U.S. State Department helped create, train, and support Islamist rebels, then \"moderates,\" but who eventually evolved to become part of al-Qaeda, the same, very same al-Qaeda that blew up the New York City towers during the events of September 11, 2001. They mysteriously failed to remember that al-Qaeda itself was composed of \"moderate rebels\" created (or reared) by the U.S. to help fight Soviet Russia because, as we will see, these educated people's reasoning doesn't entail such recursions.", "begin": 769.68, "end": 813.4, "localBegin": 769.68, "localEnd": 813.4}, {"id": "c001_f000036", "text": "So we tried that thing called regime change in Iraq, and failed miserably. We tried that thing again in Libya, and there are now active slave markets in the place. But we satisfied the objective of \"removing a dictator.\" By the exact same reasoning, a doctor would inject a patient with \"moderate\" cancer cells to improve his cholesterol numbers, and proudly claim victory after the patient is dead, particularly if the postmortem shows remarkable cholesterol readings. But we know that doctors don't inflict fatal \"cures\" upon patients, or don't do it in such a crude way, and there is a clear reason for that. Doctors usually have some modicum of skin in the game, a vague understanding of complex systems, and more than a couple of millennia of incremental ethics determining their conduct.", "begin": 813.4, "end": 864.08, "localBegin": 813.4, "localEnd": 864.08}, {"id": "c001_f000037", "text": "And don't give up on logic, intellect, and education, because tight but higher order logical reasoning would show that, unless one finds some way to reject all empirical evidence, advocating regime changes implies also advocating slavery or some similar degradation of the country (since these have been typical outcomes). So these interventionistas not only lack practical sense, and never learn from history, but they even fail at pure reasoning, which they drown in elaborate semiabstract buzzword-laden discourse.", "begin": 864.08, "end": 898.4, "localBegin": 864.08, "localEnd": 898.4}, {"id": "c001_f000038", "text": "Their three flaws: 1) they think in statics not dynamics, 2) they think in low, not high, dimensions, 3) they think in terms of actions, never interactions. We will see in more depth throughout the book this defect of mental reasoning by educated (or, rather, semi-educated) fools. I can flesh out the three defects for now.", "begin": 898.4, "end": 924.32, "localBegin": 898.4, "localEnd": 924.32}, {"id": "c001_f000039", "text": "The first flaw is that they are incapable of thinking in second steps and unaware of the need for them - and about every peasant in Mongolia, every waiter in Madrid, and every car-service operator in San Francisco knows that real life happens to have second, third, fourth, nth steps. The second flaw is that they are also incapable of distinguishing between multidimensional problems and their single-dimensional representations - like multidimensional health and its stripped, cholesterol-reading reduction. They can't get the idea that, empirically, complex systems do not have obvious one-dimensional cause-and-effect mechanisms, and that under opacity, you do not mess with such a system. An extension of this defect: they compare the actions of the \"dictator\" to those of the prime minister of Norway or Sweden, not to those of the local alternative. The third flaw is that they can't forecast the evolution of those one helps by attacking, or the magnification one gets from feedback.", "begin": 924.32, "end": 990.92, "localBegin": 924.32, "localEnd": 990.92}, {"id": "c001_f000040", "text": "LUDIS DE ALIENO CORIO", "begin": 990.92, "end": 993.36, "localBegin": 990.92, "localEnd": 993.36}, {"id": "c001_f000041", "text": "And when a blowup happens, they invoke uncertainty, something called a Black Swan (a high-impact unexpected event), after a book by a (very) stubborn fellow, not realizing that one should not mess with a system if the results are fraught with uncertainty, or, more generally, should avoid engaging in an action with a big downside if one has no idea of the outcomes. What is crucial here is that the downside doesn't affect the interventionist. He continues his practice from the comfort of his thermally regulated suburban house with a two-car garage, a dog, and a small play area with pesticide-free grass for his overprotected 2.2 children.", "begin": 993.36, "end": 1040.28, "localBegin": 993.36, "localEnd": 1040.28}, {"id": "c001_f000042", "text": "Imagine people with similar mental handicaps, people who don't understand asymmetry, piloting planes. Incompetent pilots, those who cannot learn from experience, or don't mind taking risks they don't understand, may kill many. But they will themselves end up at the bottom of, say, the Bermuda Triangle, and cease to represent a threat to others and mankind. Not here.", "begin": 1040.28, "end": 1065.48, "localBegin": 1040.28, "localEnd": 1065.48}, {"id": "c001_f000043", "text": "So we end up populating what we call the intelligentsia with people who are delusional, literally mentally deranged, simply because they never have to pay for the consequences of their actions, repeating modernist slogans stripped of all depth (for instance, they keep using the term \"democracy\" while encouraging headcutters; democracy is something they read about in graduate studies). In general, when you hear someone invoking abstract modernistic notions, you can assume that they got some education (but not enough, or in the wrong discipline) and have too little accountability.", "begin": 1065.48, "end": 1102.32, "localBegin": 1065.48, "localEnd": 1102.32}, {"id": "c001_f000044", "text": "Now some innocent people - Ezidis, Christian minorities in the Near (and Middle) East, Mandeans, Syrians, Iraqis, and Libyans - had to pay a price for the mistakes of these interventionistas currently sitting in comfortable air-conditioned offices. This, we will see, violates the very notion of justice from its prebiblical, Babylonian inception - as well as the ethical structure, that underlying matrix thanks to which humanity has survived.", "begin": 1102.32, "end": 1132.28, "localBegin": 1102.32, "localEnd": 1132.28}, {"id": "c001_f000045", "text": "The principle of intervention, like that of healers, is first do no harm (primum non nocere); even more, we will argue, those who don't take risks should never be involved in making decisions.", "begin": 1132.28, "end": 1147.84, "localBegin": 1132.28, "localEnd": 1147.84}, {"id": "c001_f000046", "text": "Further,", "begin": 1147.84, "end": 1148.88, "localBegin": 1147.84, "localEnd": 1148.88}, {"id": "c001_f000047", "text": "We have always been crazy but weren't skilled enough to destroy the world. Now we can.", "begin": 1148.88, "end": 1156.56, "localBegin": 1148.88, "localEnd": 1156.56}, {"id": "c001_f000048", "text": "We will return to the \"peacemaking\" interventionistas, and examine how their peace processes create deadlocks, as with the Israeli-Palestinian problem.", "begin": 1156.56, "end": 1168.32, "localBegin": 1156.56, "localEnd": 1168.32}, {"id": "c001_f000049", "text": "WARLORDS ARE STILL AROUND", "begin": 1168.32, "end": 1172.12, "localBegin": 1168.32, "localEnd": 1172.12}, {"id": "c001_f000050", "text": "This idea of skin in the game is woven into history: historically, all warlords and warmongers were warriors themselves, and, with a few curious exceptions, societies were run by risk takers, not risk transferors.", "begin": 1172.12, "end": 1186.24, "localBegin": 1172.12, "localEnd": 1186.24}, {"id": "c001_f000051", "text": "Prominent people took risks - considerably more risks than ordinary citizens. The Roman emperor Julian the Apostate, about whom much later, died on the battlefield fighting in the never-ending war on the Persian frontier - while emperor. One may only speculate about Julius Caesar, Alexander, and Napoleon, owing to the usual legend-building by historians, but here the proof is stark. There is no better historical evidence of an emperor taking a frontline position in battle than a Persian spear lodged in his chest (Julian omitted to wear protective armor). One of his predecessors, Valerian, was captured on the same frontier, and was said to have been used as a human footstool by the Persian Shapur when mounting his horse. And the last Byzantine emperor, Constantine XI Palaeologus, was last seen when he removed his purple toga, then joined Ioannis Dalmatus and his cousin Theophilus Palaeologus to charge Turkish troops with their swords above their heads, proudly facing certain death. Yet legend has it that Constantine had been offered a deal in the event of a surrender. Such deals are not for self-respecting kings.", "begin": 1186.24, "end": 1263.76, "localBegin": 1186.24, "localEnd": 1263.76}, {"id": "c001_f000052", "text": "These are not isolated anecdotes. The statistical reasoner in this author is quite convinced: less than a third of Roman emperors died in their beds - and one can argue that given that only few of these died of really old age, had they lived longer, they would have fallen either to a coup or in battle.", "begin": 1263.76, "end": 1283.6, "localBegin": 1263.76, "localEnd": 1283.6}, {"id": "c001_f000053", "text": "Even today, monarchs derive their legitimacy from a social contract that requires physical risk-taking. The British Royal family made sure that one of its scions, Prince Andrew, took more risks than \"commoners\" during the Falkland war of 1982, his helicopter being in the front line. Why? Because noblesse oblige; the very status of a lord has been traditionally derived from protecting others, trading personal risk for prominence - and they happened to still remember that contract. You can't be a lord if you aren't a lord.", "begin": 1283.6, "end": 1320.08, "localBegin": 1283.6, "localEnd": 1320.08}, {"id": "c001_f000054", "text": "THE BOB RUBIN TRADE", "begin": 1320.08, "end": 1323.52, "localBegin": 1320.08, "localEnd": 1323.52}, {"id": "c001_f000055", "text": "Some think that freeing ourselves from having warriors at the top means civilization and progress. It does not. Meanwhile,", "begin": 1323.52, "end": 1332.28, "localBegin": 1323.52, "localEnd": 1332.28}, {"id": "c001_f000056", "text": "Bureaucracy is a construction by which a person is conveniently separated from the consequences of his or her actions.", "begin": 1332.28, "end": 1341.4, "localBegin": 1332.28, "localEnd": 1341.4}, {"id": "c001_f000057", "text": "And, one may ask, what can we do since a centralized system will necessarily need people who are not directly exposed to the cost of errors?", "begin": 1341.4, "end": 1351.12, "localBegin": 1341.4, "localEnd": 1351.12}, {"id": "c001_f000058", "text": "Well, we have no choice but to decentralize or, more politely, to localize; to have fewer of these immune decision makers.", "begin": 1351.12, "end": 1359.72, "localBegin": 1351.12, "localEnd": 1359.72}, {"id": "c001_f000059", "text": "Decentralization is based on the simple notion that it is easier to macrobull***t than microbull***t.", "begin": 1359.72, "end": 1367.4, "localBegin": 1359.72, "localEnd": 1367.4}, {"id": "c001_f000060", "text": "Decentralization reduces large structural asymmetries.", "begin": 1367.4, "end": 1374.08, "localBegin": 1367.4, "localEnd": 1374.08}, {"id": "c001_f000061", "text": "But not to worry, if we do not decentralize and distribute responsibility, it will happen by itself, the hard way: a system that doesn't have a mechanism of skin in the game, with a buildup of imbalances, will eventually blow up and self-repair that way. If it survives.", "begin": 1374.08, "end": 1392.44, "localBegin": 1374.08, "localEnd": 1392.44}, {"id": "c001_f000062", "text": "For instance, bank blowups came in 2008 because of the accumulation of hidden and asymmetric risks in the system: bankers, master risk transferors, could make steady money from a certain class of concealed explosive risks, use academic risk models that don't work except on paper (because academics know practically nothing about risk), then invoke uncertainty after a blowup (that same unseen and unforecastable Black Swan and that same very, very stubborn author), and keep past income - what I have called the Bob Rubin trade.", "begin": 1392.44, "end": 1428.72, "localBegin": 1392.44, "localEnd": 1428.72}, {"id": "c001_f000063", "text": "The Bob Rubin trade? Robert Rubin, a former Secretary of the United States Treasury, one of those who sign their names on the banknote you just used to pay for coffee, collected more than $120 million in compensation from Citibank in the decade preceding the banking crash of 2008. When the bank, literally insolvent, was rescued by the taxpayer, he didn't write any check - he invoked uncertainty as an excuse. Heads he wins, tails he shouts \"Black Swan.\" Nor did Rubin acknowledge that he transferred risk to taxpayers: Spanish grammar specialists, assistant schoolteachers, supervisors in tin can factories, vegetarian nutrition advisors, and clerks for assistant district attorneys were \"stopping him out,\" that is, taking his risks and paying for his losses. But the worst casualty has been free markets, as the public, already prone to hating financiers, started conflating free markets and higher order forms of corruption and cronyism, when in fact it is the exact opposite: it is government, not markets, that makes these things possible by the mechanisms of bailouts. It is not just bailouts: government interference in general tends to remove skin in the game.", "begin": 1428.72, "end": 1505.0, "localBegin": 1428.72, "localEnd": 1505.0}, {"id": "c001_f000064", "text": "The good news is that in spite of the efforts of a complicit Obama administration that wanted to protect the game and the rent-seeking bankers, the risk-taking business started moving toward small independent structures known as hedge funds. The move took place mostly because of the overbureaucratization of the system as paper shufflers (who think work is mostly about paper shuffling) overburdened the banks with rules - but somehow, in the thousands of pages of additional regulations, they avoided considering skin in the game. In the decentralized hedge fund space, on the other hand, owner-operators have at least half of their net worth in the funds, making them relatively more exposed than any of their customers, and they personally go down with the ship.", "begin": 1505.0, "end": 1575.24, "localBegin": 1505.0, "localEnd": 1575.24}, {"id": "c001_f000065", "text": "SYSTEMS LEARN BY REMOVING", "begin": 1575.24, "end": 1579.4, "localBegin": 1575.24, "localEnd": 1579.4}, {"id": "c001_f000066", "text": "Now, if you are going to highlight only one single section from this book, here is the one. The interventionista case is central to our story because it shows how absence of skin in the game has both ethical and epistemological effects (i.e., related to knowledge). We saw that interventionistas don't learn because they are not the victims of their mistakes, and, as we hinted at with pathemata mathemata:", "begin": 1579.4, "end": 1605.64, "localBegin": 1579.4, "localEnd": 1605.64}, {"id": "c001_f000067", "text": "The same mechanism of transferring risk also impedes learning.", "begin": 1605.64, "end": 1611.76, "localBegin": 1605.64, "localEnd": 1611.76}, {"id": "c001_f000068", "text": "More practically,", "begin": 1611.76, "end": 1613.04, "localBegin": 1611.76, "localEnd": 1613.04}, {"id": "c001_f000069", "text": "You will never fully convince someone that he is wrong; only reality can.", "begin": 1613.04, "end": 1619.04, "localBegin": 1613.04, "localEnd": 1619.04}, {"id": "c001_f000070", "text": "Actually, to be precise, reality doesn't care about winning arguments: survival is what matters.", "begin": 1619.04, "end": 1626.08, "localBegin": 1619.04, "localEnd": 1626.08}, {"id": "c001_f000071", "text": "For", "begin": 1626.08, "end": 1626.4, "localBegin": 1626.08, "localEnd": 1626.4}, {"id": "c001_f000072", "text": "The curse of modernity is that we are increasingly populated by a class of people who are better at explaining than understanding,", "begin": 1626.4, "end": 1635.04, "localBegin": 1626.4, "localEnd": 1635.04}, {"id": "c001_f000073", "text": "or better at explaining than doing.", "begin": 1635.04, "end": 1638.52, "localBegin": 1635.04, "localEnd": 1638.52}, {"id": "c001_f000074", "text": "So learning isn't quite what we teach inmates inside the high-security prisons called schools. In biology, learning is something that, through the filter of intergenerational selection, gets imprinted at the cellular level - skin in the game, I insist, is more filter than deterrence. Evolution can only happen if risk of extinction is present. Further,", "begin": 1638.52, "end": 1660.52, "localBegin": 1638.52, "localEnd": 1660.52}, {"id": "c001_f000075", "text": "There is no evolution without skin in the game.", "begin": 1660.52, "end": 1663.52, "localBegin": 1660.52, "localEnd": 1663.52}, {"id": "c001_f000076", "text": "This last point is quite obvious, but I keep seeing academics with no skin in the game defend evolution while at the same time rejecting skin in the game and risk sharing. They refuse the notion of design by a creator who knows everything, while, at the same time, want to impose human design as if they knew all the consequences. In general, the more people worship the sacrosanct state (or, equivalently, large corporations), the more they hate skin in the game. The more they believe in their ability to forecast, the more they hate skin in the game. The more they wear suits and ties, the more they hate skin in the game.", "begin": 1663.52, "end": 1705.4, "localBegin": 1663.52, "localEnd": 1705.4}, {"id": "c001_f000077", "text": "Returning to our interventionistas, we saw that people don't learn so much from their - and other people's - mistakes; rather it is the system that learns by selecting those less prone to a certain class of mistakes and eliminating others.", "begin": 1705.4, "end": 1720.32, "localBegin": 1705.4, "localEnd": 1720.32}, {"id": "c001_f000078", "text": "Systems learn by removing parts, via negativa.", "begin": 1720.32, "end": 1731.4, "localBegin": 1720.32, "localEnd": 1731.4}, {"id": "c001_f000079", "text": "Many bad pilots, as we mentioned, are currently in the bottom of the Atlantic, many dangerous bad drivers are in the local quiet cemetery with nice walkways bordered by trees. Transportation didn't get safer just because people learn from errors, but because the system does. The experience of the system is different from that of individuals; it is grounded in filtering.", "begin": 1731.4, "end": 1773.0, "localBegin": 1731.4, "localEnd": 1773.0}, {"id": "c001_f000080", "text": "To summarize so far,", "begin": 1773.0, "end": 1776.52, "localBegin": 1773.0, "localEnd": 1776.52}, {"id": "c001_f000081", "text": "Skin in the game keeps human hubris in check.", "begin": 1776.52, "end": 1781.6, "localBegin": 1776.52, "localEnd": 1781.6}, {"id": "c001_f000082", "text": "Let us now go deeper with the second part of the prologue, and consider the notion of symmetry.", "begin": 1781.6, "end": 1789.88, "localBegin": 1781.6, "localEnd": 1789.88}]}, {"kind": "chapter", "number": 2, "title": "Prologue, Part 2: A Brief Tour of Symmetry", "audio": "audio/chapter_002.mp3", "start": 1789.91, "end": 5302.178, "duration": 3512.268, "paragraphs": [{"id": "c002_f000001", "text": "Prologue, Part 2 A Brief Tour of Symmetry", "begin": 1789.91, "end": 1796.11, "localBegin": 0.0, "localEnd": 6.2}, {"id": "c002_f000002", "text": "Meta-experts judged by meta-meta-experts - Prostitutes, nonprostitutes, and amateurs - The French have this thing with Hammurabi - Dumas is always an exception", "begin": 1796.11, "end": 1811.19, "localBegin": 6.2, "localEnd": 21.28}, {"id": "c002_f000003", "text": "I. FROM HAMMURABI TO KANT", "begin": 1811.19, "end": 1815.23, "localBegin": 21.28, "localEnd": 25.32}, {"id": "c002_f000004", "text": "Skin-in-the-game-style symmetry, until the recent intellectualization of life, had been implicitly considered the principal rule for organized society, even for any form of collective life in which one encounters or deals with others more than once. The rule had to even precede human settlement since it prevails in a sophisticated, very sophisticated, form in the animal kingdom. Or, to rephrase, it had to prevail there or life would have been extinct - risk transfer blows up systems. And the very idea of law, divine or otherwise, resides in fixing imbalances and remedying such asymmetries.", "begin": 1815.23, "end": 1856.15, "localBegin": 25.32, "localEnd": 66.24}, {"id": "c002_f000005", "text": "Let us briefly travel the road from Hammurabi to Kant, where the rule gets refined along with civilized life.", "begin": 1856.15, "end": 1864.95, "localBegin": 66.24, "localEnd": 75.04}, {"id": "c002_f000006", "text": "Hammurabi in Paris", "begin": 1864.95, "end": 1867.87, "localBegin": 75.04, "localEnd": 77.96}, {"id": "c002_f000007", "text": "Hammurabi's law was posted on a basalt stele around 3,800 years ago in a central public place in Babylon, so every literate person could read it, or, rather, read it to others who couldn't read. It contains 282 laws and is deemed to be the first codification of our rule extant. The code has one central theme: it establishes symmetries between people in a transaction, so nobody can transfer hidden tail risk, or Bob Rubin-style risks. Yes, the Bob Rubin trade is 3,800 years old, as old as civilization, and so are the rules to counter it.", "begin": 1867.87, "end": 1909.67, "localBegin": 77.96, "localEnd": 119.76}, {"id": "c002_f000008", "text": "What is a tail? Take for now that it is an extreme event of low frequency. It is called a \"tail\" because, in drawings of bell-curve style frequencies, it is located to the extreme left or right (being of low frequency), and for some reason beyond my immediate understanding, people started calling that a \"tail\" and the term stuck.", "begin": 1909.67, "end": 1933.23, "localBegin": 119.76, "localEnd": 143.32}, {"id": "c002_f000009", "text": "Hammurabi's best known injunction is as follows: \"If a builder builds a house and the house collapses and causes the death of the owner of the house - the builder shall be put to death.\"", "begin": 1933.23, "end": 1946.23, "localBegin": 143.32, "localEnd": 156.32}, {"id": "c002_f000010", "text": "For, as with financial traders, the best place to hide risks is \"in the corners,\" in burying vulnerabilities to rare events that only the architect (or the trader) can detect - the idea being to be far away in time and place when blowups happen. As one old alcoholic ruddy-faced English banker told me when I graduated from school, volunteering career advice: \"I give long-term loans only. When they mature I want to be long gone. And only reachable long distance.\" He worked for international banks and survived playing his trick by changing country every five years, and, from what I recall, he also changed wives every ten years and banks every twelve. But he didn't have to go hide very far or very deeply underground: nobody until very recently clawed back (that is, reclaimed) the past bonuses of bankers when something subsequently went wrong. And, not unexpectedly, it was the Swiss who started clawing back, in 2008.", "begin": 1946.23, "end": 2012.07, "localBegin": 156.32, "localEnd": 222.16}, {"id": "c002_f000011", "text": "The well-known lex talionis, \"an eye for one eye,\" comes from Hammurabi's rule. It is metaphorical, not literal: you don't have to actually remove an eye - hence the rule is much more flexible than it appears at first glance. For, in a famous Talmudic discussion (in Bava Kamma), a rabbi argues that if one followed the letter, the one-eyed would only pay half the punishment if he blinds a two-eyed person, and the blind would go scot-free. Or what if a small person kills a hero? Likewise, you do not need to amputate the leg of the reckless doctor who cut the wrong leg: the tort system, through courts, not regulation, thanks to the efforts of Ralph Nader, will impose some penalty, enough to protect consumers and citizens from powerful institutions. Clearly the legal system might produce some irritants (particularly with torts) and has its class of rent-seekers, but we are vastly better off complaining about lawyers than complaining about not having them.", "begin": 2012.07, "end": 2073.03, "localBegin": 222.16, "localEnd": 283.12}, {"id": "c002_f000012", "text": "More practically, some economists have been trying to blame me for wanting to reverse the bankruptcy protection offered in modern times; some even accused me of wanting to bring back the guillotine for bankers. I am not that literal: it is just the matter of inflicting some penalty, just enough to make the Bob Rubin trade less attractive, and protect the public.", "begin": 2073.03, "end": 2095.63, "localBegin": 283.12, "localEnd": 305.72}, {"id": "c002_f000013", "text": "Now, for some reason that escapes me, one of those strange things one finds only in France, Hammurabi's code, a stele in gray-black basalt, resides in the Louvre Museum in Paris. And the French, who normally know about a lot of things we don't know much about, don't seem to know about it; only Korean visitors with selfie sticks appear to have heard of the place.", "begin": 2095.63, "end": 2118.63, "localBegin": 305.72, "localEnd": 328.72}, {"id": "c002_f000014", "text": "On my penultimate pilgrimage to the site, I happened to lecture French financiers in a conference room in the museum building about the ideas of this book, and the notion of skin in the game. I was speaking right after the man who, in spite of looks (and personality) quite similar to those found in Mesopotamian statues, epitomizes absence of skin in the game: former Federal Reserve governor Ben Bernanke. To my sorrow, when I publicly questioned the audience, using the irony of the situation, namely that almost four millennia ago we were sort of more sophisticated with these things, and that the monument was 300 feet from where I was lecturing, nobody in the room, in spite of the high culture of French financiers, figured out what I was talking about. Nobody was aware of Hammurabi beyond some player in Mesopotamian geopolitics, or suspected his connection to skin in the game and the accountability of bankers.", "begin": 2118.63, "end": 2173.99, "localBegin": 328.72, "localEnd": 384.08}, {"id": "c002_f000015", "text": "Table 1 shows the progression of the rules of symmetry from Hammurabi onward, so let us climb the ladder.", "begin": 2173.99, "end": 2186.35, "localBegin": 384.08, "localEnd": 396.44}, {"id": "c002_f000016", "text": "Table 1 • Evolution of Moral Symmetry From Taleb and Sandis, 2016 Hammurabi/Lex Talionis 15th Law of Holiness and Justi", "begin": 2186.35, "end": 2200.59, "localBegin": 396.44, "localEnd": 410.68}, {"id": "c002_f000017", "text": "Silver Beats Gold", "begin": 2200.59, "end": 2205.59, "localBegin": 410.68, "localEnd": 415.68}, {"id": "c002_f000018", "text": "We rapidly go through the rules to the right of Hammurabi. Leviticus is a sweetening of Hammurabi's rule. The Golden Rule wants you to Treat others the way you would like them to treat you. The more robust Silver Rule says Do not treat others the way you would not like them to treat you. More robust? How? Why is the Silver Rule more robust?", "begin": 2205.59, "end": 2228.79, "localBegin": 415.68, "localEnd": 438.88}, {"id": "c002_f000019", "text": "First, it tells you to mind your own business and not decide what is \"good\" for others. We know with much more clarity what is bad than what is good. The Silver Rule can be seen as the Negative Golden Rule, and as I am shown by my Calabrese (and Calabrese-speaking) barber every three weeks, via negativa (acting by removing) is more powerful and less error-prone than via positiva (acting by addition).", "begin": 2228.79, "end": 2262.55, "localBegin": 438.88, "localEnd": 472.64}, {"id": "c002_f000020", "text": "Now a word about the \"others\" in treat others. \"You\" can be singular or plural, hence it can designate an individual, a basketball team, or the Northeast Association of Calabrese-Speaking Barbers. Same with the \"others.\" The idea is fractal, in the sense that it works at all scales: humans, tribes, societies, groups of societies, countries, etc., assuming each one is a separate standalone unit and can deal with other counterparts as such. Just as individuals should treat others the way they would like to be treated (or avoid being mistreated), families as units should treat other families in the same way. And, something that makes the interventionistas of Prologue 1 even more distasteful, so should countries. For Isocrates, the wise Athenian orator, warned us as early as the fifth century B.C. that nations should treat other nations according to the Silver Rule. He wrote:", "begin": 2262.55, "end": 2319.55, "localBegin": 472.64, "localEnd": 529.64}, {"id": "c002_f000021", "text": "\"Deal with weaker states as you think it appropriate for stronger states to deal with you.\"", "begin": 2319.55, "end": 2326.59, "localBegin": 529.64, "localEnd": 536.68}, {"id": "c002_f000022", "text": "Nobody embodies the notion of symmetry better than Isocrates, who lived more than a century and made significant contributions when he was in his nineties. He even managed a rare dynamic version of the Golden Rule: \"Conduct yourself toward your parents as you would have your children conduct themselves toward you.\" We had to wait for the great baseball coach Yogi Berra to get another such dynamic rule for symmetric relations: \"I go to other people's funerals so they come to mine.\"", "begin": 2326.59, "end": 2359.95, "localBegin": 536.68, "localEnd": 570.04}, {"id": "c002_f000023", "text": "More effective, of course, is the reverse direction, to treat one's children the way one wished to be treated by one's parents.", "begin": 2359.95, "end": 2382.19, "localBegin": 570.04, "localEnd": 592.28}, {"id": "c002_f000024", "text": "The very idea behind the First Amendment of the Constitution of the United States is to establish a silver rule-style symmetry: you can practice your freedom of religion so long as you allow me to practice mine; you have the right to contradict me so long as I have the right to contradict you. Effectively, there is no democracy without such an unconditional symmetry in the rights to express yourself, and the gravest threat is the slippery slope in the attempts to limit speech on grounds that some of it may hurt some people's feelings. Such restrictions do not necessarily come from the state itself, rather from the forceful establishment of an intellectual monoculture by an overactive thought police in the media and cultural life.", "begin": 2382.19, "end": 2435.55, "localBegin": 592.28, "localEnd": 645.64}, {"id": "c002_f000025", "text": "Fuhgetaboud Universalism", "begin": 2435.55, "end": 2439.55, "localBegin": 645.64, "localEnd": 649.64}, {"id": "c002_f000026", "text": "By applying symmetry to relations between individual and collective, we get virtue, classical virtue, what is now called \"virtue ethics.\" But there is a next step: all the way to the right of Table 1 is Immanuel Kant's categorical imperative, which I summarize as: Behave as if your action can be generalized to the behavior of everyone in all places, under all conditions. The actual text is more challenging: \"Act only in accordance with that maxim through which you can at the same time will that it will become a universal law,\" Kant wrote in what is known as the first formulation. And \"act in such a way that you treat humanity, whether in your own person or in the person of any other, never merely as a means to an end, but always at the same time as an end,\" in what is known as the second formulation.", "begin": 2439.55, "end": 2492.67, "localBegin": 649.64, "localEnd": 702.76}, {"id": "c002_f000027", "text": "Formulation shmormulation, fughedaboud Kant as it gets too complicated and things that get complicated have a problem. So we will skip Kant's drastic approach for one main reason:", "begin": 2492.67, "end": 2503.87, "localBegin": 702.76, "localEnd": 713.96}, {"id": "c002_f000028", "text": "Universal behavior is great on paper, disastrous in practice.", "begin": 2503.87, "end": 2509.71, "localBegin": 713.96, "localEnd": 719.8}, {"id": "c002_f000029", "text": "Why? As we will belabor ad nauseam in this book, we are local and practical animals, sensitive to scale. The small is not the large; the tangible is not the abstract; the emotional is not the logical. Just as we argued that micro works better than macro, it is best to avoid going to the very general when saying hello to your garage attendant. We should focus on our immediate environment; we need simple practical rules. Even worse: the general and the abstract tend to attract self-righteous psychopaths similar to the interventionistas of Part 1 of the Prologue.", "begin": 2509.71, "end": 2548.11, "localBegin": 719.8, "localEnd": 758.2}, {"id": "c002_f000030", "text": "In other words, Kant did not get the notion of scaling - yet many of us are victims of Kant's universalism. (As we saw, modernity likes the abstract over the particular; social justice warriors have been accused of \"treating people as categories, not individuals.\") Few, outside of religion, really got the notion of scaling before the great political thinker Elinor Ostrom, about whom a bit in Chapter 1.", "begin": 2548.11, "end": 2575.59, "localBegin": 758.2, "localEnd": 785.68}, {"id": "c002_f000031", "text": "In fact, the deep message of this book is the danger of universalism taken two or three steps too far - conflating the micro and the macro. Likewise the crux of the idea of The Black Swan was Platonification, missing central but hidden elements of a thing in the process of transforming it into an abstract construct, then causing a blowup.", "begin": 2575.59, "end": 2598.23, "localBegin": 785.68, "localEnd": 808.32}, {"id": "c002_f000032", "text": "II. FROM KANT TO FAT TONY", "begin": 2598.23, "end": 2605.95, "localBegin": 808.32, "localEnd": 816.04}, {"id": "c002_f000033", "text": "Let us move to the present, to the transactional, highly transactional present. In New Jersey, symmetry can simply mean, in Fat Tony's terms: don't give crap, don't take crap. His more practical approach is", "begin": 2605.95, "end": 2620.59, "localBegin": 816.04, "localEnd": 830.68}, {"id": "c002_f000034", "text": "Start by being nice to every person you meet. But if someone tries to exercise power over you, exercise power over him.", "begin": 2620.59, "end": 2629.63, "localBegin": 830.68, "localEnd": 839.72}, {"id": "c002_f000035", "text": "Who is Fat Tony? He is a character in the Incerto who, in demeanor, behavior, choices under uncertainty, conversation, lifestyle, waist size, and food habits would be the exact opposite of your State Department analyst or economics lecturer. He is also calm and unfazed unless one really gets him angry. He became wealthy by helping people he generically calls \"the suckers\" separate from their funds (or, as is often the case, those of their clients, as these people often gamble with other people's money).", "begin": 2629.63, "end": 2664.87, "localBegin": 839.72, "localEnd": 874.96}, {"id": "c002_f000036", "text": "This symmetry thing happens to link directly to my own profession: option trader. In an option, one person (the buyer of the option), contractually has the upside (future gains), the other (the seller) has a liability for the downside (future losses), for a pre-agreed price. Just as in an insurance contract, where risk is transferred for a fee. Any meaningful disruption of such symmetry - with transfer of liabilities - invariably leads to an explosive situation, as we saw with the economic crisis of 2008.", "begin": 2664.87, "end": 2700.11, "localBegin": 874.96, "localEnd": 910.2}, {"id": "c002_f000037", "text": "This symmetry thing also concerns the alignment of interests in a transaction. Let us refresh earlier arguments: if bankers' profits accrue to them, while their losses are somewhat quietly transferred to society (the Spanish grammar specialists, assistant schoolteachers…), there is a fundamental problem by which hidden risks will continuously increase, until the final blowup. Regulations, while appearing to be a remedy on paper, if anything, exacerbate the problem as they facilitate risk-hiding.", "begin": 2700.11, "end": 2732.87, "localBegin": 910.2, "localEnd": 942.96}, {"id": "c002_f000038", "text": "Which brings us to what is known as the agency problem.", "begin": 2732.87, "end": 2735.95, "localBegin": 942.96, "localEnd": 946.04}, {"id": "c002_f000039", "text": "Crook, Fool, or Both", "begin": 2735.95, "end": 2742.35, "localBegin": 946.04, "localEnd": 952.44}, {"id": "c002_f000040", "text": "One practical extension of the Silver Rule (as a reminder, it is the one that says Do not do to others what you don't want them to do to you):", "begin": 2742.35, "end": 2751.91, "localBegin": 952.44, "localEnd": 962.0}, {"id": "c002_f000041", "text": "Avoid taking advice from someone who gives advice for a living, unless there is a penalty for their advice.", "begin": 2751.91, "end": 2760.03, "localBegin": 962.0, "localEnd": 970.12}, {"id": "c002_f000042", "text": "Recall the earlier comment on how \"I trust you\" straddles both ethics and knowledge. There is always an element of fools of randomness and crooks of randomness in matters of uncertainty; one has a lack of understanding, the second has warped incentives. One, the fool, takes risks he doesn't understand, mistaking his own past luck for skills, the other, the crook, transfers risks to others. Economists, when they talk about skin in the game, are only concerned with the second.", "begin": 2760.03, "end": 2791.87, "localBegin": 970.12, "localEnd": 1001.96}, {"id": "c002_f000043", "text": "Let us flush out the idea of agency, well-known and studied by insurance companies. Simply, you know a lot more about your health than any insurer would. So you have an incentive to get an insurance policy when you detect an illness before someone else knows about it. By getting insured when it fits you, not when you are healthy, you end up costing the system more than you put into it, hence causing a raise in premia paid by all sorts of innocent people (including, again, the Spanish grammar specialists). Insurance companies have filters such as high deductibles and other methods to eliminate such imbalances.", "begin": 2791.87, "end": 2829.71, "localBegin": 1001.96, "localEnd": 1039.8}, {"id": "c002_f000044", "text": "The agency problem (or principal-agent problem) also manifests itself in the misalignment of interests in transactions: a vendor in a one-shot transaction does not have his interests aligned to yours - and so can hide stuff from you.", "begin": 2829.71, "end": 2845.63, "localBegin": 1039.8, "localEnd": 1055.72}, {"id": "c002_f000045", "text": "But disincentive is not enough: the fool is a real thing. Some people do not know their own interest - just consider addicts, workaholics, people trapped in a bad relationship, people who support large government, the press, book reviewers, or respectable bureaucrats, all of whom for some mysterious reason act against their own interest. So there is this other instance where filtering plays a role: fools of randomness are purged by reality so they stop harming others. Recall that it is at the foundation of evolution that systems get smart by elimination.", "begin": 2845.63, "end": 2884.23, "localBegin": 1055.72, "localEnd": 1094.32}, {"id": "c002_f000046", "text": "There is another point: we may not know beforehand if an action is foolish - but reality knows.", "begin": 2884.23, "end": 2890.43, "localBegin": 1094.32, "localEnd": 1100.52}, {"id": "c002_f000047", "text": "Causal Opacity and Preferences Revealed", "begin": 2890.43, "end": 2900.91, "localBegin": 1100.52, "localEnd": 1111.0}, {"id": "c002_f000048", "text": "Let us now take the epistemological dimension of skin in the game to an even higher level. Skin in the game is about the real world, not appearances. As per Fat Tony's motto:", "begin": 2900.91, "end": 2912.23, "localBegin": 1111.0, "localEnd": 1122.32}, {"id": "c002_f000049", "text": "You do not want to win an argument. You want to win.", "begin": 2912.23, "end": 2917.07, "localBegin": 1122.32, "localEnd": 1127.16}, {"id": "c002_f000050", "text": "Indeed you need to win whatever you are after: money, territory, the heart of a grammar specialist, or a (pink) convertible car. For focusing just on words puts one on a very dangerous slope, since", "begin": 2917.07, "end": 2930.43, "localBegin": 1127.16, "localEnd": 1140.52}, {"id": "c002_f000051", "text": "We are much better at doing than understanding.", "begin": 2930.43, "end": 2936.51, "localBegin": 1140.52, "localEnd": 1146.6}, {"id": "c002_f000052", "text": "There is a difference between a charlatan and a genuinely skilled member of society, say that between a macrobull***ter political \"scientist\" and a plumber, or between a journalist and a mafia made man. The doer wins by doing, not convincing. Entire fields (say economics and other social sciences) become themselves charlatanic because of the absence of skin in the game connecting them back to earth (while the participants argue about \"science\"). Chapter 9 shows how they will develop elaborate rituals, titles, protocols, and formalities to hide this deficit.", "begin": 2936.51, "end": 2973.55, "localBegin": 1146.6, "localEnd": 1183.64}, {"id": "c002_f000053", "text": "You may not know in your mind where you are going, but you know it by doing.", "begin": 2973.55, "end": 2979.63, "localBegin": 1183.64, "localEnd": 1189.72}, {"id": "c002_f000054", "text": "Even economics is based on the notion of \"revealed preferences.\" What people \"think\" is not relevant - you want to avoid entering the mushy-soft and self-looping discipline of psychology. People's \"explanations\" for what they do are just words, stories they tell themselves, not the business of proper science. What they do, on the other hand, is tangible and measurable and that's what we should focus on. This axiom, perhaps even principle, is very powerful but is not followed too much by researchers. Revelation of preferences is best understood by the betrothed: a diamond, particularly when it is onerous to the buyer, is vastly more convincing a commitment (and much less reversible) than a verbal promise.", "begin": 2979.63, "end": 3026.27, "localBegin": 1189.72, "localEnd": 1236.36}, {"id": "c002_f000055", "text": "As to forecasting, fuhgetaboud it:", "begin": 3026.27, "end": 3029.27, "localBegin": 1236.36, "localEnd": 1239.36}, {"id": "c002_f000056", "text": "Forecasting (in words) bears no relation to speculation (in deeds).", "begin": 3029.27, "end": 3036.43, "localBegin": 1239.36, "localEnd": 1246.52}, {"id": "c002_f000057", "text": "I personally know rich horrible forecasters and poor \"good\" forecasters. Because what matters in life isn't how frequently one is \"right\" about outcomes, but how much one makes when one is right. Being wrong, when it is not costly, doesn't count - in a way that's similar to trial-and-error mechanisms of research.", "begin": 3036.43, "end": 3057.11, "localBegin": 1246.52, "localEnd": 1267.2}, {"id": "c002_f000058", "text": "Exposures in real life, outside of games, are always too complicated to reduce to a well-defined \"event\" easy to describe in words. Outcomes in real life are not as in a baseball game, reduced to a binary win-or-lose outcome. Many exposures are highly nonlinear: you may be beneficially exposed to rain, but not to floods. The exact argument is flushed out in this author's technical works. Take for now that forecasting, especially when done with \"science,\" is often the last refuge of the charlatan, and has been so since the beginning of times.", "begin": 3057.11, "end": 3094.63, "localBegin": 1267.2, "localEnd": 1304.72}, {"id": "c002_f000059", "text": "Further, there is something called the inverse problem in mathematics, which is solved by - and only by - skin in the game. I will simplify for now as follows: it is harder for us to reverse-engineer than engineer; we see the result of evolutionary forces but cannot replicate them owing to their causal opacity. We can only run such processes forward. The very operation of Time (which we capitalize) and its irreversibility requires the filtering from skin in the game.", "begin": 3094.63, "end": 3126.79, "localBegin": 1304.72, "localEnd": 1336.88}, {"id": "c002_f000060", "text": "Skin in the game helps to solve the Black Swan problem and other matters of uncertainty at the level of both the individual and the collective: what has survived has revealed its robustness to Black Swan events and removing skin in the game disrupts such selection mechanisms. Without skin in the game, we fail to get the Intelligence of Time (a manifestation of the Lindy effect, which will get an entire chapter, and by which 1) time removes the fragile and keeps the robust, and 2) the life expectancy of the nonfragile lengthens with time). Ideas have, indirectly, skin in the game, and populations that harbor them do as well.", "begin": 3126.79, "end": 3168.39, "localBegin": 1336.88, "localEnd": 1378.48}, {"id": "c002_f000061", "text": "In that light - that of (causal) opacity and revelation of preferences - the Intelligence of Time under skin in the game even helps define rationality - the only definition of rationality I found that doesn't fall apart under logical scrutiny. A practice may appear to be irrational to an overeducated and naive (but punctual) observer who works in the French Ministry of Planning, because we humans are not intelligent enough to understand it - but it has worked for a long time. Is it rational? We have no grounds to reject it. But we know what is patently irrational: what threatens the survival of the collective first, the individual second. And, from a statistical standpoint, going against nature (and its statistical significance) is irrational. In spite of the noise funded by pesticide and other technological companies, there is no known rigorous definition of rationality that makes rejection of the \"natural\" rational; to the contrary. By definition, what works cannot be irrational; about every single person I know who has chronically failed in business shares that mental block, the failure to realize that if something stupid works (and makes money), it cannot be stupid.", "begin": 3168.39, "end": 3246.55, "localBegin": 1378.48, "localEnd": 1456.64}, {"id": "c002_f000062", "text": "A system with skin-in-the-game requirements holds together through the notion of a sacrifice in order to protect the collective or entities higher in the hierarchy that are required to survive. \"Survival talks and BS walks.\" Or as Fat Tony would put it: \"Survival tawks and BS wawks.\" In other words:", "begin": 3246.55, "end": 3267.19, "localBegin": 1456.64, "localEnd": 1477.28}, {"id": "c002_f000063", "text": "What is rational is what allows the collective - entities meant to live for a long time - to survive.", "begin": 3267.19, "end": 3275.11, "localBegin": 1477.28, "localEnd": 1485.2}, {"id": "c002_f000064", "text": "Not what is called \"rational\" in some unrigorous psychology or social science book. In that sense, contrary to what psychologists and psycholophasters will tell you, some \"overestimation\" of tail risk is not irrational by any metric, as it is more than required overall for survival. There are some risks we just cannot afford to take. And there are other risks (of the type academics shun) that we cannot afford to not take. This dimension, which bears the name \"ergodic,\" is belabored in Chapter 19.", "begin": 3275.11, "end": 3337.67, "localBegin": 1485.2, "localEnd": 1547.76}, {"id": "c002_f000065", "text": "Skin in the Game, but Not All the Time", "begin": 3337.67, "end": 3341.79, "localBegin": 1547.76, "localEnd": 1551.88}, {"id": "c002_f000066", "text": "Skin in the game is an overall necessity, but let us not get carried away in applying it to everything in sight in its every detail, particularly when consequences are contained. There is a difference between the interventionista of Prologue, Part 1 making pronouncements that cause thousands to be killed overseas, and a harmless opinion voiced by a person in a conversation, or a pronouncement by a fortune teller used for therapy rather than decision making. Our message is to focus on those who are professionally slanted, causing harm without being accountable for it, by the very structure of their own occupation.", "begin": 3341.79, "end": 3380.35, "localBegin": 1551.88, "localEnd": 1590.44}, {"id": "c002_f000067", "text": "For the professionally asymmetric person is rare and has been so in history, and even in the present. He causes a lot of problems, but he is rare. For most people you run into in real life - bakers, cobblers, plumbers, taxi drivers, accountants, tax advisors, garbage collectors, dental cleaning assistants, carwash operators (not counting Spanish grammar specialists) - pay a price for their mistakes.", "begin": 3380.35, "end": 3408.63, "localBegin": 1590.44, "localEnd": 1618.72}, {"id": "c002_f000068", "text": "III. MODERNISM", "begin": 3408.63, "end": 3410.47, "localBegin": 1618.72, "localEnd": 1620.56}, {"id": "c002_f000069", "text": "While conforming to ancestral, ancient, and classical notions of justice, this book, relying on the same arguments of asymmetry, goes against a century and a half of modernistic thinking - something we will call here intellectualism. Intellectualism is the belief that one can separate an action from the results of such action, that one can separate theory from practice, and that one can always fix a complex system by hierarchical approaches, that is, in a (ceremonial) top-down manner.", "begin": 3410.47, "end": 3443.67, "localBegin": 1620.56, "localEnd": 1653.76}, {"id": "c002_f000070", "text": "Intellectualism has a sibling: scientism, a naive interpretation of science as complication rather than science as a process and a skeptical enterprise. Using mathematics when it's not needed is not science but scientism. Replacing your well-functioning hand with something more technological, say, an artificial one, is not more scientific. Replacing the \"natural,\" that is age-old, processes that have survived trillions of high-dimensional stressors with something in a \"peer-reviewed\" journal that may not survive replication or statistical scrutiny is neither science nor good practice. At the time of writing, science has been taken over by vendors using it to sell products (like margarine or genetically modified solutions) and, ironically, the skeptical enterprise is being used to silence skeptics.", "begin": 3443.67, "end": 3494.95, "localBegin": 1653.76, "localEnd": 1705.04}, {"id": "c002_f000071", "text": "Disrespect for the vapidly complicated, verbalistically derived truths has always been present in intellectual history, but you are not likely to see it in your local scientific reporter or college teacher: higher-order questioning requires more intellectual confidence, deeper understanding of statistical significance, and a higher level of rigor and intellectual capacity - or, even better, experience selling rugs or specialized spices in a souk. So this book continues a long tradition of skeptical-inquiry-cum-practical-solutions - the readers of the Incerto might be familiar with the schools of skeptics (covered in The Black Swan), in particular the twenty-two-century-old diatribe by Sextus Empiricus Against the Professors.", "begin": 3494.95, "end": 3541.47, "localBegin": 1705.04, "localEnd": 1751.56}, {"id": "c002_f000072", "text": "The rule is:", "begin": 3541.47, "end": 3544.23, "localBegin": 1751.56, "localEnd": 1754.32}, {"id": "c002_f000073", "text": "Those who talk should do and only those who do should talk", "begin": 3544.23, "end": 3548.99, "localBegin": 1754.32, "localEnd": 1759.08}, {"id": "c002_f000074", "text": "with some dispensation for self-standing activities such as mathematics, rigorous philosophy, poetry, and art, ones that do not make explicit claims of fitting reality. As the great game theorist Ariel Rubinstein holds: do your theories or mathematical representations, don't tell people in the real world how to apply them. Let those with skin in the game select what they need.", "begin": 3548.99, "end": 3574.79, "localBegin": 1759.08, "localEnd": 1784.88}, {"id": "c002_f000075", "text": "Let us get more practical about the side effect of modernism: as things get more technological, there is a growing separation between the maker and the user.", "begin": 3574.79, "end": 3586.19, "localBegin": 1784.88, "localEnd": 1796.28}, {"id": "c002_f000076", "text": "How to Beam Light on a Speaker", "begin": 3586.19, "end": 3588.15, "localBegin": 1796.28, "localEnd": 1798.24}, {"id": "c002_f000077", "text": "Those who give lectures to large audiences notice that they - and other speakers - are uncomfortable on the stage. The reason, it took me a decade to figure out, is that the stage light beaming into our eyes hinders our concentration. (This is how police interrogations of suspects used to be run: beam a light on the suspect, and wait for him to start \"singing.\") But in the thick of the lecture, speakers can't identify what is wrong, so they attribute the loss of concentration to, simply, being on the stage. So the practice continues. Why? Because those who lecture to large audiences don't work on lighting and light engineers don't lecture to large audiences.", "begin": 3588.15, "end": 3630.59, "localBegin": 1798.24, "localEnd": 1840.68}, {"id": "c002_f000078", "text": "Another small example of top-down progress: Metro North, the railroad between New York City and its northern suburbs, renovated its trains, in a total overhaul. Trains look more modern, neater, have brighter colors, and even have such amenities as power plugs for your computer (that nobody uses). But on the edge, by the wall, there used to be a flat ledge where one can put the morning cup of coffee: it is hard to read a book while holding a coffee cup. The designer (who either doesn't ride trains or rides trains but doesn't drink coffee while reading), thinking it is an aesthetic improvement, made the ledge slightly tilted, so it is impossible to put the cup on it.", "begin": 3630.59, "end": 3669.83, "localBegin": 1840.68, "localEnd": 1879.92}, {"id": "c002_f000079", "text": "This explains the more severe problems of landscaping and architecture: architects today build to impress other architects, and we end up with strange - irreversible - structures that do not satisfy the well-being of their residents; it takes time and a lot of progressive tinkering for that. Or some specialist sitting in the ministry of urban planning who doesn't live in the community will produce the equivalent of the tilted ledge - as an improvement, except at a much larger scale.", "begin": 3669.83, "end": 3699.43, "localBegin": 1879.92, "localEnd": 1909.52}, {"id": "c002_f000080", "text": "Specialization, as I will keep insisting, comes with side effects, one of which is separating labor from the fruits of labor.", "begin": 3699.43, "end": 3711.07, "localBegin": 1909.52, "localEnd": 1921.16}, {"id": "c002_f000081", "text": "Simplicity", "begin": 3711.07, "end": 3713.35, "localBegin": 1921.16, "localEnd": 1923.44}, {"id": "c002_f000082", "text": "Now skin in the game brings simplicity - the disarming simplicity of things properly done. People who see complicated solutions do not have an incentive to implement simplified ones. As we saw, a bureaucratized system will increase in complication from the interventionism of people who sell complicated solutions because that's what their position and training invite them to do.", "begin": 3713.35, "end": 3736.75, "localBegin": 1923.44, "localEnd": 1946.84}, {"id": "c002_f000083", "text": "Things designed by people without skin in the game tend to grow in complication (before their final collapse).", "begin": 3736.75, "end": 3746.75, "localBegin": 1946.84, "localEnd": 1956.84}, {"id": "c002_f000084", "text": "There is absolutely no benefit for someone in such a position to propose something simple: when you are rewarded for perception, not results, you need to show sophistication. Anyone who has submitted a \"scholarly\" paper to a journal knows that you usually raise the odds of acceptance by making it more complicated than necessary. Further, there are side effects for problems that grow nonlinearly with such branching-out complications. Worse:", "begin": 3746.75, "end": 3774.19, "localBegin": 1956.84, "localEnd": 1984.28}, {"id": "c002_f000085", "text": "Non-skin-in-the-game people don't get simplicity.", "begin": 3774.19, "end": 3780.27, "localBegin": 1984.28, "localEnd": 1990.36}, {"id": "c002_f000086", "text": "I Am Dumb Without Skin in the Game", "begin": 3780.27, "end": 3784.27, "localBegin": 1990.36, "localEnd": 1994.36}, {"id": "c002_f000087", "text": "Let us return to pathematamathemata (learning through pain) and consider its reverse: learning through thrills and pleasure. People have two brains, one when there is skin in the game, one when there is none. Skin in the game can make boring things less boring. When you have skin in the game, dull things like checking the safety of the aircraft because you may be forced to be a passenger in it cease to be boring. If you are an investor in a company, doing ultra-boring things like reading the footnotes of a financial statement (where the real information is to be found) becomes, well, almost not boring.", "begin": 3784.27, "end": 3821.55, "localBegin": 1994.36, "localEnd": 2031.64}, {"id": "c002_f000088", "text": "But there is an even more vital dimension. Many addicts who normally have a dull intellect and the mental nimbleness of a cauliflower - or a foreign policy expert - are capable of the most ingenious tricks to procure their drugs. When they undergo rehab, they are often told that should they spend half the mental energy trying to make money as they did procuring drugs, they are guaranteed to become millionaires. But, to no avail. Without the addiction, their miraculous powers go away. It was like a magical potion that gave remarkable powers to those seeking it, but not those drinking it.", "begin": 3821.55, "end": 3857.83, "localBegin": 2031.64, "localEnd": 2067.92}, {"id": "c002_f000089", "text": "A confession. When I don't have skin in the game, I am usually dumb. My knowledge of technical matters, such as risk and probability, did not initially come from books. It did not come from lofty philosophizing and scientific hunger. It did not even come from curiosity. It came from the thrills and hormonal flush one gets while taking risks in the markets. I never thought mathematics was something interesting to me until, when I was at Wharton, a friend told me about the financial options I described earlier (and their generalization, complex derivatives). I immediately decided to make a career in them. It was a combination of financial trading and complicated probability. The field was new and uncharted. I knew in my guts there were mistakes in the theories that used the conventional bell curve and ignored the impact of the tails (extreme events). I knew in my guts that academics had not the slightest clue about the risks. So, to find errors in the estimation of these probabilistic securities, I had to study probability, which mysteriously and instantly became fun, even gripping.", "begin": 3857.83, "end": 3925.95, "localBegin": 2067.92, "localEnd": 2136.04}, {"id": "c002_f000090", "text": "When there was risk on the line, suddenly a second brain in me manifested itself, and the probabilities of intricate sequences became suddenly effortless to analyze and map. When there is fire, you will run faster than in any competition. When you ski downhill some movements become effortless. Then I became dumb again when there was no real action. Furthermore, as traders the mathematics we used fit our problem like a glove, unlike academics with a theory looking for some application - in some cases we had to invent models out of thin air and could not afford the wrong equations. Applying math to practical problems was another business altogether; it meant a deep understanding of the problem before writing the equations.", "begin": 3925.95, "end": 3970.31, "localBegin": 2136.04, "localEnd": 2180.4}, {"id": "c002_f000091", "text": "But if you muster the strength to weight-lift a car to save a child, above your current abilities, the strength gained will stay after things calm down. So, unlike the drug addict who loses his resourcefulness, what you learn from the intensity and the focus you had when under the influence of risk stays with you. You may lose the sharpness, but nobody can take away what you've learned. This is the principal reason I am now fighting the conventional educational system, made by dweebs for dweebs. Many kids would learn to love mathematics if they had some investment in it, and, more crucially, they would build an instinct to spot its misapplications.", "begin": 3970.31, "end": 4013.03, "localBegin": 2180.4, "localEnd": 2223.12}, {"id": "c002_f000092", "text": "Regulations vs. Legal Systems", "begin": 4013.03, "end": 4016.83, "localBegin": 2223.12, "localEnd": 2226.92}, {"id": "c002_f000093", "text": "There are two ways to make citizens safe from large predators, say, big powerful corporations. The first one is to enact regulations - but these, aside from restricting individual freedoms, lead to another predation, this time by the state, its agents, and their cronies. More critically, people with good lawyers can game regulations (or, as we will see, make it known that they hire former regulators, and overpay for them, which signals a prospective bribe to those currently in office). And of course regulations, once in, stay in, and even when they are proven absurd, politicians are afraid of repealing them, under pressure from those benefiting from them. Given that regulations are additive, we soon end up tangled in complicated rules that choke enterprise. They also choke life.", "begin": 4016.83, "end": 4067.59, "localBegin": 2226.92, "localEnd": 2277.68}, {"id": "c002_f000094", "text": "For there are always parasites benefiting from regulation, situations where the businessperson uses government to derive profits, often through protective regulations and franchises. The mechanism is called regulatory recapture, as it cancels the effect of what a regulation was meant to do.", "begin": 4067.59, "end": 4086.71, "localBegin": 2277.68, "localEnd": 2296.8}, {"id": "c002_f000095", "text": "The other solution is to put skin in the game in transactions, in the form of legal liability, and the possibility of an efficient lawsuit. The Anglo-Saxon world has traditionally had a predilection for the legal approach instead of the regulatory one: if you harm me, I can sue you. This has led to the very sophisticated, adaptive, and balanced common law, built bottom-up, via trial and error. When people transact, they almost always prefer to agree (as part of the contract) on a Commonwealth (or former
